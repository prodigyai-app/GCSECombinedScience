<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prodigy printable practice paper</title><style>body{font:12pt/1.5 Arial,sans-serif;max-width:780px;margin:32px auto;padding:0 20px;color:#111}h1{font-size:22pt}h2{font-size:16pt}h3{font-size:13pt}.part{break-inside:avoid;margin:18px 0}.working{height:80px;border-bottom:1px solid #aaa;background:repeating-linear-gradient(white,white 25px,#ddd 26px,white 27px)}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px;text-align:left}svg{max-width:100%}.actions{padding:18px;border:1px solid #ddd}button{padding:10px 20px;font:inherit}.marks{float:right;font-weight:bold}@media print{.actions{display:none}.question{break-before:auto}a{color:inherit}body{margin:0;max-width:none}@page{size:A4;margin:18mm}}</style><div class="actions"><button onclick="window.print()">Print / save as PDF</button> Use your browser’s print dialog to save a PDF.</div><main id="paper"><p>Loading paper…</p></main><script src="course-data.js"></script><script>
(()=>{'use strict';const args=new URLSearchParams(location.search),p=window.PAPERS.find(p=>p.id===args.get('paper')),answers=args.get('answers')==='1',el=document.getElementById('paper');if(!p){el.innerHTML='<h1>Paper not found</h1><p>Return to the course and choose a printable paper.</p>';return;}document.title=p.title+(answers?' — mark scheme':' — question paper');el.innerHTML=`<h1>${p.title}${answers?' · Mark scheme':''}</h1><p>${COURSE_META.sub} · ${p.tier||'A Level'} · ${p.marks} marks · ${p.minutes} minutes</p><p><b>Original Prodigy practice material.</b> This is not an official exam-board paper.</p>${!answers?'<p>Name: __________________________ Date: _______________</p><p>Answer all questions. Use a calculator. Show working and units. Use an appropriate periodic table or equation insert where needed.</p>':''}${p.questions.map((q,i)=>`<section class="question"><h2>${i+1}. ${q.title||q.topic||''}</h2>${q.stem||''}${q.parts.map((a,j)=>`<div class="part"><span class="marks">[${a.m}]</span><h3>${i+1}.${j+1}</h3><div>${a.q}</div>${a.opts?'<ol type="A">'+a.opts.map(o=>'<li>'+o+'</li>').join('')+'</ol>':''}${answers?(a.note?'<p><i>'+a.note+'</i></p>':'')+'<ol>'+a.ms.map(x=>'<li>'+x+'</li>').join('')+'</ol>':'<div class="working" style="height:'+Math.max(70,a.m*25)+'px"></div>'}</div>`).join('')}</section>`).join('')}<p>End of ${answers?'mark scheme':'paper'} · Total ${p.marks} marks</p>`;})();
</script></html>
