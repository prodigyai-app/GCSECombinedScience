/* EN3: elastic potential energy */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,R,S}=G;
const st={k:40,e:0.10};
const LP=0.20; /* limit of proportionality (m) */
const F=(e,k)=>e<=LP?k*e:k*LP+k*0.35*(e-LP);
const stage=`<svg id="phys-en3" viewBox="0 0 300 340" style="display:block;margin:0 auto;max-width:200px" role="img" aria-label="A spring stretched by a hanging mass"></svg><canvas id="phys-en3-cv" class="graph" aria-label="Force against extension graph with the area shaded"></canvas>`;
const panel=`<div class="field"><div class="lbl">Spring constant k <b id="phys-en3-kl"></b></div><input type="range" id="phys-en3-k" min="10" max="100" step="5" value="40" aria-label="Spring constant"></div>
<div class="field"><div class="lbl">Extension e <b id="phys-en3-el"></b></div><input type="range" id="phys-en3-e" min="0" max="0.30" step="0.01" value="0.10" aria-label="Extension"></div>
<div class="readout"><div><span>Force F = ke</span><b id="phys-en3-F">—</b></div><div><span>E<sub>e</sub> = ½ke²</span><b id="phys-en3-E">—</b></div><div><span>Area under graph</span><b id="phys-en3-A">—</b></div></div>
<p class="note" id="phys-en3-msg"></p>`;

lesson({id:"phys-en3",group:"a",num:3,lvl:"6.1.1 · Lesson 3",name:"Elastic potential energy",icon:"epe",
 eyebrow:eb("6.1.1.2 Changes in energy",3),title:"Elastic potential energy",
 intro:"Stretching a spring or an elastic band stores energy in its elastic potential store. The energy stored is the area under the force–extension graph, which gives a simple equation as long as the spring obeys Hooke’s law.",
 outcomes:[["Calculate the energy stored in a stretched spring using E<sub>e</sub> = ½ke²","6.1.1.2"],["Explain that this equation only applies up to the limit of proportionality","6.5.3"],["Use the area under a force–extension graph to find the energy stored","6.5.3"]],
 blocks:[
  B.text("Energy in a stretched spring",`<p>A force does work to stretch a spring. Provided the spring is not stretched beyond its <b>limit of proportionality</b>, the work done is stored in its elastic potential store and is all given back when it is released.</p>`+B.eq(`${v("E","e")} = ½ ${v("k")}${v("e")}² ${S}`,`<small>E<sub>e</sub> in J, k = spring constant in N/m, e = extension in m</small>`)+`<p>The spring constant k tells you how stiff the spring is: the force needed per metre of extension (F = ke). A stiff spring has a large k.</p>`),
  B.text("Area under the force–extension graph",`<p>For a spring obeying Hooke’s law, the force–extension graph is a straight line through the origin. The energy stored is the <b>area of the triangle</b> under it:</p>`+B.eq(`${v("E","e")} = ½ × ${v("F")} × ${v("e")} = ½ × (${v("k")}${v("e")}) × ${v("e")} = ½ ${v("k")}${v("e")}²`)+`<p>Beyond the limit of proportionality the graph curves, so ½ke² no longer works, and the spring may not return to its original length (it is <b>inelastically</b> deformed).</p>`),
  B.sim("phys-en3-sim","Stretching a spring",stage,panel,`<span>Shaded area = energy stored</span><span>Dashed line: limit of proportionality</span>`),
  B.example("Energy in a catapult","A catapult has a spring constant of 400 N/m and is pulled back by 15 cm. Calculate the energy stored, and the speed of a 20 g stone fired from it, assuming all the energy is transferred to the stone.",[
   ["Convert units","",[`${v("e")} = 15 cm = 0.15 m;  ${v("m")} = 20 g = 0.020 kg`]],
   ["Energy stored","",[`${v("E","e")} = ½ × 400 × 0.15² = ${res("4.5 J")}`]],
   ["Speed","E<sub>k</sub> = E<sub>e</sub>",[`${v("v")} = √(2 × 4.5 / 0.020) = √450 = ${res("21 m/s")}`]]]),
  B.check([
   {q:"A spring with k = 50 N/m is stretched by 0.20 m. Calculate the energy stored.",a:1,unit:"J",tol:0.01,why:"E = ½ × 50 × 0.20² = 1.0 J."},
   {q:"A spring with k = 200 N/m is stretched by 4.0 cm. Calculate the energy stored.",a:0.16,unit:"J",tol:0.01,why:"e = 0.040 m: E = ½ × 200 × 0.040² = 0.16 J."},
   {q:"The extension of a spring is doubled (within the limit of proportionality). What happens to the energy stored?",opts:["Doubles","Halves","Four times as big","Unchanged"],a:2,why:"E ∝ e², so 2² = 4 times."},
   {q:"A spring stores 2.25 J when stretched by 0.15 m. Calculate its spring constant.",a:200,unit:"N/m",tol:0.01,why:"k = 2E/e² = 4.5 / 0.0225 = 200 N/m."},
   {q:"A force of 12 N stretches a spring by 0.30 m (it obeys Hooke’s law). Calculate the energy stored using the area under the graph.",a:1.8,unit:"J",tol:0.01,why:"E = ½Fe = ½ × 12 × 0.30 = 1.8 J."}]),
  B.keypoints(["E<sub>e</sub> = ½ke² (on the equation sheet) applies up to the limit of proportionality.","Energy stored = area under the force–extension graph.","Convert the extension to metres before using the equation."]),
  B.mistakes(["Using the extension in cm.","Forgetting to square the extension.","Using the total length of the spring instead of its extension."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en3"); if(!s) return; const {k,e}=st, f=F(e,k), over=e>LP;
  const L0=110, sc=500, top=30, n=12, Lp=L0+e*sc; let d=`M150 ${top} v12`; for(let i=0;i<n;i++){ const y=top+12+(i+.5)*(Lp-24)/n; d+=` L${i%2?130:170} ${y.toFixed(1)}`; } d+=` L150 ${top+Lp-12} v12`;
  let g=`<rect x="80" y="18" width="140" height="12" class="fink"/><path d="${d}" fill="none" class="${over?"bd":"ink"}" stroke-width="2.5"/>`;
  g+=`<rect x="128" y="${top+Lp}" width="44" height="34" rx="4" class="facc"/><text x="150" y="${top+Lp+22}" text-anchor="middle" font-size="12" class="ton" style="fill:var(--on-accent)">${fx(f,1)} N</text>`;
  g+=`<path d="M230 ${top+L0} h40" class="mut" stroke-dasharray="4 3"/><path d="M230 ${top+Lp} h40" class="mut" stroke-dasharray="4 3"/>`;
  if(e>0.005) g+=`<path d="M255 ${top+L0} V${top+Lp}" class="dat" stroke-width="2"/><text x="262" y="${(top+L0+Lp/2-L0/2+4).toFixed(0)}" font-size="12" class="tdat">e</text>`;
  s.innerHTML=g;
  const pts=[]; for(let x=0;x<=0.3001;x+=0.005) pts.push([x,F(x,k)]); const area=[]; for(let x=0;x<=e+1e-9;x+=0.005) area.push([x,F(x,k)]);
  const ymax=Math.ceil(F(0.3,100)/5)*5;
  const P=plot($("#phys-en3-cv"),{aspect:asp(.42),x:{label:"extension / m",min:0,max:0.3},y:{label:"force / N",min:0,max:ymax},series:[{pts,col:css("--ink"),join:true,noPts:true}]});
  if(P&&e>0){ const c=$("#phys-en3-cv").getContext("2d"); c.save(); c.globalAlpha=.3; c.fillStyle=css("--accent"); c.beginPath(); c.moveTo(P.X(0),P.Y(0)); area.forEach(([x,y])=>c.lineTo(P.X(x),P.Y(y))); c.lineTo(P.X(e),P.Y(0)); c.closePath(); c.fill(); c.restore();
    c.save(); c.setLineDash([5,4]); c.strokeStyle=css("--bad"); c.beginPath(); c.moveTo(P.X(LP),P.Y(0)); c.lineTo(P.X(LP),P.Y(ymax)); c.stroke(); c.restore(); }
  let A=0; for(let i=1;i<area.length;i++) A+=(area[i][0]-area[i-1][0])*(area[i][1]+area[i-1][1])/2;
  $("#phys-en3-kl").textContent=`${k} N/m`; $("#phys-en3-el").textContent=`${fx(e,2)} m`; $("#phys-en3-F").textContent=`${fx(f,1)} N`;
  $("#phys-en3-E").textContent=over?"not valid":`${fx(0.5*k*e*e,3)} J`; $("#phys-en3-A").textContent=`${fx(A,3)} J`;
  $("#phys-en3-msg").textContent=over?"Beyond the limit of proportionality: force is no longer proportional to extension, so ½ke² does not give the energy. The area under the graph still does.":"Within the limit of proportionality the area under the line equals ½ke²."; }
$("#phys-en3-k").addEventListener("input",e=>{ st.k=+e.target.value; draw(); });
$("#phys-en3-e").addEventListener("input",e=>{ st.e=+e.target.value; draw(); });
})();


</script>
<script>

/* EN4: specific heat capacity */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,S}=G;
const MAT=[["Water",4200,"#4a8fe0"],["Oil",2000,"#d1a72c"],["Aluminium",900,"#9aa6b0"],["Copper",385,"#c06a3a"],["Lead",130,"#6c7480"]];
const st={m:1,E:20,f:0,run:false};
const stage=`<svg id="phys-en4" viewBox="0 0 900 300" role="img" aria-label="Five thermometers showing the temperature of equal masses of different materials given the same energy"></svg>`;

<div class="field"><div class="lbl">Energy supplied to each <b id="phys-en4-El"></b></div><input type="range" id="phys-en4-E" min="2" max="40" step="2" value="20" aria-label="Energy"></div>
<div class="btnrow"><button class="btn primary" id="phys-en4-go">Heat</button><button class="btn" id="phys-en4-rs">Reset</button></div>
<div class="readout"><div><span>Δθ water</span><b id="phys-en4-w">—</b></div><div><span>Δθ copper</span><b id="phys-en4-c">—</b></div></div>

lesson({id:"phys-en4",group:"a",num:4,lvl:"6.1.1 · Lesson 4",name:"Specific heat capacity",icon:"shc",
 eyebrow:eb("6.1.1.3 Energy changes in systems",4),title:"Specific heat capacity",
 intro:"Give the same amount of energy to a kilogram of water and a kilogram of copper and the copper gets more than ten times hotter. The specific heat capacity of a material tells you how much energy it takes to warm it up.",
 outcomes:[["Define specific heat capacity","6.1.1.3"],["Calculate the energy needed to change the temperature of a material using ΔE = mcΔθ","6.1.1.3"],["Describe how to measure specific heat capacity (required practical 14)","6.1.1.3"]],
 blocks:[
  B.text("Specific heat capacity",`<p>The <b>specific heat capacity</b> of a substance is the amount of energy needed to raise the temperature of <b>one kilogram</b> of the substance by <b>one degree Celsius</b>.</p>`+B.eq(`Δ${v("E")} = ${v("m")}${v("c")}Δθ ${S}`,`<small>ΔE = change in thermal energy (J), m = mass (kg), c = specific heat capacity (J/kg °C), Δθ = temperature change (°C)</small>`)+`<p>Water has a very high specific heat capacity (4200 J/kg °C), which is why it is used in central heating radiators and hot-water bottles: it stores a lot of energy for a small temperature rise and releases it slowly as it cools.</p>`),
  B.sim("phys-en4-sim","Same energy, different materials",stage,panel,`<span>Thermometers start at 20 °C</span><span>Equal masses, equal energy</span>`),
  B.example("Heating water in a kettle","A kettle heats 0.80 kg of water from 15 °C to 100 °C. Calculate the energy transferred to the water. (c = 4200 J/kg °C)",[
   ["Temperature change","",[`Δθ = 100 − 15 = 85 °C`]],
   ["Substitute","",[`Δ${v("E")} = ${v("m")}${v("c")}Δθ = 0.80 × 4200 × 85 = ${res("285 600 J")} (about 290 kJ)`]]]),
  B.example("Finding a temperature rise","A 2.0 kg aluminium block (c = 900 J/kg °C) is given 36 000 J of energy. Calculate its temperature rise.",[
   ["Rearrange","",[`Δθ = ${fr("Δ"+v("E"),v("m")+v("c"))} = ${fr("36 000","2.0 × 900")} = ${res("20 °C")}`]]]),
  B.practical(`<p>In <b>RP 14 Specific heat capacity</b> you heat a metal block with an electrical heater, measure the energy supplied with a joulemeter (or from power × time), and record the temperature rise. Plotting temperature against energy gives a straight line: c = 1 / (m × gradient).</p><ul><li>Insulate the block and add a drop of water or oil in the thermometer hole to improve thermal contact.</li><li>Energy lost to the surroundings makes the temperature rise smaller, so the measured c comes out <b>higher</b> than the true value.</li></ul>`,"Required practical 14"),
  B.check([
   {q:"Calculate the energy needed to raise the temperature of 3.0 kg of water by 20 °C. (c = 4200 J/kg °C)",a:252000,unit:"J",tol:0.01,why:"ΔE = 3.0 × 4200 × 20 = 252 000 J."},
   {q:"500 g of copper (c = 385 J/kg °C) is heated from 20 °C to 80 °C. Calculate the energy transferred.",a:11550,unit:"J",tol:0.01,why:"m = 0.500 kg: ΔE = 0.500 × 385 × 60 = 11 550 J."},
   {q:"A 1.5 kg block receives 27 000 J and warms by 20 °C. Calculate its specific heat capacity.",a:900,unit:"J/kg °C",tol:0.01,why:"c = ΔE/(mΔθ) = 27 000 / 30 = 900 J/kg °C."},
   {q:"Why is the measured specific heat capacity in RP14 usually higher than the true value?",opts:["The thermometer reads too high","Some energy heats the surroundings, so the temperature rise is smaller","The block’s mass increases","The heater gets more powerful"],a:1,why:"Less of the energy supplied warms the block, so Δθ is too small and c = ΔE/(mΔθ) is too big."},
   {q:"Equal masses of water and oil are heated with the same energy. Which gets hotter?",opts:["Water","Oil","Both the same","It depends on the starting temperature"],a:1,why:"Oil has the lower specific heat capacity, so a larger Δθ."}]),
  B.keypoints(["Specific heat capacity: energy to raise 1 kg by 1 °C.","ΔE = mcΔθ (on the equation sheet).","Water’s high specific heat capacity makes it a good store of thermal energy."]),
  B.mistakes(["Using the final temperature instead of the change in temperature.","Leaving the mass in grams.","Confusing specific heat capacity with specific latent heat (no temperature change)."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en4"); if(!s) return; const nw=window.innerWidth<640, W=nw?420:900, dx=W/5;
  const Tmax=100; let g="";

    for(let t=0;t<=100;t+=20){ const y=bot-(bot-top)*t/Tmax; g+=`<path d="M${cx+9} ${y} h6" class="mut"/>${i===0?`<text x="${cx-14}" y="${y+4}" text-anchor="end" font-size="10" class="tmut">${t}</text>`:""}`; }
    g+=`<text x="${cx}" y="${bot+46}" text-anchor="middle" font-size="${nw?11:13}" font-weight="700">${n}</text><text x="${cx}" y="${bot+62}" text-anchor="middle" font-size="${nw?10:12}" class="tmut">c = ${c}</text><text x="${cx}" y="${top-12}" text-anchor="middle" font-size="${nw?11:13}" class="tm">${T>=Tmax+20?">120":fx(T,1)} °C</text>`; });
  s.setAttribute("viewBox",`0 0 ${W} 300`); s.innerHTML=g;
  $("#phys-en4-ml").textContent=`${st.m} kg`; $("#phys-en4-El").textContent=`${st.E} kJ`;

let last=0; function loop(now){ if(st.run&&!$("#lab-phys-en4").hidden&&now-last>30){ last=now; st.f=Math.min(1,st.f+0.012); if(st.f>=1) st.run=false; draw(); } requestAnimationFrame(loop); }

$("#phys-en4-rs").addEventListener("click",reset);
$("#phys-en4-m").addEventListener("input",e=>{ st.m=+e.target.value; reset(); });
$("#phys-en4-E").addEventListener("input",e=>{ st.E=+e.target.value; reset(); });
st.f=1; draw(); requestAnimationFrame(loop);
})();

<script>

/* EN5: power */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G;
const g0=9.8, st={m:50,h:10,PA:500,PB:1250,t:0,run:false};
const stage=`<svg id="phys-en5" viewBox="0 0 900 290" role="img" aria-label="Two motors lifting identical loads; the more powerful one lifts its load faster"></svg>`;

lesson({id:"phys-en5",group:"a",num:5,lvl:"6.1.1 · Lesson 5",name:"Power",icon:"power",
 eyebrow:eb("6.1.1.4 Power",5),title:"Power",
 intro:"Two motors can lift the same load to the same height, transferring the same energy, but one may do it much faster. Power measures how quickly energy is transferred.",
 outcomes:[["Define power as the rate at which energy is transferred or work is done","6.1.1.4"],["Use P = E/t and P = W/t","6.1.1.4"],["Compare the power of two devices doing the same job","6.1.1.4"]],
 blocks:[
  B.text("Power",`<p><b>Power</b> is the rate at which energy is transferred, or the rate at which work is done.</p>`+B.eq(`${v("P")} = ${fr(v("E"),v("t"))} ${R}`,`${v("P")} = ${fr(v("W"),v("t"))} ${R}`,`<small>P = power (W), E = energy transferred (J), W = work done (J), t = time (s)</small>`)+`<p>One <b>watt</b> is an energy transfer of <b>one joule per second</b>. 1 kW = 1000 W.</p><p>Two motors lift identical loads through the same height: the work done is the same (mgh), but the more powerful motor does it in less time.</p>`),
  B.sim("phys-en5-sim","Comparing two motors",stage,panel,`<span>Both loads are lifted 10 m</span><span>Work done = mgh</span>`),
  B.example("Power of a lift motor","A lift motor raises a 600 kg lift through 24 m in 16 s. Calculate the useful power output. (g = 9.8 N/kg)",[
   ["Work done = energy transferred to the gravitational store","",[`${v("W")} = ${v("m")}${v("g")}${v("h")} = 600 × 9.8 × 24 = 141 120 J`]],
   ["Power","",[`${v("P")} = ${fr(v("W"),v("t"))} = ${fr("141 120","16")} = ${res("8820 W")} (8.8 kW)`]]]),
  B.check([
   {q:"A kettle transfers 180 000 J in 60 s. Calculate its power.",a:3000,unit:"W",tol:0.01,why:"P = E/t = 180 000 / 60 = 3000 W."},
   {q:"A 2.0 kW heater is switched on for 5 minutes. How much energy does it transfer?",a:600000,unit:"J",tol:0.01,why:"E = Pt = 2000 × 300 = 600 000 J."},
   {q:"A 60 kg student runs up stairs 4.0 m high in 5.0 s. Calculate her useful power. (g = 9.8 N/kg)",a:470.4,unit:"W",tol:0.01,why:"W = 60 × 9.8 × 4.0 = 2352 J; P = 2352 / 5.0 = 470 W."},
   {q:"Motor X lifts a load in 4 s; motor Y lifts the same load the same height in 8 s. Which statement is correct?",opts:["X does more work","Y does more work","X has twice the power of Y","Y has twice the power of X"],a:2,why:"Same work done in half the time: twice the power."},
   {q:"How long does a 1500 W motor take to do 45 000 J of work?",a:30,unit:"s",tol:0.01,why:"t = W/P = 45 000 / 1500 = 30 s."}]),
  B.keypoints(["Power = rate of energy transfer: P = E/t = W/t.","1 W = 1 J/s; 1 kW = 1000 W.","Same work in less time means more power."]),
  B.mistakes(["Leaving time in minutes: convert to seconds.","Confusing power (W) with energy (J).","Forgetting to convert kW to W."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en5"); if(!s) return; const nw=window.innerWidth<640, W=nw?420:900, Wk=st.m*g0*st.h, tA=Wk/st.PA, tB=Wk/st.PB;
  let g=`<path d="M10 270 H${W-10}" class="ink" stroke-width="2.5"/>`;
  [["A",st.PA,tA,W*0.27],["B",st.PB,tB,W*0.73]].forEach(([n,P,T,cx])=>{ const f=Math.min(1,st.t/T), y=240-f*190;
    g+=`<rect x="${cx-70}" y="18" width="140" height="22" rx="4" class="fink"/><rect x="${cx-30}" y="6" width="60" height="28" rx="6" class="fdat"/><text x="${cx}" y="25" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">${n}</text>`;
    g+=`<path d="M${cx} 34 V${y.toFixed(1)}" class="ink" stroke-width="1.6"/><rect x="${cx-26}" y="${y.toFixed(1)}" width="52" height="30" rx="3" class="facc"/><text x="${cx}" y="${(y+20).toFixed(1)}" text-anchor="middle" font-size="12" style="fill:var(--on-accent)">${st.m} kg</text>`;
    g+=`<path d="M${cx+50} 50 V240" class="mut" stroke-dasharray="3 3"/><text x="${cx+56}" y="54" font-size="11" class="tmut">10 m</text>`;
    g+=`<text x="${cx-60}" y="${nw?290:288}" font-size="${nw?11:13}" class="tm">${P} W · t = ${fx(Math.min(st.t,T),1)} s${f>=1?" ✓":""}</text>`; });
  s.setAttribute("viewBox",`0 0 ${W} 300`); s.innerHTML=g;
  $("#phys-en5-ml").textContent=`${st.m} kg`; $("#phys-en5-al").textContent=`${st.PA} W`; $("#phys-en5-bl").textContent=`${st.PB} W`;
  $("#phys-en5-W").textContent=`${fx(Wk,0)} J`; $("#phys-en5-tA").textContent=`${fx(tA,2)} s`; $("#phys-en5-tB").textContent=`${fx(tB,2)} s`; }
let last=0; function loop(now){ if(st.run&&!$("#lab-phys-en5").hidden){ const dt=Math.min(0.05,(now-last)/1000); st.t+=dt*1.5; const Wk=st.m*g0*st.h; if(st.t>=Wk/Math.min(st.PA,st.PB)) st.run=false; draw(); } last=now; requestAnimationFrame(loop); }
const reset=()=>{ st.t=0; st.run=false; draw(); };
$("#phys-en5-go").addEventListener("click",()=>{ st.t=0; st.run=true; });
$("#phys-en5-rs").addEventListener("click",reset);
[["m","m"],["a","PA"],["b","PB"]].forEach(([k,p])=>$("#phys-en5-"+k).addEventListener("input",e=>{ st[p]=+e.target.value; reset(); }));
reset(); requestAnimationFrame(loop);
})();

<script>
LEARN.unit="phys-energy";

/* EN6: conservation, dissipation and efficiency */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G;
const DEV={
 led:["LED lamp",[["Light",0.40]],[["Heating surroundings",0.60]]],
 fil:["Filament lamp",[["Light",0.10]],[["Heating surroundings",0.90]]],
 motor:["Electric motor",[["Kinetic (useful work)",0.70]],[["Heating (friction, wires)",0.20],["Sound",0.10]]],
 car:["Petrol car engine",[["Kinetic store of car",0.25]],[["Heating engine and exhaust",0.68],["Sound",0.07]]],
 kettle:["Electric kettle",[["Thermal store of water",0.90]],[["Heating kettle and air",0.08],["Sound",0.02]]],
 tv:["Television",[["Light",0.30],["Sound",0.05]],[["Heating surroundings",0.65]]]
};
const st={k:"motor",E:200};
const stage=`<svg id="phys-en6" viewBox="0 0 900 320" role="img" aria-label="Sankey diagram showing useful and wasted energy transfers for the chosen device"></svg>`;
const panel=`<div class="field"><div class="lbl">Device</div><select id="phys-en6-k" aria-label="Device">${Object.entries(DEV).map(([k,d])=>`<option value="${k}" ${k===st.k?"selected":""}>${d[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Input energy <b id="phys-en6-El"></b></div><input type="range" id="phys-en6-E" min="100" max="1000" step="100" value="200" aria-label="Input energy"></div>
<div class="readout"><div><span>Useful output</span><b id="phys-en6-u">—</b></div><div><span>Wasted</span><b id="phys-en6-w">—</b></div><div><span>Efficiency</span><b id="phys-en6-eff">—</b></div></div>`;

lesson({id:"phys-en6",group:"b",num:6,lvl:"6.1.2 · Lesson 6",name:"Conservation, dissipation and efficiency",icon:"eff",
 eyebrow:eb("6.1.2 Conservation and dissipation of energy",6),title:"Conservation, dissipation and efficiency",
 intro:"No device transfers all of its input energy usefully. Some is always dissipated, usually by heating the surroundings. Efficiency measures what fraction is useful, and Sankey diagrams show where it all goes.",
 outcomes:[["Explain that energy is conserved but is often dissipated (wasted) in a less useful form","6.1.2.1"],["Calculate efficiency using energy or power","6.1.2.2"],["Describe ways of reducing unwanted energy transfers, such as lubrication and insulation","6.1.2.1"]],
 blocks:[
  B.text("Energy is conserved but dissipated",`<p>Energy can be transferred usefully, stored or <b>dissipated</b>, but it can never be created or destroyed. In every real transfer some energy is dissipated, often by heating the surroundings or as sound. It spreads out and becomes less useful: we say it is <b>wasted</b>.</p><p>Unwanted transfers can be reduced by:</p><ul><li><b>lubrication</b> (oil or grease) to reduce friction between moving parts;</li><li><b>thermal insulation</b> to reduce energy transfer by heating;</li><li>streamlining to reduce air resistance.</li></ul>`),
  B.text("Efficiency",B.eq(`efficiency = ${fr("useful output energy transfer","total input energy transfer")} ${R}`,`efficiency = ${fr("useful power output","total power input")} ${R}`)+`<p>Efficiency has no units. It can be given as a decimal (0.25) or a percentage (25%). It can never be more than 1 (100%), because energy cannot be created.</p>`,
   B.fig(`<svg viewBox="0 0 300 180" role="img" aria-label="A Sankey diagram: a wide input arrow splits into a useful arrow and a downward wasted arrow"><rect x="10" y="40" width="140" height="80" class="fdat" opacity=".85"/><path d="M150 40 h100 v-12 l40 32 -40 32 v-12 h-100z" class="facc"/><path d="M150 80 h20 a40 40 0 0 1 40 40 v20 h12 l-32 32 -32 -32 h12 v-20 a0 0 0 0 0 0 0 z" class="fbd" opacity=".85"/><text x="70" y="85" text-anchor="middle" font-size="13" style="fill:#fff" font-weight="700">100 J in</text><text x="230" y="22" text-anchor="middle" font-size="12" class="tacc">60 J useful</text><text x="240" y="160" font-size="12" class="tbd">40 J wasted</text></svg>`,"In a Sankey diagram the width of each arrow is proportional to the energy.")),
  B.sim("phys-en6-sim","Sankey diagrams for real devices",stage,panel,`<span>Arrow widths are to scale</span><span>Useful transfers go right, wasted ones go down</span>`),
  B.example("Efficiency of a motor","An electric motor has an input power of 800 W and a useful output power of 560 W. Calculate its efficiency, and the power wasted.",[
   ["Efficiency","",[`efficiency = ${fr("560","800")} = ${res("0.70 (70%)")}`]],
   ["Wasted power","Energy is conserved",[`wasted = 800 − 560 = ${res("240 W")}`]]]),
  B.check([
   {q:"A lamp transfers 200 J of energy and 30 J is emitted as light. Calculate its efficiency as a decimal.",a:0.15,unit:"",tol:0.01,why:"30 / 200 = 0.15."},
   {q:"A motor of efficiency 0.80 has an input of 500 J. How much energy is usefully transferred?",a:400,unit:"J",tol:0.01,why:"0.80 × 500 = 400 J."},
   {q:"A pump has a useful output power of 1.2 kW and is 60% efficient. Calculate its input power.",a:2000,unit:"W",tol:0.01,why:"Input = 1200 / 0.60 = 2000 W."},
   {q:"Which would reduce the unwanted energy transfer in a bicycle chain?",opts:["Painting it","Lubricating it with oil","Making it longer","Using a heavier chain"],a:1,why:"Lubrication reduces friction, so less energy is dissipated by heating."},
   {q:"A student claims a machine is 120% efficient. Why is this impossible?",opts:["Efficiency has no units","Energy cannot be created, so output cannot exceed input","Machines always waste exactly half","Efficiency must be a whole number"],a:1,why:"The useful output can never be more than the total input."}]),
  B.keypoints(["Energy is conserved, but some is always dissipated (usually heating the surroundings).","Efficiency = useful output / total input (energy or power).","Reduce waste with lubrication, insulation and streamlining."]),
  B.mistakes(["Dividing input by output (giving a value above 1).","Mixing joules and watts in the same efficiency calculation.","Saying wasted energy is ‘destroyed’ or ‘lost’ rather than dissipated to the surroundings."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en6"); if(!s) return; const [name,use,waste]=DEV[st.k], E=st.E, nw=window.innerWidth<640;
  const H=60+E/1000*120, sc=H/E, x0=10, y0=30, xs=nw?150:260, ux=nw?330:600, fs=nw?17:13, VW=nw?620:900;
  let g=`<rect x="${x0}" y="${y0}" width="${xs-x0}" height="${H.toFixed(1)}" class="fdat" opacity=".85"/><text x="${x0+10}" y="${(y0+H/2+5).toFixed(1)}" font-size="${fs+1}" font-weight="700" style="fill:#fff">${E} J in</text>`;
  let y=y0; use.forEach(([n,f])=>{ const w=E*f*sc, hd=Math.max(14,w*.6), ex=Math.min(10,w/2);
    g+=`<path d="M${xs} ${y.toFixed(1)} H${ux} v${-ex} l${hd} ${(ex+w/2).toFixed(1)} l${-hd} ${(ex+w/2).toFixed(1)} v${-ex} H${xs}z" class="facc" opacity=".9"/>`;
    g+=`<text x="${ux+hd+8}" y="${(y+w/2+5).toFixed(1)}" font-size="${fs}" class="tacc">${n}: ${fx(E*f,0)} J</text>`; y+=w; });
  let xw=xs+12, ly=y+fs+6, lx=xs+12+waste.reduce((a,[n,f])=>a+E*f*sc+8,0)+16; waste.forEach(([n,f],i)=>{ const w=E*f*sc, ex=Math.min(8,w/2), bot=285;
    g+=`<path d="M${xs} ${y.toFixed(1)} H${(xw+w).toFixed(1)} V${bot} h${ex} l${(-w/2-ex).toFixed(1)} 22 l${(-w/2-ex).toFixed(1)} -22 h${ex} V${(y+w).toFixed(1)} H${xs}z" class="fbd" opacity="${(.9-i*.25).toFixed(2)}"/>`;
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+i*(fs+6)).toFixed(1)}" font-size="${fs}" class="tbd">${n}: ${fx(E*f,0)} J</text>`; xw+=w+8; y+=w; });
  s.setAttribute("viewBox",`0 0 ${VW} 320`); s.innerHTML=g; const u=use.reduce((a,[n,f])=>a+f,0);
  $("#phys-en6-El").textContent=`${E} J`; $("#phys-en6-u").textContent=`${fx(E*u,0)} J`; $("#phys-en6-w").textContent=`${fx(E*(1-u),0)} J`; $("#phys-en6-eff").textContent=`${fx(u,2)} (${Math.round(u*100)}%)`; }
$("#phys-en6-k").addEventListener("change",e=>{ st.k=e.target.value; draw(); });
$("#phys-en6-E").addEventListener("input",e=>{ st.E=+e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-energy";

/* EN7: thermal conductivity and insulation */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb}=G;
const MAT={glass:["Glass",1.0,"#9fd4e6"],concrete:["Concrete",1.0,"#a7a9a6"],brick:["Brick",0.7,"#b8573c"],wood:["Wood",0.15,"#b98b4e"],wool:["Mineral wool",0.04,"#e9d48a"],foam:["Polystyrene foam",0.03,"#eef0f2"]};
const A=12, C=6e5, Tin=20;
const st={m:"brick",d:0.10,To:5};
const stage=`<svg id="phys-en7" viewBox="0 0 900 250" role="img" aria-label="Cross-section of a wall with arrows showing the rate of energy transfer from the warm room to the cold outside"></svg><canvas id="phys-en7-cv" class="graph" aria-label="Room temperature after the heating is switched off"></canvas>`;
const panel=`<div class="field"><div class="lbl">Wall material</div><select id="phys-en7-m" aria-label="Material">${Object.entries(MAT).map(([k,m])=>`<option value="${k}" ${k===st.m?"selected":""}>${m[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Thickness <b id="phys-en7-dl"></b></div><input type="range" id="phys-en7-d" min="0.02" max="0.30" step="0.01" value="0.10" aria-label="Thickness"></div>
<div class="field"><div class="lbl">Outside temperature <b id="phys-en7-ol"></b></div><input type="range" id="phys-en7-o" min="-5" max="15" step="1" value="5" aria-label="Outside temperature"></div>
<div class="readout"><div><span>Thermal conductivity</span><b id="phys-en7-k">—</b></div><div><span>Rate of energy transfer</span><b id="phys-en7-P">—</b></div></div>
<p class="note" id="phys-en7-msg"></p>`;

lesson({id:"phys-en7",group:"b",num:7,lvl:"6.1.2 · Lesson 7",name:"Thermal conductivity and insulation",icon:"ins",
 eyebrow:eb("6.1.2.1 Energy transfers in a system",7),title:"Thermal conductivity and insulation",
 intro:"Houses lose energy through their walls, roofs and windows. How quickly they cool depends on what the walls are made of and how thick they are. Choosing materials with a low thermal conductivity keeps buildings warm for less money.",
 outcomes:[["Explain that a higher thermal conductivity gives a higher rate of energy transfer by conduction","6.1.2.1"],["Describe how the rate of cooling of a building depends on the thickness and thermal conductivity of its walls","6.1.2.1"],["Describe how to investigate the effectiveness of insulating materials (optional insulation investigation)","6.1.2.1"]],
 blocks:[
  B.text("Thermal conductivity",`<p>The <b>thermal conductivity</b> of a material tells you how well it conducts energy by heating. The <b>higher</b> the thermal conductivity, the <b>higher the rate</b> of energy transfer through it by conduction.</p><ul><li>Metals have high thermal conductivities (copper ≈ 400 W/m K).</li><li>Brick, glass and concrete are in the middle (≈ 1 W/m K).</li><li>Materials that trap air, such as mineral wool, foam and fabric, have very low thermal conductivities (≈ 0.03 W/m K): they are good <b>insulators</b>.</li></ul><p>The rate of cooling of a building is reduced by using walls that are <b>thicker</b> and that have a <b>lower thermal conductivity</b>. This is why houses have cavity wall insulation, loft insulation and double glazing.</p>`),
  B.sim("phys-en7-sim","How fast does a room cool?",stage,panel,`<span>Arrow width ∝ rate of energy transfer</span><span>Graph: the room cools after the heating goes off</span>`),
  B.text("Reducing energy loss at home",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Method</th><th>How it works</th></tr></thead><tbody><tr><td>Loft insulation</td><td>Mineral wool traps air (low conductivity), reducing conduction through the ceiling</td></tr><tr><td>Cavity wall insulation</td><td>Foam fills the gap between two layers of bricks, trapping air and stopping convection currents</td></tr><tr><td>Double glazing</td><td>A layer of gas or a vacuum between two panes reduces conduction</td></tr><tr><td>Draught excluders</td><td>Stop warm air escaping (convection) around doors and windows</td></tr><tr><td>Thicker walls</td><td>Energy has further to travel, so the rate of transfer is lower</td></tr></tbody></table></div>`),
  B.practical(`<p>In <b>RP 2 Thermal insulation</b> you wrap beakers of hot water in different materials (or different numbers of layers) and record the temperature every minute. The best insulator gives the slowest rate of cooling. Keep the starting temperature, volume of water and room conditions the same so that it is a fair test.</p>`,"optional insulation investigation"),
  B.check([
   {q:"Which wall would give the lowest rate of energy transfer?",opts:["Thin wall, high thermal conductivity","Thin wall, low thermal conductivity","Thick wall, high thermal conductivity","Thick wall, low thermal conductivity"],a:3,why:"Both greater thickness and lower thermal conductivity reduce the rate."},
   {q:"Why is mineral wool a good insulator?",opts:["It is a metal","It traps air, which has a very low thermal conductivity","It reflects all radiation","It has a high density"],a:1,why:"Trapped air conducts very poorly and cannot form convection currents."},
   {q:"In RP2, which variable must be kept the same for a fair test?",opts:["The insulating material","The starting temperature of the water","The final temperature","The time taken to cool"],a:1,why:"The initial temperature (and volume of water) must be controlled."},
   {q:"Copper has a thermal conductivity of 400 W/m K and glass about 1 W/m K. Which is better for the base of a saucepan?",opts:["Copper","Glass","They are the same","Neither conducts"],a:0,why:"A high thermal conductivity transfers energy quickly from the hob to the food."},
   {q:"Doubling the thickness of a wall (same material) will…",opts:["double the rate of energy transfer","halve the rate of energy transfer","not change it","make it zero"],a:1,why:"The rate of conduction is inversely proportional to thickness."}]),
  B.keypoints(["Higher thermal conductivity ⇒ higher rate of energy transfer by conduction.","Thicker walls with lower thermal conductivity reduce the rate of cooling of a building.","Good insulators usually trap air."]),
  B.mistakes(["Saying insulation ‘stops the cold getting in’: energy is transferred out from the warm house.","Confusing thermal conductivity with specific heat capacity.","Forgetting to control the starting temperature in RP2."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en7"); if(!s) return; const [name,k,col]=MAT[st.m], U=k*A/st.d, P=U*(Tin-st.To), nw=window.innerWidth<640, W=nw?500:900;
  const wx=W/2-st.d*400, ww=st.d*800; let g=`<rect x="0" y="0" width="${wx}" height="250" fill="#f6b38a" opacity=".35"/><rect x="${wx+ww}" y="0" width="${W-wx-ww}" height="250" fill="#8ab6f6" opacity=".35"/>`;
  g+=`<rect x="${wx}" y="10" width="${ww}" height="230" style="fill:${col}" class="ink" stroke-width="1.5"/><text x="${wx/2}" y="40" text-anchor="middle" font-size="15" font-weight="700">Room ${Tin} °C</text><text x="${wx+ww+(W-wx-ww)/2}" y="40" text-anchor="middle" font-size="15" font-weight="700">Outside ${st.To} °C</text>`;
  const thick=Math.max(1.5,Math.min(30,P/60)); [90,140,190].forEach(y=>{ g+=`<path d="M${wx-80} ${y} H${wx+ww+60}" class="bd" stroke-width="${thick.toFixed(1)}" opacity=".75"/><path d="M${wx+ww+60} ${y-thick/2-8} l22 ${thick/2+8} -22 ${thick/2+8}z" class="fbd"/>`; });
  g+=`<text x="${wx+ww/2}" y="236" text-anchor="middle" font-size="12" class="tm">${fx(st.d*100,0)} cm</text>`;
  s.setAttribute("viewBox",`0 0 ${W} 250`); s.innerHTML=g;
  const curve=(UU)=>{ const p=[]; for(let t=0;t<=6;t+=0.1) p.push([t,st.To+(Tin-st.To)*Math.exp(-UU*t*3600/C)]); return p; };
  plot($("#phys-en7-cv"),{aspect:asp(.4),x:{label:"time after heating switched off / hours",min:0,max:6},y:{label:"room temperature / °C",min:-5,max:20},
   series:[{pts:curve(U),col:css("--accent"),join:true,noPts:true,label:`${name}, ${fx(st.d*100,0)} cm`},{pts:curve(0.7*A/0.10),col:css("--muted"),join:true,noPts:true,label:"Brick, 10 cm (reference)"}],legend:"right"});
  $("#phys-en7-dl").textContent=`${fx(st.d*100,0)} cm`; $("#phys-en7-ol").textContent=`${st.To} °C`; $("#phys-en7-k").textContent=`${k} W/m K`; $("#phys-en7-P").textContent=`${fx(P,0)} W`;
  $("#phys-en7-msg").textContent=`Through ${A} m² of wall. Halve the thickness or double the conductivity and the rate of energy transfer doubles.`; }
$("#phys-en7-m").addEventListener("change",e=>{ st.m=e.target.value; draw(); });
$("#phys-en7-d").addEventListener("input",e=>{ st.d=+e.target.value; draw(); });
$("#phys-en7-o").addEventListener("input",e=>{ st.To=+e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-energy";

/* EN8: national and global energy resources */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {eb}=G;
const st={wind:true,sun:true,winter:true};
const SRC=[["Nuclear","#7b5fb0"],["Wind","#3aa58a"],["Solar","#e3b32a"],["Biomass and hydro","#7a9a3a"],["Gas","#d0602c"]];
const demand=(t)=>(st.winter?30:23)+6*Math.exp(-(((t-8.5)/2.2)**2))+(st.winter?10:5)*Math.exp(-(((t-18)/2.5)**2))-5*Math.exp(-(((t-3.5)/2.5)**2));
const supply=(t)=>{ const nuc=5, wind=(st.wind?13:2)*(1+0.12*Math.sin(t/3)), sun=(st.sun?(st.winter?4:11):(st.winter?1:3))*Math.max(0,Math.sin(Math.PI*((t-(st.winter?8:5.5))/(st.winter?8:15)))) , bio=3; return [nuc,wind,(t>(st.winter?8:5.5)&&t<(st.winter?16:20.5))?sun:0,bio]; };
const stage=`<canvas id="phys-en8-cv" class="graph" aria-label="Electricity demand over one day and how it is met by each energy resource"></canvas><div style="display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px;font-size:.85rem">${SRC.map(([n,c])=>`<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:14px;height:14px;border-radius:3px;background:${c};opacity:.8;display:inline-block"></i>${n}</span>`).join("")}</div>`;
const panel=`<div class="field"><div class="lbl">Season</div><div class="seg c2" id="phys-en8-s"><label class="opt"><input type="radio" name="phys-en8-s" value="w" checked><span>Winter</span></label><label class="opt"><input type="radio" name="phys-en8-s" value="s"><span>Summer</span></label></div></div>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin-bottom:8px"><input type="checkbox" id="phys-en8-w" checked style="width:18px;height:18px;accent-color:var(--accent)"> Windy day</label>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="phys-en8-u" checked style="width:18px;height:18px;accent-color:var(--accent)"> Sunny day</label>
<div class="readout"><div><span>Energy from renewables</span><b id="phys-en8-r">—</b></div><div><span>Energy from gas</span><b id="phys-en8-g">—</b></div></div>
<p class="note" id="phys-en8-msg"></p>`;

lesson({id:"phys-en8",group:"c",num:8,lvl:"6.1.3 · Lesson 8",name:"Energy resources",icon:"wind",
 eyebrow:eb("6.1.3 National and global energy resources",8),title:"Energy resources",
 intro:"We use energy resources for transport, electricity generation and heating. Some will run out and some will not; some are reliable and some depend on the weather. Choosing a mix of resources involves science, cost and politics.",
 outcomes:[["Describe the main energy resources and distinguish renewable from non-renewable","6.1.3"],["Compare the reliability and environmental impact of different resources","6.1.3"],["Explain patterns and trends in the use of energy resources","6.1.3"]],
 blocks:[
  B.text("Renewable and non-renewable",`<p>A <b>renewable</b> energy resource is one that is being (or can be) replenished as it is used. A <b>non-renewable</b> resource will eventually run out.</p><ul><li><b>Non-renewable:</b> fossil fuels (coal, oil, gas) and nuclear fuel (uranium and plutonium).</li><li><b>Renewable:</b> bio-fuel, wind, hydro-electricity, geothermal, the tides, water waves and the Sun (solar).</li></ul><p>The main uses are for <b>transport</b> (mostly oil-based fuels), <b>electricity generation</b> and <b>heating</b> (mostly gas, plus electricity).</p>`),
  B.text("Comparing resources",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Resource</th><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td>Fossil fuels</td><td>Reliable; output can be changed quickly to meet demand; relatively cheap</td><td>Non-renewable; release CO₂ (global warming); coal and oil release sulfur dioxide (acid rain)</td></tr>
<tr><td>Nuclear</td><td>No CO₂ while generating; reliable; lots of energy from a small mass of fuel</td><td>Non-renewable; radioactive waste; expensive to build and decommission; slow to start up</td></tr>
<tr><td>Wind</td><td>Renewable; no fuel cost; no CO₂ while generating</td><td>Unreliable (needs wind); visual and noise pollution; many turbines needed</td></tr>
<tr><td>Solar</td><td>Renewable; no fuel cost; good in remote places</td><td>Only works in daylight; less in winter and cloud; large areas needed</td></tr>
<tr><td>Hydro-electric</td><td>Renewable; reliable; can respond quickly to demand</td><td>Flooding valleys destroys habitats; few suitable sites</td></tr>
<tr><td>Tidal</td><td>Renewable; reliable and predictable</td><td>Few suitable sites; affects estuary habitats; output varies over the day</td></tr>
<tr><td>Wave</td><td>Renewable</td><td>Unreliable; can disturb marine habitats; expensive</td></tr>
<tr><td>Geothermal</td><td>Renewable; reliable</td><td>Only possible in volcanic areas</td></tr>
<tr><td>Bio-fuel</td><td>Renewable; ‘carbon neutral’ if crops are replanted</td><td>Land used for crops could grow food; habitats cleared</td></tr>
</tbody></table></div>`),
  B.sim("phys-en8-sim","Meeting demand on the National Grid",stage,panel,`<span>Black line: demand</span><span>Gas fills whatever the other resources cannot supply</span>`),
  B.text("Trends and issues",`<p>In the UK, coal use for electricity has fallen almost to zero, and wind and solar have grown rapidly, because of concern about <b>climate change</b> and air pollution. Gas is still used because its output can be increased quickly when demand rises or the wind drops.</p><p>Scientists can identify environmental problems, but whether we act on them is limited by <b>cost</b>, <b>politics</b>, public opinion (for example, objections to wind farms or nuclear power stations) and the need for a <b>reliable</b> supply.</p>`),
  B.check([
   {q:"Which of these is a non-renewable energy resource?",opts:["Tidal","Uranium","Bio-fuel","Geothermal"],a:1,why:"Nuclear fuel will eventually run out."},
   {q:"Why are gas power stations still used alongside wind turbines?",opts:["They produce no CO₂","They can be started quickly to meet changes in demand","They are renewable","They are the cheapest to build"],a:1,why:"Gas is reliable and controllable, so it fills gaps when wind and solar output fall."},
   {q:"Which resource is renewable <b>and</b> predictable?",opts:["Wind","Solar","Tidal","Wave"],a:2,why:"Tides are caused by the Moon and can be predicted years ahead."},
   {q:"Burning coal releases sulfur dioxide. What environmental problem does this cause?",opts:["Global warming","Acid rain","Radioactive waste","Flooding"],a:1,why:"Sulfur dioxide dissolves in rain water to form acid rain."},
   {q:"What is the main energy resource used for transport today?",opts:["Electricity from nuclear power","Oil-based fuels such as petrol and diesel","Bio-fuel","Hydrogen"],a:1,why:"Most vehicles still run on petrol or diesel, though electric vehicles are increasing."}]),
  B.keypoints(["Non-renewable: coal, oil, gas, nuclear. Renewable: bio-fuel, wind, hydro, geothermal, tidal, wave, solar.","Compare resources on reliability, cost and environmental impact.","Fossil fuel use is falling and renewables rising, but cost, politics and reliability limit the change."]),
  B.mistakes(["Saying nuclear power produces greenhouse gases while generating electricity.","Calling bio-fuels ‘non-renewable’ because they are burned.","Describing solar as unreliable ‘at night’ only: cloud and winter also reduce output."])
 ],onShow:()=>draw()});

function draw(){ const cv=$("#phys-en8-cv"); if(!cv) return; const T=[]; for(let t=0;t<=24.001;t+=0.25) T.push(t);
  const D=T.map(t=>[t,demand(t)]);
  const P=plot(cv,{aspect:asp(.46),x:{label:"time of day / hours",min:0,max:24},y:{label:"power / GW",min:0,max:50},series:[{pts:D,col:css("--ink"),join:true,noPts:true}]});
  if(!P) return; const c=cv.getContext("2d"); let base=T.map(()=>0), Er=0, Eg=0, Et=0;
  const layers=T.map(t=>{ const s=supply(t), d=demand(t); const ren=s[1]+s[2]+s[3]; const sum=s.reduce((a,b)=>a+b,0); const sc=sum>d?d/sum:1; const L=s.map(x=>x*sc); L.push(Math.max(0,d-sum)); return L; });
  SRC.forEach(([n,col],k)=>{ c.save(); c.globalAlpha=.75; c.fillStyle=col; c.beginPath(); T.forEach((t,i)=>{ const y=base[i]+layers[i][k]; i?c.lineTo(P.X(t),P.Y(y)):c.moveTo(P.X(t),P.Y(y)); });
    for(let i=T.length-1;i>=0;i--) c.lineTo(P.X(T[i]),P.Y(base[i])); c.closePath(); c.fill(); c.restore(); base=base.map((b,i)=>b+layers[i][k]); });
  c.save(); c.strokeStyle=css("--ink"); c.lineWidth=2.5; c.beginPath(); D.forEach(([t,d],i)=>i?c.lineTo(P.X(t),P.Y(d)):c.moveTo(P.X(t),P.Y(d))); c.stroke(); c.restore();
  layers.forEach(L=>{ Et+=L.reduce((a,b)=>a+b,0); Er+=L[1]+L[2]+L[3]; Eg+=L[4]; });
  $("#phys-en8-r").textContent=`${Math.round(100*Er/Et)} %`; $("#phys-en8-g").textContent=`${Math.round(100*Eg/Et)} %`;
  $("#phys-en8-msg").textContent=!st.wind&&!st.sun?"A calm, dull day: gas has to supply most of the electricity, so emissions are high.":st.wind&&st.sun&&!st.winter?"A windy, sunny summer day: renewables supply most of the electricity and little gas is needed.":"Gas output rises and falls to match demand when wind and solar cannot."; }
$("#phys-en8-s").addEventListener("change",e=>{ st.winter=e.target.value==="w"; draw(); });
$("#phys-en8-w").addEventListener("change",e=>{ st.wind=e.target.checked; draw(); });
$("#phys-en8-u").addEventListener("change",e=>{ st.sun=e.target.checked; draw(); });
})();


</script>
<script>

attach("phys-en1",{title:T,intro:I,qs:[
 {stem:`<p>A student pulls back the elastic band of a catapult and fires a small ball vertically upwards.</p>`,parts:[
  {q:"Name the energy store that increases as the elastic band is pulled back.",m:1,lines:1,ms:[["1","elastic potential (store)"]]},
  {q:"Describe the changes in energy stores from the moment the ball is released until it reaches its highest point.",m:3,lines:4,ms:[["1","energy is transferred from the elastic potential store (of the band) to the kinetic store of the ball"],["1","as the ball rises, energy is transferred from its kinetic store to its gravitational potential store"],["1","at the highest point the kinetic store is (almost) empty; some energy has been dissipated to the thermal store of the surroundings (air resistance)"]]},
  {q:"Which of these is a way of transferring energy rather than an energy store?",m:1,opts:["Chemical","Nuclear","Radiation","Magnetic"],a:2,why:"Radiation (light, sound) is a pathway, not a store."}]},

  {q:"Describe how energy is transferred from the mains supply to the water.",m:2,lines:3,ms:[["1","energy is transferred electrically (by the current) to the heating element"],["1","the element transfers energy by heating to the thermal store of the water"]]},
  {q:"Explain why the total energy of the kettle, water and surroundings stays the same.",m:2,lines:3,ms:[["1","energy cannot be created or destroyed (conservation of energy)"],["1","energy is only transferred between stores; the energy that does not heat the water is dissipated to the surroundings"]]}]}
]});

attach("phys-en2",{title:T,intro:I,qs:[
 {stem:`<p>A roller coaster car of mass 650 kg starts from rest at the top of a 42 m high slope.</p>`,parts:[
  {q:"Write down the equation that links gravitational field strength (g), height (h), gravitational potential energy (E<sub>p</sub>) and mass (m).",m:1,lines:1,ms:[["1","E<sub>p</sub> = m g h"]]},
  {q:"Calculate the energy transferred from the car’s gravitational potential store as it descends 42 m.",m:2,ans:{a:267540,unit:"J",tol:0.01},ms:[["1","E<sub>p</sub> = 650 × 9.8 × 42"],["1","= 267 540 J (268 000 J)"]]},
  {q:"Calculate the maximum possible speed of the car at the bottom of the slope.",m:3,ans:{a:28.7,unit:"m/s",tol:0.01},ms:[["1","267 540 = ½ × 650 × v²"],["1","v² = 823.2"],["1","v = 28.7 m/s"]]},
  {q:"The actual speed at the bottom is less than this. Explain why.",m:2,lines:3,ms:[["1","work is done against friction / air resistance"],["1","so some energy is dissipated to the thermal store of the surroundings, leaving less in the kinetic store"]]}]},
 {stem:`<p>A lorry has a mass of 12 000 kg.</p>`,parts:[
  {q:"Calculate the kinetic energy of the lorry when it travels at 15 m/s.",m:2,ans:{a:1350000,unit:"J",tol:0.01},ms:[["1","E<sub>k</sub> = ½ × 12 000 × 15²"],["1","= 1 350 000 J"]]},
  {q:"The speed of the lorry increases to 30 m/s. State the factor by which its kinetic energy increases.",m:1,ans:{a:4,unit:"",tol:0.001},ms:[["1","4 (kinetic energy ∝ speed²)"]]}]}
]});

attach("phys-en3",{title:T,intro:I,qs:[
 {stem:`<p>A spring has a spring constant of 25 N/m. It is stretched by 12 cm. The limit of proportionality is not exceeded.</p>`,parts:[
  {q:"Calculate the elastic potential energy stored in the spring. Use the equation E<sub>e</sub> = ½ k e².",m:2,ans:{a:0.18,unit:"J",tol:0.01},ms:[["1","e = 0.12 m; E<sub>e</sub> = 0.5 × 25 × 0.12²"],["1","= 0.18 J"]]},
  {q:"The spring is used to launch a toy of mass 0.020 kg horizontally. Calculate the maximum speed of the toy.",m:3,ans:{a:4.24,unit:"m/s",tol:0.01},ms:[["1","0.18 = ½ × 0.020 × v²"],["1","v² = 18"],["1","v = 4.2 m/s"]]},
  {q:"Explain why the equation E<sub>e</sub> = ½ke² cannot be used if the spring is stretched beyond its limit of proportionality.",m:2,lines:3,ms:[["1","beyond the limit of proportionality force is no longer proportional to extension (F ≠ ke)"],["1","so the area under the force–extension graph is no longer ½ke²"]]}]},
 {stem:`<p>The graph shows how the force on a rubber band changes with its extension.</p>`+graph({xmax:0.10,xs:0.02,ymax:8,ys:2,lines:[[[0,0],[0.08,6]]],xt:"extension / m",yt:"force / N",aria:"Straight line from the origin to 6 N at 0.08 m"}),parts:[
  {q:"Use the graph to determine the energy stored when the extension is 0.08 m.",m:2,ans:{a:0.24,unit:"J",tol:0.02},ms:[["1","energy = area under graph = ½ × 6 × 0.08"],["1","= 0.24 J"]]},
  {q:"Determine the spring constant of the band.",m:1,ans:{a:75,unit:"N/m",tol:0.02},ms:[["1","k = F/e = 6 / 0.08 = 75 N/m"]]}]}
]});

attach("phys-en4",{title:T,intro:I,qs:[
 {stem:`<p>A student investigated the specific heat capacity of a 1.0 kg aluminium block using an electric heater and a thermometer.</p>`,parts:[
  {q:"Define specific heat capacity.",m:1,lines:2,ms:[["1","the amount of energy needed to raise the temperature of 1 kg of a substance by 1 °C"]]},
  {q:"The heater transferred 18 000 J and the temperature rose from 21 °C to 40 °C. Calculate the specific heat capacity of aluminium given by these results.",m:3,ans:{a:947,unit:"J/kg °C",tol:0.01},ms:[["1","Δθ = 19 °C"],["1","c = ΔE / (m Δθ) = 18 000 / (1.0 × 19)"],["1","= 947 J/kg °C"]]},
  {q:"The accepted value is 900 J/kg °C. Suggest why the student’s value is higher, and one improvement to the method.",m:2,lines:3,ms:[["1","energy is lost to the surroundings, so the temperature rise is smaller (and c calculated is larger)"],["1","insulate the block / put water or oil in the thermometer hole for better thermal contact"]]},
  {q:"Explain why the student plotted a graph of temperature against energy supplied rather than using one pair of readings.",m:2,lines:3,ms:[["1","the gradient uses many readings, so random errors are reduced / anomalies can be spotted"],["1","c = 1 / (m × gradient), so a reliable value is obtained from the linear part"]]}]},
 {stem:`<p>A hot-water tank holds 120 kg of water.</p>`,parts:[
  {q:"Calculate the energy needed to heat the water from 12 °C to 60 °C.",m:2,ans:{a:24192000,unit:"J",tol:0.01},ms:[["1","ΔE = 120 × 4200 × 48"],["1","= 24 192 000 J (2.4 × 10⁷ J)"]]},
  {q:"The immersion heater has a power of 3.0 kW. Calculate the minimum time needed in minutes.",m:2,ans:{a:134.4,unit:"min",tol:0.01},ms:[["1","t = E / P = 24 192 000 / 3000 = 8064 s"],["1","= 134 minutes"]]}]}
]});

attach("phys-en5",{title:T,intro:I,qs:[
 {stem:`<p>An electric motor lifts a 25 kg box through a height of 6.0 m in 12 s.</p>`,parts:[
  {q:"Calculate the work done on the box.",m:2,ans:{a:1470,unit:"J",tol:0.01},ms:[["1","W = mgh = 25 × 9.8 × 6.0"],["1","= 1470 J"]]},
  {q:"Calculate the useful power output of the motor.",m:2,ans:{a:122.5,unit:"W",tol:0.01},ms:[["1","P = W / t = 1470 / 12"],["1","= 122.5 W (123 W)"]]},
  {q:"A second motor lifts the same box through the same height in 8.0 s. Explain how its power compares with the first motor.",m:2,lines:3,ms:[["1","the same work is done (same energy transferred)"],["1","in less time, so its power is greater (1.5 times greater)"]]}]},
 {stem:`<p>A hair dryer has a power of 1.8 kW.</p>`,parts:[
  {q:"Calculate the energy transferred by the hair dryer in 4.0 minutes.",m:3,ans:{a:432000,unit:"J",tol:0.01},ms:[["1","t = 240 s; P = 1800 W"],["1","E = P t = 1800 × 240"],["1","= 432 000 J"]]}]}
]});

attach("phys-en6",{title:T,intro:I,qs:[
 {stem:`<p>An LED lamp has an input power of 8.0 W. It emits 3.2 W of light.</p>`,parts:[
  {q:"Calculate the efficiency of the lamp.",m:2,ans:{a:0.4,unit:"",tol:0.01},ms:[["1","efficiency = 3.2 / 8.0"],["1","= 0.40 (40%)"]]},

lesson({id:"phys-el1",group:"a",num:1,lvl:"6.2.1 · Lesson 1",name:"Circuit symbols, charge and current",icon:"charge",
 eyebrow:eb("6.2.1 Current, potential difference and resistance",1),title:"Circuit symbols, charge and current",
 intro:"An electric current is a flow of charge. In a metal wire the charge is carried by electrons. Circuit diagrams use standard symbols so anyone can read them, and the charge that flows is linked to the current and the time.",
 outcomes:[["Draw and interpret circuit diagrams using standard symbols","6.2.1.1"],["Define electric current as the rate of flow of charge","6.2.1.2"],["Use Q = It","6.2.1.2"]],
 blocks:[
  B.text("Circuit symbols",`<p>You need to recognise and draw these symbols:</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px">${syms.map(([l,s])=>sym(l,s)).join("")}</div>`),
  B.text("Current and charge",`<p>For a current to flow, a circuit must be <b>closed</b> and there must be a source of <b>potential difference</b> (such as a cell or battery). <b>Electric current</b> is the rate of flow of electrical charge.</p>`+B.eq(`${v("Q")} = ${v("I")}${v("t")} ${R}`,`<small>Q = charge flow in coulombs (C), I = current in amperes (A), t = time in seconds (s)</small>`)+`<p>In a single closed loop (a <b>series</b> circuit), the current has the <b>same value at any point</b>. Current is measured with an <b>ammeter</b> connected in series.</p><p>Conventional current is drawn from the positive terminal to the negative; the electrons in the wires actually flow the other way.</p>`),
  B.sim("phys-el1-sim","Charge flowing round a circuit",stage,panel,`<span>Dots: moving charge</span><span>The ammeter reads the same anywhere in the loop</span>`),
  B.example("Charge from a phone charger","A phone charger supplies a current of 2.0 A for 45 minutes. Calculate the charge that flows.",[
   ["Convert the time","",[`${v("t")} = 45 × 60 = 2700 s`]],
   ["Substitute","",[`${v("Q")} = ${v("I")}${v("t")} = 2.0 × 2700 = ${res("5400 C")}`]]]),
  B.check([
   {q:"A current of 0.50 A flows for 60 s. Calculate the charge that flows.",a:30,unit:"C",tol:0.01,why:"Q = It = 0.50 × 60 = 30 C."},
   {q:"120 C of charge flows through a lamp in 40 s. Calculate the current.",a:3,unit:"A",tol:0.01,why:"I = Q/t = 120/40 = 3.0 A."},
   {q:"A current of 0.20 A transfers 36 C. How long does this take?",a:180,unit:"s",tol:0.01,why:"t = Q/I = 36/0.20 = 180 s."},
   {q:"How must an ammeter be connected to measure the current through a lamp?",opts:["In parallel with the lamp","In series with the lamp","Across the cell","It does not matter"],a:1,why:"The same current must flow through the ammeter as through the lamp."},
   {q:"In a series circuit, an ammeter before a lamp reads 0.4 A. What does an ammeter after the lamp read?",opts:["0 A","Less than 0.4 A","0.4 A","More than 0.4 A"],a:2,why:"Current is the same at every point in a single loop: it is not used up."}]),
  B.keypoints(["Current is the rate of flow of charge: Q = It.","A current needs a closed circuit and a source of potential difference.","In a single loop the current is the same everywhere."]),
  B.mistakes(["Thinking current is ‘used up’ by a lamp.","Forgetting to convert minutes or hours into seconds.","Drawing an ammeter in parallel."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-el1"); if(!s) return; const i=I(), nw=window.innerWidth<640;
  let g=S.wire(loop0);
  g+=st.n>1?S.battery(110,140,true,""):S.cell(110,140,true,"");
  g+=`<text x="70" y="145" text-anchor="end" font-size="13" class="tm">${fx(st.n*1.5,1)} V</text>`;
  g+=S.sw(220,60,st.closed)+S.lamp(460,140,true,"",Math.min(1,i/1.2))+S.meter(330,220,"A",`${fx(i,2)} A`)+S.meter(220,220,"A",`${fx(i,2)} A`);
  if(st.closed) g+=S.flow(loop0,st.ph,28,"fdat",4);
  if(!nw){ g+=`<rect x="540" y="40" width="340" height="200" rx="10" class="fpan ln"/><text x="560" y="72" font-size="15" font-weight="700">Charge meter</text>`;
    const Q=i*st.t; g+=`<text x="560" y="110" font-size="14" class="tm">I = ${fx(i,2)} A</text><text x="560" y="140" font-size="14" class="tm">t = ${fx(st.t,1)} s</text><text x="560" y="176" font-size="18" font-weight="700" class="tacc">Q = It = ${fx(Q,2)} C</text><rect x="560" y="196" width="300" height="16" rx="4" class="fsunk"/><rect x="560" y="196" width="${(300*Math.min(1,Q/(2*10))).toFixed(1)}" height="16" rx="4" class="facc"/>`; }
  s.setAttribute("viewBox",nw?"0 20 510 250":"0 0 900 280"); s.innerHTML=g;
  $("#phys-el1-nl").textContent=`${st.n} (${fx(st.n*1.5,1)} V)`; $("#phys-el1-I").textContent=`${fx(i,2)} A`; $("#phys-el1-t").textContent=`${fx(st.t,1)} s`; $("#phys-el1-Q").textContent=`${fx(i*st.t,2)} C`; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!$("#lab-phys-el1").hidden){ st.ph+=I()*60*dt; if(st.run){ st.t=Math.min(10,st.t+dt*2); if(st.t>=10) st.run=false; } draw(); } requestAnimationFrame(loop); }
$("#phys-el1-n").addEventListener("input",e=>{ st.n=+e.target.value; draw(); });
$("#phys-el1-sw").addEventListener("change",e=>{ st.closed=e.target.checked; draw(); });
$("#phys-el1-go").addEventListener("click",()=>{ st.t=0; st.run=true; });
$("#phys-el1-rs").addEventListener("click",()=>{ st.t=0; st.run=false; draw(); });
draw(); requestAnimationFrame(loop);
})();


</script>
<script>
LEARN.unit="phys-elec";

/* EL2: potential difference, resistance and V = IR */
(()=>{
const {$,fx,plot,css,linfit}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G, S=window.SYM;
const st={R:20,V:6,data:[]};
const stage=`<svg id="phys-el2" viewBox="0 0 520 270" style="display:block;margin:0 auto;max-width:520px" role="img" aria-label="Circuit with a variable supply, resistor, ammeter in series and voltmeter in parallel"></svg><canvas id="phys-el2-cv" class="graph" aria-label="Current against potential difference"></canvas>`;
const panel=`<div class="field"><div class="lbl">Resistance R <b id="phys-el2-Rl"></b></div><input type="range" id="phys-el2-R" min="5" max="50" step="5" value="20" aria-label="Resistance"></div>
<div class="field"><div class="lbl">Supply p.d. V <b id="phys-el2-Vl"></b></div><input type="range" id="phys-el2-V" min="0" max="12" step="1" value="6" aria-label="Potential difference"></div>
<div class="btnrow"><button class="btn primary" id="phys-el2-rec">Record reading</button><button class="btn" id="phys-el2-clr">Clear</button></div>
<div class="readout"><div><span>Current I = V/R</span><b id="phys-el2-I">—</b></div><div><span>Gradient of I–V graph</span><b id="phys-el2-g">—</b></div><div><span>R from graph = 1/gradient</span><b id="phys-el2-Rg">—</b></div></div>`;

lesson({id:"phys-el2",group:"a",num:2,lvl:"6.2.1 · Lesson 2",name:"Resistance and V = IR",icon:"rho",
 eyebrow:eb("6.2.1.3 Current, resistance and potential difference",2),title:"Resistance and V = IR",
 intro:"The current through a component depends on the potential difference across it and on its resistance. For many components these three quantities are linked by one simple equation.",
 outcomes:[["Explain that the current through a component depends on both the p.d. across it and its resistance","6.2.1.3"],["Use V = IR","6.2.1.3"],["Describe how to investigate the factors affecting resistance (required practical 15)","6.2.1.3"]],
 blocks:[
  B.text("Potential difference and resistance",`<p>The <b>potential difference</b> (p.d.) across a component is the energy transferred per unit charge passing through it. It is measured in <b>volts</b> with a <b>voltmeter</b> connected in <b>parallel</b> across the component.</p><p><b>Resistance</b> opposes the current. The greater the resistance, the smaller the current for a given p.d.</p>`+B.eq(`${v("V")} = ${v("I")}${v("R")} ${R}`,`<small>V = potential difference (V), I = current (A), R = resistance in ohms (Ω)</small>`)),
  B.sim("phys-el2-sim","Measuring resistance",stage,panel,`<span>Record readings at several p.d.s</span><span>Ohmic resistor: straight line through the origin</span>`),
  B.example("Using V = IR","A current of 0.25 A flows through a resistor when the p.d. across it is 6.0 V. Calculate the resistance. What current flows if the p.d. is increased to 9.0 V?",[
   ["Resistance","",[`${v("R")} = ${fr(v("V"),v("I"))} = ${fr("6.0","0.25")} = ${res("24 Ω")}`]],
   ["New current","R is constant",[`${v("I")} = ${fr(v("V"),v("R"))} = ${fr("9.0","24")} = ${res("0.375 A")}`]]]),
  B.practical(`<p>In <b>RP 15 Resistance</b> you investigate how the resistance of a wire depends on its length, and how the total resistance of resistors in series and in parallel compares with that of a single resistor.</p><ul><li>Measure V and I for different lengths of wire; R = V/I.</li><li>R is directly proportional to length: the graph of R against length is a straight line through the origin.</li><li>Use a low current and switch off between readings so that the wire does not heat up (a hotter wire has a higher resistance).</li></ul>`,"Required practical 15"),
  B.check([
   {q:"A 12 Ω resistor has a current of 0.50 A. Calculate the p.d. across it.",a:6,unit:"V",tol:0.01,why:"V = IR = 0.50 × 12 = 6.0 V."},
   {q:"A 230 V heater draws a current of 10 A. Calculate its resistance.",a:23,unit:"Ω",tol:0.01,why:"R = V/I = 230/10 = 23 Ω."},
   {q:"What current flows through a 47 Ω resistor with 9.4 V across it?",a:0.2,unit:"A",tol:0.01,why:"I = 9.4/47 = 0.20 A."},
   {q:"How is a voltmeter connected?",opts:["In series with the component","In parallel across the component","In series with the cell only","Anywhere in the circuit"],a:1,why:"It measures the p.d. between two points, so it goes across the component."},
   {q:"In RP15 the length of the wire is doubled. What happens to its resistance?",opts:["Halves","Doubles","Stays the same","Quadruples"],a:1,why:"Resistance is directly proportional to length."},
   {q:"Why should the current be kept low in RP15?",opts:["To save the battery","To stop the wire heating up and changing its resistance","Because ammeters can only read small currents","To make the voltmeter more accurate"],a:1,why:"Temperature affects resistance, so heating would spoil the results."}]),
  B.keypoints(["V = IR; resistance in ohms (Ω).","Ammeter in series; voltmeter in parallel.","Resistance of a wire is proportional to its length (RP15)."]),
  B.mistakes(["Rearranging V = IR incorrectly (use the triangle or algebra carefully).","Using mA without converting to A.","Taking the gradient of an I–V graph as R (it is 1/R)."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-el2"); if(!s) return; const I=st.V/st.R;
  const lp=[[80,50],[440,50],[440,200],[80,200],[80,50]];
  let g=S.wire(lp)+S.wire([[230,50],[230,0+10],[330,10],[330,50]],"ink",1.8)+S.battery(80,125,true,"")+`<text x="40" y="130" text-anchor="end" font-size="13" class="tm">${st.V} V</text>`+S.res(280,50,false,"")+S.meter(280,10,"V",`${fx(st.V,1)} V`)+S.meter(440,125,"A",`${fx(I,3)} A`)+`<text x="280" y="80" text-anchor="middle" font-size="13" font-weight="700">${st.R} Ω</text>`;
  s.setAttribute("viewBox","0 -20 520 250"); s.innerHTML=g;
  const f=st.data.length>=2?linfit(st.data):null;
  plot($("#phys-el2-cv"),{aspect:asp(.45),x:{label:"potential difference V / V",min:0,max:12},y:{label:"current I / A",min:0,max:Math.ceil(12/st.R*10)/10},series:[{pts:st.data,col:css("--accent")}],fits:f?[{m:f.m,c:f.c,x0:0,x1:12,col:css("--data"),dash:[5,4]}]:[],empty:"Record some readings"});
  $("#phys-el2-Rl").textContent=`${st.R} Ω`; $("#phys-el2-Vl").textContent=`${st.V} V`; $("#phys-el2-I").textContent=`${fx(I,3)} A`;
  $("#phys-el2-g").textContent=f?`${fx(f.m,4)} A/V`:"—"; $("#phys-el2-Rg").textContent=f&&f.m>0?`${fx(1/f.m,1)} Ω`:"—"; }
$("#phys-el2-R").addEventListener("input",e=>{ st.R=+e.target.value; st.data=[]; draw(); });
$("#phys-el2-V").addEventListener("input",e=>{ st.V=+e.target.value; draw(); });
$("#phys-el2-rec").addEventListener("click",()=>{ st.data=st.data.filter(p=>p[0]!==st.V); st.data.push([st.V,+(st.V/st.R).toFixed(3)]); st.data.sort((a,b)=>a[0]-b[0]); draw(); });
$("#phys-el2-clr").addEventListener("click",()=>{ st.data=[]; draw(); });
})();


</script>
<script>
LEARN.unit="phys-elec";

/* EL3: I–V characteristics, thermistors and LDRs */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb}=G;
const st={c:"res",V:3,T:25,L:50};
const Rth=()=>2000*Math.exp(3500*(1/(st.T+273)-1/298)), Rldr=()=>200+20000*Math.exp(-st.L/12);
const COMP={
 res:["Fixed resistor",V=>V/20,"A straight line through the origin: current is directly proportional to p.d. The resistance is constant (at constant temperature), so the resistor is <b>ohmic</b>."],
 lamp:["Filament lamp",V=>Math.sign(V)*0.12*Math.pow(Math.abs(V),0.55),"As the current increases the filament gets hotter. The ions vibrate more, so the resistance <b>increases</b> and the graph curves towards the V axis."],
 diode:["Diode",V=>V<=0?0:V<=0.55?1e-5*(Math.exp(V/0.06)-1):0.0951+2.2*(V-0.55),"Current flows in one direction only. In the reverse direction the resistance is very high, so the current is zero."],
 therm:["Thermistor",V=>V/Rth()*1000,"At a fixed temperature the line is straight. Raise the temperature and the resistance <b>decreases</b>, so the line gets steeper."],
 ldr:["Light-dependent resistor",V=>V/Rldr()*1000,"At a fixed light level the line is straight. Increase the light intensity and the resistance <b>decreases</b>, so the line gets steeper."]};
const mA=()=>st.c==="therm"||st.c==="ldr";
const stage=`<canvas id="phys-el3-cv" class="graph" aria-label="Current against potential difference for the chosen component"></canvas>`;
const panel=`<div class="field"><div class="lbl">Component</div><select id="phys-el3-c" aria-label="Component">${Object.entries(COMP).map(([k,c])=>`<option value="${k}">${c[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Potential difference <b id="phys-el3-Vl"></b></div><input type="range" id="phys-el3-V" min="-6" max="6" step="0.1" value="3" aria-label="Potential difference"></div>
<div class="field" id="phys-el3-Tf" hidden><div class="lbl">Temperature <b id="phys-el3-Tl"></b></div><input type="range" id="phys-el3-T" min="0" max="100" step="5" value="25" aria-label="Temperature"></div>
<div class="field" id="phys-el3-Lf" hidden><div class="lbl">Light intensity <b id="phys-el3-Ll"></b></div><input type="range" id="phys-el3-L" min="0" max="100" step="5" value="50" aria-label="Light intensity"></div>
<div class="readout"><div><span>Current</span><b id="phys-el3-I">—</b></div><div><span>Resistance V/I</span><b id="phys-el3-R">—</b></div></div>
<p class="note" id="phys-el3-msg"></p>`;

lesson({id:"phys-el3",group:"a",num:3,lvl:"6.2.1 · Lesson 3",name:"I–V characteristics",icon:"iv",
 eyebrow:eb("6.2.1.4 Resistors",3),title:"I–V characteristics",
 intro:"A graph of current against potential difference shows how a component behaves. Some components have a constant resistance; others change with the current, the temperature or the light level, which makes them useful as sensors.",
 outcomes:[["Explain that for an ohmic conductor the current is directly proportional to the p.d. at constant temperature","6.2.1.4"],["Describe and explain the I–V characteristics of a resistor, filament lamp and diode","6.2.1.4"],["Describe how the resistance of a thermistor and an LDR changes, and their uses","6.2.1.4"],["Describe how to obtain I–V characteristics (required practical 16)","6.2.1.4"]],
 blocks:[
  B.text("Ohmic and non-ohmic components",`<p>For an <b>ohmic conductor</b> at constant temperature, the current is directly proportional to the potential difference: the resistance stays the same. In other components the resistance changes:</p><ul><li><b>Filament lamp</b>: resistance increases as the temperature of the filament increases.</li><li><b>Diode</b>: current flows in one direction only; it has a very high resistance in the reverse direction.</li><li><b>Thermistor</b>: resistance <b>decreases</b> as temperature <b>increases</b>. Used in thermostats and fire alarms.</li><li><b>Light-dependent resistor (LDR)</b>: resistance <b>decreases</b> as light intensity <b>increases</b>. Used in automatic night lights and outdoor lighting.</li></ul>`),
  B.sim("phys-el3-sim","I–V characteristics",stage,panel,`<span>Curve: I–V graph</span><span>Dot: current reading at the chosen p.d.</span>`),
  B.practical(`<p>In <b>RP 16 I–V characteristics</b> you use a variable resistor (or variable supply), an ammeter in series and a voltmeter in parallel to measure the current for a range of p.d.s. Reverse the connections to the component to take negative readings. Plot current (y-axis) against p.d. (x-axis).</p>`,"Required practical 16"),
  B.check([
   {q:"What happens to the resistance of a filament lamp as the current through it increases?",opts:["Decreases","Increases","Stays the same","Becomes zero"],a:1,why:"The filament heats up, so its resistance increases."},
   {q:"Which component would be best for a circuit that switches on a heater when a room gets cold?",opts:["Diode","LDR","Thermistor","Filament lamp"],a:2,why:"A thermistor’s resistance depends on temperature."},
   {q:"The resistance of an LDR in bright light is 500 Ω. In the dark, its resistance is…",opts:["lower than 500 Ω","higher than 500 Ω","exactly 500 Ω","zero"],a:1,why:"LDR resistance increases as the light intensity decreases."},
   {q:"A diode has a p.d. of −3.0 V across it. What is the current?",opts:["Very large","About zero","Equal to the forward current","Negative and large"],a:1,why:"In reverse a diode has a very high resistance."},
   {q:"A thermistor has a current of 2.5 mA when the p.d. across it is 5.0 V. Calculate its resistance.",a:2000,unit:"Ω",tol:0.01,why:"R = 5.0 / 0.0025 = 2000 Ω."}]),
  B.keypoints(["Ohmic conductor: I ∝ V at constant temperature (straight line through the origin).","Lamp: R rises with temperature. Diode: current in one direction only.","Thermistor: R falls as T rises. LDR: R falls as light intensity rises."]),
  B.mistakes(["Saying a thermistor’s resistance increases with temperature (it decreases for the GCSE thermistor).","Plotting V on the y-axis when the question asks for an I–V graph.","Forgetting to take readings with the p.d. reversed."])
 ],onShow:()=>draw()});

function draw(){ const cv=$("#phys-el3-cv"); if(!cv) return; const [n,f,txt]=COMP[st.c]; const pts=[]; for(let V=-6;V<=6.001;V+=0.05) pts.push([V,f(V)]);
  const I=f(st.V), ymax=mA()?40:st.c==="diode"?0.6:0.4;
  plot(cv,{aspect:asp(.55),x:{label:"potential difference / V",min:-6,max:6},y:{label:`current / ${mA()?"mA":"A"}`,min:-ymax,max:ymax},series:[{pts:pts.filter(p=>Math.abs(p[1])<=ymax),col:css("--data"),join:true,noPts:true},{pts:Math.abs(I)<=ymax?[[st.V,I]]:[],col:css("--accent")}]});
  $("#phys-el3-Tf").hidden=st.c!=="therm"; $("#phys-el3-Lf").hidden=st.c!=="ldr";
  $("#phys-el3-Vl").textContent=`${fx(st.V,1)} V`; $("#phys-el3-Tl").textContent=`${st.T} °C`; $("#phys-el3-Ll").textContent=`${st.L} %`;
  const Ia=mA()?I/1000:I; $("#phys-el3-I").textContent=Math.abs(Ia)<1e-4?"≈ 0 A":Math.abs(Ia)<0.1?`${fx(Ia*1000,3)} mA`:`${fx(Ia,3)} A`;
  $("#phys-el3-R").textContent=Math.abs(Ia)<1e-6?(st.V===0?"—":"very high"):`${fx(st.V/Ia,Math.abs(st.V/Ia)>=100?0:1)} Ω`; $("#phys-el3-msg").innerHTML=txt; }
$("#phys-el3-c").addEventListener("change",e=>{ st.c=e.target.value; draw(); });
[["V","V"],["T","T"],["L","L"]].forEach(([k,p])=>$("#phys-el3-"+k).addEventListener("input",e=>{ st[p]=+e.target.value; draw(); }));
})();


</script>
<script>
