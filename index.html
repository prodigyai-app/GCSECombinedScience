/* EL4: series and parallel circuits */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb}=G, S=window.SYM;
const st={mode:"s",R1:10,R2:20,V:12};
const stage=`<svg id="phys-el4" viewBox="0 0 560 300" style="display:block;margin:0 auto;max-width:600px" role="img" aria-label="Two resistors connected in series or in parallel with meters"></svg>`;
const panel=`<div class="field"><div class="lbl">Connection</div><div class="seg c2" id="phys-el4-m"><label class="opt"><input type="radio" name="phys-el4-m" value="s" checked><span>Series</span></label><label class="opt"><input type="radio" name="phys-el4-m" value="p"><span>Parallel</span></label></div></div>
<div class="field"><div class="lbl">R₁ <b id="phys-el4-1l"></b></div><input type="range" id="phys-el4-1" min="5" max="50" step="5" value="10" aria-label="R1"></div>
<div class="field"><div class="lbl">R₂ <b id="phys-el4-2l"></b></div><input type="range" id="phys-el4-2" min="5" max="50" step="5" value="20" aria-label="R2"></div>
<div class="readout"><div><span>Total resistance</span><b id="phys-el4-Rt">—</b></div><div><span>Supply current</span><b id="phys-el4-I">—</b></div></div>
<p class="note" id="phys-el4-msg"></p>`;

lesson({id:"phys-el4",group:"b",num:4,lvl:"6.2.2 · Lesson 4",name:"Series and parallel circuits",icon:"series",
 eyebrow:eb("6.2.2 Series and parallel circuits",4),title:"Series and parallel circuits",
 intro:"Components can be connected one after another in a single loop, or side by side on separate branches. The rules for current, potential difference and resistance are different for each arrangement.",
 outcomes:[["State the rules for current, p.d. and resistance in series circuits","6.2.2"],["State the rules for current and p.d. in parallel circuits, and explain why adding resistors in parallel decreases the total resistance","6.2.2"],["Calculate the currents, p.d.s and resistances in series circuits","6.2.2"]],
 blocks:[
  B.text("The rules",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th></th><th>Series</th><th>Parallel</th></tr></thead><tbody><tr><td>Current</td><td>Same through each component</td><td>Total current = sum of the branch currents</td></tr><tr><td>Potential difference</td><td>Total p.d. of the supply is <b>shared</b> between the components</td><td>Same p.d. across each branch (equal to the supply)</td></tr><tr><td>Resistance</td><td>R<sub>total</sub> = R₁ + R₂</td><td>Total resistance is <b>less than the smallest</b> individual resistance</td></tr></tbody></table></div><p>Adding a resistor in <b>series</b> increases the total resistance. Adding a resistor in <b>parallel</b> decreases the total resistance, because it gives the charge another path to flow along, so the total current increases. (You do not need to calculate parallel resistances at GCSE.)</p>`),
  B.sim("phys-el4-sim","Series or parallel?",stage,panel,`<span>Supply: 12 V</span><span>Meters update as you change the resistors</span>`),
  B.example("A series circuit","A 6.0 Ω and a 9.0 Ω resistor are connected in series to a 4.5 V battery. Calculate the current and the p.d. across each resistor.",[
   ["Total resistance","",[`${v("R")} = 6.0 + 9.0 = 15 Ω`]],
   ["Current","Same everywhere in series",[`${v("I")} = ${fr("4.5","15")} = ${res("0.30 A")}`]],
   ["P.d.s","V = IR for each",[`${v("V","1")} = 0.30 × 6.0 = ${res("1.8 V")};  ${v("V","2")} = 0.30 × 9.0 = ${res("2.7 V")} (total 4.5 V ✓)`]]]),
  B.check([
   {q:"A 4 Ω and an 8 Ω resistor are in series. What is the total resistance?",a:12,unit:"Ω",tol:0.001,why:"R = 4 + 8 = 12 Ω."},
   {q:"A 12 V battery is connected to two lamps in series. The p.d. across one lamp is 5 V. What is the p.d. across the other?",a:7,unit:"V",tol:0.001,why:"The p.d.s add to the supply: 12 − 5 = 7 V."},
   {q:"In a parallel circuit, the branch currents are 0.3 A and 0.5 A. What is the current from the supply?",a:0.8,unit:"A",tol:0.01,why:"Currents add at a junction: 0.3 + 0.5 = 0.8 A."},
   {q:"A 10 Ω and a 20 Ω resistor are connected in parallel. The total resistance is…",opts:["30 Ω","15 Ω","more than 10 Ω but less than 20 Ω","less than 10 Ω"],a:3,why:"The total resistance in parallel is less than the smallest resistance."},
   {q:"A 3.0 Ω and a 7.0 Ω resistor are in series with a 6.0 V supply. Calculate the p.d. across the 7.0 Ω resistor.",a:4.2,unit:"V",tol:0.01,why:"I = 6.0/10 = 0.60 A; V = 0.60 × 7.0 = 4.2 V."},
   {q:"Why do houses have lights wired in parallel?",opts:["To share the p.d. between the lamps","So each lamp gets the full p.d. and can be switched independently","To increase the total resistance","To make the current the same everywhere"],a:1,why:"Each branch has the full supply p.d. and its own switch."}]),
  B.keypoints(["Series: same current; p.d.s add up to the supply; R<sub>total</sub> = R₁ + R₂.","Parallel: same p.d. across each branch; branch currents add up; total resistance is less than the smallest.","Adding resistors in parallel lowers total resistance (more paths for the charge)."]),
  B.mistakes(["Adding resistances in parallel as if they were in series.","Thinking the current is shared out in a series circuit.","Forgetting that each parallel branch has the full supply p.d."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-el4"); if(!s) return; const {R1,R2,V}=st; let g="", Rt, I;
  if(st.mode==="s"){ Rt=R1+R2; I=V/Rt; const lp=[[60,70],[500,70],[500,230],[60,230],[60,70]];
    g+=S.wire(lp)+S.battery(60,150,true,"")+`<text x="30" y="155" text-anchor="end" font-size="13" class="tm">12 V</text>`+S.res(200,70,false,"")+S.res(380,70,false,"")+S.meter(280,230,"A",`${fx(I,3)} A`);
    g+=S.wire([[165,70],[165,20],[235,20],[235,70]],"ink",1.6)+S.wire([[345,70],[345,20],[415,20],[415,70]],"ink",1.6)+S.meter(200,20,"V","")+S.meter(380,20,"V","");
    g+=`<text x="200" y="104" text-anchor="middle" font-size="13" font-weight="700">R₁ = ${R1} Ω</text><text x="380" y="104" text-anchor="middle" font-size="13" font-weight="700">R₂ = ${R2} Ω</text>`;
    g+=`<text x="250" y="12" font-size="12" class="tdat">${fx(I*R1,2)} V</text><text x="430" y="12" font-size="12" class="tdat">${fx(I*R2,2)} V</text>`;
    $("#phys-el4-msg").innerHTML=`The same current ${fx(I,3)} A flows through both. The p.d. is shared: ${fx(I*R1,2)} V + ${fx(I*R2,2)} V = 12 V. The bigger resistor gets the bigger share.`; }
  else { Rt=1/(1/R1+1/R2); I=V/Rt; const I1=V/R1, I2=V/R2;
    g+=S.wire([[60,40],[480,40],[480,260],[60,260],[60,40]]);
    g+=S.wire([[160,40],[160,150],[480,150]])+S.battery(60,150,true,"")+`<text x="30" y="155" text-anchor="end" font-size="13" class="tm">12 V</text>`;
    g+=S.res(330,40,false,"")+S.res(330,150,false,"")+S.dot(160,40)+S.dot(480,40)+S.dot(480,150)+S.meter(240,40,"A","")+S.meter(240,150,"A","")+S.meter(270,260,"A",`${fx(I,3)} A`);
    g+=`<text x="330" y="74" text-anchor="middle" font-size="13" font-weight="700">R₁ = ${R1} Ω · ${fx(I1,3)} A</text><text x="330" y="184" text-anchor="middle" font-size="13" font-weight="700">R₂ = ${R2} Ω · ${fx(I2,3)} A</text>`;
    $("#phys-el4-msg").innerHTML=`Each branch has the full 12 V. Branch currents ${fx(I1,3)} A + ${fx(I2,3)} A = ${fx(I,3)} A. Total resistance ${fx(Rt,2)} Ω is less than either resistor.`; }
  s.innerHTML=g; $("#phys-el4-1l").textContent=`${R1} Ω`; $("#phys-el4-2l").textContent=`${R2} Ω`; $("#phys-el4-Rt").textContent=`${fx(Rt,2)} Ω`; $("#phys-el4-I").textContent=`${fx(I,3)} A`; }
$("#phys-el4-m").addEventListener("change",e=>{ st.mode=e.target.value; draw(); });
$("#phys-el4-1").addEventListener("input",e=>{ st.R1=+e.target.value; draw(); });
$("#phys-el4-2").addEventListener("input",e=>{ st.R2=+e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-elec";

/* EL5: mains electricity */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {eb}=G;
const st={src:"ac",f:50,earth:true,fault:false};
const stage1=`<canvas id="phys-el5-cv" class="graph" aria-label="Potential difference against time for a.c. and d.c."></canvas>`;
const panel1=`<div class="field"><div class="lbl">Supply</div><div class="seg c2" id="phys-el5-s"><label class="opt"><input type="radio" name="phys-el5-s" value="ac" checked><span>Mains a.c.</span></label><label class="opt"><input type="radio" name="phys-el5-s" value="dc"><span>Battery d.c.</span></label></div></div>
<div class="readout"><div><span>Frequency</span><b id="phys-el5-f">—</b></div><div><span>Time for one cycle</span><b id="phys-el5-T">—</b></div></div><p class="note" id="phys-el5-msg"></p>`;
const stage2=`<svg id="el5b" viewBox="0 0 640 300" style="display:block;margin:0 auto;max-width:640px" role="img" aria-label="A metal kettle connected by live, neutral and earth wires, with a possible fault"></svg>`;
const panel2=`<label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin-bottom:10px"><input type="checkbox" id="phys-el5-fault" style="width:18px;height:18px;accent-color:var(--accent)"> Fault: live wire touches the metal case</label>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="phys-el5-earth" checked style="width:18px;height:18px;accent-color:var(--accent)"> Earth wire connected</label>
<p class="note" id="phys-el5-msg2"></p>`;

lesson({id:"phys-el5",group:"c",num:5,lvl:"6.2.3 · Lesson 5",name:"Mains electricity",icon:"mains",
 eyebrow:eb("6.2.3 Domestic uses and safety",5),title:"Mains electricity",
 intro:"Batteries give a steady direct current, but the mains supply in your home is alternating. Appliances are connected with three-core cable, and each wire has a job, including one that is there only to keep you safe.",
 outcomes:[["Explain the difference between direct and alternating potential difference","6.2.3.1"],["Recall that UK mains is a.c. at 50 Hz and about 230 V","6.2.3.1"],["Describe the live, neutral and earth wires, including their colours and potentials","6.2.3.2"],["Explain why a live wire can be dangerous even when a switch is open","6.2.3.2"]],
 blocks:[
  B.text("Direct and alternating p.d.",`<p>A <b>direct</b> potential difference (d.c.), from a cell or battery, has a constant direction, so the current always flows the same way. An <b>alternating</b> potential difference (a.c.) keeps reversing direction, so the current flows back and forth.</p><p>In the UK the domestic mains supply is a.c. with a <b>frequency of 50 Hz</b> and a p.d. of about <b>230 V</b>.</p>`),
  B.sim("phys-el5-sim","Looking at a.c. and d.c.",stage1,panel1,`<span>Oscilloscope trace</span><span>Time base: 5 ms per division</span>`),
  B.text("Three-core cable",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Wire</th><th>Colour</th><th>Potential</th><th>Job</th></tr></thead><tbody><tr><td>Live</td><td>Brown</td><td>about 230 V</td><td>Carries the alternating p.d. from the supply</td></tr><tr><td>Neutral</td><td>Blue</td><td>at or close to 0 V</td><td>Completes the circuit</td></tr><tr><td>Earth</td><td>Green and yellow stripes</td><td>0 V</td><td>Safety wire: stops the appliance case becoming live; only carries a current if there is a fault</td></tr></tbody></table></div><p>The p.d. between the live and earth wire is about 230 V. Touching the live wire is dangerous because your body is at 0 V: a large p.d. across you drives a current through you, which can be fatal. This is true <b>even if the switch is open</b>, because the live wire is still connected to the supply. Any connection between the live wire and earth can be dangerous.</p>`),
  B.sim("phys-el5-sim2","Why the earth wire matters",stage2,panel2,`<span>Brown: live · Blue: neutral · Green/yellow: earth</span>`),
  B.check([
   {q:"What is the frequency of the UK mains supply?",opts:["230 Hz","50 Hz","60 Hz","13 Hz"],a:1,why:"UK mains is 50 Hz, 230 V."},
   {q:"What colour is the neutral wire?",opts:["Brown","Blue","Green and yellow","Red"],a:1,why:"Neutral is blue; live is brown; earth is green/yellow."},
   {q:"What is the potential of the earth wire?",a:0,unit:"V",abs:0.01,why:"The earth wire is at 0 V."},
   {q:"Why can touching a live wire be dangerous even when the appliance is switched off?",opts:["The switch stores charge","The live wire is still at a high potential, so a current could flow through you to earth","The neutral wire becomes live","The earth wire is at 230 V"],a:1,why:"The switch only breaks the circuit after the live wire, which stays at about 230 V."},
   {q:"What is the main difference between a.c. and d.c.?",opts:["a.c. is always bigger","a.c. keeps changing direction; d.c. flows in one direction","d.c. only comes from the mains","a.c. cannot transfer energy"],a:1,why:"Alternating current repeatedly reverses direction."}]),
  B.keypoints(["d.c.: one direction. a.c.: keeps reversing. UK mains: a.c., 50 Hz, about 230 V.","Live (brown, 230 V), neutral (blue, ≈ 0 V), earth (green/yellow, 0 V, safety).","A live wire is dangerous even when switched off: a current can flow through you to earth."]),
  B.mistakes(["Saying the earth wire normally carries the current.","Mixing up the colours of live and neutral.","Thinking that switching off makes the live wire safe."])
 ],onShow:()=>draw()});

function draw(){ const cv=$("#phys-el5-cv"); if(!cv) return; const pts=[]; for(let t=0;t<=40.001;t+=0.2) pts.push([t,st.src==="ac"?325*Math.sin(2*Math.PI*50*t/1000):230]);
  plot(cv,{aspect:asp(.4),x:{label:"time / ms",min:0,max:40},y:{label:"potential difference / V",min:-400,max:400},series:[{pts,col:css("--data"),join:true,noPts:true}]});
  $("#phys-el5-f").textContent=st.src==="ac"?"50 Hz":"— (constant)"; $("#phys-el5-T").textContent=st.src==="ac"?"0.020 s (20 ms)":"—";
  $("#phys-el5-msg").textContent=st.src==="ac"?"The p.d. swings between +325 V and −325 V, 50 times a second. Its effective value is 230 V.":"A d.c. supply gives a constant p.d., so the trace is a horizontal line.";
  const s=$("#el5b"); const live="#8a4b1f", neu="#2f6fd6", earth="#3f9a3a", danger=st.fault&&!st.earth, blow=st.fault&&st.earth;
  let g=`<rect x="20" y="40" width="110" height="200" rx="8" class="fsunk ink" stroke-width="2"/><text x="75" y="30" text-anchor="middle" font-size="13" font-weight="700">Supply</text><text x="75" y="90" text-anchor="middle" font-size="12" class="tm">L 230 V</text><text x="75" y="150" text-anchor="middle" font-size="12" class="tm">N 0 V</text><text x="75" y="210" text-anchor="middle" font-size="12" class="tm">E 0 V</text>`;
  g+=`<path d="M130 85 H230" style="stroke:${live}" stroke-width="5"/><rect x="230" y="75" width="50" height="20" rx="3" class="${blow?"fbd":"fsunk"} ink" stroke-width="1.5"/>${blow?`<path d="M240 85 l10 -6 M262 85 l10 6" class="ink" stroke-width="2"/>`:`<path d="M230 85 H280" class="ink" stroke-width="1.2"/>`}<text x="255" y="110" text-anchor="middle" font-size="11" class="tm">fuse${blow?" (melted)":""}</text>`;
  g+=`<path d="M280 85 H${blow?280:420}" style="stroke:${live}" stroke-width="5"/>`;
  g+=`<path d="M130 145 H420" style="stroke:${neu}" stroke-width="5"/><path d="M130 205 H${st.earth?470:330}" style="stroke:${earth}" stroke-width="5" stroke-dasharray="10 6"/>`;
  g+=`<path d="M400 55 h160 v200 h-160 z" class="${danger?"fbd":"fpan"} ink" stroke-width="3" opacity="${danger?.5:1}"/><text x="480" y="48" text-anchor="middle" font-size="13" font-weight="700">Metal kettle</text><rect x="430" y="110" width="80" height="50" rx="6" class="fsunk ink" stroke-width="1.5"/><text x="470" y="140" text-anchor="middle" font-size="11" class="tm">element</text>`;
  if(st.earth) g+=`<circle cx="470" cy="205" r="5" class="fink"/>`;
  if(st.fault&&!blow) g+=`<path d="M420 85 L440 85 L400 ${100}" style="stroke:${live}" stroke-width="4"/>`;
  if(st.fault) g+=`<text x="415" y="78" font-size="11" class="tbd">loose live wire</text>`;
  if(danger) g+=`<circle cx="600" cy="140" r="14" class="fink"/><path d="M600 154 v60 M600 214 l-14 40 M600 214 l14 40 M600 170 l-38 0" class="ink" stroke-width="4"/><path d="M600 260 h20" class="ink"/><text x="600" y="285" text-anchor="middle" font-size="12" class="tbd" font-weight="700">current through person!</text>`;
  s.innerHTML=g;
  $("#phys-el5-msg2").innerHTML=!st.fault?"Normal use: current flows in the live wire and back through the neutral wire. The earth wire carries no current.":blow?"The case is earthed, so a large current flows from live to earth. This melts the <b>fuse</b>, disconnecting the live wire and making the kettle safe.":"<b>Dangerous:</b> with no earth wire the metal case is at 230 V. Anyone touching it provides a path to earth, and a current flows through them."; }
$("#phys-el5-s").addEventListener("change",e=>{ st.src=e.target.value; draw(); });
$("#phys-el5-fault").addEventListener("change",e=>{ st.fault=e.target.checked; draw(); });
$("#phys-el5-earth").addEventListener("change",e=>{ st.earth=e.target.checked; draw(); });
})();


</script>
<script>

/* EL6: power and energy transfers in circuits */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,R,hbars}=G;
const APP=[["Phone charger",10],["LED TV",80],["Laptop",60],["Hair dryer",1800],["Kettle",3000],["Electric shower",9000],["Washing machine",2000]];
const st={a:4,t:5};
const stage=`<svg id="phys-el6" viewBox="0 0 900 300" role="img" aria-label="Bar chart comparing the energy transferred by appliances in the chosen time"></svg>`;
const panel=`<div class="field"><div class="lbl">Appliance</div><select id="phys-el6-a" aria-label="Appliance">${APP.map(([n,P],i)=>`<option value="${i}" ${i===st.a?"selected":""}>${n} (${P} W)</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Time switched on <b id="phys-el6-tl"></b></div><input type="range" id="phys-el6-t" min="1" max="60" step="1" value="5" aria-label="Time in minutes"></div>
<div class="readout"><div><span>Current I = P/V</span><b id="phys-el6-I">—</b></div><div><span>Energy E = Pt</span><b id="phys-el6-E">—</b></div><div><span>Charge Q = It</span><b id="phys-el6-Q">—</b></div><div><span>Check: E = QV</span><b id="phys-el6-QV">—</b></div></div>`;

lesson({id:"phys-el6",group:"c",num:6,lvl:"6.2.4 · Lesson 6",name:"Power and energy transfers",icon:"power",
 eyebrow:eb("6.2.4 Energy transfers",6),title:"Power and energy transfers",
 intro:"Every appliance transfers energy from the mains or a battery. How much it transfers depends on its power and how long it is switched on. The power depends on the current and the potential difference.",
 outcomes:[["Use P = VI and P = I²R","6.2.4.1"],["Use E = Pt and E = QV","6.2.4.2"],["Describe how different appliances transfer energy, and explain how power ratings relate to energy transferred","6.2.4.2"]],
 blocks:[
  B.text("Power in circuits",B.eq(`${v("P")} = ${v("V")}${v("I")} ${R}`,`${v("P")} = ${v("I")}²${v("R")} ${R}`,`<small>P = power (W), V = p.d. (V), I = current (A), R = resistance (Ω)</small>`)+`<p>P = I²R shows that the power dissipated in a resistor (for example, by heating a wire) depends on the <b>square</b> of the current: doubling the current makes the heating four times as great.</p>`),
  B.text("Energy transferred",B.eq(`${v("E")} = ${v("P")}${v("t")} ${R}`,`${v("E")} = ${v("Q")}${v("V")} ${R}`,`<small>E = energy (J), t = time (s), Q = charge (C)</small>`)+`<p>Everyday appliances are designed to transfer energy usefully: a kettle transfers energy electrically to the thermal store of water; a motor transfers it to a kinetic store. The <b>power rating</b> tells you the energy transferred per second when the appliance is used normally.</p><p>The p.d. is the energy transferred per coulomb of charge: as each coulomb passes through a 230 V appliance, 230 J is transferred.</p>`),
  B.sim("phys-el6-sim","Comparing appliances",stage,panel,`<span>Mains p.d. = 230 V</span><span>Bars: energy transferred in the chosen time</span>`),
  B.example("Current in a heater","A 2.3 kW heater is connected to the 230 V mains for 2 hours. Calculate the current and the energy transferred.",[
   ["Current","",[`${v("I")} = ${fr(v("P"),v("V"))} = ${fr("2300","230")} = ${res("10 A")}`]],
   ["Energy","Time in seconds",[`${v("E")} = ${v("P")}${v("t")} = 2300 × 7200 = ${res("1.66 × 10⁷ J")}`]]]),
  B.check([
   {q:"A lamp has a p.d. of 12 V across it and a current of 2.0 A. Calculate its power.",a:24,unit:"W",tol:0.01,why:"P = VI = 12 × 2.0 = 24 W."},
   {q:"A current of 3.0 A flows through a 20 Ω resistor. Calculate the power.",a:180,unit:"W",tol:0.01,why:"P = I²R = 9 × 20 = 180 W."},
   {q:"A 60 W lamp is on for 10 minutes. Calculate the energy transferred.",a:36000,unit:"J",tol:0.01,why:"E = 60 × 600 = 36 000 J."},
   {q:"500 C of charge passes through a 230 V appliance. How much energy is transferred?",a:115000,unit:"J",tol:0.01,why:"E = QV = 500 × 230 = 115 000 J."},
   {q:"Calculate the current drawn by a 1150 W microwave from the 230 V mains.",a:5,unit:"A",tol:0.01,why:"I = P/V = 1150/230 = 5.0 A."},
   {q:"The current in a cable doubles. How does the rate of heating of the cable change?",opts:["Doubles","Halves","Four times as great","Unchanged"],a:2,why:"P = I²R, so 2² = 4 times."}]),
  B.keypoints(["P = VI and P = I²R.","E = Pt and E = QV.","Power rating = energy transferred per second in normal use."]),
  B.mistakes(["Using minutes or hours in E = Pt instead of seconds.","Forgetting to square the current in P = I²R.","Using kW without converting to W."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-el6"); if(!s) return; const nw=window.innerWidth<640, t=st.t*60, [n,P]=APP[st.a];
  const items=APP.map(([nm,p],i)=>[nm,p*t/1000,i===st.a?"facc":"fdat"]), max=Math.max(...items.map(x=>x[1]));
  s.setAttribute("viewBox",nw?`0 0 500 ${APP.length*34+50}`:`0 0 900 ${APP.length*34+50}`);
  s.innerHTML=`<text x="10" y="24" font-size="15" font-weight="700">Energy transferred in ${st.t} minute${st.t>1?"s":""} / kJ</text>`+hbars(items,0,40,nw?500:900,max,{unit:"kJ",lw:nw?150:180,dp:1,bh:24});
  const I=P/230; $("#phys-el6-tl").textContent=`${st.t} min`; $("#phys-el6-I").textContent=`${fx(I,2)} A`; $("#phys-el6-E").textContent=`${fx(P*t/1000,1)} kJ`; $("#phys-el6-Q").textContent=`${fx(I*t,0)} C`; $("#phys-el6-QV").textContent=`${fx(I*t*230/1000,1)} kJ`; }
$("#phys-el6-a").addEventListener("change",e=>{ st.a=+e.target.value; draw(); });
$("#phys-el6-t").addEventListener("input",e=>{ st.t=+e.target.value; draw(); });
})();

<script>

/* Exam-style questions at the end of each Electricity lesson (AQA style) */
(()=>{
const {attach}=EXAM, S=window.SYM;
const T="Exam-style questions", I="Write your answer, then open the mark scheme and tick the marks you earned. Numerical parts can be checked automatically.";
const circ=`<figure><svg viewBox="0 0 420 200" role="img" aria-label="A battery in series with a resistor, a lamp and an ammeter; a voltmeter across the resistor">${S.wire([[60,50],[360,50],[360,160],[60,160],[60,50]])}${S.battery(60,105,true)}${S.res(170,50)}${S.lamp(280,50)}${S.meter(220,160,"A")}${S.wire([[140,50],[140,10],[200,10],[200,50]],"ink",1.6)}${S.meter(170,10,"V")}<text x="25" y="110" text-anchor="end" font-size="13" class="tm">6.0 V</text><text x="170" y="80" text-anchor="middle" font-size="12">R</text></svg></figure>`;

attach("phys-el1",{title:T,intro:I,qs:[
 {stem:`<p>A student sets up a circuit containing a battery, a switch, a lamp and an ammeter in series.</p>`,parts:[
  {q:"Draw the circuit symbol for an ammeter and state how it is connected.",m:2,lines:2,ms:[["1","a circle containing the letter A"],["1","connected in series (with the lamp)"]]},

<script>

/* PM1: density and the states of matter */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,R,particles}=G;
const ST={solid:["Ice (solid)",920,"Particles are closely packed in a regular pattern and vibrate about fixed positions."],liquid:["Water (liquid)",1000,"Particles are close together but randomly arranged; they move around each other."],gas:["Steam (gas)",0.6,"Particles are far apart and move quickly and randomly in all directions."]};
const st={s:"solid"}; let box;
const stage=`<canvas id="phys-pm1-cv" class="graph" aria-label="Particles of water in the chosen state"></canvas>`;
const panel=`<div class="field"><div class="lbl">State</div><div class="seg c3" id="phys-pm1-s"><label class="opt"><input type="radio" name="phys-pm1-s" value="solid" checked><span>Solid</span></label><label class="opt"><input type="radio" name="phys-pm1-s" value="liquid"><span>Liquid</span></label><label class="opt"><input type="radio" name="phys-pm1-s" value="gas"><span>Gas</span></label></div></div>
<div class="readout"><div><span>Density</span><b id="phys-pm1-d">—</b></div><div><span>Volume of 1 kg</span><b id="phys-pm1-V">—</b></div></div><p class="note" id="phys-pm1-msg"></p>`;

lesson({id:"phys-pm1",group:"a",num:1,lvl:"6.3.1 · Lesson 1",name:"Density and states of matter",icon:"density",
 eyebrow:eb("6.3.1.1 Density of materials",1),title:"Density and states of matter",
 intro:"A kilogram of steam takes up about 1700 times more space than a kilogram of water. The particle model explains why the same substance has very different densities as a solid, a liquid and a gas.",
 outcomes:[["Use ρ = m/V","6.3.1.1"],["Use the particle model to explain the different densities of solids, liquids and gases","6.3.1.1"],["Describe how to measure the density of regular and irregular objects and of liquids (required practical 17)","6.3.1.1"]],
 blocks:[
  B.text("Density",B.eq(`ρ = ${fr(v("m"),v("V"))} ${R}`,`<small>ρ = density (kg/m³), m = mass (kg), V = volume (m³)</small>`)+`<p>Density is the mass per unit volume. Because 1 g/cm³ = 1000 kg/m³, water has a density of 1.0 g/cm³ or 1000 kg/m³. Objects less dense than water float on it.</p>`),
  B.text("The particle model",`<p>All matter is made of tiny particles. The arrangement and motion of the particles explain the properties of each state:</p><ul><li><b>Solid</b>: particles in fixed positions, regular pattern, vibrating. Fixed shape and volume; high density.</li><li><b>Liquid</b>: particles touching but irregularly arranged, moving past each other. Fixed volume, flows; high density (similar to the solid).</li><li><b>Gas</b>: particles far apart, moving fast and randomly. No fixed shape or volume; very low density because there is so much space between the particles.</li></ul><p>When a substance changes state, its <b>mass is conserved</b>: the number of particles stays the same, only their arrangement changes.</p>`),
  B.sim("phys-pm1-sim","Same substance, three states",stage,panel,`<span>Same particles, different arrangement</span>`),
  B.practical(`<p>In <b>RP 17 Density</b> you measure the density of regular solids, irregular solids and liquids:</p><ul><li><b>Regular solid:</b> measure length, width and height with a ruler (or vernier calipers) to find V; measure m on a balance.</li><li><b>Irregular solid:</b> lower it into a <b>eureka (displacement) can</b> full of water; the volume of water displaced, collected in a measuring cylinder, equals the volume of the object.</li><li><b>Liquid:</b> measure the mass of an empty measuring cylinder, add a known volume of liquid and measure the mass again.</li></ul>`,"Required practical 17"),
  B.example("Density of a stone","A stone has a mass of 156 g. When it is lowered into a displacement can, 60 cm³ of water overflows. Calculate the density of the stone in kg/m³.",[
   ["Density in g/cm³","",[`ρ = ${fr("156","60")} = 2.6 g/cm³`]],
   ["Convert","× 1000",[`ρ = ${res("2600 kg/m³")}`]]]),
  B.check([
   {q:"A block has a mass of 4.0 kg and a volume of 0.0020 m³. Calculate its density.",a:2000,unit:"kg/m³",tol:0.01,why:"ρ = 4.0/0.0020 = 2000 kg/m³."},
   {q:"A 2.0 cm × 3.0 cm × 5.0 cm block has a mass of 81 g. Calculate its density in g/cm³.",a:2.7,unit:"g/cm³",tol:0.01,why:"V = 30 cm³; ρ = 81/30 = 2.7 g/cm³."},
   {q:"Calculate the mass of 0.50 m³ of oil of density 800 kg/m³.",a:400,unit:"kg",tol:0.01,why:"m = ρV = 800 × 0.50 = 400 kg."},
   {q:"Why does a gas have a much lower density than a liquid?",opts:["Its particles are smaller","Its particles are much further apart","Its particles are lighter","It has fewer particles per kilogram"],a:1,why:"The same mass occupies a far bigger volume because of the spaces between particles."},
   {q:"10 g of ice melts. What is the mass of the water?",a:10,unit:"g",tol:0.001,why:"Mass is conserved in a change of state."}]),
  B.keypoints(["ρ = m/V (kg/m³). 1 g/cm³ = 1000 kg/m³.","Solids and liquids: particles close ⇒ high density. Gases: particles far apart ⇒ low density.","Irregular solids: volume by displacement (eureka can)."]),
  B.mistakes(["Mixing g/cm³ and kg/m³.","Thinking particles themselves expand in a gas.","Reading the measuring cylinder from above the meniscus."])
 ],onShow:()=>{ init(); draw(); }});

function init(){ if(box) return; box=particles($("#phys-pm1-cv"),{mode:st.s,n:48,aspect:.42,r:6}); requestAnimationFrame(loop); }
function draw(){ const [n,d,txt]=ST[st.s]; $("#phys-pm1-d").textContent=`${d} kg/m³`; $("#phys-pm1-V").textContent=st.s==="gas"?`${fx(1/d,2)} m³`:`${fx(1000/d,3)} litres`; $("#phys-pm1-msg").textContent=txt; if(box) box.draw(); }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!$("#lab-phys-pm1").hidden&&box){ box.step(dt); box.draw(); } requestAnimationFrame(loop); }
$("#phys-pm1-s").addEventListener("change",e=>{ st.s=e.target.value; if(box){ box.P.mode=st.s; box.P.n=st.s==="gas"?18:48; box.P.speed=st.s==="gas"?1.2:1; box.seed(); } draw(); });
})();


</script>
<script>
LEARN.unit="phys-particle";

/* PM2: internal energy and changes of state */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,particles}=G;
const m=0.5, P=1000, ci=2100, cw=4200, Lf=334000, Lv=2260000;
const E1=m*ci*20, E2=E1+m*Lf, E3=E2+m*cw*100, E4=E3+m*Lv, E5=E4+m*2000*20;
function stateAt(E){ if(E<E1) return ["solid",-20+E/(m*ci),"Solid warming: kinetic energy of the particles increases, so temperature rises."];
  if(E<E2) return ["melt",0,"Melting at 0 °C: energy breaks bonds, increasing potential energy. Temperature stays constant."];
  if(E<E3) return ["liquid",(E-E2)/(m*cw),"Liquid warming: kinetic energy increases, so temperature rises."];
  if(E<E4) return ["boil",100,"Boiling at 100 °C: energy separates the particles completely (potential energy rises). Temperature is constant."];
  return ["gas",100+(E-E4)/(m*2000),"Gas warming: kinetic energy increases again."]; }
const st={E:0,run:false,data:[[0,-20]]}; let box;
const stage=`<canvas id="phys-pm2-cv" class="graph" aria-label="Temperature against time as ice is heated"></canvas><canvas id="phys-pm2-pc" class="graph" aria-label="Particles of the water"></canvas>`;
const panel=`<div class="btnrow"><button class="btn primary" id="phys-pm2-go">Heat</button><button class="btn" id="phys-pm2-pa">Pause</button><button class="btn" id="phys-pm2-rs">Reset</button></div>
<div class="readout"><div><span>Time</span><b id="phys-pm2-t">—</b></div><div><span>Temperature</span><b id="phys-pm2-T">—</b></div><div><span>Energy supplied</span><b id="phys-pm2-E">—</b></div><div><span>State</span><b id="phys-pm2-s">—</b></div></div>
<p class="note" id="phys-pm2-msg"></p><p class="note">0.50 kg of ice at −20 °C, heated by a 1.0 kW heater with no losses.</p>`;

lesson({id:"phys-pm2",group:"b",num:2,lvl:"6.3.2 · Lesson 2",name:"Internal energy and changes of state",icon:"heatcurve",
 eyebrow:eb("6.3.2.1 Internal energy",2),title:"Internal energy and changes of state",
 intro:"Heat some ice steadily and its temperature rises, stops at 0 °C while it melts, rises again, then stops at 100 °C while it boils. The idea of internal energy explains why the temperature sometimes stays the same while energy is still being supplied.",
 outcomes:[["Define internal energy as the total kinetic and potential energy of the particles","6.3.2.1"],["Explain that heating raises the temperature or changes the state, but not both at once","6.3.2.1"],["Describe melting, freezing, boiling, evaporation, condensation and sublimation as physical changes","6.3.1.2"],["Interpret heating and cooling graphs","6.3.2.3"]],
 blocks:[
  B.text("Internal energy",`<p>The particles in a system have energy in their <b>kinetic</b> store (because they move or vibrate) and in their <b>potential</b> store (because of the forces and bonds between them). The <b>internal energy</b> is the total kinetic and potential energy of all the particles.</p><p>Heating transfers energy to the particles, increasing the internal energy. This either:</p><ul><li>raises the <b>temperature</b> (the particles’ kinetic energy increases), or</li><li>produces a <b>change of state</b> (the potential energy increases as bonds are broken or weakened). The temperature stays constant.</li></ul>`),
  B.text("Changes of state",`<p>Changes of state are <b>physical</b> changes: the material recovers its original properties if the change is reversed, and mass is conserved.</p><ul><li>solid → liquid: <b>melting</b>; liquid → solid: <b>freezing</b></li><li>liquid → gas: <b>boiling</b> or <b>evaporating</b>; gas → liquid: <b>condensing</b></li><li>solid → gas: <b>sublimating</b></li></ul>`),
  B.sim("phys-pm2-sim","A heating curve",stage,panel,`<span>Flat sections: changes of state</span><span>Sloping sections: temperature rising</span>`),
  B.check([
   {q:"What is internal energy?",opts:["The kinetic energy of the particles only","The total kinetic and potential energy of all the particles","The energy needed to melt a substance","The temperature of a substance"],a:1,why:"Internal energy = total KE + PE of the particles."},
   {q:"While water is boiling, its temperature stays at 100 °C. What happens to the energy supplied?",opts:["It is destroyed","It increases the kinetic energy of the particles","It increases the potential energy of the particles (breaking bonds)","It is all lost to the surroundings"],a:2,why:"During a change of state the potential energy increases, not the kinetic energy."},
   {q:"What is the name for a solid changing directly into a gas?",opts:["Evaporation","Condensation","Sublimation","Melting"],a:2,why:"Sublimation (e.g. dry ice)."},
   {q:"On a cooling curve for a liquid, a flat section shows that the substance is…",opts:["boiling","freezing","warming","evaporating"],a:1,why:"While cooling, the flat section is the liquid freezing at constant temperature."},
   {q:"In the simulation, which change of state needs the most energy?",opts:["Melting","Boiling","Warming the ice","Warming the water"],a:1,why:"Specific latent heat of vaporisation (2.26 MJ/kg) is much larger than of fusion."}]),
  B.keypoints(["Internal energy = total kinetic + potential energy of the particles.","Heating increases internal energy: either the temperature rises or the state changes.","During a change of state, temperature is constant; potential energy changes."]),
  B.mistakes(["Saying temperature rises during melting or boiling.","Calling a change of state a chemical change.","Confusing evaporation (at the surface, any temperature) with boiling."])
 ],onShow:()=>{ init(); draw(); }});

function init(){ if(box) return; box=particles($("#phys-pm2-pc"),{mode:"solid",n:40,aspect:.25,r:5}); requestAnimationFrame(loop); }
function draw(){ const t=st.E/P, [s,T,msg]=stateAt(st.E);
  plot($("#phys-pm2-cv"),{aspect:asp(.42),x:{label:"time / s",min:0,max:1600},y:{label:"temperature / °C",min:-30,max:130},series:[{pts:st.data,col:css("--accent"),join:true,noPts:true}]});
  const want=s==="melt"?(st.E<(E1+E2)/2?"solid":"liquid"):s==="boil"?(st.E<(E3+E4)/2?"liquid":"gas"):s;
  if(box&&box.P.mode!==want){ box.P.mode=want; box.P.n=want==="gas"?16:40; box.seed(); }
  if(box){ box.P.speed=0.6+Math.max(0,T+20)/80; }
  $("#phys-pm2-t").textContent=`${fx(t,0)} s`; $("#phys-pm2-T").textContent=`${fx(T,1)} °C`; $("#phys-pm2-E").textContent=`${fx(st.E/1000,0)} kJ`; $("#phys-pm2-s").textContent={solid:"solid",melt:"melting",liquid:"liquid",boil:"boiling",gas:"gas"}[s]; $("#phys-pm2-msg").textContent=msg; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!$("#lab-phys-pm2").hidden){ if(st.run){ st.E=Math.min(E5,st.E+P*dt*60); st.data.push([st.E/P,stateAt(st.E)[1]]); if(st.E>=E5) st.run=false; draw(); } if(box){ box.step(dt); box.draw(); } } requestAnimationFrame(loop); }
$("#phys-pm2-go").addEventListener("click",()=>{ if(st.E>=E5){ st.E=0; st.data=[[0,-20]]; } st.run=true; });
$("#phys-pm2-pa").addEventListener("click",()=>{ st.run=false; });
$("#phys-pm2-rs").addEventListener("click",()=>{ st.run=false; st.E=0; st.data=[[0,-20]]; draw(); });
})();


</script>
<script>

/* PM3: specific latent heat */
(()=>{
const {$,fx,plot,css,linfit}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,S}=G;
const MODE={boil:["Boiling water (vaporisation)",2.26e6,"mass of water boiled away"],melt:["Melting ice (fusion)",3.34e5,"mass of water collected"]};
const st={k:"boil",P:100,t:0,run:false,data:[]};
const stage=`<svg id="phys-pm3" viewBox="0 0 900 230" role="img" aria-label="Heater in a beaker on a balance with a joulemeter"></svg><canvas id="phys-pm3-cv" class="graph" aria-label="Energy supplied against change in mass"></canvas>`;
const panel=`<div class="field"><div class="lbl">Experiment</div><select id="phys-pm3-k" aria-label="Experiment">${Object.entries(MODE).map(([k,m])=>`<option value="${k}">${m[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Heater power <b id="phys-pm3-Pl"></b></div><input type="range" id="phys-pm3-P" min="50" max="200" step="25" value="100" aria-label="Heater power"></div>
<div class="btnrow"><button class="btn primary" id="phys-pm3-go">Run for 10 minutes</button><button class="btn" id="phys-pm3-rs">Reset</button></div>
<div class="readout"><div><span>Energy supplied</span><b id="phys-pm3-E">—</b></div><div><span>Change in mass</span><b id="phys-pm3-m">—</b></div><div><span>L from gradient</span><b id="phys-pm3-L">—</b></div></div>`;

lesson({id:"phys-pm3",group:"b",num:3,lvl:"6.3.2 · Lesson 3",name:"Specific latent heat",icon:"latent",
 eyebrow:eb("6.3.2.3 Specific latent heat",3),title:"Specific latent heat",
 intro:"Melting or boiling a substance needs energy, even though the temperature does not change. The specific latent heat tells you how much energy is needed to change the state of one kilogram.",
 outcomes:[["Define specific latent heat, and distinguish latent heat of fusion and of vaporisation","6.3.2.3"],["Use E = mL","6.3.2.3"],["Distinguish between specific heat capacity and specific latent heat","6.3.2.3"]],
 blocks:[
  B.text("Specific latent heat",`<p>The energy needed for a substance to change state is called <b>latent heat</b>. The <b>specific latent heat</b> of a substance is the amount of energy required to change the state of <b>one kilogram</b> of the substance with <b>no change in temperature</b>.</p>`+B.eq(`${v("E")} = ${v("m")}${v("L")} ${S}`,`<small>E = energy (J), m = mass (kg), L = specific latent heat (J/kg)</small>`)+`<ul><li><b>Specific latent heat of fusion</b>: change of state from solid to liquid (water: 334 000 J/kg).</li><li><b>Specific latent heat of vaporisation</b>: change of state from liquid to vapour (water: 2 260 000 J/kg).</li></ul><p><b>Specific heat capacity</b> is about changing the <b>temperature</b>; <b>specific latent heat</b> is about changing the <b>state</b>.</p>`),
  B.sim("phys-pm3-sim","Measuring specific latent heat",stage,panel,`<span>Readings every minute</span><span>Gradient of E against Δm = L</span>`),
  B.example("Melting and warming ice","Calculate the energy needed to turn 0.20 kg of ice at 0 °C into water at 30 °C. (L<sub>f</sub> = 334 000 J/kg, c = 4200 J/kg °C)",[
   ["Melt the ice","E = mL",[`${v("E","1")} = 0.20 × 334 000 = 66 800 J`]],
   ["Warm the water","E = mcΔθ",[`${v("E","2")} = 0.20 × 4200 × 30 = 25 200 J`]],
   ["Total","",[`${v("E")} = 66 800 + 25 200 = ${res("92 000 J")}`]]]),
  B.check([
   {q:"Calculate the energy needed to melt 2.0 kg of ice at 0 °C. (L = 334 000 J/kg)",a:668000,unit:"J",tol:0.01,why:"E = 2.0 × 334 000 = 668 000 J."},
   {q:"Calculate the energy needed to boil away 0.050 kg of water at 100 °C. (L = 2 260 000 J/kg)",a:113000,unit:"J",tol:0.01,why:"E = 0.050 × 2.26 × 10⁶ = 113 000 J."},
   {q:"5400 J melts 0.020 kg of a solid at its melting point. Calculate its specific latent heat of fusion.",a:270000,unit:"J/kg",tol:0.01,why:"L = E/m = 5400/0.020 = 270 000 J/kg."},
   {q:"Which quantity is used when a substance changes state at constant temperature?",opts:["Specific heat capacity","Specific latent heat","Density","Thermal conductivity"],a:1,why:"Latent heat is for changes of state."},
   {q:"A 2.0 kW kettle keeps water boiling. How much water boils away in 113 s? (L = 2 260 000 J/kg)",a:0.1,unit:"kg",tol:0.01,why:"E = 2000 × 113 = 226 000 J; m = 226 000 / 2.26 × 10⁶ = 0.10 kg."}]),
  B.keypoints(["Specific latent heat: energy to change the state of 1 kg with no temperature change.","E = mL (on the equation sheet). Fusion: solid ↔ liquid; vaporisation: liquid ↔ gas.","Latent heat changes state; specific heat capacity changes temperature."]),
  B.mistakes(["Using a temperature change in E = mL.","Mixing up fusion and vaporisation values.","Forgetting to add the two parts in multi-stage questions."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-pm3"); if(!s) return; const [n,L,lab]=MODE[st.k], E=st.P*st.t, dm=E/L, boil=st.k==="boil";
  let g=`<rect x="60" y="190" width="220" height="24" rx="4" class="fpan ink" stroke-width="2"/><rect x="120" y="196" width="100" height="14" rx="2" class="fsunk"/><text x="170" y="207" text-anchor="middle" font-size="11" class="tm">${fx((boil?300:0)+(boil?-1:1)*dm*1000,1)} g</text>`;
  if(boil){ const h=110-dm*1000*0.6; g+=`<path d="M90 70 V188 H250 V70" fill="none" class="ink" stroke-width="2.5"/><rect x="92" y="${(188-h).toFixed(1)}" width="156" height="${h.toFixed(1)}" fill="#5a9be6" opacity=".55"/>`;
    if(st.run) for(let i=0;i<5;i++){ const x=110+i*30, y=170-((st.t*7+i*23)%(h-6)); g+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="4" fill="#fff" opacity=".8"/>`; } }
  else { g+=`<path d="M100 30 L240 30 L185 110 V140 H155 V110 Z" class="fsunk ink" stroke-width="2"/>${Array.from({length:10},(_,i)=>`<rect x="${112+(i%5)*24}" y="${36+Math.floor(i/5)*22}" width="20" height="18" rx="3" fill="#cfe8ff" class="ink" stroke-width=".8" opacity="${Math.max(.2,1-dm*8)}"/>`).join("")}<path d="M90 150 V188 H250 V150" fill="none" class="ink" stroke-width="2.5"/><rect x="92" y="${(188-Math.min(36,dm*1000*0.9)).toFixed(1)}" width="156" height="${Math.min(36,dm*1000*.9).toFixed(1)}" fill="#5a9be6" opacity=".55"/>`; }
  g+=`<rect x="${boil?160:164}" y="${boil?20:10}" width="12" height="${boil?150:90}" rx="4" class="fbd"/><path d="M166 ${boil?20:10} V0" class="ink" stroke-width="2"/>`;
  g+=`<rect x="330" y="50" width="170" height="90" rx="8" class="fpan ink" stroke-width="2"/><text x="415" y="78" text-anchor="middle" font-size="12" class="tmut">joulemeter</text><text x="415" y="112" text-anchor="middle" font-size="22" font-weight="700" class="tm">${fx(E,0)} J</text>`;
  g+=`<text x="560" y="70" font-size="15" font-weight="700">${n}</text><text x="560" y="100" font-size="14" class="tm">t = ${fx(st.t,0)} s</text><text x="560" y="126" font-size="14" class="tm">Δm = ${fx(dm*1000,2)} g (${lab})</text>`;
  s.innerHTML=g;
  const f=st.data.length>=3?linfit(st.data):null;
  plot($("#phys-pm3-cv"),{aspect:asp(.42),x:{label:"change in mass / kg",min:0,max:boil?0.06:0.4},y:{label:"energy supplied / J",min:0,max:120000},series:[{pts:st.data,col:css("--accent")}],fits:f?[{m:f.m,c:f.c,x0:0,x1:boil?0.06:0.4,col:css("--data"),dash:[5,4]}]:[],empty:"Run the experiment"});
  $("#phys-pm3-Pl").textContent=`${st.P} W`; $("#phys-pm3-E").textContent=`${fx(E,0)} J`; $("#phys-pm3-m").textContent=`${fx(dm*1000,2)} g`; $("#phys-pm3-L").textContent=f?`${fx(f.m/1000,0)} kJ/kg`:"—"; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(st.run&&!$("#lab-phys-pm3").hidden){ const t0=st.t; st.t=Math.min(600,st.t+dt*60); if(Math.floor(st.t/60)>Math.floor(t0/60)){ const L=MODE[st.k][1], tt=Math.floor(st.t/60)*60; st.data.push([+((st.P*tt/L)*(1+(Math.random()-.5)*0.04)).toFixed(5),st.P*tt]); } if(st.t>=600) st.run=false; draw(); } requestAnimationFrame(loop); }
const reset=()=>{ st.t=0; st.run=false; st.data=[[0,0]]; draw(); };
$("#phys-pm3-go").addEventListener("click",()=>{ reset(); st.run=true; });
$("#phys-pm3-rs").addEventListener("click",reset);
$("#phys-pm3-k").addEventListener("change",e=>{ st.k=e.target.value; reset(); });
$("#phys-pm3-P").addEventListener("input",e=>{ st.P=+e.target.value; reset(); });
st.data=[[0,0]]; requestAnimationFrame(loop);
})();


</script>
<script>
LEARN.unit="phys-particle";

/* PM4: particle motion in gases: temperature and pressure */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {eb,particles}=G;
const st={T:20}; let box;
const p=T=>100*(T+273)/293;
const stage=`<canvas id="phys-pm4-pc" class="graph" aria-label="Gas particles in a sealed container"></canvas><canvas id="phys-pm4-cv" class="graph" aria-label="Pressure against temperature"></canvas>`;
const panel=`<div class="field"><div class="lbl">Temperature <b id="phys-pm4-Tl"></b></div><input type="range" id="phys-pm4-T" min="-100" max="300" step="10" value="20" aria-label="Temperature"></div>
<div class="readout"><div><span>Pressure</span><b id="phys-pm4-p">—</b></div><div><span>Mean particle speed (relative)</span><b id="phys-pm4-v">—</b></div></div>
<p class="note">Sealed container: the volume and the number of particles stay fixed. Pressure is 100 kPa at 20 °C.</p>`;

lesson({id:"phys-pm4",group:"c",num:4,lvl:"6.3.3 · Lesson 4",name:"Gas pressure and temperature",icon:"kinetic",
 eyebrow:eb("6.3.3.1 Particle motion in gases",4),title:"Gas pressure and temperature",
 intro:"The particles in a gas are in constant random motion, colliding with each other and with the walls of their container. These collisions cause the pressure of the gas, and heating the gas makes them harder and more frequent.",
 outcomes:[["Explain how the motion of gas particles relates to temperature","6.3.3.1"],["Explain why heating a gas at constant volume increases its pressure","6.3.3.1"],["Explain that gas pressure produces a net force at right angles to the container walls","6.3.3.2"]],
 blocks:[
  B.text("Particles in a gas",`<p>The molecules of a gas are in <b>constant random motion</b>. The temperature of the gas is related to the <b>average kinetic energy</b> of the molecules: the hotter the gas, the faster the molecules move on average.</p><p>When molecules hit the walls of the container they exert a force on them. The total force per unit area is the <b>pressure</b>. Because the molecules bounce off in all directions, the pressure produces a net force at <b>right angles</b> to the walls.</p>`),
  B.text("Heating a gas at constant volume",`<p>If a gas is heated in a sealed, rigid container:</p><ol><li>the molecules gain kinetic energy and move faster on average;</li><li>they collide with the walls <b>more often</b>;</li><li>each collision exerts a <b>bigger force</b> (a bigger change of momentum).</li></ol><p>So the <b>pressure increases</b>. This is why aerosol cans warn you not to heat them, and why tyre pressures rise on a long journey.</p>`),
  B.sim("phys-pm4-sim","Heating a sealed gas",stage,panel,`<span>Faster particles: more frequent, harder collisions</span>`),
  B.check([
   {q:"What is the temperature of a gas related to?",opts:["The size of its molecules","The average kinetic energy of its molecules","The number of molecules","The volume of the container"],a:1,why:"Higher temperature means faster molecules on average."},
   {q:"A sealed can of gas is heated. What happens to the pressure?",opts:["Decreases","Increases","Stays the same","Becomes zero"],a:1,why:"Faster molecules hit the walls more often and harder."},
   {q:"In which direction does gas pressure act on the walls of a container?",opts:["Upwards only","Downwards only","At right angles to the walls","Parallel to the walls"],a:2,why:"The net force from many collisions is perpendicular to the surface."},
   {q:"A tyre is cooled on a cold night. What happens to the molecules?",opts:["They move more slowly on average","They get smaller","They stop moving","They move faster"],a:0,why:"Lower temperature means lower average kinetic energy."},
   {q:"Which of these does <b>not</b> increase when a gas is heated at constant volume?",opts:["Average speed of molecules","Rate of collisions with the walls","Pressure","Number of molecules"],a:3,why:"The container is sealed, so the number of molecules is fixed."}]),
  B.keypoints(["Gas molecules move randomly; absolute temperature (K) ∝ average kinetic energy.","Pressure is caused by collisions with the walls and acts at right angles to them.","At constant volume: hotter ⇒ faster ⇒ more frequent and harder collisions ⇒ higher pressure."]),
  B.mistakes(["Saying the molecules expand when heated.","Saying only ‘more collisions’: also say each collision is harder.","Forgetting that the volume must be constant for this explanation."])
 ],onShow:()=>{ init(); draw(); }});

function init(){ if(box) return; box=particles($("#phys-pm4-pc"),{mode:"gas",n:30,aspect:.32,r:5}); requestAnimationFrame(loop); }
function draw(){ const sp=Math.sqrt((st.T+273)/293); if(box) box.P.speed=sp*1.1;
  const line=[[-100,p(-100)],[300,p(300)]];
  plot($("#phys-pm4-cv"),{aspect:asp(.38),x:{label:"temperature / °C",min:-100,max:300},y:{label:"pressure / kPa",min:0,max:220},series:[{pts:line,col:css("--data"),join:true,noPts:true},{pts:[[st.T,p(st.T)]],col:css("--accent")}]});
  $("#phys-pm4-Tl").textContent=`${st.T} °C`; $("#phys-pm4-p").textContent=`${fx(p(st.T),0)} kPa`; $("#phys-pm4-v").textContent=`${fx(sp,2)} ×`; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!$("#lab-phys-pm4").hidden&&box){ box.step(dt); box.draw(); } requestAnimationFrame(loop); }
$("#phys-pm4-T").addEventListener("input",e=>{ st.T=+e.target.value; draw(); });
})();


</script>
<script>

/* Exam-style questions at the end of each Particle model lesson (AQA style) */
(()=>{
const {attach,graph}=EXAM;
const T="Exam-style questions", I="Write your answer, then open the mark scheme and tick the marks you earned. Numerical parts can be checked automatically. Take c of water = 4200 J/kg °C, L<sub>f</sub> of water = 334 000 J/kg and L<sub>v</sub> of water = 2 260 000 J/kg.";

attach("phys-pm1",{title:T,intro:I,qs:[
 {stem:`<p>A student wants to find the density of a small irregular stone (required practical 17).</p>`,parts:[
  {q:"Describe how the student could measure the volume of the stone.",m:3,lines:4,ms:[["1","fill a displacement (eureka) can with water up to the spout"],["1","lower the stone in and collect the water that overflows"],["1","measure the volume of the water collected in a measuring cylinder; this equals the volume of the stone"]]},
  {q:"The stone has a mass of 0.084 kg and a volume of 3.0 × 10⁻⁵ m³. Calculate its density.",m:2,ans:{a:2800,unit:"kg/m³",tol:0.01},ms:[["1","ρ = 0.084 / 3.0 × 10⁻⁵"],["1","= 2800 kg/m³"]]},
  {q:"Give one source of error in measuring the volume, and how to reduce it.",m:2,lines:3,ms:[["1","water left on the sides of the can / measuring cylinder; air bubbles on the stone; parallax when reading the meniscus"],["1","matching improvement: wait for dripping to stop / tap the stone / read at eye level at the bottom of the meniscus"]]}]},
 {stem:`<p>Water can exist as ice, liquid water and steam.</p>`,parts:[
  {q:"Explain, in terms of particles, why steam has a much lower density than liquid water.",m:2,lines:3,ms:[["1","particles in steam are much further apart"],["1","so the same mass occupies a much larger volume"]]},
  {q:"State what happens to the mass of 50 g of ice when it melts.",m:1,lines:1,ms:[["1","it stays the same (50 g); mass is conserved"]]}]}
]});

attach("phys-pm2",{title:T,intro:I,qs:[
 {stem:`<p>The graph shows how the temperature of a substance changes as it cools.</p>`+graph({xmax:20,xs:2,xl:2,ymax:100,ys:10,yl:2,lines:[[[0,90],[4,62],[12,62],[16,40],[20,30]]],xt:"time / minutes",yt:"temperature / °C",aria:"Cooling curve with a flat section at 62 °C from 4 to 12 minutes"}),parts:[
  {q:"Determine the freezing point of the substance.",m:1,ans:{a:62,unit:"°C",tol:0.02},ms:[["1","62 °C"]]},
  {q:"Explain why the temperature stays constant between 4 and 12 minutes.",m:3,lines:4,ms:[["1","the substance is changing state (freezing)"],["1","energy is transferred to the surroundings as bonds form between particles"],["1","the potential energy of the particles decreases, but their kinetic energy (and so the temperature) does not change"]]},
  {q:"What is meant by the internal energy of a substance?",m:1,lines:2,ms:[["1","the total kinetic energy and potential energy of all the particles in the system"]]}]}
]});

attach("phys-pm3",{title:T,intro:I,qs:[
 {stem:`<p>A student measured the specific latent heat of vaporisation of water using a kettle on a balance.</p>`,parts:[
  {q:"Define specific latent heat of vaporisation.",m:2,lines:2,ms:[["1","the energy needed to change 1 kg of a substance from liquid to vapour (gas)"],["1","with no change in temperature"]]},
  {q:"The kettle supplied 270 000 J while the mass of water decreased by 0.125 kg. Calculate the specific latent heat of vaporisation from these results.",m:2,ans:{a:2160000,unit:"J/kg",tol:0.01},ms:[["1","L = E/m = 270 000 / 0.125"],["1","= 2 160 000 J/kg"]]},
  {q:"Suggest why the student’s value is lower than the accepted value of 2 260 000 J/kg.",m:2,lines:3,ms:[["1","the measured mass loss was too large for the energy recorded (or the energy recorded was too small)"],["1","e.g. water splashed out of the kettle / energy stored in the hot element continued boiling water after it was switched off / readings taken before boiling steadily"]]}]},
 {stem:`<p>An ice cube of mass 0.030 kg at 0 °C is put into a drink.</p>`,parts:[
  {q:"Calculate the energy needed to melt the ice cube.",m:2,ans:{a:10020,unit:"J",tol:0.01},ms:[["1","E = 0.030 × 334 000"],["1","= 10 020 J"]]},
  {q:"Calculate the total energy needed to melt the ice and warm the water produced to 12 °C.",m:3,ans:{a:11532,unit:"J",tol:0.01},ms:[["1","E = mcΔθ = 0.030 × 4200 × 12 = 1512 J"],["1","total = 10 020 + 1512"],["1","= 11 532 J"]]}]}
]});

attach("phys-pm4",{title:T,intro:I,qs:[
 {stem:`<p>An aerosol can contains gas at high pressure. The label warns: ‘Do not expose to temperatures above 50 °C’.</p>`,parts:[
  {q:"Explain how the gas molecules exert a pressure on the inside of the can.",m:2,lines:3,ms:[["1","the molecules are in constant random motion and collide with the walls"],["1","each collision exerts a force; force per unit area is the pressure (at right angles to the walls)"]]},
  {q:"Explain why heating the can is dangerous.",m:4,lines:5,ms:[["1","the molecules gain kinetic energy / move faster on average"],["1","they collide with the walls more frequently"],["1","each collision exerts a greater force"],["1","so the pressure increases (volume constant), and the can could explode"]]}]}
]});

attach("phys-pm5",{title:T,intro:I,qs:[
 {stem:`<p>A syringe contains 80 cm³ of air at a pressure of 100 kPa. The end is sealed and the plunger is pushed in slowly. The temperature stays constant.</p>`,parts:[
  {q:"Calculate the pressure when the volume is 32 cm³.",m:3,ans:{a:250,unit:"kPa",tol:0.01},ms:[["1","p₁V₁ = p₂V₂"],["1","p₂ = 100 × 80 / 32"],["1","= 250 kPa"]]},
  {q:"Explain, in terms of particles, why the pressure increases when the volume decreases.",m:2,lines:3,ms:[["1","the particles have less distance to travel / there are more particles per unit volume"],["1","so they collide with the walls more frequently (per unit area)"]]},
  {ht:true,q:"The plunger is now pushed in very quickly. Explain why the temperature of the air increases.",m:3,lines:4,ms:[["1","work is done on the gas (a force moves the plunger through a distance)"],["1","energy is transferred to the gas, increasing its internal energy"],["1","the kinetic energy of the particles increases, so the temperature rises (no time for energy to escape by heating)"]]}]}
]});

attach("phys-pm6",{title:T,intro:I,qs:[
 {stem:`<p>A 1.5 kW electric heater is placed in 0.80 kg of ice at 0 °C. Assume no energy is lost.</p>`,parts:[
  {q:"Calculate the time taken to melt all the ice.",m:3,ans:{a:178.1,unit:"s",tol:0.01},ms:[["1","E = 0.80 × 334 000 = 267 200 J"],["1","t = E/P = 267 200 / 1500"],["1","= 178 s"]]},
  {q:"Calculate the further time taken to heat the water to 100 °C.",m:3,ans:{a:224,unit:"s",tol:0.01},ms:[["1","E = 0.80 × 4200 × 100 = 336 000 J"],["1","t = 336 000 / 1500"],["1","= 224 s"]]},
  {q:"Explain why the heater takes much longer to boil all the water away than to melt the ice.",m:2,lines:3,ms:[["1","the specific latent heat of vaporisation is much larger than that of fusion (2 260 000 vs 334 000 J/kg)"],["1","to boil, particles must be separated completely (much more energy to overcome attractions)"]]}]}
]},sec=>sec.lastElementChild);

<script>
LEARN.unit="phys-atomic";

/* AT1: atoms and isotopes */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb}=G;
const EL=[["H","Hydrogen",1],["He","Helium",2],["Li","Lithium",3],["Be","Beryllium",4],["B","Boron",5],["C","Carbon",6],["N","Nitrogen",7],["O","Oxygen",8]];
const st={Z:6,N:6,e:6,lev:false};
const stage=`<svg id="phys-at1" viewBox="0 0 900 320" role="img" aria-label="Model of an atom built from protons, neutrons and electrons, with its nuclear symbol"></svg>`;
const panel=`<div class="field"><div class="lbl">Protons <b id="phys-at1-Zl"></b></div><input type="range" id="phys-at1-Z" min="1" max="8" step="1" value="6" aria-label="Protons"></div>
<div class="field"><div class="lbl">Neutrons <b id="phys-at1-Nl"></b></div><input type="range" id="phys-at1-N" min="0" max="10" step="1" value="6" aria-label="Neutrons"></div>
<div class="field"><div class="lbl">Electrons <b id="phys-at1-el"></b></div><input type="range" id="phys-at1-e" min="0" max="10" step="1" value="6" aria-label="Electrons"></div>
<div class="readout"><div><span>Element</span><b id="phys-at1-n">—</b></div><div><span>Mass number</span><b id="phys-at1-A">—</b></div><div><span>Overall charge</span><b id="phys-at1-q">—</b></div></div><p class="note" id="phys-at1-msg"></p>`;

lesson({id:"phys-at1",group:"a",num:1,lvl:"6.4.1 · Lesson 1",name:"Atoms and isotopes",icon:"atom",
 eyebrow:eb("6.4.1 Atoms and isotopes",1),title:"Atoms and isotopes",
 intro:"Everything is made of atoms: a tiny positive nucleus of protons and neutrons, surrounded by electrons. The number of protons decides which element it is; the number of neutrons can vary, giving isotopes.",
 outcomes:[["Describe the structure of an atom and recall its size","6.4.1.1"],["Describe how electrons can change energy level by absorbing or emitting electromagnetic radiation","6.4.1.1"],["Use atomic number and mass number, and explain what isotopes and ions are","6.4.1.2"]],
 blocks:[
  B.text("The structure of the atom",`<ul><li>Atoms are very small, with a radius of about <b>1 × 10⁻¹⁰ m</b>.</li><li>The <b>nucleus</b> contains protons and neutrons. Its radius is less than <b>1/10 000</b> of the radius of the atom, but almost all the mass is concentrated there.</li><li><b>Electrons</b> are arranged at different distances from the nucleus (different <b>energy levels</b>).</li><li>Atoms have no overall charge: the number of electrons equals the number of protons.</li></ul><div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Particle</th><th>Relative mass</th><th>Relative charge</th><th>Where</th></tr></thead><tbody><tr><td>Proton</td><td>1</td><td>+1</td><td>Nucleus</td></tr><tr><td>Neutron</td><td>1</td><td>0</td><td>Nucleus</td></tr><tr><td>Electron</td><td>very small (≈ 1/2000)</td><td>−1</td><td>Energy levels around the nucleus</td></tr></tbody></table></div><p>Electrons may move to a <b>higher</b> energy level (further from the nucleus) by <b>absorbing</b> electromagnetic radiation, and move back to a <b>lower</b> energy level by <b>emitting</b> electromagnetic radiation.</p>`),
  B.text("Atomic number, mass number and isotopes",`<p>The <b>atomic number</b> (proton number) Z is the number of protons; all atoms of an element have the same number of protons. The <b>mass number</b> A is the total number of protons and neutrons.</p><p style="font-size:1.4rem;text-align:center;font-family:var(--f-display)"><span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:right;font-size:.75rem;line-height:1.1;margin-right:2px"><span>14</span><span>6</span></span>C &nbsp; carbon-14: 6 protons, 8 neutrons</p><p><b>Isotopes</b> are atoms of the same element (same number of protons) with <b>different numbers of neutrons</b>. Atoms turn into <b>ions</b> by losing or gaining outer electrons.</p>`),
  B.sim("phys-at1-sim","Build an atom",stage,panel,`<span>Red: protons · grey: neutrons · blue: electrons</span><span>Nucleus not to scale</span>`),
  B.check([
   {q:"Approximately what is the radius of an atom?",opts:["1 × 10⁻⁵ m","1 × 10⁻¹⁰ m","1 × 10⁻¹⁵ m","1 × 10⁻²⁰ m"],a:1,why:"About 10⁻¹⁰ m."},
   {q:"How many neutrons are in an atom of uranium-238 (atomic number 92)?",a:146,unit:"",tol:0.001,why:"238 − 92 = 146."},
   {q:"What do isotopes of an element have in common?",opts:["Same number of neutrons","Same mass number","Same number of protons","Same number of nucleons"],a:2,why:"Same element ⇒ same proton number; different neutron numbers."},
   {q:"An atom loses an electron. What does it become?",opts:["An isotope","A positive ion","A negative ion","A different element"],a:1,why:"Fewer electrons than protons ⇒ overall positive charge."},
   {q:"What happens when an electron moves to a lower energy level?",opts:["It absorbs electromagnetic radiation","It emits electromagnetic radiation","It leaves the atom","The nucleus changes"],a:1,why:"Energy is given out as EM radiation."},
   {q:"The radius of a nucleus is about how many times smaller than the radius of the atom?",opts:["10","100","10 000 or more","They are the same"],a:2,why:"Less than 1/10 000 of the atomic radius."}]),
  B.keypoints(["Atom radius ≈ 1 × 10⁻¹⁰ m; nucleus radius < 1/10 000 of this, but contains almost all the mass.","Atomic number = protons; mass number = protons + neutrons.","Isotopes: same protons, different neutrons. Ions: atoms that have lost or gained electrons."]),
  B.mistakes(["Saying isotopes have different numbers of protons.","Adding electrons into the mass number.","Confusing absorbing (moving up) and emitting (moving down) radiation."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-at1"); if(!s) return; const {Z,N,e}=st, A=Z+N, q=Z-e, nw=window.innerWidth<640, [sym,name]=EL[Z-1];
  const cx=170, cy=160; let g=`<circle cx="${cx}" cy="${cy}" r="60" fill="none" class="mut" stroke-dasharray="3 4"/><circle cx="${cx}" cy="${cy}" r="110" fill="none" class="mut" stroke-dasharray="3 4"/><circle cx="${cx}" cy="${cy}" r="150" fill="none" class="mut" stroke-dasharray="3 4" opacity="${e>10?1:0}"/>`;
  const nuc=Array(A).fill(0), golden=2.399963;
  nuc.forEach((t,i)=>{ const r=6.5*Math.sqrt(i+.5), a=i*golden, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${Math.floor((i+1)*Z/A)>Math.floor(i*Z/A)?"#d6533c":"#9aa1a8"}" class="ink" stroke-width=".6"/>`; });
  for(let i=0;i<e;i++){ const sh=i<2?0:1, k=sh?i-2:i, n=sh?Math.min(8,e-2):Math.min(2,e), R=sh?110:60, a=k*2*Math.PI/n-Math.PI/2; g+=`<circle cx="${(cx+R*Math.cos(a)).toFixed(1)}" cy="${(cy+R*Math.sin(a)).toFixed(1)}" r="6" fill="#3a7bd5"/>`; }
  const ox=nw?20:400, oy=nw?340:60;
  g+=`<text x="${ox+60}" y="${oy+80}" font-size="64" font-weight="700" style="font-family:var(--f-display)">${sym}</text><text x="${ox+52}" y="${oy+42}" text-anchor="end" font-size="24" class="tacc">${A}</text><text x="${ox+52}" y="${oy+82}" text-anchor="end" font-size="24" class="tdat">${Z}</text>${q?`<text x="${ox+60+44*sym.length}" y="${oy+42}" font-size="22">${Math.abs(q)>1?Math.abs(q):""}${q>0?"+":"−"}</text>`:""}`;
  g+=`<text x="${ox}" y="${oy+130}" font-size="15" font-weight="700">${name}-${A}</text><text x="${ox}" y="${oy+156}" font-size="13" class="tm">${Z} protons, ${N} neutrons, ${e} electrons</text><text x="${ox}" y="${oy+180}" font-size="13" class="tmut">mass number (top) = protons + neutrons</text><text x="${ox}" y="${oy+200}" font-size="13" class="tmut">atomic number (bottom) = protons</text>`;
  s.setAttribute("viewBox",nw?"0 0 360 560":"0 0 900 320"); s.innerHTML=g;
  const stable={1:[0,1,2],2:[1,2],3:[3,4],4:[5],5:[5,6],6:[6,7,8],7:[7,8],8:[8,9,10]}, iso=(stable[Z]||[]).includes(N);
  $("#phys-at1-Zl").textContent=Z; $("#phys-at1-Nl").textContent=N; $("#phys-at1-el").textContent=e; $("#phys-at1-n").textContent=name; $("#phys-at1-A").textContent=A; $("#phys-at1-q").textContent=q===0?"0 (neutral atom)":q>0?`+${q} (positive ion)`:`${q} (negative ion)`;
  $("#phys-at1-msg").textContent=`Changing the neutrons makes a different isotope of ${name.toLowerCase()}. ${iso?"This isotope occurs naturally.":"This isotope is unstable or does not exist: real nuclei need a suitable balance of protons and neutrons."} Changing the protons changes the element.`; }
[["Z","Z"],["N","N"],["e","e"]].forEach(([k,p])=>$("#phys-at1-"+k).addEventListener("input",e=>{ st[p]=+e.target.value; draw(); }));
