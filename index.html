const panel=`<div class="field"><div class="lbl">Initial velocity u <b id="phys-fo9-ul"></b></div><input type="range" id="phys-fo9-u" min="0" max="20" step="1" value="4" aria-label="Initial velocity"></div>
<div class="field"><div class="lbl">Acceleration a <b id="phys-fo9-al"></b></div><input type="range" id="phys-fo9-a" min="-3" max="3" step="0.25" value="1.5" aria-label="Acceleration"></div>
<div class="field"><div class="lbl">Time t <b id="phys-fo9-tl"></b></div><input type="range" id="phys-fo9-t" min="1" max="12" step="1" value="8" aria-label="Time"></div>
<div class="readout"><div><span>Final velocity v = u + at</span><b id="phys-fo9-v">—</b></div><div><span>${HT} Distance = area</span><b id="phys-fo9-s">—</b></div><div><span>Check v² − u² = 2as</span><b id="phys-fo9-c">—</b></div></div><p class="note" id="phys-fo9-msg"></p>`;
const tv=`<svg viewBox="0 0 320 190" role="img" aria-label="Velocity–time graph for a skydiver: rises steeply then levels off at terminal velocity, drops when the parachute opens and levels at a lower terminal velocity"><path d="M40 15 V160 H310" class="ink" fill="none" stroke-width="1.5"/><path d="M40 160 C70 60 100 45 150 42 L170 42 C180 42 182 120 200 125 C220 128 260 128 300 128" class="dat" fill="none" stroke-width="2.5"/><text x="95" y="36" font-size="10">terminal velocity</text><text x="215" y="118" font-size="10">lower terminal velocity</text><text x="172" y="80" font-size="10" class="tacc">parachute opens</text><text x="175" y="178" text-anchor="middle" font-size="11">time</text><text x="20" y="90" font-size="11" transform="rotate(-90 20 90)" text-anchor="middle">velocity</text></svg>`;

lesson({id:"phys-fo9",group:"c",num:9,lvl:"6.5.4 · Lesson 9",name:"Acceleration and velocity–time graphs",icon:"vt",
 eyebrow:eb("6.5.6.1.5 Acceleration",9),title:"Acceleration and velocity–time graphs",
 intro:"Acceleration is the rate of change of velocity. A velocity–time graph shows acceleration as its gradient and, for higher-tier students, distance travelled as the area underneath.",
 outcomes:[["Use a = Δv/t and v² − u² = 2as","6.5.6.1.5"],["Find acceleration from the gradient of a velocity–time graph; (HT) find distance from the area under it","6.5.6.1.5"],["Recall that free-fall acceleration near the Earth is about 9.8 m/s², and explain terminal velocity","6.5.6.1.5"]],
 blocks:[
  B.text("Acceleration",B.eq(`${v("a")} = ${fr("Δ"+v("v"),v("t"))} ${R}`,`<small>a = acceleration (m/s²), Δv = change in velocity (m/s), t = time (s)</small>`,`${v("v")}² − ${v("u")}² = 2${v("a")}${v("s")} ${S}`,`<small>v = final velocity, u = initial velocity, s = distance (m)</small>`)+`<p>An object that slows down is <b>decelerating</b> (negative acceleration). Near the Earth’s surface any object falling freely under gravity has an acceleration of about <b>9.8 m/s²</b>.</p><p>On a velocity–time graph, the <b>gradient</b> is the acceleration.</p>`+ht(`<p>The <b>area under</b> a velocity–time graph is the <b>distance travelled</b> (or displacement). For curved graphs, count squares.</p>`)),
  B.sim("phys-fo9-sim","Velocity–time graphs",stage,panel,`<span>Gradient = acceleration · Higher: shaded area = distance</span>`),
  B.text("Terminal velocity",`<p>An object falling through a fluid initially accelerates due to the force of gravity. As its speed increases, the resistive force (drag) increases, so the resultant force decreases and the acceleration decreases. Eventually the resultant force is zero and the object moves at its <b>terminal velocity</b>.</p>`,B.fig(tv,"A skydiver reaches terminal velocity; opening the parachute increases the drag, giving a lower terminal velocity.")),
  B.example("Using v² − u² = 2as","A car travelling at 12 m/s accelerates at 2.0 m/s² over a distance of 45 m. Calculate its final velocity.",[
   ["Substitute","",[`${v("v")}² = ${v("u")}² + 2${v("a")}${v("s")} = 12² + 2 × 2.0 × 45 = 144 + 180 = 324`]],
   ["Square root","",[`${v("v")} = √324 = ${res("18 m/s")}`]]]),
  B.check([
   {q:"A car speeds up from 5 m/s to 25 m/s in 8 s. Calculate its acceleration.",a:2.5,unit:"m/s²",tol:0.01,why:"a = (25 − 5)/8 = 2.5 m/s²."},
   {q:"A cyclist slows from 10 m/s to 4 m/s in 3.0 s. Calculate the acceleration.",a:-2,unit:"m/s²",tol:0.01,why:"a = (4 − 10)/3.0 = −2.0 m/s² (a deceleration of 2.0 m/s²)."},
   {q:"A ball is dropped from rest and falls 5.0 m. Calculate its speed at the bottom. (a = 9.8 m/s²)",a:9.9,unit:"m/s",tol:0.01,why:"v² = 0 + 2 × 9.8 × 5.0 = 98; v = 9.9 m/s."},
   {q:"A train accelerates from rest at 0.50 m/s² until it reaches 20 m/s. How far does it travel?",a:400,unit:"m",tol:0.01,why:"s = v²/(2a) = 400/1.0 = 400 m."},
   {q:"(Higher) A car travels at a steady 15 m/s for 20 s. What is the area under its v–t graph?",a:300,unit:"m",tol:0.01,why:"Area = 15 × 20 = 300 m."},
   {q:"Why does a falling skydiver reach a terminal velocity?",opts:["Gravity switches off","Air resistance increases until it equals the weight","Her mass decreases","Air resistance decreases"],a:1,why:"Resultant force becomes zero, so no further acceleration."}]),
  B.keypoints(["a = Δv/t; v² − u² = 2as (equation sheet). Free fall: a ≈ 9.8 m/s².","v–t graph: gradient = acceleration; (HT) area = distance.","Terminal velocity: drag increases with speed until it balances the weight."]),
  B.mistakes(["Using a distance–time graph’s gradient as acceleration.","Forgetting to square the velocities in v² − u² = 2as.","Saying a skydiver at terminal velocity has no forces on her (the forces are balanced)."])
 ],onShow:()=>draw()});

function draw(){ const cv=$("#phys-fo9-cv"); if(!cv) return; const {u,a,t}=st; let tt=t, vEnd=u+a*t; if(vEnd<0){ tt=u/(-a); vEnd=0; }
  const s=u*tt+0.5*a*tt*tt;
  const P=plot(cv,{aspect:asp(.45),x:{label:"time / s",min:0,max:12},y:{label:"velocity / m/s",min:0,max:60},series:[{pts:[[0,u],[tt,vEnd]],col:css("--data"),join:true,noPts:true}]});
  if(P){ const c=cv.getContext("2d"); c.save(); c.globalAlpha=.25; c.fillStyle=css("--accent"); c.beginPath(); c.moveTo(P.X(0),P.Y(0)); c.lineTo(P.X(0),P.Y(u)); c.lineTo(P.X(tt),P.Y(vEnd)); c.lineTo(P.X(tt),P.Y(0)); c.closePath(); c.fill(); c.restore(); }
  $("#phys-fo9-ul").textContent=`${u} m/s`; $("#phys-fo9-al").textContent=`${a} m/s²`; $("#phys-fo9-tl").textContent=`${t} s`; $("#phys-fo9-v").textContent=`${fx(vEnd,2)} m/s`; $("#phys-fo9-s").textContent=`${fx(s,1)} m`;
  $("#phys-fo9-c").textContent=Math.abs(a)>1e-9?`${fx(vEnd*vEnd-u*u,1)} = ${fx(2*a*s,1)}`:"a = 0";
  $("#phys-fo9-msg").textContent=tt<t?`The object stops after ${fx(tt,1)} s.`:a>0?"Positive gradient: accelerating.":a<0?"Negative gradient: decelerating.":"Horizontal line: constant velocity."; }
[["u","u"],["a","a"],["t","t"]].forEach(([k,p])=>$("#phys-fo9-"+k).addEventListener("input",e=>{ st[p]=+e.target.value; draw(); }));
})();


</script>
<script>
LEARN.unit="phys-forces";

/* FO10: Newton's laws */
(()=>{
const {$,fx,plot,css,linfit}=LAB, {B,lesson,asp,arr}=LEARN, {v,fr,res}=LAB.W, {eb,R,HT,ht}=G;
const st={F:0.6,m:1.0,data:[],x:0,run:false};
const stage=`<svg id="phys-fo10" viewBox="0 0 900 200" role="img" aria-label="A trolley on a bench pulled by a string over a pulley by a hanging mass"></svg><canvas id="phys-fo10-cv" class="graph" aria-label="Acceleration against resultant force"></canvas>`;
const panel=`<div class="field"><div class="lbl">Resultant force F <b id="phys-fo10-Fl"></b></div><input type="range" id="phys-fo10-F" min="0.2" max="1.2" step="0.2" value="0.6" aria-label="Force"></div>
<div class="field"><div class="lbl">Mass of trolley m <b id="phys-fo10-ml"></b></div><input type="range" id="phys-fo10-m" min="0.5" max="2" step="0.5" value="1" aria-label="Mass"></div>
<div class="btnrow"><button class="btn primary" id="phys-fo10-go">Release</button><button class="btn" id="phys-fo10-clr">Clear graph</button></div>
<div class="readout"><div><span>Acceleration a = F/m</span><b id="phys-fo10-a">—</b></div><div><span>Gradient (1/m)</span><b id="phys-fo10-g">—</b></div></div>`;

lesson({id:"phys-fo10",group:"c",num:10,lvl:"6.5.4 · Lesson 10",name:"Newton’s laws of motion",icon:"fma",
 eyebrow:eb("6.5.4.2 Forces, accelerations and Newton’s laws of motion",10),title:"Newton’s laws of motion",
 intro:"Newton’s three laws link forces to motion. A resultant force makes an object accelerate; with no resultant force, it keeps doing what it was doing; and forces always come in pairs.",
 outcomes:[["State Newton’s first law, including for moving objects; (HT) explain inertia","6.5.6.2.1"],["Use F = ma; (HT) describe inertial mass","6.5.6.2.2"],["Apply Newton’s third law to equilibrium situations","6.5.6.2.3"],["Describe how to investigate the effect of force and mass on acceleration (required practical 19)","6.5.6.2.2"]],
 blocks:[
  B.text("Newton’s first law",`<p>If the resultant force acting on an object is <b>zero</b>:</p><ul><li>a stationary object remains stationary;</li><li>a moving object continues to move at the <b>same speed and in the same direction</b> (the same velocity).</li></ul><p>So when a vehicle travels at a steady speed, the resistive forces balance the driving force. The velocity (speed and/or direction) of an object will only change if a resultant force is acting on it.</p>`+ht(`<p>The tendency of objects to continue in their state of rest or of uniform motion is called <b>inertia</b>.</p>`)),
  B.text("Newton’s second law",`<p>The acceleration of an object is <b>proportional to the resultant force</b> acting on it, and <b>inversely proportional to the mass</b> of the object.</p>`+B.eq(`${v("F")} = ${v("m")}${v("a")} ${R}`,`<small>F = resultant force (N), m = mass (kg), a = acceleration (m/s²)</small>`)+ht(`<p><b>Inertial mass</b> is a measure of how difficult it is to change the velocity of an object. It is defined as the ratio of force over acceleration: m = F/a.</p>`)+`<p>You should be able to estimate the speed, accelerations and forces involved in large accelerations for everyday road transport: for example, a car accelerating at about 3 m/s² with a mass of 1000 kg needs a resultant force of about 3000 N.</p>`),
  B.text("Newton’s third law",`<p>Whenever two objects interact, the forces they exert on each other are <b>equal and opposite</b>. The two forces act on <b>different</b> objects and are the same type of force.</p><p>Example: a book on a table pushes down on the table with a contact force; the table pushes up on the book with an equal contact force. (The book’s weight and the table’s push are balanced, but they are not a Newton’s third law pair, because they act on the same object.)</p>`),
  B.sim("phys-fo10-sim","Force, mass and acceleration",stage,panel,`<span>Record a at several forces: straight line through the origin</span>`),
  B.practical(`<p>In <b>RP 19 Acceleration</b> a trolley is pulled along a bench by a string over a pulley attached to a hanging mass. Light gates (or a stopwatch and marked distances) measure the acceleration.</p><ul><li><b>Effect of force:</b> move masses from the trolley to the hanger, so the total mass of the system stays constant while the force changes. a ∝ F.</li><li><b>Effect of mass:</b> keep the hanging mass constant and add masses to the trolley. a ∝ 1/m.</li></ul>`,"Required practical 19"),
  B.check([
   {q:"Calculate the force needed to accelerate a 1200 kg car at 2.5 m/s².",a:3000,unit:"N",tol:0.01,why:"F = ma = 1200 × 2.5 = 3000 N."},
   {q:"A resultant force of 30 N acts on a 6.0 kg box. Calculate its acceleration.",a:5,unit:"m/s²",tol:0.01,why:"a = F/m = 30/6.0 = 5.0 m/s²."},
   {q:"A resultant force of 900 N gives a motorbike an acceleration of 4.5 m/s². What is its mass?",a:200,unit:"kg",tol:0.01,why:"m = F/a = 900/4.5 = 200 kg."},
   {q:"A car moves at a steady 30 m/s on a straight road. What is the resultant force on it?",opts:["Equal to the driving force","Zero","Equal to its weight","Equal to air resistance"],a:1,why:"Constant velocity ⇒ zero resultant force (Newton’s first law)."},
   {q:"A swimmer pushes backwards on the water. By Newton’s third law…",opts:["the water pushes forward on the swimmer with an equal force","the water pushes backward on the swimmer","the swimmer’s weight increases","nothing happens to the swimmer"],a:0,why:"Equal and opposite forces on the two interacting objects."},
   {q:"(Higher) What is inertia?",opts:["The force of gravity","The tendency of an object to stay at rest or keep moving at the same velocity","The resistance of air","The mass of an object on the Moon"],a:1,why:"Objects resist changes to their motion."}]),
  B.keypoints(["First law: zero resultant force ⇒ no change in velocity.","Second law: F = ma (a ∝ F, a ∝ 1/m). (HT) Inertial mass = F/a.","Third law: interacting objects exert equal and opposite forces on each other."]),
  B.mistakes(["Thinking a moving object needs a resultant force to keep moving.","Using weight instead of mass in F = ma.","Pairing weight and normal force as a third-law pair."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo10"); if(!s) return; const a=st.F/st.m, px=60+st.x*480;
  let g=`<rect x="20" y="110" width="600" height="14" class="fsunk ink" stroke-width="1.5"/><circle cx="628" cy="104" r="12" class="fpan ink" stroke-width="2"/><path d="M${px+90} 92 H628" class="ink" stroke-width="1.4"/><path d="M640 104 V${125+st.x*35}" class="ink" stroke-width="1.4"/><rect x="628" y="${125+st.x*35}" width="24" height="${12+st.F*16}" rx="2" class="fmut"/>`;
  g+=`<rect x="${px}" y="76" width="90" height="28" rx="4" class="facc"/><circle cx="${px+18}" cy="106" r="5" class="fink"/><circle cx="${px+72}" cy="106" r="5" class="fink"/>${Array.from({length:Math.round(st.m*2)},(_,i)=>`<rect x="${px+10+i*18}" y="62" width="14" height="14" rx="2" class="fmut"/>`).join("")}`;
  g+=arr(px+90,90,px+90+st.F*80,90,"dat","",3)+`<text x="300" y="170" font-size="12" class="tm">light gates measure the acceleration</text><rect x="250" y="60" width="6" height="50" class="fdat" opacity=".6"/><rect x="450" y="60" width="6" height="50" class="fdat" opacity=".6"/>`;
  g+=`<text x="700" y="60" font-size="14" class="tm">F = ${fx(st.F,1)} N</text><text x="700" y="84" font-size="14" class="tm">m = ${st.m} kg</text><text x="700" y="114" font-size="15" font-weight="700" class="tacc">a = ${fx(a,2)} m/s²</text>`;
  s.innerHTML=g;
  const f=st.data.length>=2?linfit(st.data):null;
  plot($("#phys-fo10-cv"),{aspect:asp(.42),x:{label:"resultant force / N",min:0,max:1.4},y:{label:"acceleration / m/s²",min:0,max:2.6},series:[{pts:st.data,col:css("--accent")}],fits:f?[{m:f.m,c:f.c,x0:0,x1:1.4,col:css("--data"),dash:[5,4]}]:[],empty:"Release the trolley at several forces"});
  $("#phys-fo10-Fl").textContent=`${fx(st.F,1)} N`; $("#phys-fo10-ml").textContent=`${st.m} kg`; $("#phys-fo10-a").textContent=`${fx(a,2)} m/s²`; $("#phys-fo10-g").textContent=f?`${fx(f.m,2)} kg⁻¹ (m ≈ ${fx(1/f.m,2)} kg)`:"—"; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(st.run&&!$("#lab-phys-fo10").hidden){ st.T=(st.T||0)+dt; st.x=Math.min(1,0.5*(st.F/st.m)*st.T*st.T/1.2); if(st.x>=1){ st.run=false; const a=st.F/st.m; st.data=st.data.filter(p=>Math.abs(p[0]-st.F)>1e-6); st.data.push([st.F,+(a*(1+(Math.random()-.5)*0.04)).toFixed(3)]); } draw(); } requestAnimationFrame(loop); }
$("#phys-fo10-go").addEventListener("click",()=>{ st.x=0; st.T=0; st.run=true; });
$("#phys-fo10-clr").addEventListener("click",()=>{ st.data=[]; draw(); });
$("#phys-fo10-F").addEventListener("input",e=>{ st.F=+e.target.value; st.x=0; draw(); });
$("#phys-fo10-m").addEventListener("input",e=>{ st.m=+e.target.value; st.data=[]; st.x=0; draw(); });
requestAnimationFrame(loop);
})();


</script>
<script>
LEARN.unit="phys-forces";

/* FO11: stopping distances */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb}=G;
const ROAD={dry:["Dry road",7],wet:["Wet road",4.5],icy:["Icy road",1.5]};
const st={v:20,rt:0.7,r:"dry",m:1200};
const stage=`<svg id="phys-fo11" viewBox="0 0 900 190" role="img" aria-label="Thinking distance and braking distance along a road"></svg>`;
const panel=`<div class="field"><div class="lbl">Speed <b id="phys-fo11-vl"></b></div><input type="range" id="phys-fo11-v" min="5" max="35" step="1" value="20" aria-label="Speed"></div>
<div class="field"><div class="lbl">Reaction time <b id="phys-fo11-rl"></b></div><input type="range" id="phys-fo11-rt" min="0.4" max="2.0" step="0.1" value="0.7" aria-label="Reaction time"></div>
<div class="field"><div class="lbl">Road surface</div><div class="seg c3" id="phys-fo11-r">${Object.entries(ROAD).map(([k,r])=>`<label class="opt"><input type="radio" name="phys-fo11-r" value="${k}" ${k===st.r?"checked":""}><span>${r[0].split(" ")[0]}</span></label>`).join("")}</div></div>
<div class="readout"><div><span>Thinking distance</span><b id="phys-fo11-th">—</b></div><div><span>Braking distance</span><b id="phys-fo11-br">—</b></div><div><span>Stopping distance</span><b id="phys-fo11-st">—</b></div><div><span>Braking force (1200 kg car)</span><b id="phys-fo11-F">—</b></div></div>`;

lesson({id:"phys-fo11",group:"c",num:11,lvl:"6.5.4 · Lesson 11",name:"Stopping distances",icon:"stop",
 eyebrow:eb("6.5.4.3 Forces and braking",11),title:"Stopping distances",
 intro:"A car cannot stop instantly. First the driver has to react, then the brakes have to slow the car down. Both distances depend on speed, and many other factors make them longer.",
 outcomes:[["Define stopping distance as thinking distance plus braking distance","6.5.6.3.1"],["Describe the factors that affect reaction time, thinking distance and braking distance","6.5.6.3.2–3"],["Explain how the brakes transfer energy and estimate the forces involved in decelerating a vehicle","6.5.6.3.4"]],
 blocks:[
  B.text("Thinking and braking distance",`<p>The <b>stopping distance</b> of a vehicle is the sum of:</p><ul><li>the <b>thinking distance</b>: the distance travelled during the driver’s reaction time;</li><li>the <b>braking distance</b>: the distance travelled under the braking force.</li></ul><p>For a given braking force, the greater the speed of the vehicle, the greater the stopping distance.</p><div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Distance</th><th>Increased by</th></tr></thead><tbody><tr><td>Thinking</td><td>Higher speed; longer reaction time due to tiredness, drugs, alcohol or distractions (such as a phone)</td></tr><tr><td>Braking</td><td>Higher speed; wet or icy roads; worn or poor brakes; worn tyres; greater mass</td></tr></tbody></table></div><p>Reaction times vary from person to person, typically <b>0.2 s to 0.9 s</b>. They can be measured with the ruler-drop test or with online tests.</p>`),
  B.sim("phys-fo11-sim","Stopping a car",stage,panel,`<span>Blue: thinking distance · red: braking distance</span>`),
  B.text("Braking forces and energy",`<p>When a force is applied to the brakes, work done by the friction force between the brake and the wheel reduces the kinetic energy of the vehicle, and the temperature of the brakes increases.</p><p>The greater the speed, the greater the braking force needed to stop the vehicle in a certain distance. The greater the braking force, the greater the deceleration. Large decelerations may lead to brakes overheating and/or loss of control.</p><p>Doubling the speed doubles the thinking distance but makes the braking distance four times greater (braking distance ∝ v²).</p>`),
  B.example("Higher · Estimating a braking force","A 1500 kg car travelling at 20 m/s stops in a braking distance of 25 m. Estimate the average braking force.",[
   ["Deceleration","v² − u² = 2as",[`0 − 20² = 2 × ${v("a")} × 25 ⇒ ${v("a")} = −8.0 m/s²`]],
   ["Force","F = ma",[`${v("F")} = 1500 × 8.0 = ${res("12 000 N")}`]]]),
  B.check([
   {q:"A driver has a reaction time of 0.6 s and is travelling at 25 m/s. Calculate the thinking distance.",a:15,unit:"m",tol:0.01,why:"s = vt = 25 × 0.6 = 15 m."},
   {q:"The thinking distance is 12 m and the braking distance is 24 m. What is the stopping distance?",a:36,unit:"m",tol:0.001,why:"12 + 24 = 36 m."},
   {q:"Which factor increases the braking distance but not the thinking distance?",opts:["Drinking alcohol","Using a phone","Icy road","Tiredness"],a:2,why:"Icy roads reduce friction, so the deceleration is smaller."},
   {q:"The speed of a car doubles. By what factor does its braking distance increase?",a:4,unit:"",tol:0.001,why:"Braking distance ∝ v² (because kinetic energy ∝ v²)."},
   {q:"What happens to the temperature of the brakes when a car stops?",opts:["Decreases","Increases","Stays the same","Falls to 0 °C"],a:1,why:"Work done by friction transfers kinetic energy to the thermal store of the brakes."},
   {q:"What is a typical human reaction time?",opts:["0.002 s","0.2–0.9 s","3–5 s","10 s"],a:1,why:"About 0.2 s to 0.9 s."}]),
  B.keypoints(["Stopping distance = thinking distance + braking distance.","Thinking distance ∝ speed and reaction time; for a fixed braking force and mass, braking distance ∝ speed² and depends on road, brakes, tyres and mass.","Brakes do work against the car’s kinetic energy; large decelerations risk overheating and loss of control."]),
  B.mistakes(["Saying alcohol increases braking distance (it increases reaction time and so thinking distance).","Assuming braking distance doubles when speed doubles.","Forgetting to convert mph or km/h to m/s."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo11"); if(!s) return; const [n,a]=ROAD[st.r], th=st.v*st.rt, br=st.v*st.v/(2*a), tot=th+br, sc=Math.min(8,820/Math.max(tot,100));
  let g=`<rect x="0" y="70" width="900" height="70" fill="#5c6166" opacity=".85"/><path d="M0 105 H900" stroke="#fff" stroke-width="2" stroke-dasharray="20 14"/>`;
  if(st.r==="wet") g+=`<rect x="0" y="70" width="900" height="70" fill="#5a9be6" opacity=".2"/>`; if(st.r==="icy") g+=`<rect x="0" y="70" width="900" height="70" fill="#e8f4ff" opacity=".45"/>`;
  const x0=40; g+=`<rect x="${x0}" y="40" width="${th*sc}" height="16" class="fdat"/><rect x="${x0+th*sc}" y="40" width="${br*sc}" height="16" class="fbd"/>`;
  g+=`<text x="${x0+th*sc/2}" y="32" text-anchor="middle" font-size="12" class="tdat">${fx(th,1)} m</text><text x="${x0+th*sc+br*sc/2}" y="32" text-anchor="middle" font-size="12" class="tbd">${fx(br,1)} m</text>`;
  g+=`<rect x="${x0-30}" y="80" width="46" height="22" rx="5" class="facc"/><rect x="${x0+tot*sc-30}" y="112" width="46" height="22" rx="5" class="facc" opacity=".5"/><path d="M${x0+tot*sc+20} 60 V150" class="ink" stroke-dasharray="4 3"/>`;
  g+=`<text x="${x0}" y="170" font-size="12" class="tm">0 m</text><text x="${x0+tot*sc}" y="170" text-anchor="middle" font-size="12" font-weight="700">${fx(tot,1)} m</text>`;
  s.innerHTML=g;
  $("#phys-fo11-vl").textContent=`${st.v} m/s (${fx(st.v*2.237,0)} mph)`; $("#phys-fo11-rl").textContent=`${fx(st.rt,1)} s`; $("#phys-fo11-th").textContent=`${fx(th,1)} m`; $("#phys-fo11-br").textContent=`${fx(br,1)} m`; $("#phys-fo11-st").textContent=`${fx(tot,1)} m`; $("#phys-fo11-F").textContent=`${fx(st.m*a,0)} N`; }
$("#phys-fo11-v").addEventListener("input",e=>{ st.v=+e.target.value; draw(); });
$("#phys-fo11-rt").addEventListener("input",e=>{ st.rt=+e.target.value; draw(); });

  {q:"The lorry later travels at a steady speed. State and explain the size of the driving force.",m:2,lines:3,ms:[["1","the driving force equals the resistive forces"],["1","resultant force is zero (Newton’s first law), so no acceleration"]]},

<script>
LEARN.unit="phys-waves";

/* WA1: transverse and longitudinal waves */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,S}=G;
const st={type:"t",A:30,f:1,ph:0,run:true};
const lamOf=()=>200/st.f; /* px; wave speed fixed by the medium */
const stage=`<svg id="phys-wa1" viewBox="0 0 900 220" role="img" aria-label="Animation of a wave with one particle highlighted"></svg>`;
const panel=`<div class="field"><div class="lbl">Wave type</div><div class="seg c2" id="phys-wa1-t"><label class="opt"><input type="radio" name="phys-wa1-t" value="t" checked><span>Transverse</span></label><label class="opt"><input type="radio" name="phys-wa1-t" value="l"><span>Longitudinal</span></label></div></div>
<div class="field"><div class="lbl">Amplitude <b id="phys-wa1-Al"></b></div><input type="range" id="phys-wa1-A" min="5" max="50" step="5" value="30" aria-label="Amplitude"></div>
<div class="field"><div class="lbl">Frequency <b id="phys-wa1-fl"></b></div><input type="range" id="phys-wa1-f" min="0.25" max="2" step="0.25" value="1" aria-label="Frequency"></div>
<div class="btnrow"><button class="btn" id="phys-wa1-p">Pause</button></div>
<div class="readout"><div><span>Period T = 1/f</span><b id="phys-wa1-T">—</b></div><div><span>Wavelength</span><b id="phys-wa1-L">—</b></div></div><p class="note" id="phys-wa1-msg"></p>`;

lesson({id:"phys-wa1",group:"a",num:1,lvl:"6.6.1 · Lesson 1",name:"Transverse and longitudinal waves",icon:"wave",
 eyebrow:eb("6.6.1.1–6.6.1.2 Transverse and longitudinal waves; properties of waves",1),title:"Transverse and longitudinal waves",
 intro:"Waves transfer energy from one place to another without transferring matter. The particles of the medium just oscillate about fixed positions, either side to side across the direction of travel or back and forth along it.",
 outcomes:[["Describe the difference between transverse and longitudinal waves, with examples","6.6.1.1"],["Describe evidence that it is the wave and not the medium that travels","6.6.1.1"],["Describe amplitude, wavelength, frequency and period, and use T = 1/f","6.6.1.2"]],
 blocks:[
  B.text("Two types of wave",`<ul><li>In a <b>transverse</b> wave the oscillations are <b>perpendicular</b> to the direction of energy transfer. Examples: ripples on a water surface, waves on a string, all electromagnetic waves.</li><li>In a <b>longitudinal</b> wave the oscillations are <b>parallel</b> to the direction of energy transfer. They show areas of <b>compression</b> and <b>rarefaction</b>. Example: sound waves travelling through air.</li></ul><p>Evidence that the wave, not the medium, travels: a cork on a pond bobs up and down as ripples pass but is not carried along; air particles do not travel from a loudspeaker to your ear.</p>`),
  B.text("Describing waves",`<ul><li><b>Amplitude</b>: the maximum displacement of a point on a wave away from its undisturbed position.</li><li><b>Wavelength</b> (λ): the distance from a point on one wave to the equivalent point on the adjacent wave.</li><li><b>Frequency</b> (f): the number of waves passing a point each second, in hertz (Hz).</li><li><b>Period</b> (T): the time for one complete wave to pass a point.</li></ul>`+B.eq(`${v("T")} = ${fr("1",v("f"))} ${S}`,`<small>T = period (s), f = frequency (Hz)</small>`)),
  B.sim("phys-wa1-sim","Watching a wave pass",stage,panel,`<span>Red dot: one particle of the medium</span><span>It oscillates but does not travel with the wave</span>`),
  B.check([
   {q:"Which of these is a longitudinal wave?",opts:["Light","Ripples on water","Sound in air","Microwaves"],a:2,why:"Sound in air has compressions and rarefactions."},
   {q:"A wave has a frequency of 50 Hz. Calculate its period.",a:0.02,unit:"s",tol:0.01,why:"T = 1/50 = 0.020 s."},
   {q:"A wave has a period of 0.25 s. Calculate its frequency.",a:4,unit:"Hz",tol:0.01,why:"f = 1/0.25 = 4.0 Hz."},
   {q:"What does the amplitude of a wave measure?",opts:["Distance between two crests","Maximum displacement from the undisturbed position","Number of waves per second","Speed of the wave"],a:1,why:"Amplitude = maximum displacement."},
   {q:"A cork on a pond bobs up and down as waves pass. What does this show?",opts:["Water travels with the wave","The wave transfers energy but not the water","The wave is longitudinal","The cork is heavy"],a:1,why:"The water oscillates in place; energy moves on."}]),
  B.keypoints(["Transverse: oscillations perpendicular to energy transfer (water ripples, EM waves).","Longitudinal: oscillations parallel; compressions and rarefactions (sound).","Waves transfer energy, not matter. T = 1/f."]),
  B.mistakes(["Measuring amplitude from crest to trough (that is twice the amplitude).","Saying sound is transverse.","Measuring wavelength from crest to the next trough."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-wa1"); if(!s) return; const lam=lamOf(), k=2*Math.PI/lam, ph=st.ph; let g="";
  if(st.type==="t"){ let d=""; for(let x=0;x<=900;x+=4){ const y=110-st.A*Math.sin(k*x-ph); d+=(x?"L":"M")+x+" "+y.toFixed(1); } g+=`<path d="M0 110 H900" class="mut" stroke-dasharray="4 4"/><path d="${d}" fill="none" class="dat" stroke-width="3"/>`;
    for(let x=10;x<900;x+=20){ const y=110-st.A*Math.sin(k*x-ph); g+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="3.5" class="fmut"/>`; }
    const xp=310, yp=110-st.A*Math.sin(k*xp-ph); g+=`<circle cx="${xp}" cy="${yp.toFixed(1)}" r="7" class="fbd"/><path d="M${xp} ${110-st.A} V${110+st.A}" class="bd" stroke-dasharray="3 3"/>`;
    g+=`<path d="M100 ${110-st.A-14} h${lam}" class="ink"/><path d="M100 ${110-st.A-20} v12 M${100+lam} ${110-st.A-20} v12" class="ink"/><text x="${100+lam/2}" y="${110-st.A-22}" text-anchor="middle" font-size="12">wavelength</text>`; }
  else { for(let i=0;i<90;i++){ const x0=i*10+5, x=x0+st.A*0.5*Math.sin(k*x0-ph); g+=`<line x1="${x.toFixed(1)}" y1="50" x2="${x.toFixed(1)}" y2="170" class="${i===31?"bd":"dat"}" stroke-width="${i===31?4:2}"/>`; }
    g+=`<text x="10" y="200" font-size="12" class="tmut">Lines close together: compressions · far apart: rarefactions</text>`; }
  g+=`<path d="M760 25 h110" class="acc" stroke-width="3"/><path d="M872 25 l-12 -6 v12z" class="facc"/><text x="760" y="16" font-size="11" class="tacc">energy transfer</text>`;
  s.innerHTML=g; $("#phys-wa1-Al").textContent=`${st.A/20} cm`; $("#phys-wa1-fl").textContent=`${st.f} Hz`; $("#phys-wa1-T").textContent=`${fx(1/st.f,2)} s`; $("#phys-wa1-L").textContent=`${fx(2/st.f,2)} m`;
  $("#phys-wa1-msg").textContent=st.type==="t"?"The red particle moves up and down, at right angles to the direction the wave travels.":"The red layer moves back and forth, parallel to the direction the wave travels."; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(st.run&&!$("#lab-phys-wa1").hidden){ st.ph+=2*Math.PI*st.f*dt*0.6; draw(); } requestAnimationFrame(loop); }
$("#phys-wa1-t").addEventListener("change",e=>{ st.type=e.target.value; draw(); });
$("#phys-wa1-A").addEventListener("input",e=>{ st.A=+e.target.value; draw(); });
$("#phys-wa1-f").addEventListener("input",e=>{ st.f=+e.target.value; draw(); });
$("#phys-wa1-p").addEventListener("click",e=>{ st.run=!st.run; e.target.textContent=st.run?"Pause":"Play"; });
requestAnimationFrame(loop);
})();


</script>
<script>
LEARN.unit="phys-waves";

/* WA2: wave speed and v = fλ */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G;
const MED={water:["Ripple tank (shallow water)",0.25,"cm",100],deep:["Ripple tank (deeper water)",0.36,"cm",100],string:["Vibrating string",24,"m",1]};
const st={m:"water",f:10,ph:0,run:true};
const stage=`<svg id="phys-wa2" viewBox="0 0 900 260" role="img" aria-label="Top view of waves in a ripple tank with a ruler"></svg>`;
const panel=`<div class="field"><div class="lbl">Medium</div><select id="phys-wa2-m" aria-label="Medium">${Object.entries(MED).map(([k,m])=>`<option value="${k}">${m[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Frequency <b id="phys-wa2-fl"></b></div><input type="range" id="phys-wa2-f" min="4" max="20" step="1" value="10" aria-label="Frequency"></div>
<div class="btnrow"><button class="btn" id="phys-wa2-p">Freeze (strobe)</button></div>
<div class="readout"><div><span>Length of 10 wavelengths</span><b id="phys-wa2-10">—</b></div><div><span>Wavelength λ</span><b id="phys-wa2-L">—</b></div><div><span>Wave speed v = fλ</span><b id="phys-wa2-v">—</b></div></div><p class="note">Change the frequency: the wavelength changes, but the speed stays the same for the same medium.</p>`;

lesson({id:"phys-wa2",group:"a",num:2,lvl:"6.6.1 · Lesson 2",name:"Wave speed",icon:"waves",
 eyebrow:eb("6.6.1.2 Properties of waves",2),title:"Wave speed",
 intro:"The wave speed is the speed at which energy is transferred through the medium. It is linked to the frequency and wavelength by the wave equation, which you can check with a ripple tank or a vibrating string.",
 outcomes:[["Use the wave equation v = fλ","6.6.1.2"],["Describe a method to measure the speed of sound waves in air","6.6.1.2"],["Describe how to measure the frequency, wavelength and speed of waves in a ripple tank and on a string (required practical 20)","6.6.1.2"]],
 blocks:[
  B.text("The wave equation",`<p>The <b>wave speed</b> is the speed at which the energy is transferred (or the wave moves) through the medium.</p>`+B.eq(`${v("v")} = ${v("f")}λ ${R}`,`<small>v = wave speed (m/s), f = frequency (Hz), λ = wavelength (m)</small>`)+`<p>The speed depends on the medium. For a given medium, increasing the frequency decreases the wavelength.</p><p><b>Speed of sound in air:</b> two people stand a measured distance apart (e.g. 400 m). One bangs two blocks together; the other starts a stopwatch on seeing the blocks hit and stops it on hearing the sound. v = distance ÷ time (about 330–340 m/s). Repeat and average to reduce the effect of reaction time.</p>`),
  B.sim("phys-wa2-sim","Measuring waves in a ripple tank",stage,panel,`<span>Bright lines: wave crests (seen from above)</span>`),
  B.practical(`<p>In <b>RP 20 Waves</b> you measure the speed of waves in a ripple tank and on a stretched string.</p><ul><li><b>Ripple tank:</b> use a lamp and a stroboscope (or a phone video) to “freeze” the pattern on the paper underneath. Measure across 10 wavelengths and divide by 10. Count the waves passing a point in 10 s for the frequency. v = fλ.</li><li><b>String:</b> a vibration generator drives a string over a pulley. Adjust the frequency until a stationary wave appears; measure the length of several half-wavelengths with a metre rule. Read the frequency from the signal generator.</li></ul>`,"Required practical 20"),
  B.check([
   {q:"A wave has a frequency of 200 Hz and a wavelength of 1.7 m. Calculate its speed.",a:340,unit:"m/s",tol:0.01,why:"v = fλ = 200 × 1.7 = 340 m/s."},
   {q:"Radio waves travel at 3.0 × 10⁸ m/s. Calculate the wavelength of a 100 MHz radio wave.",a:3,unit:"m",tol:0.01,why:"λ = v/f = 3.0 × 10⁸ / 1.0 × 10⁸ = 3.0 m."},
   {q:"Water waves have a wavelength of 0.040 m and travel at 0.32 m/s. Calculate their frequency.",a:8,unit:"Hz",tol:0.01,why:"f = v/λ = 0.32/0.040 = 8.0 Hz."},
   {q:"Why do students measure across 10 waves in a ripple tank rather than one?",opts:["To make the waves faster","To reduce the uncertainty in the wavelength","Because one wave cannot be seen","To change the frequency"],a:1,why:"A longer measurement has a smaller percentage uncertainty."},
   {q:"The frequency of waves in the same ripple tank is doubled. What happens to the wavelength?",opts:["Doubles","Halves","Stays the same","Quadruples"],a:1,why:"Speed is fixed by the medium, so λ = v/f halves."}]),
  B.keypoints(["v = fλ. Wave speed depends on the medium.","Same medium: higher frequency ⇒ shorter wavelength.","Measure over many wavelengths (or many waves) to reduce uncertainty."]),
  B.mistakes(["Forgetting to convert kHz or MHz to Hz.","Mixing cm and m for the wavelength.","Thinking that increasing the frequency increases the speed."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-wa2"); if(!s) return; const [n,vv,u,cf]=MED[st.m], lam=vv/st.f; /* m */

  for(let x=30-((st.ph/(2*Math.PI))*lp)%lp+lp; x<890; x+=lp) g+=`<rect x="${x.toFixed(1)}" y="12" width="${Math.max(2,lp*0.18).toFixed(1)}" height="186" fill="#d8f0ff" opacity=".8"/>`;
  const L10=10*lam, Lpx=L10*px; g+=`<rect x="40" y="210" width="${Math.min(840,Lpx+20)}" height="34" class="fpan ink" stroke-width="1"/>`;
  for(let i=0;i<=10;i++){ const x=50+i*lp; if(x>880) break; g+=`<path d="M${x.toFixed(1)} 210 v12" class="bd" stroke-width="2"/>`; }
  g+=`<text x="${Math.min(850,50+Lpx/2)}" y="238" text-anchor="middle" font-size="12" class="tm">10 λ = ${st.m==="string"?fx(L10,2)+" m":fx(L10*100,1)+" cm"}</text>`;
  s.innerHTML=g; $("#phys-wa2-fl").textContent=`${st.f} Hz`; $("#phys-wa2-10").textContent=st.m==="string"?`${fx(L10,2)} m`:`${fx(L10*100,1)} cm`; $("#phys-wa2-L").textContent=st.m==="string"?`${fx(lam,3)} m`:`${fx(lam*100,2)} cm`; $("#phys-wa2-v").textContent=`${fx(st.f*lam,2)} m/s`; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(st.run&&!$("#lab-phys-wa2").hidden){ st.ph+=2*Math.PI*dt*1.2; draw(); } requestAnimationFrame(loop); }
$("#phys-wa2-m").addEventListener("change",e=>{ st.m=e.target.value; draw(); });
$("#phys-wa2-f").addEventListener("input",e=>{ st.f=+e.target.value; draw(); });

<script>

/* WA5: the electromagnetic spectrum */
(()=>{
const {$,fx,sci}=LAB, {B,lesson}=LEARN, {v,fr,res}=LAB.W, {eb,HT,ht}=G;
const REG=[["Gamma rays",-16,-11,"#7b5fb0","emitted by changes in the nucleus"],["X-rays",-11,-8,"#5a6fd6","inner electrons; medical imaging"],["Ultraviolet",-8,-6.4,"#9a6ad6","sun tanning, security marking"],["Visible light",-6.4,-6.15,"rainbow","the only part our eyes detect"],["Infrared",-6.15,-3,"#d6533c","emitted by all warm objects"],["Microwaves",-3,-1,"#d1a72c","satellite communication, cooking"],["Radio waves",-1,4,"#3aa58a","produced by oscillating circuits"]];
const st={L:-6.3};
const stage=`<svg id="phys-wa5" viewBox="0 0 900 260" role="img" aria-label="The electromagnetic spectrum with a slider marking the chosen wavelength"></svg>`;
const panel=`<div class="field"><div class="lbl">Wavelength <b id="phys-wa5-Ll"></b></div><input type="range" id="phys-wa5-L" min="-13" max="3" step="0.05" value="-6.3" aria-label="Wavelength (log scale)"></div>
<div class="readout"><div><span>Region</span><b id="phys-wa5-r">—</b></div><div><span>Frequency f = c/λ</span><b id="phys-wa5-f">—</b></div><div><span>Speed in a vacuum</span><b>3.0 × 10⁸ m/s</b></div></div><p class="note" id="phys-wa5-msg"></p>`;
const fmt=x=>{ const e=Math.floor(Math.log10(x)), m=x/10**e; return `${fx(m,1)} × 10${String(e).replace(/-/,"⁻").replace(/\d/g,d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[d])}`; };

lesson({id:"phys-wa5",group:"b",num:5,lvl:"6.6.2 · Lesson 5",name:"The electromagnetic spectrum",icon:"em",
 eyebrow:eb("6.6.2.1–6.6.2.2 Types and properties of electromagnetic waves",5),title:"The electromagnetic spectrum",
 intro:"Light is just one small part of a whole family of electromagnetic waves. They all travel at the same speed through a vacuum, but their wavelengths range from smaller than an atom to longer than a football pitch.",
 outcomes:[["Recall that EM waves are transverse, transfer energy from source to absorber and form a continuous spectrum","6.6.2.1"],["List the groups of the EM spectrum in order of wavelength and frequency","6.6.2.1"],["Explain that different wavelengths are absorbed, transmitted, refracted or reflected differently; (HT) explain how radio waves are produced and absorbed","6.6.2.2"]],
 blocks:[
  B.text("Electromagnetic waves",`<p>Electromagnetic waves are <b>transverse</b> waves that transfer energy from the <b>source</b> of the waves to an <b>absorber</b>. They form a <b>continuous spectrum</b>, and all types travel at the <b>same velocity</b> through a vacuum (space) or air: 3.0 × 10⁸ m/s.</p><p>In order of <b>decreasing wavelength</b> (and increasing frequency): <b>radio waves, microwaves, infrared, visible light (red to violet), ultraviolet, X-rays, gamma rays</b>.</p><p>Our eyes only detect visible light, so we detect a limited range of electromagnetic waves.</p>`),
  B.sim("phys-wa5-sim","Exploring the spectrum",stage,panel,`<span>Wavelength scale is logarithmic: each mark is ×10</span>`),
  B.text("Properties",`<p>Different substances may absorb, transmit, refract or reflect electromagnetic waves in ways that vary with wavelength. For example, glass transmits visible light but absorbs much ultraviolet; the atmosphere transmits radio waves and visible light but absorbs most X-rays. Some effects, such as refraction, are due to the difference in velocity of the waves in different substances.</p><p>Changes in atoms and the nuclei of atoms can result in electromagnetic waves being generated or absorbed over a wide frequency range. <b>Gamma rays</b> originate from changes in the <b>nucleus</b> of an atom.</p><p>Ultraviolet waves, X-rays and gamma rays can have hazardous effects on human body tissue. The effects depend on the type of radiation and the size of the dose.</p>`+ht(`<p><b>Radio waves</b> can be produced by <b>oscillations in electrical circuits</b>. When radio waves are absorbed they may create an <b>alternating current</b> with the <b>same frequency</b> as the radio wave itself, so radio waves can themselves induce oscillations in an electrical circuit (this is how an aerial works).</p>`)),
  B.check([
   {q:"Which EM wave has the longest wavelength?",opts:["Gamma rays","Visible light","Microwaves","Radio waves"],a:3,why:"Radio waves are at the long-wavelength end."},
   {q:"Which EM wave has the highest frequency?",opts:["Gamma rays","Ultraviolet","Infrared","Radio waves"],a:0,why:"Gamma rays have the shortest wavelength and highest frequency."},
   {q:"Which part of the spectrum lies between visible light and microwaves?",opts:["Ultraviolet","Infrared","X-rays","Radio waves"],a:1,why:"Order: radio, micro, IR, visible, UV, X-ray, gamma."},
   {q:"Calculate the frequency of microwaves of wavelength 0.12 m. (c = 3.0 × 10⁸ m/s)",a:2.5e9,unit:"Hz",tol:0.01,why:"f = c/λ = 3.0 × 10⁸ / 0.12 = 2.5 × 10⁹ Hz."},
   {q:"What do all EM waves have in common?",opts:["Same frequency","Same wavelength","Same speed in a vacuum","Same energy"],a:2,why:"All travel at 3.0 × 10⁸ m/s in a vacuum."},
   {q:"(Higher) How are radio waves produced?",opts:["By changes in the nucleus","By oscillations in electrical circuits","By hot objects only","By sound waves"],a:1,why:"Oscillating charges in a circuit (a transmitter aerial)."}]),
  B.keypoints(["EM waves: transverse, same speed in a vacuum, transfer energy from source to absorber.","Order (long λ to short λ): radio, micro, IR, visible, UV, X-ray, gamma.","Gamma from the nucleus. (HT) Radio waves from oscillating circuits; absorbed radio waves induce an a.c. of the same frequency."]),
  B.mistakes(["Putting UV on the wrong side of visible light.","Thinking that higher-frequency EM waves travel faster.","Calling EM waves longitudinal."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-wa5"); if(!s) return; const nw=window.innerWidth<640, X=e=>30+(e+13)/16*840; let g=""; const AB={"Gamma rays":"γ","X-rays":"X","Ultraviolet":"UV","Visible light":"Vis","Infrared":"IR","Microwaves":"Micro","Radio waves":"Radio"};
  REG.forEach(([n,a,b,col])=>{ const x1=X(Math.max(-13,a)), x2=X(Math.min(3,b)); if(col==="rainbow"){ const cs=["#7a3cff","#3c5cff","#2fb34a","#f2e02a","#f39a1e","#e3341e"]; cs.forEach((c,i)=>g+=`<rect x="${(x1+(x2-x1)*i/6).toFixed(1)}" y="60" width="${((x2-x1)/6+0.5).toFixed(1)}" height="60" style="fill:${c}"/>`); } else g+=`<rect x="${x1.toFixed(1)}" y="60" width="${(x2-x1).toFixed(1)}" height="60" style="fill:${col}" opacity=".75"/>`;
    g+=`<text x="${((x1+x2)/2).toFixed(1)}" y="${n==="Visible light"?52:(nw?150:140)}" text-anchor="middle" font-size="${nw?26:12}" font-weight="700">${nw?AB[n]:n==="Visible light"?"Visible":n}</text>`; });
  for(let e=-12;e<=3;e+=nw?4:2) g+=`<path d="M${X(e)} 120 v8" class="ink"/><text x="${X(e)}" y="${nw?185:162}" text-anchor="middle" font-size="${nw?22:10}" class="tmut">10${String(e).replace(/-/,"⁻").replace(/\d/g,d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[d])} m</text>`;
  g+=nw?`<text x="30" y="30" font-size="22" class="tmut">← higher frequency</text><text x="870" y="30" text-anchor="end" font-size="22" class="tmut">longer λ →</text>`:`<text x="30" y="20" font-size="11" class="tmut">← shorter wavelength, higher frequency, more energy</text><text x="870" y="20" text-anchor="end" font-size="11" class="tmut">longer wavelength, lower frequency →</text>`;
  const xm=X(st.L); g+=`<path d="M${xm} 54 V126" class="ink" stroke-width="3"/><circle cx="${xm}" cy="54" r="5" class="fink"/>`;
  let d=""; const cyc=Math.max(1.5,Math.min(30,6-st.L*0.6)); for(let x=0;x<=840;x+=3){ d+=(x?"L":"M")+(30+x)+" "+(215+22*Math.sin(x/840*cyc*2*Math.PI)).toFixed(1); } g+=`<path d="${d}" fill="none" class="dat" stroke-width="2"/><text x="30" y="250" font-size="11" class="tmut">(wave drawn schematically: more cycles = shorter wavelength)</text>`;
  s.innerHTML=g; const L=10**st.L, f=3e8/L, R=REG.find(([n,a,b])=>st.L>=a&&st.L<b)||REG[REG.length-1];
  $("#phys-wa5-Ll").textContent=`${fmt(L)} m`; $("#phys-wa5-f").textContent=`${fmt(f)} Hz`; $("#phys-wa5-r").textContent=R[0]; $("#phys-wa5-msg").textContent=`${R[0]}: ${R[4]}.`; }
$("#phys-wa5-L").addEventListener("input",e=>{ st.L=+e.target.value; draw(); });
})();


</script>

lesson({id:"phys-wa6",group:"b",num:6,lvl:"6.6.2 · Lesson 6",name:"Uses and dangers of electromagnetic waves",icon:"xray",
 eyebrow:eb("6.6.2.3–6.6.2.4 Properties and uses of electromagnetic waves",6),title:"Uses and dangers of electromagnetic waves",

 outcomes:[["Give practical applications of each type of electromagnetic wave","6.6.2.4"],["Explain why each type of EM wave is suitable for its application","6.6.2.4"],["Describe the hazards of ultraviolet, X-rays and gamma rays, and that radiation dose is a measure of risk","6.6.2.3"]],
 blocks:[
  B.text("Uses",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Wave</th><th>Uses</th></tr></thead><tbody><tr><td>Radio waves</td><td>Television and radio</td></tr><tr><td>Microwaves</td><td>Satellite communications, cooking food</td></tr><tr><td>Infrared</td><td>Electrical heaters, cooking food, infrared cameras</td></tr><tr><td>Visible light</td><td>Fibre optic communications</td></tr><tr><td>Ultraviolet</td><td>Energy-efficient lamps, sun tanning</td></tr><tr><td>X-rays and gamma rays</td><td>Medical imaging and treatments</td></tr></tbody></table></div>`),
  B.sim("phys-wa6-sim","Which wave for which job?",stage,panel,`<span>Match the properties of the wave to the job</span>`),

  B.check([

   {q:"What can excessive exposure to ultraviolet cause?",opts:["Broken bones","Premature skin ageing and skin cancer","Radio interference","Hypothermia"],a:1,why:"UV damages skin cells."},
   {q:"Which types of EM radiation are ionising?",opts:["Radio and microwaves","Infrared and visible","X-rays and gamma rays","All of them"],a:2,why:"X-rays and gamma rays (and higher-energy UV) are ionising."},
   {q:"What does radiation dose measure?",opts:["The frequency of the radiation","The risk of harm from exposure to radiation","The speed of the radiation","The half-life"],a:1,why:"Dose in sieverts measures risk of harm."}]),

<script>
LEARN.unit="phys-magnet";

/* MG1: magnets and magnetic fields */
(()=>{
const {$,fx,svgPt}=LAB, {B,lesson}=LEARN, {eb}=G;
const st={mode:"one",flip:false,cx:640,cy:120};
/* magnetic poles as point charges for field calculation: list [x,y,q] (q>0 north) */
const poles=()=>{
  if(st.mode==="one") return [[330,160,1],[470,160,-1]];
  return st.flip?[[150,160,-1],[290,160,1],[510,160,1],[650,160,-1]]:[[150,160,-1],[290,160,1],[510,160,-1],[650,160,1]]; };
function Bf(x,y){ let bx=0,by=0; poles().forEach(([px,py,q])=>{ const dx=x-px, dy=y-py, r2=dx*dx+dy*dy+30, r=Math.sqrt(r2); bx+=q*dx/(r2*r); by+=q*dy/(r2*r); }); return [bx,by]; }
function trace(x,y,dir){ const pts=[[x,y]]; for(let i=0;i<500;i++){ const [bx,by]=Bf(x,y), m=Math.hypot(bx,by); if(m<1e-12) break; x+=dir*4*bx/m; y+=dir*4*by/m; pts.push([x,y]); if(x<0||x>800||y<-20||y>340) break; if(poles().some(([px,py])=>Math.hypot(x-px,y-py)<6)) break; } return pts; }
const stage=`<svg id="phys-mg1" viewBox="0 0 800 320" style="touch-action:none" role="img" aria-label="Magnetic field lines around bar magnets with a compass you can drag"></svg>`;
const panel=`<div class="field"><div class="lbl">Arrangement</div><div class="seg c2" id="phys-mg1-m"><label class="opt"><input type="radio" name="phys-mg1-m" value="one" checked><span>One magnet</span></label><label class="opt"><input type="radio" name="phys-mg1-m" value="two"><span>Two magnets</span></label></div></div>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer" id="phys-mg1-ff"><input type="checkbox" id="phys-mg1-f" style="width:18px;height:18px;accent-color:var(--accent)"> Turn the second magnet round</label>
<p class="note">Drag the compass around. It points along the field line, towards the south pole.</p><p class="note" id="phys-mg1-msg"></p>`;

lesson({id:"phys-mg1",group:"a",num:1,lvl:"6.7.1 · Lesson 1",name:"Magnets and magnetic fields",icon:"magnet",
 eyebrow:eb("6.7.1 Permanent and induced magnetism, magnetic forces and fields",1),title:"Magnets and magnetic fields",
 intro:"Magnets have two poles and are surrounded by a magnetic field, the region in which they exert forces on other magnets and on magnetic materials. Compasses let us map the field, and show that the Earth itself has one.",
 outcomes:[["Describe the forces between poles, and the difference between permanent and induced magnets","6.7.1.1"],["Describe how to plot the magnetic field pattern of a bar magnet with a compass","6.7.1.2"],["Explain how the behaviour of a compass is evidence that the Earth’s core is magnetic","6.7.1.2"]],
 blocks:[
  B.text("Poles and forces",`<p>The poles of a magnet are the places where the magnetic forces are strongest. When two magnets are brought close together they exert a force on each other: <b>like poles repel</b>, <b>unlike poles attract</b>. These are examples of non-contact forces.</p><ul><li>A <b>permanent magnet</b> produces its own magnetic field.</li><li>An <b>induced magnet</b> is a material that becomes a magnet when it is placed in a magnetic field. Induced magnetism <b>always causes a force of attraction</b>. When removed from the field, an induced magnet loses most or all of its magnetism quickly.</li></ul><p>Magnetic materials: iron, steel, cobalt and nickel.</p>`),
  B.text("Magnetic fields",`<p>The region around a magnet where a force acts on another magnet or on a magnetic material is called the <b>magnetic field</b>. The force between a magnet and a magnetic material is always attractive.</p><ul><li>The strength of the field depends on the distance from the magnet: it is strongest at the poles.</li><li>The direction of the field at any point is the direction of the force that would act on another <b>north pole</b> placed there. So field lines go from <b>north to south</b>.</li><li>A magnetic compass contains a small bar magnet. The Earth has a magnetic field; the compass needle points in the direction of the Earth’s magnetic field.</li></ul><p>To plot a field, place a plotting compass near the magnet, mark where the needle points, move the compass to that mark, and repeat. Join the dots to make a field line.</p>`),
  B.sim("phys-mg1-sim","Mapping a magnetic field",stage,panel,`<span>Field lines go from N to S</span><span>Closer lines: stronger field</span>`),
  B.check([
   {q:"Two north poles are brought close together. What happens?",opts:["They attract","They repel","Nothing","They become induced magnets"],a:1,why:"Like poles repel."},
   {q:"In which direction do magnetic field lines point?",opts:["From south to north","From north to south","Clockwise","Towards the nearest pole"],a:1,why:"The direction of the force on a north pole."},
   {q:"An iron nail is held near a magnet and becomes magnetic. What is it called?",opts:["A permanent magnet","An induced magnet","An electromagnet","A compass"],a:1,why:"It is magnetised only while in the field."},
   {q:"Which of these is a magnetic material?",opts:["Copper","Aluminium","Nickel","Brass"],a:2,why:"Iron, steel, cobalt and nickel."},
   {q:"Where is the magnetic field of a bar magnet strongest?",opts:["In the middle","At the poles","Far away","It is the same everywhere"],a:1,why:"Field lines are closest together at the poles."},
   {q:"What does a compass needle show when it is far from any magnets?",opts:["Nothing: it spins","The direction of the Earth’s magnetic field","The direction of the Sun","The strongest wind"],a:1,why:"Evidence that the Earth’s core is magnetic."}]),
  B.keypoints(["Like poles repel; unlike poles attract. Induced magnetism always attracts.","Field lines go from N to S; strongest at the poles.","A compass points along the field; the Earth has a magnetic field."]),
  B.mistakes(["Drawing field lines from S to N.","Saying induced magnets can repel.","Saying all metals are magnetic."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-mg1"); if(!s) return; let g=""; const P=poles();
  P.forEach(([px,py,q])=>{ if(q<0) return; for(let k=0;k<12;k++){ const a=k*Math.PI/6+Math.PI/12; const pts=trace(px+8*Math.cos(a),py+8*Math.sin(a),1); g+=`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" class="mut" stroke-width="1.3"/>`; const m=pts[Math.floor(pts.length/2)], n=pts[Math.floor(pts.length/2)+1]; if(n){ const ang=Math.atan2(n[1]-m[1],n[0]-m[0])*180/Math.PI; g+=`<path d="M0 0 L-8 -4 L-8 4z" class="fmut" transform="translate(${m[0].toFixed(1)} ${m[1].toFixed(1)}) rotate(${ang.toFixed(1)})"/>`; } } });
  const mag=(x1,x2,flip)=>{ const nL=flip; return `<rect x="${x1}" y="145" width="${(x2-x1)/2}" height="30" style="fill:${nL?"#d6533c":"#3a7bd5"}"/><rect x="${(x1+x2)/2}" y="145" width="${(x2-x1)/2}" height="30" style="fill:${nL?"#3a7bd5":"#d6533c"}"/><text x="${x1+12}" y="166" font-size="14" font-weight="700" style="fill:#fff">${nL?"N":"S"}</text><text x="${x2-22}" y="166" font-size="14" font-weight="700" style="fill:#fff">${nL?"S":"N"}</text>`; };
  /* draw magnet bodies from pole positions */
  for(let i=0;i<P.length;i+=2){ const [x1,,q1]=P[i], [x2]=P[i+1]; g+=mag(x1-20,x2+20,q1>0); }
  const [bx,by]=Bf(st.cx,st.cy), ang=Math.atan2(by,bx)*180/Math.PI;
  g+=`<g id="phys-mg1-c" style="cursor:grab" transform="translate(${st.cx} ${st.cy})"><circle r="20" class="fpan ink" stroke-width="2"/><g transform="rotate(${ang.toFixed(1)})"><path d="M0 -5 L16 0 L0 5z" style="fill:#d6533c"/><path d="M0 -5 L-16 0 L0 5z" class="fmut"/></g><circle r="2" class="fink"/></g>`;
  s.innerHTML=g; $("#phys-mg1-ff").style.display=st.mode==="two"?"flex":"none";
  $("#phys-mg1-msg").textContent=st.mode==="one"?"The compass needle’s red end (its north pole) points away from the magnet’s N pole and towards its S pole.":st.flip?"Like poles facing: the field lines push apart and there is a neutral point between the magnets. The magnets repel.":"Unlike poles facing: field lines join across the gap. The magnets attract."; }
let drag=false; const svg=()=>$("#phys-mg1");
document.addEventListener("pointerdown",e=>{ if(e.target.closest("#phys-mg1-c")){ drag=true; e.preventDefault(); } });
document.addEventListener("pointermove",e=>{ if(!drag) return; const p=svgPt(svg(),e); st.cx=Math.max(20,Math.min(780,p.x)); st.cy=Math.max(20,Math.min(300,p.y)); draw(); });
document.addEventListener("pointerup",()=>{ drag=false; });
$("#phys-mg1").addEventListener("click",e=>{ if(e.target.closest("#phys-mg1-c")) return; const p=svgPt(svg(),e); st.cx=p.x; st.cy=p.y; draw(); });
$("#phys-mg1-m").addEventListener("change",e=>{ st.mode=e.target.value; draw(); });
$("#phys-mg1-f").addEventListener("change",e=>{ st.flip=e.target.checked; draw(); });
})();


</script>
<script>
LEARN.unit="phys-magnet";

/* MG2: electromagnetism, solenoids and electromagnets */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb}=G;
const st={view:"wire",I:3,n:10,core:false};
const stage=`<svg id="phys-mg2" viewBox="0 0 800 320" role="img" aria-label="Magnetic field around a current-carrying wire or solenoid"></svg>`;
const panel=`<div class="field"><div class="lbl">Conductor</div><div class="seg c2" id="phys-mg2-v"><label class="opt"><input type="radio" name="phys-mg2-v" value="wire" checked><span>Straight wire</span></label><label class="opt"><input type="radio" name="phys-mg2-v" value="sol"><span>Solenoid</span></label></div></div>
<div class="field"><div class="lbl">Current <b id="phys-mg2-Il"></b></div><input type="range" id="phys-mg2-I" min="-5" max="5" step="1" value="3" aria-label="Current"></div>
<div class="field" id="phys-mg2-nf"><div class="lbl">Number of turns <b id="phys-mg2-nl"></b></div><input type="range" id="phys-mg2-n" min="5" max="30" step="5" value="10" aria-label="Turns"></div>
<label id="phys-mg2-cf" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="phys-mg2-c" style="width:18px;height:18px;accent-color:var(--accent)"> Iron core</label>
<div class="readout"><div><span>Field strength (relative)</span><b id="phys-mg2-B">—</b></div><div><span id="phys-mg2-xt">Paper clips lifted</span><b id="phys-mg2-x">—</b></div></div><p class="note" id="phys-mg2-msg"></p>`;

lesson({id:"phys-mg2",group:"a",num:2,lvl:"6.7.2 · Lesson 2",name:"Electromagnetism",icon:"solenoid",
 eyebrow:eb("6.7.2.1 Electromagnetism",2),title:"Electromagnetism",
 intro:"An electric current produces a magnetic field. Coiling the wire into a solenoid concentrates the field, and adding an iron core makes a strong electromagnet that can be switched on and off.",
 outcomes:[["Describe the magnetic field around a current-carrying wire, and how its strength depends on current and distance","6.7.2.1"],["Describe the field of a solenoid and how an iron core increases it","6.7.2.1"],["Interpret diagrams of electromagnetic devices and explain how they work","6.7.2.1"]],
 blocks:[
  B.text("Field around a wire",`<p>When a current flows through a conducting wire, a magnetic field is produced around the wire. The field lines are <b>concentric circles</b>. The strength of the field depends on the <b>current</b> through the wire and the <b>distance</b> from the wire: it is stronger with a larger current and closer to the wire.</p><p>The direction follows the <b>right-hand grip rule</b>: point your right thumb in the direction of the conventional current; your fingers curl in the direction of the field.</p>`),
  B.text("Solenoids and electromagnets",`<p>Shaping a wire to form a <b>solenoid</b> increases the strength of the magnetic field. The field inside a solenoid is <b>strong and uniform</b>; outside, it has a similar shape to that of a bar magnet.</p><p>Adding an <b>iron core</b> increases the strength of the field of a solenoid. A solenoid with an iron core is an <b>electromagnet</b>. The field strength also increases with more turns and a larger current.</p><p>Electromagnets are used in electric bells, relays, circuit breakers, scrap-yard cranes and door locks, because the magnetism can be switched on and off.</p>`),
  B.sim("phys-mg2-sim","Fields from currents",stage,panel,`<span>⊙ current out of the screen · ⊗ current into the screen</span>`),
  B.check([
   {q:"What shape are the magnetic field lines around a straight current-carrying wire?",opts:["Straight lines","Concentric circles","Spirals","Like a bar magnet"],a:1,why:"Concentric circles centred on the wire."},
   {q:"How does the field strength change as you move away from the wire?",opts:["Increases","Decreases","Stays the same","Reverses"],a:1,why:"The field is weaker further from the wire."},
   {q:"Which change would NOT make an electromagnet stronger?",opts:["More turns","Larger current","Adding an iron core","Reversing the current"],a:3,why:"Reversing the current swaps the poles but does not change the strength."},
   {q:"What is the magnetic field like inside a long solenoid?",opts:["Zero","Strong and uniform","Weak and circular","Strongest at the ends"],a:1,why:"Parallel, evenly spaced field lines."},
   {q:"Why are electromagnets used in scrap-yard cranes rather than permanent magnets?",opts:["They are lighter","They can be switched off to drop the load","They work on aluminium","They need no electricity"],a:1,why:"Switching off the current releases the scrap."}]),
  B.keypoints(["Current in a wire ⇒ circular magnetic field; stronger with more current and nearer the wire.","Solenoid: strong uniform field inside, bar-magnet shape outside.","Electromagnet = solenoid + iron core; stronger with more turns and more current."]),
  B.mistakes(["Using the left hand for the grip rule.","Thinking that reversing the current weakens the field.","Saying the iron core is a permanent magnet."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-mg2"); if(!s) return; const I=st.I; let g="";
  $("#phys-mg2-nf").style.display=st.view==="sol"?"block":"none"; $("#phys-mg2-cf").style.display=st.view==="sol"?"flex":"none";
  if(st.view==="wire"){ const cx=400, cy=160; if(I!==0){ for(let r=30;r<=150;r+=Math.max(14,40/Math.abs(I)*3)){ g+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(0)}" fill="none" class="mut" stroke-width="${Math.max(.6,2.2-r/80)}"/>`; const a=-Math.PI/2, x=cx+r, y=cy, dir=I>0?-1:1; g+=`<path d="M0 0 L-8 -4 L-8 4z" class="fmut" transform="translate(${x} ${y}) rotate(${dir>0?90:-90})"/>`; } }
    g+=`<circle cx="${cx}" cy="${cy}" r="16" class="fpan ink" stroke-width="2.5"/>`+(I>0?`<circle cx="${cx}" cy="${cy}" r="4" class="fink"/>`:I<0?`<path d="M${cx-8} ${cy-8} L${cx+8} ${cy+8} M${cx+8} ${cy-8} L${cx-8} ${cy+8}" class="ink" stroke-width="2.5"/>`:"");
    g+=`<text x="${cx}" y="300" text-anchor="middle" font-size="13" class="tm">${I>0?"Current out of the screen: field anticlockwise":I<0?"Current into the screen: field clockwise":"No current: no field"}</text>`;
    $("#phys-mg2-xt").textContent="Field 5 cm from the wire"; $("#phys-mg2-x").textContent=fx(Math.abs(I)/5,2)+" ×"; $("#phys-mg2-B").textContent=fx(Math.abs(I),1);
    $("#phys-mg2-msg").textContent="Double the current and the field doubles. Further from the wire the circles are more widely spaced: a weaker field."; }
  else { const n=st.n, x1=240, x2=560, cy=160, k=st.core?40:1, Bv=Math.abs(I)*n*k/10;
    if(st.core) g+=`<rect x="${x1-10}" y="${cy-28}" width="${x2-x1+20}" height="56" fill="#8a929a" opacity=".6"/>`;
    for(let i=0;i<n;i++){ const x=x1+(i+.5)*(x2-x1)/n; g+=`<ellipse cx="${x.toFixed(1)}" cy="${cy}" rx="5" ry="48" fill="none" class="acc" stroke-width="2.4"/>`; }
    if(I!==0){ const N=I>0; [-30,-15,0,15,30].forEach(dy=>{ g+=`<path d="M${x1-40} ${cy+dy} H${x2+40}" class="dat" stroke-width="1.5"/>`; g+=`<path d="M0 0 L-8 -4 L-8 4z" class="fdat" transform="translate(${N?x2+40:x1-40} ${cy+dy}) rotate(${N?0:180})"/>`; });
      [60,90].forEach(h=>{ g+=`<path d="M${x2+40} ${cy-15} C${x2+140} ${cy-h-60}, ${x1-140} ${cy-h-60}, ${x1-40} ${cy-15}" fill="none" class="dat" stroke-width="1.2"/><path d="M${x2+40} ${cy+15} C${x2+140} ${cy+h+60}, ${x1-140} ${cy+h+60}, ${x1-40} ${cy+15}" fill="none" class="dat" stroke-width="1.2"/>`; });
      g+=`<text x="${x2+60}" y="${cy+6}" font-size="22" font-weight="700" style="fill:${N?"#d6533c":"#3a7bd5"}">${N?"N":"S"}</text><text x="${x1-80}" y="${cy+6}" font-size="22" font-weight="700" style="fill:${N?"#3a7bd5":"#d6533c"}">${N?"S":"N"}</text>`; }
    const clips=Math.min(20,Math.floor(Bv/2)); for(let i=0;i<clips;i++) g+=`<path d="M${370+(i%10)*8} ${250+Math.floor(i/10)*14} h5 v10 h-4 v-7" fill="none" class="ink" stroke-width="1.5"/>`;
    $("#phys-mg2-xt").textContent="Paper clips lifted"; $("#phys-mg2-x").textContent=clips; $("#phys-mg2-B").textContent=fx(Bv,1);
    $("#phys-mg2-msg").textContent=st.core?"The iron core becomes an induced magnet, greatly strengthening the field.":"More turns or more current makes the field stronger. Try adding an iron core."; }
  s.innerHTML=g; $("#phys-mg2-Il").textContent=`${I} A`; $("#phys-mg2-nl").textContent=st.n; }
$("#phys-mg2-v").addEventListener("change",e=>{ st.view=e.target.value; draw(); });
$("#phys-mg2-I").addEventListener("input",e=>{ st.I=+e.target.value; draw(); });
$("#phys-mg2-n").addEventListener("input",e=>{ st.n=+e.target.value; draw(); });
$("#phys-mg2-c").addEventListener("change",e=>{ st.core=e.target.checked; draw(); });
})();


</script>
<script>

/* MG3: the motor effect and F = BIl (HT) */
(()=>{

const st={B:0.5,I:3,l:0.1,flipB:false};

 outcomes:[["Describe the motor effect: a force on a conductor carrying a current in a magnetic field","6.7.2.2"],["Use Fleming’s left-hand rule to find the direction of the force","6.7.2.2"],["Use F = BIl and recall the factors that affect the size of the force","6.7.2.2"]],
 blocks:[
  B.text("The motor effect",`<p>When a conductor carrying a current is placed in a magnetic field, the magnet producing the field and the conductor exert a force on each other. This is called the <b>motor effect</b>.</p><p>The direction of the force is given by <b>Fleming’s left-hand rule</b>. The force is at right angles to both the field and the current. Reversing either the current or the field reverses the force. There is no force if the wire is parallel to the field.</p>`,B.fig(flhr,"Fleming’s left-hand rule.")),
  B.text("Size of the force",`<p>For a conductor at right angles to a magnetic field and carrying a current:</p>`+B.eq(`${v("F")} = ${v("B")}${v("I")}${v("l")} ${S}`,`<small>F = force (N), B = magnetic flux density (tesla, T), I = current (A), l = length of conductor in the field (m)</small>`)),
  B.sim("phys-mg3-sim","Force on a current-carrying wire",stage,panel,`<span>Field lines go from N to S</span><span>⊙ current out of the screen · ⊗ into the screen</span>`),

   {q:"In Fleming’s left-hand rule, what does the first finger represent?",opts:["Current","Force","Field","Voltage"],a:2,why:"First finger = Field."},
   {q:"What happens to the force if both the current and the field are reversed?",opts:["It reverses","It stays in the same direction","It becomes zero","It doubles"],a:1,why:"Reversing both cancels out."},
   {q:"When is there no force on a current-carrying wire in a magnetic field?",opts:["When the wire is at right angles to the field","When the wire is parallel to the field","When the current is large","Never"],a:1,why:"The force is greatest at 90° and zero when parallel."}]),
  B.keypoints(["Motor effect: force on a current-carrying conductor in a magnetic field.","Fleming’s left-hand rule: First finger Field, seCond finger Current, thuMb Motion.","F = BIl (equation sheet); B in tesla."]),

  if(F>0) g+=arr(cx,cy+(up?-28:28),cx,cy+(up?-28-Math.min(100,F*300):28+Math.min(100,F*300)),"acc","",5);

  s.innerHTML=g; $("#phys-mg3-Bl").textContent=`${fx(st.B,1)} T`; $("#phys-mg3-Il").textContent=`${st.I} A`; $("#phys-mg3-ll").textContent=`${fx(st.l,2)} m`; $("#phys-mg3-F").textContent=`${fx(F,3)} N`; $("#phys-mg3-d").textContent=F>0?(up?"up":"down"):"—"; }
$("#phys-mg3-B").addEventListener("input",e=>{ st.B=+e.target.value; draw(); });

/* ---------- local progress bundle ---------- */
function gather(){ const o={}; raw.keys().filter(isSync).forEach(k=>{ try{ o[k]=JSON.parse(raw.get(k)); }catch(e){} }); return o; }

/* merge two bundles so that no progress is lost */
function merge(a,b){ a=a||{}; b=b||{}; const out={...b,...a};
  const D="learn-gcse-combined-motion-done"; if(a[D]||b[D]) out[D]=[...new Set([...(b[D]||[]),...(a[D]||[])])];
  const C="learn-gcse-combined-check-state", rank={ok:3,shown:2,no:1}; if(a[C]||b[C]){ const m={...(b[C]||{})}; Object.entries(a[C]||{}).forEach(([k,v])=>{ if(!m[k]||(rank[v]||0)>(rank[m[k]]||0)) m[k]=v; }); out[C]=m; }
  const E="learn-gcse-combined-motion-exam"; if(a[E]||b[E]){ const sc=s=>!s||!s.done?-1:(s.t?s.t.filter(Boolean).length:0)+(+s.v||0)+(s.c!=null?1:0); const m={...(b[E]||{})};
    Object.entries(a[E]||{}).forEach(([k,v])=>{ const w=m[k]; if(!w||sc(v)>sc(w)||(sc(v)===sc(w)&&(v.w||"").length>(w.w||"").length)) m[k]=v; }); out[E]=m; }
  const A="learn-gcse-combined-activity"; if(a[A]||b[A]){ const x=a[A]||{}, y=b[A]||{}, r={time:{},first:{},last:{},days:[]};
    new Set([...Object.keys(x.time||{}),...Object.keys(y.time||{})]).forEach(id=>{ r.time[id]=Math.max((x.time||{})[id]||0,(y.time||{})[id]||0);
      const f=[(x.first||{})[id],(y.first||{})[id]].filter(Boolean).sort(); if(f[0]) r.first[id]=f[0];
      const l=[(x.last||{})[id],(y.last||{})[id]].filter(Boolean).sort(); if(l.length) r.last[id]=l[l.length-1]; });
    r.days=[...new Set([...(x.days||[]),...(y.days||[])])].sort(); out[A]=r; }
  const plain=o=>o&&typeof o==="object"&&!Array.isArray(o);
  Object.keys(out).forEach(k=>{ if(SPECIAL.has(k)||!(k in a)||!(k in b)) return;
    if(plain(a[k])&&plain(b[k])) out[k]={...b[k],...a[k]}; else if(Array.isArray(a[k])&&Array.isArray(b[k])) out[k]=a[k].length>=b[k].length?a[k]:b[k]; });
  return out; }

/* ---------- push / pull ---------- */
const origSet=store.set.bind(store);
store.set=(k,v)=>{ origSet(k,v); if(user&&isSync(k)){ dirty=true; if(!pushT) pushT=setTimeout(()=>{ pushT=null; push(); },4000); } };
async function push(){ if(!user||!dirty) return; dirty=false; const data=gather();
  const {error}=await sb.from("progress").upsert({user_id:user.id,site:SITE,data,updated_at:new Date().toISOString()},{onConflict:"user_id,site"});
  if(error){ dirty=true; showSync("Not saved yet: will retry"); } else { lastSync=new Date(); showSync(); } }
setInterval(()=>{ if(dirty) push(); },60000);
window.addEventListener("pagehide",()=>{ if(dirty) push(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&dirty) push(); });

async function pull(){ const {data,error}=await sb.from("progress").select("data,updated_at").eq("user_id",user.id).eq("site",SITE).maybeSingle();
  if(error) return false; const server=(data&&data.data)||{}; const owner=raw.get(OWNER);
  const local=owner&&owner!==user.id?{}:gather(); const merged=merge(local,server);
  const changedLocal=JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(gather()))||owner!==user.id;
  if(JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(server))){ await sb.from("progress").upsert({user_id:user.id,site:SITE,data:merged,updated_at:new Date().toISOString()},{onConflict:"user_id,site"}); }
  writeAll(merged); raw.set(OWNER,user.id); lastSync=new Date();
  return changedLocal; }

async function codeInfo(v){ const {data}=await sb.rpc("class_info",{class_code:v}); if(!data) throw new Error("That class code was not recognised. Check it with your teacher.");
  if(data.site!==SITE){ const o=SITES[data.site]||["another course",""]; throw new Error(`That code is for a ${o[0]} class. Use it on ${o[1]} — your username and password work there too.`); } return data; }

const email=u=>`${u.trim().toLowerCase()}@${DOMAIN}`;
function nice(err){ const m=(err&&err.message)||String(err||""); if(/invalid login/i.test(m)) return "Username or password is not right."; if(/already registered|already exists/i.test(m)) return "That username is already taken. Try another."; if(/invalid teacher code/i.test(m)) return "The teacher code was not accepted."; if(/invalid class code/i.test(m)) return "The class code was not accepted. Check it with your teacher."; if(/invalid username/i.test(m)) return "Usernames are 3–30 characters: letters, numbers, dots, dashes or underscores."; if(/database error/i.test(m)) return mode==="teacher"?"The teacher code was not accepted.":"The class code was not accepted. Check it with your teacher."; if(/rate limit|too many/i.test(m)) return "Too many attempts from this network. Wait a minute and try again."; if(/fetch|network/i.test(m)) return "Could not reach the server. Check your internet connection."; return m; }
async function submit(e){ e.preventDefault(); const f=e.target, err=$("#acc-e"), btn=f.querySelector('button[type="submit"]'); const v=n=>(f.elements[n]?f.elements[n].value:"").trim(); err.textContent="";
  const u=v("u").toLowerCase(); if(!/^[a-z0-9._-]{3,30}$/.test(u)){ err.textContent="Usernames are 3–30 letters, numbers, dots, dashes or underscores."; return; }
  btn.disabled=true;
  try{
    if(mode==="in"){ const {error}=await sb.auth.signInWithPassword({email:email(u),password:f.elements.p.value}); if(error) throw error; }

function stats(d){ d=d||{}; const done=new Set((d["learn-gcse-combined-motion-done"]||[]).filter(id=>lessonIds.has(id))), cs=d["learn-gcse-combined-check-state"]||{}, ex=d["learn-gcse-combined-motion-exam"]||{}, act=d["learn-gcse-combined-activity"]||{};

  units.forEach(u=>R.unit[u.key]={n:0,done:0,cok:0,cq:0,em:0,emk:0,title:u.title});
