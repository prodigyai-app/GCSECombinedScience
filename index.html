/* AN1: pure substances and formulations */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field}=CH;
const S=[["Pure water","pure",[100,100],0],["Sea water","impure",[100.6,103],0],["Pure ethanoic acid","pure",[118,118],0],["Shop-bought 'pure' orange juice","impure",[100.5,102],0],["Pure aspirin","pure",[136,136],1],["Impure aspirin","impure",[128,134],1]];
const stage=`<svg id="chem-an1-svg" class="chsvg" viewBox="0 0 560 280" role="img" aria-label="Heating curve"></svg>`;
const panel=field("Sample",sel("chem-an1-s",S.map((s,i)=>[String(i),s[0]]),"0"))+CH.ro([["chem-an1-t","Melting or boiling"],["chem-an1-p","Chemically pure?"]]);
lesson({id:"chem-an1",group:"a",num:1,lvl:"5.8.1 · Lesson 1",name:"Pure substances and formulations",icon:"pure",
 eyebrow:eb("5.8.1.1–5.8.1.2 Pure substances; formulations",1),title:"Pure substances and formulations",
 intro:"In everyday language 'pure' means nothing added. In chemistry, a pure substance is a single element or compound, and you can test for it: a pure substance melts and boils at one fixed temperature.",
 outcomes:[["Explain what a pure substance is in chemistry and how it differs from everyday use","5.8.1.1"],["Use melting and boiling point data to distinguish pure from impure substances","5.8.1.1"],["Identify formulations given appropriate information","5.8.1.2"]],
 blocks:[
  B.text("Pure in chemistry",`<p>In chemistry, a <b>pure substance</b> is a single element or compound, not mixed with any other substance. Pure elements and compounds melt and boil at <b>specific temperatures</b>. Melting point and boiling point data can be used to distinguish pure substances from mixtures: impurities usually <b>lower the melting point</b> and make it melt over a <b>range</b> of temperatures, and raise the boiling point.</p><p>In everyday language, a pure substance can mean a substance that has had nothing added to it, so it is unadulterated and in its natural state, e.g. pure milk.</p>`),
  B.sim("chem-an1-sim","Is it pure?",stage,panel,`<span>Pure: sharp, fixed temperature</span><span>Impure: over a range</span>`),
  B.text("Formulations",`<p>A <b>formulation</b> is a mixture that has been designed as a useful product. Many products are complex mixtures in which each chemical has a particular purpose. Formulations are made by mixing the components in carefully measured quantities to ensure that the product has the required properties.</p><p>Formulations include <b>fuels, cleaning agents, paints, medicines, alloys, fertilisers and foods</b>. For example, a paint contains a pigment (colour), a binder (sticks it to the surface), a solvent (makes it spread) and additives.</p>`),
  B.check([
   {q:"What is a pure substance in chemistry?",opts:["A natural substance with nothing added","A single element or compound","Any substance that is safe to eat","A mixture with a fixed recipe"],a:1,why:"Not mixed with anything else."},
   {q:"A sample melts between 72 °C and 76 °C. What does this suggest?",opts:["It is pure","It is impure","It is a gas","It is an element"],a:1,why:"Impure substances melt over a range."},
   {q:"Which of these is a formulation?",opts:["Distilled water","Paint","Copper","Oxygen"],a:1,why:"A mixture designed as a useful product."},
   {q:"Pure water boils at 100 °C. A sample boils at 102 °C. What does this suggest?",opts:["It is pure water","It contains a dissolved impurity","The thermometer is broken","It is a different element"],a:1,why:"Impurities raise the boiling point."},
   {q:"Why are the components of a formulation measured carefully?",opts:["To make it cheaper","So the product has the required properties","To make it pure","So it reacts quickly"],a:1,why:"Each component has a purpose and amount."}]),
  B.keypoints(["Pure: single element or compound; sharp melting and boiling points.","Impurities: lower mp (over a range), raise bp.","Formulation: designed mixture, components in measured quantities (paints, medicines, fuels, alloys, foods, fertilisers, cleaning agents)."]),
  B.mistakes(["Using the everyday meaning of 'pure' in a chemistry answer.","Saying a formulation is a pure substance.","Saying impurities raise the melting point."])
 ],onShow:()=>draw()});
function draw(){ const s=S[+$("#chem-an1-s").value], [a,b]=s[2], X=t=>60+t/60*480, Y=T=>250-(T-(s[3]?60:20))/(s[3]?100:100)*220; let d="";
  const tA=20, tB=tA+(s[1]==="pure"?20:20); const base=s[3]?60:20;
  const pts=[[0,base],[tA,a],[tB,b],[tB+18,b+(s[3]?20:15)]]; d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  $("#chem-an1-svg").innerHTML=`<line x1="60" y1="20" x2="60" y2="250" class="ink" stroke-width="1.5"/><line x1="60" y1="250" x2="540" y2="250" class="ink" stroke-width="1.5"/><text x="300" y="272" text-anchor="middle" font-size="12">time heated</text><text x="16" y="135" font-size="12" transform="rotate(-90 16 135)" text-anchor="middle">temperature / °C</text><path d="${d}" fill="none" class="dat" stroke-width="3"/><line x1="60" y1="${Y(a)}" x2="${X(tA)}" y2="${Y(a)}" class="mut" stroke-dasharray="4 4"/><text x="54" y="${Y(a)+4}" text-anchor="end" font-size="11">${a}</text>${b!==a?`<line x1="60" y1="${Y(b)}" x2="${X(tB)}" y2="${Y(b)}" class="mut" stroke-dasharray="4 4"/><text x="54" y="${Y(b)+4}" text-anchor="end" font-size="11">${b}</text>`:""}<text x="${X((tA+tB)/2)}" y="${Math.min(Y(a),Y(b))-14}" text-anchor="middle" font-size="12">${s[1]==="pure"?"flat: fixed temperature":"rises during the change: a range"}</text>`;
  set("chem-an1-t",a===b?`${s[3]?"melts":"boils"} at exactly ${a} °C`:`${s[3]?"melts":"boils"} from ${a} to ${b} °C`); set("chem-an1-p",s[1]==="pure"?`<span class="pill ok">Pure</span>`:`<span class="pill no">Mixture</span>`); }
$("#chem-an1-s").addEventListener("change",draw); draw();
})();

</script>
<script>
LEARN.unit="chem-analysis";

/* AN2: chromatography and Rf values (RP12) */
(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,set,loop}=CH, {res,fr}=LAB.W;
const D={A:[.72,"#e3b81f"],B:[.45,"#d63a8a"],C:[.25,"#3a7bd6"],D:[.58,"#3fb37a"]};
const LANES=[["A",["A"]],["B",["B"]],["C",["C"]],["D",["D"]],["X",["B","C","A"]],["Y",["D","C"]]];
const st={p:0,run:false};
const stage=`<svg id="chem-an2-svg" class="chsvg" viewBox="0 0 520 360" role="img" aria-label="Chromatogram"></svg>`;
const panel=`<div class="btnrow"><button class="btn primary" id="chem-an2-go">Run the chromatogram</button><button class="btn" id="chem-an2-re">Reset</button></div>`+CH.ro([["chem-an2-sf","Solvent front"],["chem-an2-x","Mixture X contains"],["chem-an2-y","Mixture Y contains"]])+`<p class="note">Distances are measured from the pencil start line. Click a spot to measure its R<sub>f</sub> value.</p><div id="chem-an2-rf" class="readout c1" style="grid-template-columns:1fr"><div><span>R<sub>f</sub> of chosen spot</span><b>—</b></div></div>`;
lesson({id:"chem-an2",group:"a",num:2,lvl:"5.8.1 · Lesson 2",name:"Chromatography",icon:"chrom",
 eyebrow:eb("5.8.1.3 Chromatography · Required practical 12",2),title:"Chromatography and R<sub>f</sub> values",
 intro:"Paper chromatography separates the substances in a mixture by how far they travel up the paper with a solvent. Measuring R<sub>f</sub> values lets you identify each substance by comparing it with known ones.",
 outcomes:[["Explain how paper chromatography separates mixtures using the stationary and mobile phases","5.8.1.3"],["Calculate R<sub>f</sub> values and use them to identify substances","5.8.1.3"],["Explain how chromatography distinguishes pure substances from impure ones","5.8.1.3"]],
 blocks:[
  B.text("How it works",`<p>Chromatography involves a <b>stationary phase</b> (the paper) and a <b>mobile phase</b> (the solvent). Separation depends on the distribution of substances between the phases: a substance that is more attracted to the solvent (more soluble) travels further.</p>`+B.eq(`R<sub>f</sub> = ${fr("distance moved by substance","distance moved by solvent")}`)+`<p>Different compounds have different R<sub>f</sub> values in different solvents, which can be used to help identify the compounds. A <b>pure</b> compound produces a <b>single spot</b> in all solvents; the compounds in a mixture may separate into different spots depending on the solvent.</p><p>In <b>RP12</b>, Required practical 12, draw the start line in <b>pencil</b> (insoluble, so it does not run), keep the spots above the solvent level, and cover the beaker so the solvent does not evaporate.</p>`),
  B.sim("chem-an2-sim","Run a chromatogram",stage,panel,`<span>Stationary phase: paper</span><span>Mobile phase: solvent</span>`),
  B.example("Calculating R<sub>f</sub>","A spot moves 3.6 cm while the solvent moves 8.0 cm. Calculate the R<sub>f</sub> value.",[
   ["Substitute","",[`R<sub>f</sub> = ${fr("3.6","8.0")}`]],
   ["Calculate (no units)","",[res("0.45")]]]),
  B.check([
   {q:"A spot moves 2.4 cm; the solvent front moves 6.0 cm. Calculate R<sub>f</sub>.",a:0.4,unit:"",tol:0.0001,why:"2.4 ÷ 6.0 = 0.40."},
   {q:"Why is the start line drawn in pencil?",opts:["Pencil is easier to see","Graphite is insoluble and will not move up the paper","Pencil dissolves in the solvent","Ink is too expensive"],a:1,why:"Ink would separate too."},
   {q:"A substance gives one spot in three different solvents. What does this suggest?",opts:["It is a mixture","It is pure","It is insoluble","It is a formulation"],a:1,why:"A pure compound gives a single spot."},
   {q:"What is the stationary phase in paper chromatography?",opts:["The solvent","The paper","The ink","The beaker"],a:1,why:"The mobile phase is the solvent."},
   {q:"Why must the spots be above the level of the solvent?",opts:["So they dissolve into the solvent in the beaker instead of moving up","So they do not dissolve into the solvent in the beaker","To make them dry","So they react"],a:1,why:"Otherwise they would wash off into the solvent."}]),
  B.keypoints(["Stationary phase: paper. Mobile phase: solvent.","R<sub>f</sub> = distance by substance ÷ distance by solvent (no units; 0 ≤ Rf ≤ 1).","Pure substance: one spot in all solvents. Identify by matching R<sub>f</sub> values with known substances."]),
  B.mistakes(["Measuring to the top of the paper instead of the solvent front.","Measuring from the bottom of the paper instead of the start line.","Giving R<sub>f</sub> values greater than 1 or with units."])
 ],onShow:()=>draw()});
const F=250, y0=296;
function draw(){ const p=st.p, front=y0-F*p; let g=`<rect x="20" y="20" width="480" height="330" fill="#fbfaf4" stroke="#bbb"/><path d="M30 ${y0}h460" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/><text x="494" y="${y0-6}" text-anchor="end" font-size="11" style="fill:#555">pencil start line</text><rect x="21" y="${Math.max(front,y0)}" width="478" height="${Math.max(0,350-Math.max(front,y0))}" fill="#9cc8e8" opacity=".3"/>`;
  if(p>0) g+=`<path d="M30 ${front}h460" stroke="#2a6fd6" stroke-width="1.2" stroke-dasharray="2 3"/><text x="494" y="${front-4}" text-anchor="end" font-size="11" style="fill:#2a6fd6">solvent front</text>`;
  g+=`<rect x="21" y="${y0+6}" width="478" height="${344-y0}" fill="#9cc8e8" opacity=".5"/>`;
  LANES.forEach(([lab,sp],i)=>{ const x=70+i*76; g+=`<text x="${x}" y="${y0+26}" text-anchor="middle" font-size="13" style="fill:#222;font-weight:700">${lab}</text>`;
    sp.forEach(k=>{ const y=y0-F*p*D[k][0]; g+=`<ellipse data-chem-an2="${k}" cx="${x}" cy="${y}" rx="9" ry="${6+p*3}" fill="${D[k][1]}" style="cursor:pointer"/>`; }); });
  $("#chem-an2-svg").innerHTML=g; set("chem-an2-sf",p?`${(F*p/40).toFixed(1)} cm`:"—");
  if(p>=1){ set("chem-an2-x","A, B and C"); set("chem-an2-y","C and D"); } else { set("chem-an2-x","—"); set("chem-an2-y","—"); } }
loop("chem-an2",dt=>{ if(st.run){ st.p=Math.min(1,st.p+dt/5); draw(); if(st.p>=1) st.run=false; } });
$("#chem-an2-go").addEventListener("click",()=>{ if(st.p>=1) st.p=0; st.run=true; });
$("#chem-an2-re").addEventListener("click",()=>{ st.p=0; st.run=false; draw(); $("#chem-an2-rf b").textContent="—"; });
document.addEventListener("click",e=>{ const s=e.target.closest("[data-chem-an2]"); if(!s||st.p<=0) return; const k=s.dataset.chem-an2, d=F*st.p*D[k][0]/40, sf=F*st.p/40; $("#chem-an2-rf b").innerHTML=`${d.toFixed(1)} cm ÷ ${sf.toFixed(1)} cm = ${(d/sf).toFixed(2)} (dye ${k})`; });
draw();
})();

</script>
<script>
LEARN.unit="chem-analysis";

/* AN3: tests for gases */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field}=CH;
const G=[["H2","hydrogen"],["O2","oxygen"],["CO2","carbon dioxide"],["Cl2","chlorine"]];
const T=[["burn","Hold a burning splint at the mouth of the tube"],["glow","Insert a glowing splint"],["lime","Bubble the gas through limewater"],["litmus","Hold damp blue litmus paper in the gas"]];
const R={H2:{burn:"Squeaky pop: hydrogen burns rapidly with oxygen in the air.",glow:"No relight.",lime:"Stays clear.",litmus:"No change."},O2:{burn:"The splint burns more brightly.",glow:"The glowing splint relights.",lime:"Stays clear.",litmus:"No change."},CO2:{burn:"The flame goes out.",glow:"The splint goes out.",lime:"Limewater turns milky (cloudy) as calcium carbonate forms.",litmus:"Turns slightly red (weakly acidic)."},Cl2:{burn:"Not used: chlorine is toxic.",glow:"Not used.",lime:"Not used.",litmus:"Litmus is bleached white (it may turn red first)."}};
const KEY={H2:"burn",O2:"glow",CO2:"lime",Cl2:"litmus"};
const stage=`<svg id="chem-an3-svg" class="chsvg" viewBox="0 0 520 260" role="img" aria-label="Gas test"></svg>`;
const panel=field("Gas in the tube",sel("chem-an3-g",G.map(g=>[g[0],g[1]]),"H2"))+field("Test",sel("chem-an3-t",T.map(t=>[t[0],t[1]]),"burn"))+`<div class="readout c1" style="grid-template-columns:1fr"><div><span>Result</span><b id="chem-an3-r" style="font-family:var(--f-body);font-weight:500;font-size:.95rem">—</b></div></div><p class="note" id="chem-an3-k"></p>`;
lesson({id:"chem-an3",group:"a",num:3,lvl:"5.8.2 · Lesson 3",name:"Tests for gases",icon:"gastest",
 eyebrow:eb("5.8.2.1–5.8.2.4 Identification of common gases",3),title:"Tests for common gases",
 intro:"Four common gases each have a simple, reliable test. Learn the test and the positive result for each.",
 outcomes:[["Describe the tests and results for hydrogen, oxygen, carbon dioxide and chlorine","5.8.2"],["Choose the right test to identify a gas produced in a reaction","5.8.2"]],
 blocks:[
  B.text("The four tests",`<table class="tbl-mini"><tr><th>Gas</th><th>Test</th><th>Positive result</th></tr><tr><td>Hydrogen</td><td>burning splint held at the open end of a test tube of the gas</td><td>burns rapidly with a <b>pop</b> sound</td></tr><tr><td>Oxygen</td><td>glowing splint inserted into a test tube of the gas</td><td>splint <b>relights</b></td></tr><tr><td>Carbon dioxide</td><td>shake or bubble the gas through limewater (calcium hydroxide solution)</td><td>limewater turns <b>milky</b> (cloudy)</td></tr><tr><td>Chlorine</td><td>damp litmus paper put into the gas</td><td>litmus paper is <b>bleached</b> and turns white</td></tr></table>`),
  B.sim("chem-an3-sim","Test the gas",stage,panel,`<span>One test, one gas</span>`),
  B.check([
   {q:"Which gas relights a glowing splint?",opts:["Hydrogen","Oxygen","Carbon dioxide","Chlorine"],a:1,why:"Oxygen supports combustion."},
   {q:"What is the test for carbon dioxide?",opts:["Squeaky pop","Limewater turns milky","Bleaches litmus","Relights splint"],a:1,why:"Limewater test."},
   {q:"Which gas bleaches damp litmus paper?",opts:["Oxygen","Hydrogen","Chlorine","Carbon dioxide"],a:2,why:"Chlorine is a bleach."},
   {q:"Magnesium reacts with hydrochloric acid. Which test identifies the gas made?",opts:["Glowing splint","Burning splint: squeaky pop","Limewater","Damp litmus"],a:1,why:"Metal + acid gives hydrogen."},
   {q:"Why must the litmus paper be damp in the chlorine test?",opts:["Chlorine dissolves in the water to bleach it","To keep it cool","So it sticks","It does not need to be"],a:0,why:"Chlorine reacts with water to form bleaching substances."}]),
  B.keypoints(["Hydrogen: burning splint → squeaky pop.","Oxygen: glowing splint relights.","Carbon dioxide: limewater turns milky. Chlorine: damp litmus bleached white."]),
  B.mistakes(["Mixing up burning and glowing splints.","Saying limewater goes 'clear' with CO₂.","Using dry litmus paper for chlorine."])
 ],onShow:()=>draw()});
function draw(){ const g=$("#chem-an3-g").value, t=$("#chem-an3-t").value, r=R[g][t], ok=KEY[g]===t;
  let s=`<path d="M100 40v150a25 25 0 0 0 50 0V40" class="ink" fill="none" stroke-width="2.4"/><text x="125" y="250" text-anchor="middle" font-size="13">${G.find(x=>x[0]===g)[1]}</text>`;
  if(g==="Cl2") s+=`<rect x="102" y="50" width="46" height="160" fill="#b6e07a" opacity=".35"/>`;
  if(t==="burn"){ s+=`<path d="M160 30l90 -10" stroke="#c8a165" stroke-width="5"/>${g==="H2"?`<text x="190" y="60" font-size="22" font-weight="700" style="fill:var(--accent)">POP!</text>`:g==="CO2"?"":`<path d="M150 31c-8-10-2-18 0-24c2 6 8 14 0 24z" fill="#f2a63a"/>`}`; }
  if(t==="glow"){ s+=`<path d="M125 120l60 -110" stroke="#c8a165" stroke-width="5"/>${g==="O2"?`<path d="M125 122c-10-12-2-22 0-30c2 8 10 18 0 30z" fill="#f2a63a"/>`:`<circle cx="125" cy="120" r="3" fill="#555"/>`}`; }
  if(t==="lime"){ s+=`<path d="M300 90v110a25 25 0 0 0 50 0V90" class="ink" fill="none" stroke-width="2.4"/><rect x="302" y="140" width="46" height="84" rx="10" fill="${g==="CO2"?"#e9eaea":"#cfe6f5"}" opacity="${g==="CO2"?.95:.5}"/><path d="M150 60h165v150" class="ink" fill="none" stroke-width="2"/><text x="325" y="250" text-anchor="middle" font-size="13">limewater</text>`; }
  if(t==="litmus"){ s+=`<rect x="113" y="60" width="24" height="70" fill="${g==="Cl2"?"#fafafa":g==="CO2"?"#b06090":"#4a6fd0"}" stroke="var(--ink)" stroke-width="1"/>`; }
  s+=`<text x="300" y="40" font-size="14" font-weight="700" style="fill:${ok?"var(--good)":"var(--muted)"}">${ok?"Positive test":"Not the test for this gas"}</text>`;
  $("#chem-an3-svg").innerHTML=s; set("chem-an3-r",r); set("chem-an3-k",ok?"This is the standard test for "+G.find(x=>x[0]===g)[1]+".":"Try the test that matches this gas."); }
["chem-an3-g","chem-an3-t"].forEach(id=>$("#"+id).addEventListener("change",draw)); draw();
})();

</script>
<script>

const T="Exam-style questions", I="Write your answer, then open the mark scheme and tick the marks you earned. Numerical parts can be checked automatically.";

  {q:"<span class=\"ht\">Higher</span> Write the ionic equation for the reaction in solution X.",m:2,lines:1,ms:[["1","Cu²⁺ + 2OH⁻ → Cu(OH)₂"],["1","state symbols (aq), (aq), (s)"]]}]}]});
attach("chem-an5",{title:T,intro:I,qs:[
 {stem:`<p>A white solid is thought to be potassium bromide.</p>`,parts:[
  {q:"Describe a test to show that the solid contains bromide ions. Give the result.",m:3,lines:3,ms:[["1","dissolve in water, add dilute nitric acid"],["1","add silver nitrate solution"],["1","cream precipitate"]]},
  {q:"Describe a test to show that a solution contains sulfate ions. Give the result.",m:3,lines:3,ms:[["1","add dilute hydrochloric acid"],["1","add barium chloride solution"],["1","white precipitate"]]}]}]});
attach("chem-an6",{title:T,intro:I,qs:[
 {stem:`<p>Flame emission spectroscopy is used to analyse a sample of river water.</p>`,parts:[
  {q:"Give two advantages of using flame emission spectroscopy rather than flame tests.",m:2,lines:2,ms:[["1","more accurate / sensitive (small amounts) / rapid"],["1","can identify ions in a mixture / can measure concentration"]]},
  {q:"Explain how the spectrum is used to identify the metal ions present.",m:2,lines:3,ms:[["1","compare the lines with reference spectra of known ions"],["1","each ion gives lines at its own (specific) wavelengths; all lines of an ion must be present"]]}]}]});
attach("chem-an7",{title:T,intro:I,qs:[
 {stem:`<p>A student has three unlabelled solutions: copper(II) sulfate, sodium carbonate and iron(II) chloride.</p>`,parts:[
  {q:"Describe tests that would identify each solution. Give the results.",m:6,lines:10,lor:[["Level 3 (5–6)","Clear tests identifying all three solutions, with correct results and reasoning."],["Level 2 (3–4)","Tests that identify at least two solutions with results."],["Level 1 (1–2)","Some relevant tests or results."],["0","No relevant content."]],ind:["add sodium hydroxide: copper(II) sulfate gives blue precipitate","iron(II) chloride gives green precipitate","sodium carbonate gives no precipitate","flame test: copper green, sodium yellow","add dilute acid: sodium carbonate fizzes, gas turns limewater milky","HCl + BaCl₂: copper(II) sulfate gives white precipitate","HNO₃ + AgNO₃: iron(II) chloride gives white precipitate"]}]}]},sec=>sec.lastElementChild);
})();

<script>
LEARN.unit="chem-atmos";

/* AM1: composition and evolution of the atmosphere */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val}=CH;
/* illustrative model: [bya, CO2, N2, O2, H2O+other] in % */
const K=[[4.4,80,6,0,14],[4.0,70,15,0,15],[3.0,45,45,0,10],[2.4,25,65,2,8],[1.0,8,80,10,2],[0.2,0.5,78,20.5,1],[0,0.04,78,21,0.96]];
const EV=[[4.6,"The Earth forms. For the first billion years, intense volcanic activity releases gases: mainly carbon dioxide, with water vapour, nitrogen and small amounts of methane and ammonia. There is little or no oxygen."],[4.0,"The Earth cools. Water vapour condenses to form the oceans. Carbon dioxide dissolves in the oceans and carbonates precipitate, forming sediments."],[2.7,"Algae and later plants appear and begin to produce oxygen by photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂."],[1.0,"Oxygen gradually builds up, allowing animals to evolve. Carbon dioxide continues to fall: absorbed by plants and algae, and locked up in sedimentary rocks (limestone) and fossil fuels."],[0.2,"For about the last 200 million years the composition has been much as it is today: about four-fifths nitrogen, one-fifth oxygen, and small proportions of other gases."]];
const at=t=>{ for(let i=0;i<K.length-1;i++){ const a=K[i], b=K[i+1]; if(t<=a[0]&&t>=b[0]){ const u=(a[0]-t)/(a[0]-b[0]); return a.slice(1).map((v,k)=>v+(b[k+1]-v)*u); } } return t>4.4?K[0].slice(1):K[K.length-1].slice(1); };
const stage=`<svg id="chem-am1-svg" class="chsvg" viewBox="0 0 560 250" role="img" aria-label="Composition of the atmosphere"></svg>`;
const panel=`<div class="field"><div class="lbl">Time before present <b id="chem-am1-t-l"></b></div><input type="range" id="chem-am1-t" min="0" max="460" step="5" value="0" aria-label="Billions of years ago" style="direction:rtl"></div>`+`<p class="note" id="chem-am1-e"></p><p class="note">Illustrative values: the evidence for the early atmosphere is limited because the time scale is so long (4.6 billion years).</p>`;
lesson({id:"chem-am1",group:"a",num:1,lvl:"5.9.1 · Lesson 1",name:"The Earth's atmosphere",icon:"earth",
 eyebrow:eb("5.9.1.1–5.9.1.4 The proportions of gases in the atmosphere; the Earth's early atmosphere; how oxygen increased and carbon dioxide decreased",1),title:"The composition and evolution of the atmosphere",
 intro:"Today's air is about four-fifths nitrogen and one-fifth oxygen. It was not always like this: the early atmosphere was mostly carbon dioxide, and life itself changed it.",
 outcomes:[["State the proportions of the main gases in today's atmosphere","5.9.1.1"],["Describe one theory of how the early atmosphere formed and how the oceans formed","5.9.1.2"],["Explain how oxygen increased and carbon dioxide decreased","5.9.1.3–5.9.1.4"]],
 blocks:[
  B.text("Today's atmosphere",`<p>For 200 million years, the proportions of different gases in the atmosphere have been much the same as they are today: about <b>four-fifths (approximately 80%) nitrogen</b>, about <b>one-fifth (approximately 20%) oxygen</b>, and small proportions of various other gases, including carbon dioxide, water vapour and noble gases.</p>`),
  B.sim("chem-am1-sim","4.6 billion years of air",stage,panel,`<span>Drag back in time</span>`),
  B.text("How it changed",`<ul><li>The early atmosphere was probably like the atmospheres of Mars and Venus today: mainly <b>carbon dioxide</b> with little or no oxygen, released by volcanoes. Nitrogen may also have been released, and water vapour condensed to form the <b>oceans</b>.</li><li>When the oceans formed, carbon dioxide <b>dissolved</b> in the water and <b>carbonates were precipitated</b>, producing sediments, reducing the amount of carbon dioxide.</li><li><b>Algae and plants</b> produced the oxygen that is now in the atmosphere by <b>photosynthesis</b>. Algae first produced oxygen about 2.7 billion years ago; over the next billion years plants evolved and the oxygen increased to a level that enabled animals to evolve.</li><li>Carbon dioxide was also removed as it was used by algae and plants and locked up in <b>sedimentary rocks</b> such as limestone, and in <b>fossil fuels</b> (coal, crude oil and natural gas) formed from the remains of living things.</li></ul>`),
  B.check([
   {q:"What is the approximate percentage of nitrogen in today's atmosphere?",a:79,show:"78–80",unit:"%",tol:0,abs:1,why:"About 78–80%, or four-fifths."},
   {q:"Which gas made up most of the Earth's early atmosphere?",opts:["Oxygen","Nitrogen","Carbon dioxide","Argon"],a:2,why:"Released by volcanic activity."},
   {q:"How were the oceans formed?",opts:["Water vapour condensed as the Earth cooled","Ice comets melted only","Photosynthesis","Rain from clouds of nitrogen"],a:0,why:"Volcanic water vapour condensed."},
   {q:"Which process increased the amount of oxygen in the atmosphere?",opts:["Respiration","Combustion","Photosynthesis","Volcanic activity"],a:2,why:"Algae and plants release oxygen."},
   {q:"Give a way that carbon dioxide was removed from the early atmosphere.",opts:["Dissolving in the oceans","Released by volcanoes","Formed by combustion","Made by animals"],a:0,why:"It dissolved and formed carbonate sediments."}]),
  B.keypoints(["Today: ~80% N₂, ~20% O₂, small amounts of CO₂, water vapour, noble gases.","Early: mainly CO₂ from volcanoes, little or no O₂; water vapour condensed to form oceans.","O₂ from photosynthesis by algae and plants; CO₂ removed by oceans, plants, sedimentary rocks and fossil fuels."]),
  B.mistakes(["Saying the atmosphere is mainly oxygen.","Saying respiration produced the oxygen.","Forgetting that dissolving in oceans and forming carbonate rocks removed CO₂."])
 ],onShow:()=>draw()});
function draw(){ const t=val("chem-am1-t")/100, c=at(t), names=["Carbon dioxide","Nitrogen","Oxygen","Water vapour and other gases"], cols=["#e0634f","#4f8fd8","#3fb37a","#9aa4ad"];
  let g=`<text x="10" y="22" font-size="14" font-weight="700">${t===0?"Today":t.toFixed(2)+" billion years ago"}</text>`; let x=10;
  c.forEach((v,i)=>{ const w=540*v/c.reduce((a,b)=>a+b,0); g+=`<rect x="${x}" y="40" width="${Math.max(0,w)}" height="60" fill="${cols[i]}"/>`; x+=w; });
  c.forEach((v,i)=>{ g+=`<rect x="10" y="${125+i*28}" width="14" height="14" fill="${cols[i]}"/><text x="32" y="${137+i*28}" font-size="13">${names[i]}: ${v<1?v.toFixed(2):v.toFixed(0)}%</text>`; });
  $("#chem-am1-svg").innerHTML=g; set("chem-am1-t-l",t===0?"today":t.toFixed(2)+" billion years");
  const e=EV.slice().reverse().find(x=>t<=x[0])||EV[0]; set("chem-am1-e",e[1]); }
$("#chem-am1-t").addEventListener("input",draw); draw();
})();

</script>
<script>
LEARN.unit="chem-atmos";

/* AM2: greenhouse gases and climate change */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val}=CH;
const stage=`<svg id="chem-am2-svg" class="chsvg" viewBox="0 0 560 300" role="img" aria-label="The greenhouse effect"></svg>`;
const panel=sl("chem-am2-c","Carbon dioxide concentration",180,800,10,420,"Carbon dioxide in parts per million")+CH.ro([["chem-am2-t","Warming compared with pre-industrial (model)"],["chem-am2-n","Note"]])+`<p class="note">Pre-industrial: about 280 ppm. Today: over 420 ppm. A simple model: about 3 °C of warming for each doubling of CO₂.</p>`;
lesson({id:"chem-am2",group:"b",num:2,lvl:"5.9.2 · Lesson 2",name:"Greenhouse gases and climate change",icon:"green",
 eyebrow:eb("5.9.2.1–5.9.2.3 Greenhouse gases; human activities; global climate change",2),title:"Greenhouse gases and global climate change",
 intro:"Greenhouse gases keep the Earth warm enough for life. But human activities are adding more of them, and the evidence shows the Earth is warming as a result.",
 outcomes:[["Describe the greenhouse effect in terms of the interaction of radiation with matter","5.9.2.1"],["Name human activities that increase carbon dioxide and methane","5.9.2.2"],["Evaluate the evidence for climate change and describe its possible effects","5.9.2.2–5.9.2.3"]],
 blocks:[
  B.text("The greenhouse effect",`<p>Greenhouse gases in the atmosphere maintain temperatures on Earth high enough to support life. Water vapour, carbon dioxide and methane are greenhouse gases.</p><ul><li>The Sun emits <b>short wavelength radiation</b>, which passes through the atmosphere and is absorbed by the Earth's surface, warming it.</li><li>The warm Earth emits <b>longer wavelength (infrared) radiation</b>.</li><li>Greenhouse gases <b>absorb</b> some of this long wavelength radiation and re-emit it in all directions, including back towards the Earth, keeping it warmer.</li></ul>`),
  B.sim("chem-am2-sim","More CO₂, more warming",stage,panel,`<span>Short wavelength in</span><span>Long wavelength trapped</span>`),
  B.text("Human activities and climate change",`<p>Some human activities increase the amounts of greenhouse gases in the atmosphere:</p><ul><li><b>carbon dioxide</b>: burning fossil fuels, deforestation (fewer trees to absorb CO₂, and trees burned);</li><li><b>methane</b>: cattle farming, rice fields, decomposition of waste in landfill.</li></ul><p>Based on peer-reviewed evidence, many scientists believe that human activities will cause the temperature of the Earth's atmosphere to increase at the surface and that this will result in global climate change. However, it is difficult to model such complex systems as global climate change; this leads to simplified models, speculation and opinions in the media that may be based on only parts of the evidence and which may be biased.</p><p>Possible effects: <b>sea level rise</b> (flooding and coastal erosion); more frequent and severe <b>storms</b>; changes in the amount, timing and distribution of <b>rainfall</b>; <b>temperature and water stress</b> for humans and wildlife; changes in food producing capacity of some regions; changes to the distribution of wildlife species.</p>`),
  B.check([
   {q:"Which of these is a greenhouse gas?",opts:["Nitrogen","Oxygen","Methane","Argon"],a:2,why:"Methane, carbon dioxide and water vapour."},
   {q:"What type of radiation do greenhouse gases absorb?",opts:["Short wavelength radiation from the Sun","Long wavelength radiation from the Earth","Ultraviolet only","Radio waves"],a:1,why:"Infrared emitted by the warm Earth."},
   {q:"Which human activity increases methane?",opts:["Cattle farming","Using solar panels","Planting trees","Recycling glass"],a:0,why:"Cattle produce methane during digestion."},
   {q:"Why is it difficult to predict climate change precisely?",opts:["There is no data","The climate is a very complex system, so models must be simplified","Scientists do not agree that CO₂ is a greenhouse gas","Temperature cannot be measured"],a:1,why:"Complex systems need simplified models."},
   {q:"Give an effect of global climate change.",opts:["Sea level rise","More oxygen","Less carbon dioxide","Thicker ozone layer"],a:0,why:"Melting ice and expanding water."}]),
  B.keypoints(["Greenhouse gases: water vapour, CO₂, methane. They absorb long wavelength radiation emitted by the Earth.","CO₂ from fossil fuels and deforestation; methane from cattle, rice and landfill.","Effects: sea level rise, storms, rainfall changes, water stress, food production, wildlife distribution."]),
  B.mistakes(["Confusing the greenhouse effect with the ozone hole.","Saying greenhouse gases trap heat from the Sun on its way in (they absorb radiation emitted by the Earth).","Treating media opinion as scientific evidence: look for peer-reviewed data."])
 ],onShow:()=>draw()});
function draw(){ const c=val("chem-am2-c"), dT=3*Math.log2(c/280), n=Math.round((c-180)/60)+2;
  let g=`<rect x="0" y="0" width="560" height="300" fill="#0b1830" opacity=".25"/><circle cx="60" cy="50" r="32" fill="#ffcf3f"/><rect x="0" y="250" width="560" height="50" fill="#3a7d44"/><rect x="0" y="80" width="560" height="${40+n*3}" fill="#9aa4ad" opacity="${Math.min(.5,.08+n*.03)}"/><text x="545" y="98" text-anchor="end" font-size="12">greenhouse gases</text>`;
  g+=`<path d="M90 70L230 250" stroke="#ffcf3f" stroke-width="3" stroke-dasharray="3 3"/><text x="150" y="150" font-size="12">short wavelength in</text>`;
  [[260,250,330,90],[330,250,420,150],[400,250,480,95]].forEach(([x1,y1,x2,y2],i)=>{ g+=`<path d="M${x1} ${y1}Q${(x1+x2)/2-20} ${(y1+y2)/2} ${x2} ${y2}" fill="none" stroke="#e0634f" stroke-width="3"/>`; if(i<Math.min(3,Math.floor(n/3))) g+=`<path d="M${x2} ${y2+16}l20 120" stroke="#e0634f" stroke-width="2" stroke-dasharray="4 3"/>`; });
  g+=`<text x="300" y="240" font-size="12" style="fill:#fff">long wavelength (infrared) out</text><text x="20" y="285" font-size="13" style="fill:#fff">Surface warming in this model: ${dT>=0?"+":""}${dT.toFixed(1)} °C</text>`;
  $("#chem-am2-svg").innerHTML=g; set("chem-am2-c-l",c+" ppm"); set("chem-am2-t",(dT>=0?"+":"")+dT.toFixed(1)+" °C"); set("chem-am2-n",c<280?"cooler: ice-age levels were about 180 ppm":c<=300?"close to pre-industrial":c<=430?"around today's level":"possible future levels"); }
$("#chem-am2-c").addEventListener("input",draw); draw();
})();

</script>
<script>
LEARN.unit="chem-atmos";

/* AM3: carbon footprint */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set}=CH;
const A=[["Insulate the home and use a heat pump",1.4],["Switch to renewable electricity",1.0],["Take one fewer long-haul flight a year",1.5],["Use public transport or an electric car",1.3],["Eat less red meat",0.7],["Buy less and recycle more",0.5]];
const BASE=10;
const stage=`<svg id="chem-am3-svg" class="chsvg" viewBox="0 0 560 200" role="img" aria-label="Carbon footprint bar"></svg>`;
const panel=`<p class="note" style="margin-top:0">Tick the changes a household makes. Illustrative figures in tonnes of CO₂ equivalent per person per year.</p><div id="chem-am3-c">${A.map((a,i)=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-chem-am3="${i}" style="width:18px;height:18px"> ${a[0]} (−${a[1]} t)</label>`).join("")}</div>`+CH.ro([["chem-am3-t","Footprint"],["chem-am3-p","Reduction"]]);
lesson({id:"chem-am3",group:"b",num:3,lvl:"5.9.2 · Lesson 3",name:"Carbon footprint",icon:"foot",
 eyebrow:eb("5.9.2.4 The carbon footprint and its reduction",3),title:"The carbon footprint and its reduction",
 intro:"A carbon footprint is the total amount of carbon dioxide and other greenhouse gases emitted over the full life cycle of a product, service or event. It can be reduced, but there are real problems in doing so.",
 outcomes:[["Describe what is meant by a carbon footprint","5.9.2.4"],["Describe actions to reduce emissions of carbon dioxide and methane","5.9.2.4"],["Give reasons why actions may be limited","5.9.2.4"]],
 blocks:[
  B.text("Reducing the footprint",`<p>The <b>carbon footprint</b> is the total amount of carbon dioxide and other greenhouse gases emitted over the full life cycle of a product, service or event. It can be reduced by reducing emissions of carbon dioxide and methane:</p><ul><li>increased use of <b>alternative energy</b> supplies (renewables, nuclear);</li><li><b>energy conservation</b> (insulation, efficient appliances);</li><li><b>carbon capture and storage</b>;</li><li><b>carbon taxes</b> and licences;</li><li><b>carbon offsetting</b>, including through tree planting;</li><li>carbon neutrality: zero net release.</li></ul><p><b>Problems</b> of reducing the footprint include: scientific disagreement over causes and consequences; lack of public information and education; lifestyle changes (e.g. greater use of cars and aeroplanes); economic considerations (cost); incomplete international cooperation.</p>`),
  B.sim("chem-am3-sim","Shrink a footprint",stage,panel,`<span>Typical UK footprint: about 10 t per person</span>`),
  B.check([
   {q:"What is a carbon footprint?",opts:["The mass of carbon in a fuel","The total greenhouse gases emitted over the full life cycle of a product, service or event","The area of forest needed","The amount of CO₂ in the air"],a:1,why:"Full life cycle emissions."},
   {q:"Which of these reduces the carbon footprint?",opts:["Carbon capture and storage","Deforestation","Burning more coal","Using more landfill"],a:0,why:"CO₂ is stored instead of released."},
   {q:"Give a reason why reducing the carbon footprint is difficult.",opts:["Incomplete international cooperation","There are no alternatives","CO₂ is not a greenhouse gas","Trees release CO₂ when growing"],a:0,why:"Countries must act together."},
   {q:"What is carbon offsetting?",opts:["Burning fuels faster","Balancing emissions by actions that remove CO₂, such as tree planting","Storing coal","Using more methane"],a:1,why:"e.g. planting trees."},
   {q:"A footprint of 10 t is reduced by 2.5 t. What percentage reduction is this?",a:25,unit:"%",tol:0,why:"2.5 ÷ 10 × 100 = 25%."}]),
  B.keypoints(["Carbon footprint: total greenhouse gases over a full life cycle.","Reduce: renewables, conservation, carbon capture, taxes, offsetting.","Problems: disagreement, education, lifestyle, cost, international cooperation."]),
  B.mistakes(["Counting only the emissions when a product is used, not made and disposed of.","Saying carbon capture removes all CO₂ from the air.","Forgetting methane as part of the footprint."])
 ],onShow:()=>draw()});
function draw(){ const on=[...document.querySelectorAll("[data-chem-am3]")].filter(c=>c.checked).map(c=>+c.dataset.chem-am3), cut=on.reduce((t,i)=>t+A[i][1],0), F=BASE-cut;
  const W=v=>v/BASE*400; $("#chem-am3-svg").innerHTML=`<text x="10" y="30" font-size="13">Before</text><rect x="70" y="16" width="${W(BASE)}" height="26" fill="#e0634f" opacity=".85"/><text x="${74+W(BASE)}" y="34" font-size="12">${BASE} t</text><text x="10" y="80" font-size="13">After</text><rect x="70" y="66" width="${W(F)}" height="26" fill="#3fb37a" opacity=".85"/><text x="${74+W(F)}" y="84" font-size="12">${F.toFixed(1)} t</text><text x="10" y="130" font-size="12" style="fill:var(--muted)">The rest comes from shared services, goods and food production</text><text x="10" y="148" font-size="12" style="fill:var(--muted)">that one household cannot change alone.</text>`;
  set("chem-am3-t",F.toFixed(1)+" t CO₂e"); set("chem-am3-p",(cut/BASE*100).toFixed(0)+"%"); }
document.addEventListener("change",e=>{ if(e.target.closest("[data-chem-am3]")) draw(); }); draw();
})();

</script>
<script>
LEARN.unit="chem-atmos";

/* AM4: atmospheric pollutants from fuels */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,seg,radio}=CH;
const FU={gas:["Natural gas (methane)",0,0,0],petrol:["Petrol in a car engine",0,1,0],diesel:["Diesel in an engine",1,1,1],coal:["Coal in a power station",1,1,1],h2:["Hydrogen",0,1,0]};
const EFF={CO2:"greenhouse gas: climate change",H2O:"harmless",CO:"toxic gas: colourless and odourless, so not easily detected; it combines with haemoglobin and reduces the oxygen-carrying capacity of the blood",C:"solid particulates (soot): global dimming and health problems for humans (lung damage)",SO2:"acid rain and respiratory problems",NOx:"acid rain and respiratory problems",PM:"particulates: global dimming and lung damage"};
const NM={CO2:"carbon dioxide",H2O:"water vapour",CO:"carbon monoxide",C:"soot (carbon particulates)",SO2:"sulfur dioxide",NOx:"oxides of nitrogen",PM:"particulates"};
const stage=`<div style="padding:14px"><div id="chem-am4-o" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="chem-am4-w" style="margin-top:10px"></div></div>`;
const panel=field("Fuel",sel("chem-am4-f",Object.entries(FU).map(([k,v])=>[k,v[0]]),"petrol"))+field("Oxygen supply",seg("chem-am4-o2",[["plenty","Plenty of oxygen"],["limited","Limited oxygen"]],2,"plenty"));
lesson({id:"chem-am4",group:"b",num:4,lvl:"5.9.3 · Lesson 4",name:"Atmospheric pollutants",icon:"smog",
 eyebrow:eb("5.9.3.1–5.9.3.2 Atmospheric pollutants from fuels; properties and effects",4),title:"Atmospheric pollutants from fuels",
 intro:"Burning fossil fuels releases more than carbon dioxide and water. Depending on the fuel and how much oxygen there is, it can also produce carbon monoxide, soot, sulfur dioxide, oxides of nitrogen and particulates.",
 outcomes:[["Describe how pollutants are produced when fuels burn","5.9.3.1"],["Describe the effects of carbon monoxide, sulfur dioxide, oxides of nitrogen and particulates","5.9.3.2"],["Predict the products of combustion of a fuel given its composition and the conditions","5.9.3.1"]],
 blocks:[
  B.text("Where pollutants come from",`<p>The combustion of fuels is a major source of atmospheric pollutants. Most fuels, including coal, contain carbon and/or hydrogen and may also contain some sulfur. The gases released into the atmosphere when a fuel is burned may include carbon dioxide, water vapour, carbon monoxide, sulfur dioxide and oxides of nitrogen. Solid particles and unburned hydrocarbons may also be released that form <b>particulates</b> in the atmosphere.</p><ul><li><b>Carbon monoxide</b> and <b>soot</b> form by <b>incomplete combustion</b> when oxygen is limited.</li><li><b>Sulfur dioxide</b> forms when sulfur impurities in the fuel burn.</li><li><b>Oxides of nitrogen</b> form when nitrogen and oxygen from the air react at the high temperatures in engines.</li></ul>`),
  B.sim("chem-am4-sim","What comes out of the exhaust?",stage,panel,`<span>Fuel + conditions → products</span>`),
  B.check([
   {q:"Why is carbon monoxide dangerous?",opts:["It causes acid rain","It is toxic and not easily detected","It is a greenhouse gas only","It causes global dimming"],a:1,why:"Colourless, odourless and reduces oxygen carried by the blood."},
   {q:"How are oxides of nitrogen formed in a car engine?",opts:["From nitrogen in the fuel only","Nitrogen and oxygen from the air react at high temperatures","From sulfur in the fuel","From incomplete combustion"],a:1,why:"High temperature in the engine."},
   {q:"What causes sulfur dioxide to be released when coal is burned?",opts:["Sulfur impurities in the coal","Nitrogen in the air","Lack of oxygen","Water vapour"],a:0,why:"The sulfur burns to SO₂."},
   {q:"Which pollutant causes global dimming?",opts:["Carbon monoxide","Particulates","Sulfur dioxide","Water vapour"],a:1,why:"Tiny solid particles reflect sunlight."},
   {q:"Which two pollutants cause acid rain?",opts:["CO and CO₂","SO₂ and oxides of nitrogen","Soot and CO","Methane and water"],a:1,why:"They dissolve in rain to form acids."}]),
  B.keypoints(["Incomplete combustion: CO (toxic) and soot.","SO₂ from sulfur impurities; NOx from N₂ + O₂ at high temperature: both cause acid rain and respiratory problems.","Particulates: global dimming and lung damage."]),
  B.mistakes(["Saying oxides of nitrogen come from nitrogen in the fuel.","Saying carbon monoxide causes acid rain.","Confusing global dimming with global warming."])
 ],onShow:()=>draw()});
function draw(){ const k=$("#chem-am4-f").value, F=FU[k], lim=radio("chem-am4-o2")==="limited";
  const out=k==="h2"?["H2O"]:["CO2","H2O"]; if(lim&&k!=="h2") out.push("CO","C"); if(F[1]) out.push("SO2"); if(F[2]) out.push("NOx"); if(F[3]&&!out.includes("C")) out.push("PM");
  $("#chem-am4-o").innerHTML=out.map(p=>`<span class="pill ${["CO2","H2O"].includes(p)?"ok":"no"}" style="font-size:.95rem">${NM[p]}</span>`).join("");
  $("#chem-am4-w").innerHTML=`<table class="tbl-mini"><tr><th>Product</th><th>Effect</th></tr>${out.map(p=>`<tr><td>${NM[p]}</td><td>${EFF[p]}</td></tr>`).join("")}</table>${k==="h2"?`<p class="muted">Hydrogen makes only water, but oxides of nitrogen can still form at high temperatures in an engine.</p>`:""}`; }
["chem-am4-f","chem-am4-o2"].forEach(id=>$("#"+id).addEventListener("change",draw)); draw();
})();

</script>
<script>

/* Exam-style questions for Topic 9 */
(()=>{
const {attach}=EXAM;
const T="Exam-style questions", I="Write your answer, then open the mark scheme and tick the marks you earned.";
attach("chem-am1",{title:T,intro:I,qs:[
 {stem:`<p>Scientists think the Earth's early atmosphere was similar to the atmosphere of Mars today: mainly carbon dioxide.</p>`,parts:[
  {q:"Describe how the oceans formed.",m:2,lines:2,ms:[["1","(volcanoes released) water vapour"],["1","the Earth cooled and the water vapour condensed"]]},
  {q:"Explain how the amount of carbon dioxide in the atmosphere decreased. Give three processes.",m:3,lines:5,ms:[["1","dissolved in the oceans (and carbonates precipitated)"],["1","used by algae / plants in photosynthesis"],["1","locked up in sedimentary rocks (limestone) / fossil fuels"]]},
  {q:"Explain why scientists cannot be certain about the composition of the early atmosphere.",m:1,lines:2,ms:[["1","it was billions of years ago / no one was there / little evidence survives"]]}]}]});
attach("chem-am2",{title:T,intro:I,qs:[
 {stem:`<p>Carbon dioxide and methane are greenhouse gases.</p>`,parts:[
  {q:"Explain how greenhouse gases keep the Earth warm.",m:3,lines:4,ms:[["1","short wavelength radiation from the Sun passes through the atmosphere and warms the Earth"],["1","the Earth emits long wavelength (infrared) radiation"],["1","greenhouse gases absorb (and re-emit) some of this radiation, keeping energy in the atmosphere"]]},
  {q:"Give one human activity that increases methane and one that increases carbon dioxide.",m:2,lines:2,ms:[["1","methane: cattle farming / rice / landfill"],["1","carbon dioxide: burning fossil fuels / deforestation"]]},
  {q:"Give two possible effects of global climate change.",m:2,lines:2,ms:[["1","sea level rise / flooding / coastal erosion"],["1","more storms / changes in rainfall / water stress / food production / wildlife distribution"]]}]}]});
attach("chem-am3",{title:T,intro:I,qs:[
 {stem:`<p>Governments want to reduce the carbon footprint of their countries.</p>`,parts:[

(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field}=CH;

const P={paper:{n:"Paper bag",st:[["Raw materials","timber from trees: renewable, but land use",3],["Manufacture","pulping and drying: large amounts of energy and water",4],["Use","usually single use; weak when wet",3],["Disposal","biodegradable; can be recycled; some incinerated",1]]},plastic:{n:"Plastic (poly(ethene)) bag",st:[["Raw materials","crude oil: finite resource",3],["Manufacture","cracking and polymerisation: less energy than paper",2],["Use","can be reused many times",1],["Disposal","not biodegradable; litter harms wildlife; can be recycled; landfill lasts for centuries",4]]}};
const stage=`<svg id="chem-ur4-svg" class="chsvg" viewBox="0 0 560 260" role="img" aria-label="Life cycle comparison"></svg>`;
const panel=`<p class="note" style="margin-top:0">Illustrative scores, 1 = low impact, 4 = high impact. Real LCAs use measured data, but some values have to be estimated.</p>`+field("Show details for",sel("chem-ur4-p",[["paper","Paper bag"],["plastic","Plastic bag"]],"paper"))+`<div id="chem-ur4-t"></div>`;
lesson({id:"chem-ur4",group:"b",num:4,lvl:"5.10.2 · Lesson 4",name:"Life cycle assessment and recycling",icon:"lca",
 eyebrow:eb("5.10.2.1–5.10.2.2 Life cycle assessment; ways of reducing the use of resources",4),title:"Life cycle assessment and recycling",
 intro:"A life cycle assessment (LCA) looks at the environmental impact of a product at every stage, from getting the raw materials to throwing it away. Reducing, reusing and recycling cut the impact further.",
 outcomes:[["Describe the four stages of a life cycle assessment","5.10.2.1"],["Carry out a simple comparative LCA and explain why LCAs can be biased","5.10.2.1"],["Evaluate ways of reducing the use of limited resources, including recycling","5.10.2.2"]],
 blocks:[
  B.text("Life cycle assessments",`<p>Life cycle assessments are carried out to assess the environmental impact of products in each of these stages:</p><ol><li>extracting and processing <b>raw materials</b>;</li><li><b>manufacturing</b> and packaging;</li><li><b>use</b> and operation during its lifetime;</li><li><b>disposal</b> at the end of its useful life, including transport and distribution at each stage.</li></ol><p>Use of water, resources, energy sources and production of some wastes can be fairly easily quantified. Allocating numerical values to pollutant effects is less straightforward and requires <b>value judgements</b>, so LCA is not a purely objective process. Selective or abbreviated LCAs can be devised to evaluate a product but these can be <b>misused</b> to reach pre-determined conclusions, e.g. in support of claims for advertising purposes.</p>`),
  B.sim("chem-ur4-sim","Paper or plastic?",stage,panel,`<span>Four stages</span>`),
  B.text("Reduce, reuse, recycle",`<p>The reduction in use, reuse and recycling of materials by end users reduces the use of limited resources, use of energy sources, waste and environmental impacts. Metals, glass, building materials, clay ceramics and most plastics are produced from limited raw materials. Much of the energy for the processes comes from limited resources. Obtaining raw materials from the Earth by quarrying and mining causes environmental impacts.</p><ul><li><b>Glass</b> bottles can be reused; other glass is crushed and melted to make new products.</li><li><b>Metals</b> can be recycled by melting and recasting or reforming into different products. The amount of separation required depends on the metal and the product (e.g. scrap steel can be added to iron from a blast furnace).</li></ul>`),
  B.check([
   {q:"Which is NOT a stage of a life cycle assessment?",opts:["Extracting raw materials","Manufacturing","Advertising","Disposal"],a:2,why:"The four stages are raw materials, manufacture, use and disposal."},
   {q:"Why is an LCA not a purely objective process?",opts:["It uses no data","Some effects need value judgements to give them numbers","It only looks at cost","It is done by computers"],a:1,why:"Pollutant effects are hard to quantify."},
   {q:"How can an LCA be misused?",opts:["By including all stages","By selecting only some stages to support an advertising claim","By using measured data","By comparing two products"],a:1,why:"Abbreviated LCAs can be biased."},
   {q:"Give a benefit of recycling metals.",opts:["Uses more ore","Less energy and fewer limited resources are used","Makes more waste","Increases mining"],a:1,why:"Less quarrying and mining."}]),
  B.keypoints(["LCA stages: raw materials → manufacture → use → disposal (plus transport).","Some values need judgement; LCAs can be misused.","Reduce, reuse, recycle saves resources, energy and waste."]),
  B.mistakes(["Leaving out the use stage.","Assuming paper is always better because it is biodegradable.","Saying recycling uses no energy."])
 ],onShow:()=>draw()});
function draw(){ const k=$("#chem-ur4-p").value; let g=""; const X0=150, w=36;

  $("#chem-ur4-svg").innerHTML=g; $("#chem-ur4-t").innerHTML=`<table class="tbl-mini">${P[k].st.map(([s,d])=>`<tr><td>${s}</td><td>${d}</td></tr>`).join("")}</table>`; }
$("#chem-ur4-p").addEventListener("change",draw); draw();
})();

<script>

/* GCSE helpers: higher-tier badges, equation tags, store bars */
window.G=(()=>{
const HT='<span class="ht">Higher</span>';
const R='<span class="eqk">Equation sheet</span>', S='<span class="eqk">Equation sheet</span>';
const ht=html=>`<div class="htbox">${HT} ${html}</div>`;
const eb=(spec,n)=>`AQA Combined Science · Physics · ${spec}${n?` · Lesson ${n}`:""}`;
/* horizontal bar chart in SVG: items [[label,value,cls]] ; returns markup */
function hbars(items,x,y,w,max,o={}){ const bh=o.bh||22, gap=o.gap||10, lw=o.lw||150, unit=o.unit||"J", dp=o.dp??0; let g="";
  items.forEach(([lab,val,cls],i)=>{ const yy=y+i*(bh+gap), L=Math.max(0,Math.min(1,val/max))*(w-lw-70);
    g+=`<text x="${x+lw-8}" y="${yy+bh/2+4}" text-anchor="end" font-size="13">${lab}</text><rect x="${x+lw}" y="${yy}" width="${w-lw-70}" height="${bh}" rx="3" class="fsunk"/><rect x="${x+lw}" y="${yy}" width="${L.toFixed(1)}" height="${bh}" rx="3" class="${cls||"facc"}"/><text x="${x+lw+L+6}" y="${yy+bh/2+4}" font-size="12" class="tm">${(+val).toFixed(dp)} ${unit}</text>`; });
  return g; }

/* particle box on a canvas: mode solid | liquid | gas; w (0–1 fraction of width used, for pistons); speed scale */
function particles(cv,o={}){ const P={mode:o.mode||"gas",n:o.n||40,speed:o.speed||1,w:1,r:o.r||5,hits:0,col:o.col||"#c4531a",list:[]};
  function seed(){ P.list=[]; const n=P.n; for(let i=0;i<n;i++){ const a=Math.random()*6.283; P.list.push({x:Math.random(),y:Math.random(),vx:Math.cos(a),vy:Math.sin(a),hx:0,hy:0}); }
    if(P.mode!=="gas"){ const ar=o.aspect||.6, cols=Math.ceil(Math.sqrt(n/(ar*0.8))), dx=1/cols; P.dx=dx; P.list.forEach((p,i)=>{ const r=Math.floor(i/cols); p.hx=((i%cols)+.5+(P.mode==="liquid"?(Math.random()-.5)*.5:0))*dx; p.hy=1-(r+.5)*dx/ar*(P.mode==="liquid"?1.08:1); p.x=p.hx; p.y=p.hy; }); } }
  function step(dt){ const L=P.list; P.hits=0;
    if(P.mode==="solid"){ L.forEach(p=>{ p.x=p.hx+(Math.random()-.5)*.012*P.speed; p.y=p.hy+(Math.random()-.5)*.012*P.speed; }); return; }
    if(P.mode==="liquid"){ L.forEach(p=>{ p.hx+=(Math.random()-.5)*.01*P.speed; p.hx=Math.max(.03,Math.min(.97,p.hx)); p.x=p.hx+(Math.random()-.5)*.012*P.speed; p.y=p.hy+(Math.random()-.5)*.012*P.speed; }); return; }
    L.forEach(p=>{ p.x+=p.vx*P.speed*dt*.5; p.y+=p.vy*P.speed*dt*.5; if(p.x<0){p.x=-p.x;p.vx*=-1;} if(p.x>P.w){p.x=2*P.w-p.x;p.vx*=-1;P.hits++;} if(p.y<0){p.y=-p.y;p.vy*=-1;} if(p.y>1){p.y=2-p.y;p.vy*=-1;} }); }
  function draw(){ if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*(o.aspect||.6)), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); const pad=8, bw=(w-2*pad), bh=h-2*pad;
    c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--panel"); c.fillRect(pad,pad,bw*P.w,bh); c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink"); c.lineWidth=2; c.strokeRect(pad,pad,bw*P.w,bh);
    if(o.piston){ c.fillStyle="#8a929a"; c.fillRect(pad+bw*P.w,pad,10,bh); c.fillRect(pad+bw*P.w+10,pad+bh/2-5,w,10); }
    const rr=P.mode!=="gas"&&P.dx?.4*bw*P.dx:P.r; c.fillStyle=P.col; P.list.forEach(p=>{ c.beginPath(); c.arc(pad+Math.min(p.x,P.w)*bw,pad+p.y*bh,rr,0,6.283); c.fill(); }); }
  seed(); return {P,seed,step,draw}; }
return {HT,R,S,ht,eb,hbars,particles};
})();


</script>
<script>
LEARN.unit="phys-energy";

/* EN1: energy stores and systems */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb,hbars}=G;
/* each scenario: stores [name, cls, f(t) in J], picture(t), text(t) */
const SC={
 ball:{name:"Ball thrown upwards",path:"mechanically (by the weight doing work)",
  stores:[["Kinetic","facc",t=>25*(1-t)**2],["Gravitational","fdat",t=>25-25*(1-t)**2]],
  pic:t=>{ const h=25-25*(1-t)**2, y=210-h*6.2; return `<path d="M40 222 H300" class="ink" stroke-width="2"/><circle cx="170" cy="${y.toFixed(1)}" r="13" class="facc"/><text x="190" y="${(y+5).toFixed(1)}" font-size="12" class="tm">v = ${fx(10*(1-t),1)} m/s</text>`; },
  say:"As the ball rises it slows down: energy is transferred from its kinetic store to its gravitational potential store. At the top all 25 J is in the gravitational store (ignoring air resistance)."},
 car:{name:"Car braking",path:"mechanically (friction between brake pads and discs)",
  stores:[["Kinetic","facc",t=>200*(1-t)**2],["Thermal (brakes)","fbd",t=>200-200*(1-t)**2]],
  pic:t=>{ const x=40+200*(1-(1-t)**2); return `<path d="M20 200 H320" class="ink" stroke-width="2"/><g transform="translate(${x.toFixed(1)} 0)"><rect x="0" y="160" width="70" height="26" rx="6" class="facc"/><rect x="14" y="146" width="38" height="18" rx="5" class="facc" opacity=".8"/><circle cx="16" cy="190" r="9" style="fill:${t>0.05?"#d9542b":"#444"}"/><circle cx="56" cy="190" r="9" style="fill:${t>0.05?"#d9542b":"#444"}"/></g>`; },
  sayK:"kJ",
  say:"Friction in the brakes does work on the car, transferring energy from the kinetic store of the car to the thermal store of the brakes, which get hot. The energy then spreads to the surroundings."},
 kettle:{name:"Water heated in a kettle",path:"electrically, then by heating",
  stores:[["Thermal (water)","fbd",t=>300*t],["Thermal (surroundings)","fmut",t=>30*t]],
  pic:t=>`<path d="M110 120 h110 l10 90 h-130z" class="fsunk ink" stroke-width="2"/><rect x="${116}" y="${(200-60).toFixed(0)}" width="98" height="66" style="fill:rgb(${90+Math.round(150*t)},${150-Math.round(70*t)},${230-Math.round(170*t)})" opacity=".7"/><path d="M220 140 q30 10 26 40 l-14 -2" class="ink" fill="none" stroke-width="3"/><path d="M150 112 v-10 h30 v10" class="ink" fill="none" stroke-width="2"/><text x="165" y="96" text-anchor="middle" font-size="12" class="tm">${fx(20+80*t,0)} °C</text>`,
  say:"The mains supply transfers energy electrically to the heating element, which heats the water. Most ends up in the thermal store of the water; some heats the kettle and the air."},
 bow:{name:"Arrow fired from a bow",path:"mechanically (the string pushes the arrow)",
  stores:[["Elastic (bow)","fgd",t=>40*(1-t)],["Kinetic (arrow)","facc",t=>38*t],["Thermal (surroundings)","fmut",t=>2*t]],
  pic:t=>{ const pull=50*(1-t), ax=170-pull+260*t; return `<path d="M120 100 q${40-pull*0.2} 60 0 120" class="ink" fill="none" stroke-width="4"/><path d="M120 100 L${(170-pull).toFixed(1)} 160 L120 220" class="mut" fill="none" stroke-width="1.5"/><path d="M${(ax-90).toFixed(1)} 160 H${ax.toFixed(1)}" class="ink" stroke-width="3"/><path d="M${ax.toFixed(1)} 160 l-10 -5 v10z" class="fink"/>`; },
  say:"The stretched bow stores energy in its elastic potential store. When released, the string does work on the arrow and the energy is transferred to the arrow’s kinetic store. A little is dissipated as sound and heating."},
 torch:{name:"Battery-powered torch",path:"electrically, then by radiation (light)",
  stores:[["Chemical (battery)","fdat",t=>60*(1-t)],["Light → surroundings","facc",t=>9*t],["Thermal (surroundings)","fbd",t=>51*t]],
  pic:t=>`<rect x="80" y="150" width="130" height="40" rx="8" class="fsunk ink" stroke-width="2"/><path d="M210 145 l30 -12 v74 l-30 -12z" class="fsunk ink" stroke-width="2"/>${t<1?`<path d="M240 140 L320 110 V230 L240 200z" fill="#ffd84a" opacity=".55"/>`:""}<rect x="95" y="160" width="${(90*(1-t)).toFixed(1)}" height="20" class="fdat" opacity=".7"/>`,
  say:"Energy is transferred electrically from the chemical store of the battery to the lamp. It leaves as light (radiation) and by heating, and both end up in the thermal store of the surroundings."}
};
const st={k:"ball",t:0,play:false};
const stage=`<svg id="phys-en1" viewBox="0 0 900 260" role="img" aria-label="A picture of the chosen energy transfer next to bar charts of the energy in each store"></svg>`;
const panel=`<div class="field"><div class="lbl">Scenario</div><select id="phys-en1-k" aria-label="Scenario">${Object.entries(SC).map(([k,s])=>`<option value="${k}">${s.name}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Progress through the event <b id="phys-en1-tl"></b></div><input type="range" id="phys-en1-t" min="0" max="1" step="0.01" value="0" aria-label="Progress"></div>
<div class="btnrow"><button class="btn primary" id="phys-en1-go">Play</button></div>
<div class="readout"><div><span>Transfer pathway</span><b id="phys-en1-p" style="font-size:.85rem">—</b></div><div><span>Total energy</span><b id="phys-en1-tot">—</b></div></div>
<p class="note" id="phys-en1-say"></p>`;

lesson({id:"phys-en1",group:"a",num:1,lvl:"6.1.1 · Lesson 1",name:"Energy stores and systems",icon:"stores",
 eyebrow:eb("6.1.1 Energy changes in a system",1),title:"Energy stores and systems",
 intro:"Energy is never used up. It is stored in different ways and moves between stores when something happens. Describing these stores and transfers is the key to every energy question in physics.",
 outcomes:[["Name the energy stores and the ways energy can be transferred between them","6.1.1.1"],["Describe the changes in energy stores when a system changes","6.1.1.1"],["Explain what is meant by a system and a closed system","6.1.1.1"]],
 blocks:[
  B.text("Energy stores",`<p>Energy can be stored in several ways. You need to know these <b>stores</b>:</p><ul><li><b>Kinetic</b>: anything moving.</li><li><b>Gravitational potential</b>: anything raised above the ground.</li><li><b>Elastic potential</b>: anything stretched, squashed or bent.</li><li><b>Thermal</b> (internal): everything; for the same mass and material, hotter objects have more.</li><li><b>Chemical</b>: fuels, food and batteries.</li><li><b>Magnetic</b> and <b>electrostatic</b>: magnets or charges that attract or repel.</li><li><b>Nuclear</b>: inside the nuclei of atoms.</li></ul>`,
   B.fig(`<svg viewBox="0 0 320 220" role="img" aria-label="Energy moves from one store to another by a transfer pathway"><rect x="10" y="70" width="110" height="70" rx="10" class="fsunk ink" stroke-width="2"/><text x="65" y="102" text-anchor="middle" font-size="14" font-weight="700">Store A</text><text x="65" y="122" text-anchor="middle" font-size="11" class="tmut">e.g. chemical</text><rect x="200" y="70" width="110" height="70" rx="10" class="fsunk ink" stroke-width="2"/><text x="255" y="102" text-anchor="middle" font-size="14" font-weight="700">Store B</text><text x="255" y="122" text-anchor="middle" font-size="11" class="tmut">e.g. kinetic</text><path d="M122 105 H192" class="acc" stroke-width="5"/><path d="M198 105 l-12 -8 v16z" class="facc"/><text x="160" y="92" text-anchor="middle" font-size="11" class="tacc">transfer</text><text x="160" y="170" text-anchor="middle" font-size="12" class="tm">Pathways: mechanically · electrically</text><text x="160" y="188" text-anchor="middle" font-size="12" class="tm">by heating · by radiation (light, sound)</text></svg>`,"Energy moves between stores along transfer pathways.")),
  B.text("Systems and transfers",`<p>A <b>system</b> is an object or group of objects that you are interested in. When a system changes, energy moves between its stores. Energy is transferred:</p><ul><li><b>mechanically</b>: a force does work (pushing, pulling, stretching);</li><li><b>electrically</b>: a current flows;</li><li><b>by heating</b>: from a hotter object to a cooler one;</li><li><b>by radiation</b>: light, infrared or sound waves carry energy away.</li></ul><p>In a <b>closed system</b> no energy enters or leaves, so the <b>total energy stays the same</b>. Energy can be transferred usefully, stored or dissipated, but it cannot be created or destroyed. This is the <b>principle of conservation of energy</b>.</p>`),
  B.sim("phys-en1-sim","Following energy between stores",stage,panel,`<span>Drag the slider or press Play</span><span>Bars: energy in each store</span>`),
  B.example("Describing a transfer","A bungee jumper falls from a bridge. Describe the energy transfers from the moment she jumps to the lowest point.",[
   ["Falling freely","Before the cord tightens",["Energy is transferred from her gravitational potential store to her kinetic store (she speeds up)."]],
   ["Cord stretching","Cord pulls up on her",["She slows down: energy is transferred from her kinetic and gravitational stores to the elastic potential store of the cord."]],
   ["Lowest point","Momentarily stationary",["Kinetic store is zero. Most energy is in the elastic store; a little has been dissipated to the thermal store of the surroundings by air resistance."]]]),
  B.check([
   {q:"A battery-powered toy car accelerates from rest. Which store is energy transferred <b>from</b>?",opts:["Kinetic","Chemical","Elastic potential","Gravitational potential"],a:1,why:"The battery’s chemical store is emptied as the car speeds up."},
   {q:"A ball is thrown upwards. Which store increases as it rises?",opts:["Kinetic","Gravitational potential","Chemical","Elastic potential"],a:1,why:"It gains height, so its gravitational potential store increases while its kinetic store decreases."},
   {q:"A closed system has 500 J of energy. 120 J is transferred from its kinetic store to its thermal store. What is the total energy of the system now?",a:500,unit:"J",tol:0.001,why:"In a closed system the total energy is constant: still 500 J."},
   {q:"Which of these is a way of <b>transferring</b> energy, not a store?",opts:["Thermal","Heating","Nuclear","Elastic"],a:1,why:"Heating is a pathway; thermal is a store."},
   {q:"A car brakes to a stop. Where does the energy from its kinetic store mostly go?",opts:["Gravitational store of the car","Chemical store of the fuel","Thermal store of the brakes and surroundings","Elastic store of the tyres"],a:2,why:"Friction in the brakes heats them; the energy then spreads to the surroundings."}]),
  B.keypoints(["Stores: kinetic, gravitational potential, elastic potential, thermal, chemical, magnetic, electrostatic, nuclear.","Pathways: mechanically (work done by a force), electrically, by heating, by radiation.","In a closed system the total energy is constant: energy is conserved."]),
  B.mistakes(["Calling heat, light or sound a ‘store’: they are ways of transferring energy.","Saying energy is ‘used up’ or ‘lost’: it is transferred, often wastefully to the surroundings.","Forgetting the thermal store of the surroundings in real (non-ideal) transfers."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-en1"); if(!s) return; const S=SC[st.k], kJ=st.k==="car"||st.k==="kettle", u=kJ?"kJ":"J";
  const vals=S.stores.map(([n,c,f])=>[n,f(st.t),c]), max=Math.max(...S.stores.map(([n,c,f])=>Math.max(f(0),f(1))));
  const nw=window.innerWidth<640, bx=nw?0:370, by=nw?285:60;
  let g=`<rect x="10" y="10" width="330" height="240" rx="10" class="fpan ln"/>`+S.pic(st.t);
  g+=`<text x="${bx+10}" y="${by-20}" font-size="15" font-weight="700">Energy stores</text>`+hbars(vals,bx,by,nw?350:520,max,{unit:u,lw:nw?150:170});
  const tot=vals.reduce((a,b)=>a+b[1],0), ty=by+vals.length*32+26;
  g+=`<text x="${bx+10}" y="${ty}" font-size="13" class="tm">Total = ${fx(tot,0)} ${u} (constant)</text>`;
  s.setAttribute("viewBox",nw?`0 0 350 ${ty+14}`:"0 0 900 260");
  s.innerHTML=g; $("#phys-en1-tl").textContent=`${Math.round(st.t*100)} %`; $("#phys-en1-p").textContent=S.path; $("#phys-en1-tot").textContent=`${fx(tot,0)} ${u}`; $("#phys-en1-say").textContent=S.say; $("#phys-en1-t").value=st.t; }
let last=0; function loop(now){ if(st.play&&!$("#lab-phys-en1").hidden){ if(now-last>30){ last=now; st.t=Math.min(1,st.t+0.01); if(st.t>=1) st.play=false; draw(); } } requestAnimationFrame(loop); }
$("#phys-en1-k").addEventListener("change",e=>{ st.k=e.target.value; st.t=0; st.play=false; draw(); });
$("#phys-en1-t").addEventListener("input",e=>{ st.t=+e.target.value; st.play=false; draw(); });
$("#phys-en1-go").addEventListener("click",()=>{ if(st.t>=1) st.t=0; st.play=true; });
draw(); requestAnimationFrame(loop);
})();


</script>
<script>
LEARN.unit="phys-energy";

/* EN2: kinetic and gravitational potential energy */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {v,fr,res,sq}=LAB.W, {eb,R,hbars}=G;
const g0=9.8, st={m:2,h:15,air:false,y:15,run:false,t:0};
const stage=`<svg id="phys-en2" viewBox="0 0 900 260" role="img" aria-label="An object falling from a height, with bar charts of its gravitational, kinetic and thermal energy"></svg>`;
const panel=`<div class="field"><div class="lbl">Mass <b id="phys-en2-ml"></b></div><input type="range" id="phys-en2-m" min="0.5" max="5" step="0.5" value="2" aria-label="Mass"></div>
<div class="field"><div class="lbl">Drop height <b id="phys-en2-hl"></b></div><input type="range" id="phys-en2-h" min="2" max="20" step="1" value="15" aria-label="Height"></div>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="phys-en2-air" style="width:18px;height:18px;accent-color:var(--accent)"> Include air resistance</label>
<div class="btnrow"><button class="btn primary" id="phys-en2-go">Drop</button><button class="btn" id="phys-en2-rs">Reset</button></div>
<div class="readout"><div><span>E<sub>p</sub> at the top = mgh</span><b id="phys-en2-ep">—</b></div><div><span>Speed now</span><b id="phys-en2-v">—</b></div><div><span>Speed at the ground</span><b id="phys-en2-vf">—</b></div></div>
<p class="note" id="phys-en2-msg"></p>`;

lesson({id:"phys-en2",group:"a",num:2,lvl:"6.1.1 · Lesson 2",name:"Kinetic and gravitational potential energy",icon:"ke",
 eyebrow:eb("6.1.1.2 Changes in energy",2),title:"Kinetic and gravitational potential energy",
 intro:"Moving objects have energy in their kinetic store, and raised objects have energy in their gravitational potential store. Two equations let you calculate these, and conservation of energy links them together.",
 outcomes:[["Calculate the kinetic energy of a moving object using E<sub>k</sub> = ½mv²","6.1.1.2"],["Calculate the change in gravitational potential energy using E<sub>p</sub> = mgh","6.1.1.2"],["Use conservation of energy to calculate the speed of a falling object","6.1.1.2"]],
 blocks:[
  B.text("Kinetic energy",`<p>The kinetic energy of a moving object depends on its mass and its speed:</p>`+B.eq(`${v("E","k")} = ½ ${v("m")}${v("v")}² ${R}`,`<small>E<sub>k</sub> in joules (J), m in kilograms (kg), v in metres per second (m/s)</small>`)+`<p>Because the speed is squared, doubling the speed makes the kinetic energy <b>four times</b> as big. Doubling the mass only doubles it.</p>`),
  B.text("Gravitational potential energy",`<p>When an object is lifted, energy is transferred to its gravitational potential store:</p>`+B.eq(`${v("E","p")} = ${v("m")}${v("g")}${v("h")} ${R}`,`<small>m in kg, g = gravitational field strength (9.8 N/kg on Earth), h = change in height in metres (m)</small>`)+`<p>On the Moon g is only 1.6 N/kg, so lifting the same object through the same height stores far less energy.</p>`),
  B.text("Falling objects",`<p>If air resistance is negligible, all the energy lost from the gravitational store goes to the kinetic store:</p>`+B.eq(`${v("m")}${v("g")}${v("h")} = ½ ${v("m")}${v("v")}²  ⇒  ${v("v")} = ${sq("2"+v("g")+v("h"))}`)+`<p>The mass cancels, so (without air resistance) every object dropped from the same height lands at the same speed. With air resistance, some energy is dissipated to the thermal store of the surroundings and the object lands more slowly.</p>`),
  B.sim("phys-en2-sim","Dropping an object",stage,panel,`<span>Change the mass and height, then drop</span><span>Bars show the energy stores</span>`),
  B.example("Speed of a falling ball","A 0.50 kg ball is dropped from a height of 5.0 m. Calculate its speed just before it hits the ground. Ignore air resistance. (g = 9.8 N/kg)",[

   ["Square root","",[`${v("v")} = √98 = ${res("9.9 m/s")}`]]]),

   {q:"A 1200 kg car has 60 000 J of kinetic energy. Calculate its speed.",a:10,unit:"m/s",tol:0.01,why:"v² = 2 × 60 000 / 1200 = 100, so v = 10 m/s."},
   {q:"A 15 kg suitcase is lifted onto a shelf 1.6 m high. Calculate the energy transferred to its gravitational potential store. (g = 9.8 N/kg)",a:235.2,unit:"J",tol:0.01,why:"E<sub>p</sub> = 15 × 9.8 × 1.6 = 235 J."},
   {q:"The speed of a cyclist doubles. What happens to her kinetic energy?",opts:["It doubles","It halves","It becomes four times as big","It stays the same"],a:2,why:"E<sub>k</sub> ∝ v², so 2² = 4 times."},
   {q:"A stone falls 20 m from rest. Ignoring air resistance, calculate its speed when it hits the ground. (g = 9.8 N/kg)",a:19.8,unit:"m/s",tol:0.01,why:"v = √(2gh) = √(2 × 9.8 × 20) = 19.8 m/s."},
   {q:"A 60 kg climber gains 5880 J of gravitational potential energy. How high has she climbed? (g = 9.8 N/kg)",a:10,unit:"m",tol:0.01,why:"h = E<sub>p</sub>/(mg) = 5880 / 588 = 10 m."}]),
  B.keypoints(["E<sub>k</sub> = ½mv²: kinetic energy depends on speed squared.","E<sub>p</sub> = mgh: h is the change in height; g = 9.8 N/kg on Earth.","Without air resistance, energy lost from the gravitational store = energy gained by the kinetic store, so v = √(2gh)."]),
  B.mistakes(["Forgetting to square the speed, or squaring the ½ as well.","Using mass in grams: always convert to kilograms.","Forgetting to take the square root at the end when finding a speed."])
 ],onShow:()=>draw()});

const vNow=()=>{ const drop=st.h-st.y, loss=st.air?0.18*drop/st.h:0; return Math.sqrt(Math.max(0,2*g0*drop*(1-loss))); };
function draw(){ const s=$("#phys-en2"); if(!s) return; const nw=window.innerWidth<640, bx=nw?0:370, by=nw?285:70;
  const Ep0=st.m*g0*st.h, Ep=st.m*g0*st.y, vv=vNow(), Ek=0.5*st.m*vv*vv, Th=Math.max(0,Ep0-Ep-Ek);
  const Y=h=>230-h*10;

  g+=`<path d="M54 ${Y(20)} V230" class="mut" stroke-width="1.5"/><text x="20" y="22" font-size="11" class="tmut">h / m</text>`;
  g+=`<path d="M120 ${Y(st.h)-12} h80" class="mut" stroke-dasharray="4 4"/><circle cx="170" cy="${(Y(st.y)-Math.min(12,8+st.m)).toFixed(1)}" r="${(8+st.m*1.4).toFixed(1)}" class="facc"/>`;
  if(vv>0.2) g+=`<text x="200" y="${(Y(st.y)-6).toFixed(1)}" font-size="12" class="tm">v = ${fx(vv,1)} m/s</text>`;

  s.setAttribute("viewBox",nw?`0 0 350 ${ty+14}`:"0 0 900 260"); s.innerHTML=g;

  const vf=Math.sqrt(2*g0*st.h*(st.air?0.82:1)); $("#phys-en2-vf").textContent=`${fx(vf,1)} m/s`;
  $("#phys-en2-msg").textContent=st.air?"With air resistance some energy is dissipated to the thermal store of the air, so the landing speed is lower than √(2gh).":"With no air resistance the landing speed √(2gh) does not depend on the mass: try changing it."; }
let last=0; function loop(now){ if(st.run&&!$("#lab-phys-en2").hidden&&now-last>25){ const dt=(now-last)/1000; last=now; st.t+=Math.min(dt,0.05)*0.6; st.y=Math.max(0,st.h-0.5*g0*(st.air?0.82:1)*st.t*st.t); if(st.y<=0) st.run=false; draw(); } else if(!st.run) last=now; requestAnimationFrame(loop); }

<script>
