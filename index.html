<style>
/* Layout: practical switcher, then each lab = live apparatus stage beside a control panel, with results and worked solutions underneath */
:root{
  --bg:#e9edee; --panel:#fbfcfc; --sunk:#dfe5e7; --ink:#162024; --muted:#54636a; --line:#cbd5d9;
  --accent:#c4531a; --accent-soft:#f6e3d8; --on-accent:#ffffff; --data:#1b6788; --good:#2c7a4c; --bad:#b1352a;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,2.8vw,1.95rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{flex:none}
.brand p{color:var(--muted);font-size:.95rem}
.switcher{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.prac{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .15s}
.prac:hover{border-color:var(--muted)}
.prac:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prac[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prac .ico{grid-row:span 2;width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.prac .lvl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prac .nm{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.08rem;line-height:1.15}

/* lab layout */
.lab{display:flex;flex-direction:column;gap:18px}
.lab-head{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:960px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:var(--r);overflow:hidden;background:#1d2224;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.35);position:relative;min-width:0}
.stage svg,.stage canvas{display:block;width:100%;height:auto}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;background:#15191b;color:#c9d2d5;font-family:var(--f-mono);font-size:.74rem}
.stage-bar b{color:#fff;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl i,.lbl output i{text-transform:none;font-family:Georgia,serif;font-size:1.1em}
.lbl output{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none}
.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c1{grid-template-columns:minmax(0,1fr)}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.2;min-height:38px;background:var(--panel)}
.opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.opt input:disabled + span{opacity:.45;cursor:not-allowed}
.sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
input[type=number]{width:84px;font-family:var(--f-mono);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{accent-color:var(--accent);width:17px;height:17px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.step-tag{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.readout div{background:var(--sunk);padding:7px 10px;display:flex;flex-direction:column}
.readout span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.readout b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600}
.readout.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:520px){.readout.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* lower area */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600;text-align:right}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono);font-size:.86rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);font-size:.92rem;padding:10px 0}
.results-tables{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
@media (max-width:620px){.results-tables{grid-template-columns:minmax(0,1fr)}}
.graph{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px;padding-top:8px;font-size:.96rem}
.prose ol,.prose ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.vars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.vars dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.vars dd{margin:0}
.ans{background:var(--sunk);border-radius:8px;padding:8px 12px}

/* worked solution */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.chip span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.chip.key{border-color:var(--accent);background:var(--accent-soft)}
.work{display:flex;flex-direction:column;gap:12px}
.wstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.wstep .n{grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.wstep h4{margin:4px 0 0;font-family:var(--f-display);font-stretch:85%;font-size:1.02rem}
.wstep .why{color:var(--muted);font-size:.92rem}
.eqs{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding:2px 0}
.eq{font-family:var(--f-mono);font-size:.9rem;display:flex;align-items:center;flex-wrap:nowrap;gap:.35em;white-space:nowrap}
.eq .tx{white-space:normal;min-width:0;flex:1 1 auto;line-height:1.5}
.eq i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.eq .res{background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:0 6px;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25}
.fr > span{padding:0 3px}
.fr > span:first-child{border-bottom:1.5px solid currentColor}
.sq{display:inline-flex;align-items:flex-start}
.sq > span{border-top:1.5px solid currentColor;padding:1px 3px 0}
.veiled{position:relative}
.veiled > .veil-body{filter:blur(7px);user-select:none;pointer-events:none}
.veil-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;font-weight:600}
.veiled > .veil-msg{display:grid}
.veil-msg span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:34ch}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.preset{all:unset;cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.35}
.preset:hover{border-color:var(--accent)}
.preset:focus-visible{outline:2px solid var(--accent)}
.preset b{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.pred{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pred label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.pred input{width:100%}
.pred-res{font-size:.92rem}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}

/* navigation groups */
.nav{display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:8px}
.navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.prac .ico{width:36px;height:36px;color:var(--ink)}
.prac[aria-selected="true"] .ico{background:var(--accent);color:var(--on-accent)}
/* revealable answers */
details.reveal{border:0;padding:0}
details.reveal summary{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);justify-content:flex-start;gap:6px}
details.reveal summary::after{content:""}
details.reveal summary::before{content:"▸"}
details.reveal[open] summary::before{content:"▾"}
details.reveal .ans{margin-top:6px}
/* tables */
td.xc{width:28px;padding:2px 4px}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:3px 6px;border-radius:5px}
button.x:hover{background:var(--sunk);color:var(--bad)}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.readout.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.readout.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:.9rem;line-height:1.25;min-height:40px}
.steps button .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.steps button.done{color:var(--muted)}
.steps button.done .k{background:var(--good);border-color:var(--good);color:#fff}
.steps button.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.steps button.next .k{border-color:var(--accent);color:var(--accent)}
.steps button:disabled{cursor:not-allowed;opacity:.55}
.schem{background:var(--sunk);border-radius:8px;padding:8px;display:flex;justify-content:center}
.schem svg{width:100%;max-width:300px;height:auto}
.schem svg *{stroke:var(--ink)}
.schem svg text{fill:var(--ink);stroke:none}
.note{font-size:.88rem;color:var(--muted)}
.warn{font-size:.88rem;color:var(--bad);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stage canvas{touch-action:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.listmode .navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.listmode .prac{grid-template-columns:auto 1fr;align-items:start;align-content:start;padding:14px 16px}
.listmode .prac .ico{grid-row:span 3}
.listmode .prac .desc{grid-column:2;font-size:.88rem;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.listmode .prac:hover{border-color:var(--accent)}
#list-intro{margin:-4px 0 14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 18px}
.pnav.bot{margin:22px 0 6px}
.pnav .btn{min-height:40px;padding:6px 14px;width:auto}
.pnav .pn-pos{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pnav .pn-sp{flex:1}
.pnav .pn-t{display:inline-block;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.pnav.top{position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.06)}
@media (max-width:640px){.pnav.top{position:static}.pnav .pn-t{max-width:11ch}.pnav .pn-sp{display:none}.pnav .pn-pos{order:-1;flex-basis:100%}.pnav .pn-list{flex:1 1 100%}.pnav .pn-prev,.pnav .pn-next{flex:1 1 40%}.listmode .navgroup .switcher{grid-template-columns:1fr}}
</style><style>
/* ---------- learning pages ---------- */
.lsec{display:flex;flex-direction:column;gap:18px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.lcard>h3{font-size:1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lcard>h3 .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:3px 7px;border-radius:5px;font-weight:600;font-stretch:normal}
.lcard>h3 .kind.k-sim{background:var(--data);color:#fff}
.lcard>h3 .kind.k-ex{background:#6b4fa0;color:#fff}
.lcard>h3 .kind.k-chk{background:var(--good);color:#fff}
.lcard>h3 .kind.k-prac{background:#8a6234;color:#fff}
.prose{font-size:1.02rem;line-height:1.6}
.prose p{margin:0 0 .75em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:.2em 0 .8em;padding-left:1.3em}.prose li{margin:.25em 0}
.prose b{font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.fig{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;line-height:1.4}
.lo{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.lo li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:1rem}
.lo li::before{content:"";width:14px;height:14px;margin-top:4px;border:2px solid var(--accent);border-radius:4px}
.lo .ref{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:6px}
.eqbox{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.eqbox>div{font-family:var(--f-mono);font-size:1.02rem;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 14px;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.eqbox>div small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:6px}
.kp{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.kp li{padding:8px 12px;border-radius:6px;background:var(--sunk);border-left:4px solid var(--good)}
.kp.kbad li{border-left-color:var(--bad)}
.kp li b{font-weight:700}
.ex .exq{font-size:1.02rem;padding:10px 14px;background:var(--sunk);border-radius:8px;margin-bottom:12px}
.ex .exs{display:flex;flex-direction:column;gap:10px}
.ex .exs .wstep[hidden]{display:none}
.ex .exbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ex .exbtns .btn{width:auto;min-height:38px;padding:6px 14px}
.qz{display:flex;flex-direction:column;gap:14px}

function linfit(pts){ const n=pts.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0; pts.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}); const d=n*sxx-sx*sx; if(Math.abs(d)<1e-12) return null; const m=(n*sxy-sx*sy)/d; return {m,c:(sy-m*sx)/n}; }
function triX(xs){ const a=Math.min(...xs), b=Math.max(...xs), i=(b-a)*.1, st=nice(b-a,10); let xa=Math.ceil((a+i)/st)*st, xb=Math.floor((b-i)/st)*st; if(xb<=xa){xa=a;xb=b;} return [xa,xb]; }
/* worst-fit line through the error bars of the end points; returns the line whose gradient differs most from best */
function worst(pts,ey,best){ const P=pts.map((p,i)=>[p[0],p[1],Array.isArray(ey)?ey[i]:ey]).sort((a,b)=>a[0]-b[0]); if(P.length<2) return null;
  const a=P[0], b=P[P.length-1]; const l1=[[a[0],a[1]+a[2]],[b[0],b[1]-b[2]]], l2=[[a[0],a[1]-a[2]],[b[0],b[1]+b[2]]];
  const mk=l=>{ const m=(l[1][1]-l[0][1])/(l[1][0]-l[0][0]); return {m,c:l[0][1]-m*l[0][0]}; }; const A=mk(l1), B=mk(l2);
  const W=Math.abs(A.m-best.m)>Math.abs(B.m-best.m)?A:B; return {...W,pc:Math.abs(W.m-best.m)/Math.abs(best.m)*100}; }
function nice(span,n=6){ if(!(span>0)) return 1; const raw=span/n, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p; }

/* thermometer: returns svg; setThermo(id,T) moves the column. visible scale from yTop+14 to yTop+scaleLen */
const thermoMap={};
C.thermo=(x,yTop,len,id,{tMin=-10,tMax=110,scaleLen=null}={})=>{
  const s0=yTop+14, s1=yTop+(scaleLen||len-40), k=(s1-s0)/(tMax-tMin), bot=yTop+len-12;
  thermoMap[id]={y:T=>s1-(T-tMin)*k,bot};
  let ticks=""; for(let T=tMin;T<=tMax;T++){ const y=(s1-(T-tMin)*k).toFixed(2), L=T%10===0?5.5:T%5===0?3.8:2.2;
    if(k<1.2&&T%5&&T%10) continue;
    ticks+=`<line x1="${x-2}" x2="${x-2+L}" y1="${y}" y2="${y}" stroke="#1d1d1d" stroke-width="${T%10===0?.55:.35}"/>`;
    if(T%20===0) ticks+=`<text x="${x+7}" y="${(+y+1.6).toFixed(2)}" font-size="4.4" text-anchor="end" font-family="Arial" fill="#1d1d1d">${T}</text>`; }
  return `<g><rect x="${x-8}" y="${yTop}" width="16" height="${len}" rx="8" fill="url(#g-thGlass)" stroke="#9fb6be" stroke-width=".6"/>
<rect x="${x-2}" y="${s0-4}" width="9" height="${s1-s0+8}" rx="1" fill="#f7f5ec" opacity=".95"/>${ticks}
<rect x="${x-4.6}" y="${yTop+6}" width="2.2" height="${len-12}" fill="#fff" opacity=".65"/>
<rect id="${id}" x="${x-4.4}" y="${s1}" width="1.8" height="${bot-s1}" fill="url(#g-red)"/>
<ellipse cx="${x}" cy="${bot+2}" rx="6.5" ry="11" fill="#d42a22" stroke="#8f1414" stroke-width=".8"/><ellipse cx="${x-2}" cy="${bot-2}" rx="2" ry="4.5" fill="#fff" opacity=".55"/>
<rect x="${x-6.5}" y="${yTop}" width="3" height="${len-10}" rx="1.5" fill="#fff" opacity=".45"/></g>`; };

/* wooden rule. horizontal: from (x,y) length len px for cm cm; vertical if vert */
C.rule=(x,y,lenCm,px,{vert=false,w=26,label="",major=10,from=0}={})=>{ const L=lenCm*px; let t="";
  const mm=px>=7;
  for(let i=0;i<=lenCm*(mm?10:2);i++){ const cm=i/(mm?10:2), p=(cm*px).toFixed(2), isCm=Math.abs(cm-Math.round(cm))<1e-6, half=Math.abs(cm*2-Math.round(cm*2))<1e-6;
    const l=isCm?(Math.round(cm)%major===0?w*.5:w*.36):half?w*.26:w*.16;
    t+=vert?`<line x1="${x}" x2="${x+l}" y1="${y+ +p}" y2="${y+ +p}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`:`<line x1="${x+ +p}" x2="${x+ +p}" y1="${y}" y2="${y+l}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`;
    const step=px>=14?1:px>=6?5:10;
    if(isCm&&Math.round(cm)%step===0){ const v=Math.round(cm)+from; t+=vert?`<text x="${x+w*.62}" y="${y+ +p+3}" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`:`<text x="${x+ +p}" y="${y+w*.86}" text-anchor="middle" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`; } }
  return vert?`<rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="url(#g-woodV)" filter="url(#g-woodgrain)"/><rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}${label?`<text x="${x+w*.5}" y="${y+L*.5}" font-family="Arial" font-size="6" fill="#6b4e1f" transform="rotate(90 ${x+w*.5} ${y+L*.5})" text-anchor="middle">${label}</text>`:""}`
   :`<rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="url(#g-wood)" filter="url(#g-woodgrain)"/><rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}`; };

/* ---------------- canvas graph ---------------- */
function plot(cv,o){
  if(!cv||!cv.offsetParent) return null;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), panel=css("--panel"), mono=css("--f-mono");
  const S=(o.series||[]).filter(s=>s.pts&&s.pts.length);
  const all=S.flatMap(s=>s.pts);
  const rng=(ax,i)=>{ let lo=ax.min, hi=ax.max; const vals=all.map(p=>p[i]);
    if(lo==null) lo=vals.length?Math.min(...vals):(ax.def||[0,10])[0]; if(hi==null) hi=vals.length?Math.max(...vals):(ax.def||[0,10])[1];
    if(ax.zero!==false){ if(ax.min==null) lo=Math.min(0,lo); if(ax.max==null) hi=Math.max(0,hi); }
    if(hi-lo<1e-9){ hi=lo+(ax.span||1); }
    const st=nice(hi-lo,ax.n||6); if(ax.min==null) lo=Math.floor(lo/st+1e-9)*st; if(ax.max==null) hi=Math.ceil(hi/st-1e-9)*st; if(hi<=lo) hi=lo+st;
    return [lo,hi,nice(hi-lo,ax.n||6)]; };
  const [x0,x1,xs]=rng(o.x,0), [y0,y1,ys]=rng(o.y,1);
  const L=58,R=16,T=16,B=44, pw=w-L-R, ph=h-T-B;
  const X=v=>L+(v-x0)/(x1-x0)*pw, Y=v=>T+(y1-v)/(y1-y0)*ph;
  const dec=st=>Math.max(0,-Math.floor(Math.log10(st)+1e-9));
  c.lineWidth=1;
  for(let v=x0;v<=x1+xs*1e-6;v+=xs/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-x0)/xs)-Math.round((v-x0)/xs))<1e-6?1:.45; c.beginPath(); c.moveTo(Math.round(X(v))+.5,T); c.lineTo(Math.round(X(v))+.5,T+ph); c.stroke(); }
  for(let v=y0;v<=y1+ys*1e-6;v+=ys/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-y0)/ys)-Math.round((v-y0)/ys))<1e-6?1:.45; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); }
  c.globalAlpha=1; c.strokeStyle=mut; c.lineWidth=1.4;
  const ax0=(x0<=0&&x1>=0)?X(0):L, ay0=(y0<=0&&y1>=0)?Y(0):T+ph;
  c.beginPath(); c.moveTo(ax0,T); c.lineTo(ax0,T+ph); c.moveTo(L,ay0); c.lineTo(L+pw,ay0); c.stroke();
  c.fillStyle=mut; c.font=`11.5px ${mono}`; c.textAlign="center"; c.textBaseline="top";
  for(let v=x0;v<=x1+xs*1e-6;v+=xs) c.fillText((Math.abs(v)<xs*1e-6?0:v).toFixed(dec(xs)),X(v),T+ph+6);
  c.fillText(o.x.label,L+pw/2,T+ph+24);
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=y0;v<=y1+ys*1e-6;v+=ys) c.fillText((Math.abs(v)<ys*1e-6?0:v).toFixed(dec(ys)),L-6,Y(v));
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.y.label,0,0); c.restore();
  if(!S.length&&!(o.fits||[]).length){ c.textAlign="center"; const msg=o.empty||"Readings will be plotted here"; if(c.measureText(msg).width>pw-16){ const w=msg.split(" "), h=Math.ceil(w.length/2); c.fillText(w.slice(0,h).join(" "),L+pw/2,T+ph/2-8); c.fillText(w.slice(h).join(" "),L+pw/2,T+ph/2+8); } else c.fillText(msg,L+pw/2,T+ph/2); return null; }
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  (o.fits||[]).forEach(f=>{ c.strokeStyle=f.col||ink; c.lineWidth=1.6; c.globalAlpha=.9; c.setLineDash(f.dash||[]); c.beginPath();
    if(f.fn){ for(let i=0;i<=120;i++){ const xv=f.x0+(f.x1-f.x0)*i/120; const yv=f.fn(xv); i?c.lineTo(X(xv),Y(yv)):c.moveTo(X(xv),Y(yv)); } }
    else { c.moveTo(X(f.x0),Y(f.m*f.x0+f.c)); c.lineTo(X(f.x1),Y(f.m*f.x1+f.c)); }
    c.stroke(); c.setLineDash([]); c.globalAlpha=1; });
  if(o.tri){ const t=o.tri, ya=t.m*t.xa+t.c, yb=t.m*t.xb+t.c; c.strokeStyle=css("--data"); c.fillStyle=css("--data"); c.lineWidth=1.3; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(X(t.xa),Y(ya)); c.lineTo(X(t.xb),Y(ya)); c.lineTo(X(t.xb),Y(yb)); c.stroke(); c.setLineDash([]);
    c.font=`600 11px ${mono}`; c.textAlign="center"; c.textBaseline="top"; c.fillText(t.dxl||"Δx",(X(t.xa)+X(t.xb))/2,Y(ya)+(yb>ya?4:-16));
    const dw=c.measureText(t.dyl||"Δy").width; const right=X(t.xb)+8+dw<L+pw; c.textAlign=right?"left":"right"; c.textBaseline="middle"; c.fillText(t.dyl||"Δy",X(t.xb)+(right?5:-5),(Y(ya)+Y(yb))/2); }
  S.forEach(s=>{
    const pts=s.sort===false?s.pts:s.pts.slice().sort((a,b)=>a[0]-b[0]);
    if(s.join){ c.strokeStyle=s.col; c.lineWidth=1.8; c.globalAlpha=.85; c.beginPath();
      const P=pts.map(([a,b])=>[X(a),Y(b)]);
      P.forEach((p,i)=>{ if(!i){ c.moveTo(p[0],p[1]); return; } if(s.join!=="curve"){ c.lineTo(p[0],p[1]); return; }
        const p0=P[i-2]||P[i-1], p1=P[i-1], p3=P[i+1]||p; c.bezierCurveTo(p1[0]+(p[0]-p0[0])/6,p1[1]+(p[1]-p0[1])/6,p[0]-(p3[0]-p1[0])/6,p[1]-(p3[1]-p1[1])/6,p[0],p[1]); });
      c.stroke(); c.globalAlpha=1; }
    c.strokeStyle=s.col; c.lineWidth=1.7;
    if(s.ey||s.ex){ c.lineWidth=1.1; c.globalAlpha=.75; s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv), ey=s.ey?(Array.isArray(s.ey)?s.ey[i]:s.ey):0, ex=s.ex?(Array.isArray(s.ex)?s.ex[i]:s.ex):0;
      if(ey){ const y1=Y(yv+ey), y2=Y(yv-ey); c.beginPath(); c.moveTo(x,y1); c.lineTo(x,y2); c.moveTo(x-4,y1); c.lineTo(x+4,y1); c.moveTo(x-4,y2); c.lineTo(x+4,y2); c.stroke(); }
      if(ex){ const x1=X(xv-ex), x2=X(xv+ex); c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.moveTo(x1,y-4); c.lineTo(x1,y+4); c.moveTo(x2,y-4); c.lineTo(x2,y+4); c.stroke(); } }); c.globalAlpha=1; c.lineWidth=1.7; }
    if(!s.noPts) s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv),k=3.8; const hl=s.mark&&s.mark[i]; c.globalAlpha=hl?.35:1; c.beginPath(); c.moveTo(x-k,y-k); c.lineTo(x+k,y+k); c.moveTo(x+k,y-k); c.lineTo(x-k,y+k); c.stroke(); if(hl){ c.beginPath(); c.arc(x,y,7,0,Math.PI*2); c.stroke(); } c.globalAlpha=1; });
  });
  c.restore();

 example:(title,q,steps)=>{ const id="ex"+(++qid); return `<div class="lcard ex" id="${id}"><h3>${kind("k-ex","Worked example")}${title}</h3><div class="exq">${q}</div><div class="exs">${steps.map(([t,why,eqs],i)=>W.step(i+1,t,why,eqs).replace('<div class="wstep"',`<div class="wstep" ${i?"hidden":""}`)).join("")}</div><div class="exbtns"><button class="btn primary" data-exnext="${id}">Show next step</button><button class="btn" data-exall="${id}">Show all steps</button></div></div>`; },
 keypoints:(list,title="Key points")=>`<div class="lcard"><h3>${title}</h3><ul class="kp">${list.map(x=>`<li>${x}</li>`).join("")}</ul></div>`,
 mistakes:(list)=>`<div class="lcard"><h3>Common mistakes</h3><ul class="kp kbad">${list.map(x=>`<li>${x}</li>`).join("")}</ul></div>`,
 practical:(html,label)=>`<div class="lcard"><h3>${kind("k-prac","Practical")}${label}</h3><div class="prac-link"><div class="prose" style="flex:1 1 320px">${html}</div></div></div>`,
 check:(qs,title="Check your understanding")=>{ const id="qz"+(++qid); QZ[id]=qs;
  return `<div class="lcard" id="${id}"><h3>${kind("k-chk","Check")}${title} <span class="qscore" id="${id}-score"></span></h3><div class="qz">${qs.map((q,i)=>{ const n=`${id}-${i}`;
   const body=q.opts?`<div class="qo">${q.opts.map((o,j)=>`<label><input type="radio" name="${n}" value="${j}"><span>${o}</span></label>`).join("")}</div>`:`<div class="qnum"><input type="text" inputmode="decimal" id="${n}-in" aria-label="Your answer" autocomplete="off"><span>${q.unit||""}</span></div>`;
   return `<div class="qi" data-q="${n}"><div class="qq"><b class="qn">${i+1}</b>${q.q}</div>${body}<div class="qact"><button class="btn primary" data-chk="${n}">Check</button><button class="btn" data-show="${n}">Show answer</button></div><div class="qfb" id="${n}-fb" hidden></div></div>`; }).join("")}</div></div>`; }
};
const QZ={}, STATE={};
/* check-question results are kept on this device (for the optional progress report) */
const CKEY="learn-gcse-combined-check-state", CSAVED=store.get(CKEY)||{};
function qkey(qid){ const el=document.querySelector(`[data-q="${qid}"]`), sec=el&&el.closest("section.lab"); if(!sec) return null; return sec.id.slice(4)+":"+[...sec.querySelectorAll(".qi")].indexOf(el); }
function persist(qid){ const k=qkey(qid); if(!k) return; CSAVED[k]=STATE[qid]; store.set(CKEY,CSAVED); }
let restored=false;
function restore(){ restored=true; document.querySelectorAll("section.lab .qi[data-q]").forEach(el=>{ const qid=el.dataset.q, k=qkey(qid); if(k&&CSAVED[k]) STATE[qid]=CSAVED[k]; }); Object.keys(QZ).forEach(id=>{ if(document.getElementById(id)&&QZ[id].some((_,i)=>STATE[`${id}-${i}`])) score(id); }); }

/* parse a typed number: accepts 1.2e3, 1.2×10^3, 1.2 x 10^-3, commas */
function num(s){ return NumericTools.parseNumber(s); }
function grade(qid){ const [id,i]=qid.split(/-(?=\d+$)/), q=QZ[id][+i], fb=$(`#${qid}-fb`); let ok=false, ans;
  if(q.opts){ const sel=$(`input[name="${qid}"]:checked`); if(!sel){ fb.hidden=false; fb.className="qfb nok"; fb.innerHTML="Choose an answer first."; return; } ans=+sel.value; ok=ans===q.a;
    $$(`[data-q="${qid}"] .qo label`).forEach((l,j)=>{ l.classList.toggle("right",ok&&j===q.a); l.classList.toggle("wrong",!ok&&j===ans); }); }
  else { const v=num($(`#${qid}-in`).value); if(isNaN(v)){ fb.hidden=false; fb.className="qfb nok"; fb.innerHTML="Enter a number or expression, such as 1/2, sqrt(2) or 3.2e-3."; return; }
    const tol=q.tol??0.02; ok=NumericTools.matches(v,q.a,tol,q.abs||0); }
  fb.hidden=false; fb.className="qfb "+(ok?"ok":"nok"); fb.innerHTML=(ok?"<b>Correct.</b> ":"<b>Not quite.</b> ")+(ok?(q.why||""):(q.hint?q.hint+" ":"")+"Try again, or show the answer.");
  STATE[qid]=ok||STATE[qid]==="shown"?(ok?"ok":"shown"):"no"; persist(qid); score(id); }
function reveal(qid){ const [id,i]=qid.split(/-(?=\d+$)/), q=QZ[id][+i], fb=$(`#${qid}-fb`);
  if(q.opts) $$(`[data-q="${qid}"] .qo label`).forEach((l,j)=>l.classList.toggle("right",j===q.a));
  fb.hidden=false; fb.className="qfb ok"; fb.innerHTML=`<b>Answer: ${q.opts?q.opts[q.a]:`${q.show??q.a} ${q.unit||""}`}</b>. ${q.why||""}`; if(STATE[qid]!=="ok") STATE[qid]="shown"; persist(qid); score(id); }
function score(id){
  const relevant=(key)=>!document.querySelector(`[data-q="${key}"]`)?.hidden;
  const active=QZ[id].map((q,i)=>`${id}-${i}`).filter(relevant), n=active.length, ok=active.filter(k=>STATE[k]==="ok").length;
  $(`#${id}-score`).textContent=`${ok} / ${n} correct`;
  const sec=$(`#${id}`).closest("section.lab"); if(!sec) return;
  const all=$$(`#${sec.id} .lcard[id^="qz"]`).every(c=>QZ[c.id].every((_,i)=>!relevant(`${c.id}-${i}`)||STATE[`${c.id}-${i}`]==="ok"));
  const lid=sec.id.slice(4);
  if(all&&n){ done.add(lid); } else { done.delete(lid); $(`#tab-${lid}`)?.classList.remove("done"); }
  store.set(DONEKEY,[...done]); mark();
 }
function mark(){ if(!restored) restore(); done.forEach(id=>{ const t=$("#tab-"+id); if(t) t.classList.add("done"); }); }

document.addEventListener("click",e=>{ const t=e.target.closest("[data-chk],[data-show],[data-exnext],[data-exall]"); if(!t) return;
  if(t.dataset.chk) grade(t.dataset.chk); else if(t.dataset.show) reveal(t.dataset.show);
  else if(t.dataset.exnext){ const h=$$(`#${t.dataset.exnext} .wstep[hidden]`); if(h[0]) h[0].hidden=false; if(h.length<=1){ t.disabled=true; } }
  else if(t.dataset.exall){ $$(`#${t.dataset.exall} .wstep`).forEach(s=>s.hidden=false); $(`#${t.dataset.exall} [data-exnext]`).disabled=true; } });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches(".qnum input")){ const q=e.target.closest(".qi"); grade(q.dataset.q); } });

function lesson(cfg){
  const s=document.createElement("section"); s.className="lab"; s.id="lab-"+cfg.id; s.hidden=true;
  s.innerHTML=`<div class="lab-head"><span class="eyebrow">${cfg.eyebrow}</span><h2>${cfg.title}</h2><p class="muted">${cfg.intro}</p></div>
<div class="lsec"><div class="lcard"><h3>By the end of this lesson you should be able to</h3><ul class="lo">${cfg.outcomes.map(([t,r])=>`<li><span>${t}${r?`<span class="ref">${r}</span>`:""}</span></li>`).join("")}</ul></div>
${cfg.blocks.join("\n")}</div>`;
  $(".wrap").appendChild(s);
  LAB.register({id:cfg.id,group:(API.unit?API.unit+":":"")+cfg.group,unit:API.unit||null,num:cfg.num,lvl:cfg.lvl,name:cfg.name,tag:cfg.tag||null,icon:"l-"+cfg.icon,onShow:cfg.onShow||null});
  return s;
}
/* force arrow: from (x1,y1) to (x2,y2); col = css class suffix (acc,dat,gd,bd,ink) */
function arr(x1,y1,x2,y2,col="acc",lab="",w=3.5,lx=8,ly=-6){ const L=Math.hypot(x2-x1,y2-y1); if(L<1) return ""; const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI, hl=Math.min(13,L*.6);
  const xe=x2-Math.cos(a*Math.PI/180)*hl*.6, ye=y2-Math.sin(a*Math.PI/180)*hl*.6;
  return `<g><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${xe.toFixed(1)}" y2="${ye.toFixed(1)}" class="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M0 0 L${-hl} ${-hl*.45} L${-hl} ${hl*.45}Z" class="f${col==="ink"?"ink":col}" transform="translate(${x2.toFixed(1)} ${y2.toFixed(1)}) rotate(${a.toFixed(1)})"/>${lab?`<text x="${(x2+lx).toFixed(1)}" y="${(y2+ly).toFixed(1)}" font-size="13" font-weight="700" class="t${col==="ink"?"":col}">${lab}</text>`:""}</g>`; }
const asp=a=>window.innerWidth<640?Math.max(a,.68):a;
const API={B,lesson,mark,num,done,QZ,STATE,CSAVED,arr,asp,unit:null,updateTier:()=>Object.keys(QZ).forEach(score)}; return API;
})();

</script>

 dopplerb:'<path d="M3 18c4-1 8-1 18-6"/><circle cx="9" cy="16" r="1.5" fill="currentColor"/><circle cx="15" cy="14" r="1.5" fill="currentColor"/><path d="M4 4l6 6M7 4h3v3"/>'
}).forEach(([k,v])=>LAB.ICONS["l-"+k]=v);

<script>
/* Exam-style questions: self-marked against OCR-style mark schemes */
window.EXAM=(()=>{
const {$,$$,store}=LAB, {num}=LEARN;
const KEY="learn-gcse-combined-motion-exam", saved=store.get(KEY)||{};
const save=()=>store.set(KEY,saved);
const CARDS={}, PARTS={};
const kind=`<span class="kind k-exam">Exam</span>`;
const L="abcdefghij";

/* simple graph for question figures */
function graph(o){ const w=o.w||440,h=o.h||270,ml=52,mr=14,mt=14,mb=46,pw=w-ml-mr,ph=h-mt-mb,y0=o.ymin||0;
  const X=x=>ml+x/o.xmax*pw, Y=y=>mt+(o.ymax-y)/(o.ymax-y0)*ph; let g="";
  for(let x=0;x<=o.xmax+1e-9;x+=o.xs){ const lab=Math.round(x/o.xs)%(o.xl||1)===0; g+=`<line x1="${X(x)}" y1="${mt}" x2="${X(x)}" y2="${mt+ph}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${X(x)}" y="${mt+ph+17}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${+x.toFixed(2)}</text>`; }
  for(let y=y0;y<=o.ymax+1e-9;y+=o.ys){ const lab=Math.round((y-y0)/o.ys)%(o.yl||1)===0; g+=`<line x1="${ml}" y1="${Y(y)}" x2="${ml+pw}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${ml-7}" y="${Y(y)+4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${+y.toFixed(2)}</text>`; }
  g+=`<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" style="stroke:var(--ink)" stroke-width="1.5"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  (o.lines||[]).forEach(p=>g+=`<polyline points="${p.map(([x,y])=>`${X(x)},${Y(y)}`).join(" ")}" fill="none" style="stroke:var(--data)" stroke-width="2.6" stroke-linejoin="round"/>`);
  g+=`<text x="${ml+pw/2}" y="${h-6}" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.xt}</text><text transform="translate(14 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.yt}</text>`;
  return `<figure><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||"Graph"}">${g}</svg>${o.cap?`<figcaption class="muted" style="font-size:.85rem">${o.cap}</figcaption>`:""}</figure>`; }

const pscore=p=>{ const s=saved[p.id]; if(!s||!s.done) return null;
  if(p.opts) return s.c===p.a?1:0; if(p.lor) return +s.v||0; return (s.t||[]).filter(Boolean).length; };

function partHTML(p,qi){ const s=saved[p.id]||{};
  let body="";
  if(p.opts){ body=`<div class="xmcq">${p.opts.map((o,j)=>`<label class="${s.done?(j===p.a?"right":(j===s.c?"wrong":"")):""}"><input type="radio" name="${p.id}" value="${j}" ${s.c===j?"checked":""}><span><b>${"ABCD"[j]}</b> ${o}</span></label>`).join("")}</div><div class="xbtns"><button class="btn primary" data-xmcq="${p.id}">Check</button></div>`; }
  else { body=`<textarea class="xans" data-xw="${p.id}" rows="${p.lines||3}" aria-label="Your answer to part ${p.l||'1'}" placeholder="Write your answer and working here">${(s.w||"").replace(/</g,"&lt;")}</textarea>`;
    if(p.ans) body+=`<div class="xfinal"><span>Final answer</span><input type="text" inputmode="decimal" data-xin="${p.id}" value="${String(s.f??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" aria-label="Final answer" autocomplete="off"><span class="u">${p.ans.unit||""}</span><button class="btn" data-xchk="${p.id}">Check answer</button></div>`;
    body+=`<div class="xbtns"><button class="btn primary" data-xms="${p.id}">${s.done?(s.hid?"Show mark scheme":"Hide mark scheme"):"Mark it: show mark scheme"}</button></div>`; }
  let ms="";
  if(p.lor){ ms=`<div class="xmsh"><span>Levels of response mark scheme</span><span>Award: <select data-xlor="${p.id}">${Array.from({length:p.m+1},(_,i)=>`<option value="${i}" ${+s.v===i?"selected":""}>${i}</option>`).join("")}</select> / ${p.m}</span></div>${p.lor.map(([lv,d])=>`<div class="lv"><b>${lv}</b><span>${d}</span></div>`).join("")}${p.ind?`<div class="note"><b>Indicative scientific content</b><ul>${p.ind.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`; }
  else if(!p.opts){ ms=`<div class="xmsh"><span>Mark scheme · tick each mark you earned</span><span id="${p.id}-pm"></span></div>${p.ms.map(([c,t],j)=>`<label><input type="checkbox" data-xt="${p.id}" data-j="${j}" ${(s.t||[])[j]?"checked":""}><code>${c}</code><span>${t}</span></label>`).join("")}${p.note?`<div class="note">${p.note}</div>`:""}`; }
  const fb=p.opts&&s.done?`<div class="xfb ${s.c===p.a?"ok":"nok"}">${s.c===p.a?"<b>Correct.</b> ":"<b>Not this one.</b> Answer: "+"ABCD"[p.a]+". "}${p.why||""}</div>`:"";
  return `<div class="xp" data-p="${p.id}"><div class="xpq"><span class="xpl">${p.lab!=null?p.lab:(p.l?`(${p.l})`:"")}</span><div>${p.ht?'<span class="ht">Higher</span> ':""}${p.q}</div><span class="xm">[${p.m}]</span></div><div class="xbody">${body}<div class="xfb" id="${p.id}-fb" hidden></div>${ms?`<div class="xms" id="${p.id}-ms" ${s.done&&!s.hid?"":"hidden"}>${ms}</div>`:""}${fb}</div></div>`; }

function cardHTML(cid){ const c=CARDS[cid]; let qn=c.start||1;
  const qs=c.qs.map(q=>{ const n=qn++; const parts=q.parts.map(p=>partHTML(p)).join(""); const t=q.parts.reduce((a,p)=>a+p.m,0);
    return `<div class="xq"><div class="xq-head"><span class="xqn">${c.qfmt?c.qfmt(n):n}</span><div class="xstem">${q.stem||""}</div></div><div class="xparts">${parts}</div>${q.parts.length>1?`<div class="xqtot">Total for question ${n}: ${t} marks</div>`:""}</div>`; }).join("");
  return `<h3>${kind}${c.title} <span class="qscore" id="${cid}-score"></span></h3>${c.intro?`<p class="xintro">${c.intro}</p>`:""}${qs}<div class="xfoot"><span class="muted" id="${cid}-sum"></span><button class="btn" data-xreset="${cid}">Clear my answers</button></div>`; }

function build(cid,cfg){ let k=0; CARDS[cid]=cfg; cfg.qs.forEach((q,qi)=>q.parts.forEach((p,pi)=>{ p.id=`${cid}q${qi}${L[pi]}`; if(q.parts.length>1&&p.l==null) p.l=L[pi]; if(!p.opts&&!p.lor&&p.ms&&p.ms.length!==p.m) console.warn("mark count",p.id); p.card=cid; p.tag=p.tag||cfg.tag; PARTS[p.id]=p; }));
  const el=document.createElement("div"); el.className="lcard exam"; el.id=cid; el.innerHTML=cardHTML(cid); return el; }
function rerender(cid){ $("#"+cid).innerHTML=cardHTML(cid); refresh(cid); }
function allParts(cid){ return CARDS[cid].qs.flatMap(q=>q.parts); }
function refresh(cid){ const ps=allParts(cid), T=ps.reduce((a,p)=>a+p.m,0); let got=0,mk=0,mt=0;
  ps.forEach(p=>{ const v=pscore(p); if(v!=null){ got+=v; mk++; mt+=p.m; } const e=$(`#${p.id}-pm`); if(e&&!p.lor){ const s=saved[p.id]; e.textContent=s&&s.done?`${pscore(p)} / ${p.m}`:""; } });
  $(`#${cid}-score`).textContent=`${got} / ${T} marks`;
  $(`#${cid}-sum`).textContent=mk?`${mk} of ${ps.length} parts marked · ${got} out of ${mt} on the parts marked so far`:`${ps.length} parts · ${T} marks. Answer, then use the mark scheme to mark yourself honestly.`;
  if(CARDS[cid].onChange) CARDS[cid].onChange(); }

function attach(lid,cfg,before){ const sec=$("#lab-"+lid+" .lsec"); if(!sec) return; const cid="xm-"+lid+(cfg.suffix||"");
  const el=build(cid,{tag:lid,...cfg}); if(before){ const b=before(sec); b?sec.insertBefore(el,b):sec.appendChild(el); } else sec.appendChild(el); refresh(cid); return cid; }

document.addEventListener("click",e=>{ const t=e.target.closest("[data-xms],[data-xmcq],[data-xchk],[data-xreset],[data-xgo]"); if(!t) return;
  if(t.dataset.xgo){ location.hash=t.dataset.xgo; return; }
  if(t.dataset.xreset){ const cid=t.dataset.xreset; if(!confirm("Clear your written answers and marks for this section?")) return; allParts(cid).forEach(p=>delete saved[p.id]); save(); rerender(cid); return; }
  const id=t.dataset.xms||t.dataset.xmcq||t.dataset.xchk, p=PARTS[id], s=saved[id]=saved[id]||{};
  if(t.dataset.xmcq){ const sel=$(`input[name="${id}"]:checked`); const fb=$(`#${id}-fb`); if(!sel){ fb.hidden=false; fb.className="xfb nok"; fb.textContent="Choose an answer first."; return; } s.c=+sel.value; s.done=true; save(); rerender(p.card); return; }
  if(t.dataset.xms){ const ms=$(`#${id}-ms`); if(!s.done){ s.done=true; s.hid=false; if(!s.t) s.t=[]; } else s.hid=!s.hid; ms.hidden=!!s.hid; t.textContent=s.hid?"Show mark scheme":"Hide mark scheme"; save(); refresh(p.card); return; }
  if(t.dataset.xchk){ const raw=$(`[data-xin="${id}"]`).value, v=num(raw), fb=$(`#${id}-fb`); fb.hidden=false; s.f=raw;
    if(isNaN(v)){ fb.className="xfb nok"; fb.textContent="Enter a number or expression, such as 1/2, sqrt(2) or 3.2e-3."; save(); return; }
    const a=p.ans, tol=a.tol??0.03, x=a.abs?Math.abs(v):v, ok=NumericTools.matches(x,a.a,tol,a.atol??0);
    if(ok){ const single=p.m===1&&p.ms.length===1;
      fb.className="xfb ok"; fb.innerHTML=single?"<b>Final answer correct.</b> One mark awarded.":"<b>Final numerical value correct.</b> Open the mark scheme and tick the marks earned for working, accuracy and any explanation. A matching number alone does not establish all the required method marks.";
      s.done=true; s.hid=false; s.t=s.t||[]; if(single) s.t=[true]; save();
      const ms=$(`#${id}-ms`); ms.hidden=false; $$(`[data-xt="${id}"]`).forEach((c,j)=>c.checked=!!s.t[j]); $(`[data-xms="${id}"]`).textContent="Hide mark scheme"; refresh(p.card); }
    else { fb.className="xfb nok"; fb.innerHTML=`<b>That doesn't match.</b> ${a.hint||"Check your working, units and significant figures."} You can still pick up method marks: open the mark scheme to see which you earned.`; save(); } } });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.matches('.xmcq input[type="radio"]')){ const s=saved[t.name]=saved[t.name]||{}; s.c=+t.value; save(); }
  else if(t.dataset.xt){ const id=t.dataset.xt, s=saved[id]=saved[id]||{}; s.t=s.t||[]; s.t[+t.dataset.j]=t.checked; save(); refresh(PARTS[id].card); }
  else if(t.dataset.xlor){ const id=t.dataset.xlor, s=saved[id]=saved[id]||{}; s.v=+t.value; s.done=true; save(); refresh(PARTS[id].card); } });
document.addEventListener("input",e=>{ const t=e.target, id=t.dataset.xw||t.dataset.xin; if(id){ const s=saved[id]=saved[id]||{}; if(t.dataset.xin) s.f=t.value; else s.w=t.value; save(); } });

return {graph,attach,build,refresh,allParts,pscore,PARTS,CARDS,saved,save,rerender};
})();

</script>
<script>
/* Mixed exam paper lesson: Section A (MCQ) + Section B (structured), timer and topic summary */
EXAM.paper=function(cfg){
const {lesson,done,mark}=LEARN, {$,store}=LAB, {build,refresh,allParts,pscore}=EXAM;
const id=cfg.id, P=id+"-xp", MINS=cfg.mins||70;
const cfgA={title:"Section A · Multiple choice",intro:`Answer all ${cfg.secA.length} questions. Each is worth 1 mark and is marked automatically.`,tag:id,qs:cfg.secA.map(q=>({parts:[{...q,m:1,l:""}]}))};
const cfgB={title:"Section B · Structured questions",start:cfg.secA.length+1,intro:"Answer all questions. Show your working: method marks are available even if the final answer is wrong. Use the mark schemes to mark your own answers, then check the summary below.",tag:id,qs:cfg.secB};
const sec=lesson({id,group:"r",num:cfg.num,lvl:"Review",name:"Mixed exam paper",icon:"solve",eyebrow:cfg.eyebrow,title:cfg.title,intro:cfg.intro,
 outcomes:[["Answer unfamiliar exam questions that combine ideas from different lessons"],[`Mark your own work against ${window.EXAM_BOARD||"OCR"}-style mark schemes`],["Identify which topics to revise next"]],
 blocks:[`<div class="lcard"><h3>Before you start</h3><div class="xpaper"><div><span>Total marks</span><b id="${P}-total">—</b></div><div><span>Suggested time</span><b>${MINS} min</b></div><div><span>Timer</span><b class="xtimer" id="${P}-t">${MINS}:00</b></div></div><div class="xbtns"><button class="btn primary" id="${P}-start">Start timer</button><button class="btn" id="${P}-reset">Reset timer</button></div><p class="muted" style="margin-top:10px;font-size:.92rem">${cfg.note||"Take g = 9.81 m s⁻². You will need a calculator."} Your written answers and marks are saved on this device.</p></div>`]});
const lsec=sec.querySelector(".lsec"), ca="xm-"+id+"a", cb="xm-"+id+"b";
lsec.appendChild(build(ca,cfgA)); lsec.appendChild(build(cb,cfgB));
lsec.insertAdjacentHTML("beforeend",`<div class="lcard"><h3><span class="kind k-exam">Results</span>Your paper summary</h3><div class="xpaper"><div><span>Score</span><b id="${P}-sc">—</b></div><div><span>Score on parts marked</span><b id="${P}-pc">—</b></div><div><span>Parts marked</span><b id="${P}-pm">—</b></div></div><div class="xbd" id="${P}-bd"></div><p class="muted" style="margin-top:10px;font-size:.9rem">Bars show the marks you earned on the parts you have marked, grouped by lesson. Red bars are below 60 %: open that lesson to revise it.</p></div>`);
const names={}; LAB.list.forEach(p=>names[p.id]=`${(p.lvl||"").replace(/^.*Lesson /,"L")} · ${p.name}`);
function summary(){ const ps=[...allParts(ca),...allParts(cb)], T=ps.reduce((a,p)=>a+p.m,0); let got=0,mt=0,mk=0; const by={};
  ps.forEach(p=>{ const v=pscore(p), t=p.tag; by[t]=by[t]||{g:0,m:0,all:0}; by[t].all+=p.m; if(v!=null){ got+=v; mt+=p.m; mk++; by[t].g+=v; by[t].m+=p.m; } });
  $(`#${P}-total`).textContent=T; $(`#${P}-sc`).textContent=`${got} / ${T}`; $(`#${P}-pc`).textContent=mt?Math.round(got/mt*100)+" %":"—"; $(`#${P}-pm`).textContent=`${mk} of ${ps.length}`;
  const order=Object.keys(by).sort((a,b)=>+a.replace(/\D/g,"")-+b.replace(/\D/g,""));
  $(`#${P}-bd`).innerHTML=order.map(t=>{ const r=by[t], pc=r.m?r.g/r.m*100:0, low=r.m&&pc<60;
    return `<div class="row ${low?"low":""}"><span>${names[t]||t}</span><span class="bar"><i style="width:${r.m?pc:0}%"></i></span><span class="m">${r.m?`${r.g}/${r.m}`:`–/${r.all}`}</span><button class="btn" data-xgo="${t}">Open lesson</button></div>`; }).join("");
  if(mk===ps.length&&!done.has(id)){ done.add(id); store.set("learn-gcse-combined-motion-done",[...done]); mark(); } }
EXAM.CARDS[ca].onChange=summary; EXAM.CARDS[cb].onChange=summary; refresh(ca); refresh(cb);
/* countdown timer */
const TK=`learn-gcse-combined-${id}-paper-timer`; let tm=store.get(TK)||{left:MINS*60,run:false,at:0}, iv=null;
const left=()=>tm.run?tm.left-(Date.now()-tm.at)/1000:tm.left;
function show(){ const l=left(), el=$(`#${P}-t`); if(l<=0){ el.textContent="Time’s up"; el.classList.add("up"); if(tm.run){ tm={left:0,run:false,at:0}; store.set(TK,tm); stop(); } } else { const s=Math.ceil(l); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; el.classList.remove("up"); } $(`#${P}-start`).textContent=tm.run?"Pause timer":(tm.left<MINS*60&&tm.left>0?"Resume timer":"Start timer"); }
function stop(){ clearInterval(iv); iv=null; }
$(`#${P}-start`).addEventListener("click",()=>{ if(tm.run){ tm={left:left(),run:false,at:0}; stop(); } else if(left()>0){ tm={left:tm.left,run:true,at:Date.now()}; iv=setInterval(show,500); } store.set(TK,tm); show(); });
$(`#${P}-reset`).addEventListener("click",()=>{ stop(); tm={left:MINS*60,run:false,at:0}; store.set(TK,tm); show(); });
if(tm.run) iv=setInterval(show,500); show();
};

</script>
<script>
/* circuit symbols (schematic) for the electricity pages; all centred at (x,y), horizontal unless v=true */
window.SYM=(()=>{
const bg='class="fsunk"', ink='class="ink"';
const rot=(x,y,v,inner)=>`<g transform="translate(${x} ${y})${v?" rotate(90)":""}">${inner}</g>`;
const S={
 wire:(pts,cls="ink",w=2)=>`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" class="${cls}" stroke-width="${w}" stroke-linejoin="round"/>`,
 dot:(x,y)=>`<circle cx="${x}" cy="${y}" r="4" class="fink"/>`,
 res:(x,y,v=false,lab="",col="ink")=>rot(x,y,v,`<rect x="-24" y="-9" width="48" height="18" stroke-width="2" class="fsunk ${col}"/>`)+(lab?`<text x="${v?x+16:x}" y="${v?y+4:y-15}" ${v?"":'text-anchor="middle"'} font-size="12" font-weight="700">${lab}</text>`:""),
 vres:(x,y,v=false,lab="")=>S.res(x,y,v,lab)+rot(x,y,v,`<path d="M-20 14 L20 -14" ${ink} stroke-width="2"/><path d="M20 -14 l-9 1 l5 7z" class="fink"/>`),
 therm:(x,y,v=false,lab="")=>S.res(x,y,v,lab)+rot(x,y,v,`<path d="M-26 14 h8 L18 -14" ${ink} stroke-width="1.8" fill="none"/>`),
 ldr:(x,y,v=false,lab="")=>S.res(x,y,v,lab)+rot(x,y,v,`<path d="M-30 -30 L-14 -14 M-18 -34 L-2 -18" ${ink} stroke-width="1.6"/><path d="M-14 -14 l-7 -1 l1 -6z M-2 -18 l-7 -1 l1 -6z" class="fink"/>`),
 cell:(x,y,v=false,lab="")=>rot(x,y,v,`<rect x="-8" y="-20" width="16" height="40" ${bg}/><path d="M-5 -20 V20" ${ink} stroke-width="2.5"/><path d="M5 -10 V10" ${ink} stroke-width="5"/>`)+(lab?`<text x="${v?x+18:x}" y="${v?y+4:y-26}" ${v?"":'text-anchor="middle"'} font-size="12" font-weight="700">${lab}</text>`:""),
 battery:(x,y,v=false,lab="")=>rot(x,y,v,`<rect x="-18" y="-20" width="36" height="40" ${bg}/><path d="M-15 -20 V20 M3 -20 V20" ${ink} stroke-width="2.5"/><path d="M-5 -10 V10 M13 -10 V10" ${ink} stroke-width="5"/>`)+(lab?`<text x="${v?x+20:x}" y="${v?y+4:y-26}" ${v?"":'text-anchor="middle"'} font-size="12" font-weight="700">${lab}</text>`:""),
 lamp:(x,y,v=false,lab="",glow=0)=>(glow>0?`<circle cx="${x}" cy="${y}" r="${16+glow*14}" fill="#ffd84a" opacity="${(0.15+glow*0.5).toFixed(2)}"/>`:"")+rot(x,y,v,`<circle r="13" stroke-width="2" class="fsunk ink"/><path d="M-9 -9 L9 9 M9 -9 L-9 9" ${ink} stroke-width="1.8"/>`)+(lab?`<text x="${x}" y="${y-20}" text-anchor="middle" font-size="12" font-weight="700">${lab}</text>`:""),
 diode:(x,y,v=false,lab="",led=false,lit=0)=>(lit>0?`<circle cx="${x}" cy="${y}" r="${12+lit*10}" fill="#ff4d3a" opacity="${(0.15+lit*0.5).toFixed(2)}"/>`:"")+rot(x,y,v,`<rect x="-12" y="-12" width="24" height="24" ${bg}/><path d="M-10 -11 L10 0 L-10 11Z" class="fsunk ink" stroke-width="2"/><path d="M10 -11 V11" ${ink} stroke-width="2.5"/>${led?`<path d="M0 -14 L8 -26 M6 -12 L14 -24" ${ink} stroke-width="1.5"/><path d="M8 -26 l-6 2 l3 4z M14 -24 l-6 2 l3 4z" class="fink"/>`:""}`)+(lab?`<text x="${x}" y="${y+28}" text-anchor="middle" font-size="12" font-weight="700">${lab}</text>`:""),
 meter:(x,y,letter,val="",col="dat")=>`<circle cx="${x}" cy="${y}" r="15" class="fpan ${col}" stroke-width="2.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700" class="t${col}">${letter}</text>${val!==""?`<rect x="${x-34}" y="${y+18}" width="68" height="20" rx="4" class="fpan ln"/><text x="${x}" y="${y+33}" text-anchor="middle" font-size="12" class="tm">${val}</text>`:""}`,
 sw:(x,y,closed=true,v=false)=>rot(x,y,v,`<rect x="-20" y="-14" width="40" height="20" ${bg}/><circle cx="-16" cy="0" r="3" class="fink"/><circle cx="16" cy="0" r="3" class="fink"/><path d="M-16 0 L${closed?"16 0":"12 -14"}" ${ink} stroke-width="2.2"/>`),
 /* moving charge dots along a polyline path; phase in px */
 flow:(pts,phase,gap=26,cls="fdat",r=3.5)=>{ let L=[],tot=0; for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); L.push(d); tot+=d; } let o=""; if(tot<1) return o;

/* particle box on a canvas: mode solid | liquid | gas; w (0–1 fraction of width used, for pistons); speed scale */

    else i++; }

  function num(){ let d=""; while(i<s.length&&/\d/.test(s[i])){ d+=s[i]; i++; } return d?+d:1; }

function Mr(s){ const c=parse(s); let t=0; for(const k in c){ if(!bySym[k]) return NaN; t+=bySym[k].Ar*c[k]; } return Math.round(t*100)/100; }

/* plain-text formula with unicode subscripts, for SVG text, options and labels */
const u=s=>String(s).replace(/([A-Za-z)\]])(\d+)/g,(m,a,d)=>a+d.replace(/\d/g,x=>"₀₁₂₃₄₅₆₇₈₉"[x])).replace(/->/g,"→").replace(/<=>/g,"⇌");
const sci=(n,sf=3)=>{ if(n===0) return "0"; const e=Math.floor(Math.log10(Math.abs(n))), m=n/10**e; return `${(+m.toPrecision(sf)).toFixed(sf-1)} × 10${String(e).replace(/-/,"⁻").replace(/\d/g,x=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[x])}`; };
/* brute-force balancer for small equations: returns coefficient array (reactants then products) or null */
function balance(L,R,max=8){ const sp=[...L,...R].map(parse), n=sp.length, els=[...new Set(sp.flatMap(o=>Object.keys(o)))], c=Array(n).fill(1);
  const ok=()=>els.every(e=>{ let t=0; sp.forEach((o,i)=>{ t+=(i<L.length?1:-1)*(o[e]||0)*c[i]; }); return t===0; });
  const rec=i=>{ if(i===n) return ok(); for(let k=1;k<=max;k++){ c[i]=k; if(rec(i+1)) return true; } return false; };
  return rec(0)?c.slice():null; }

/* ---------- small UI helpers ---------- */
const sl=(id,lab,min,max,step,val,aria)=>`<div class="field"><div class="lbl">${lab} <b id="${id}-l"></b></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${aria||lab.replace(/<[^>]+>/g,"")}"></div>`;
const seg=(id,opts,cols=2,def)=>`<div class="seg c${cols}" id="${id}">${opts.map(([v,t],i)=>`<label class="opt"><input type="radio" name="${id}" value="${v}" ${(def==null?i===0:v===def)?"checked":""}><span>${t}</span></label>`).join("")}</div>`;
const field=(lab,inner)=>`<div class="field"><div class="lbl">${lab}</div>${inner}</div>`;
const sel=(id,opts,def)=>`<select id="${id}">${opts.map(([v,t])=>`<option value="${v}" ${v===def?"selected":""}>${t}</option>`).join("")}</select>`;
const ro=(list,cls="")=>`<div class="readout ${cls}">${list.map(([id,t])=>`<div><span>${t}</span><b id="${id}">—</b></div>`).join("")}</div>`;
const val=id=>+$("#"+id).value;
const radio=id=>{ const e=document.querySelector(`input[name="${id}"]:checked`); return e?e.value:null; };
const on=(ids,fn,ev)=>ids.forEach(id=>{ const e=$("#"+id); if(!e) return; e.addEventListener(ev||(e.tagName==="SELECT"||e.classList.contains("seg")?"change":"input"),fn); });
const set=(id,t)=>{ const e=$("#"+id); if(e) e.innerHTML=t; };
function loop(lid,fn){ let last=0; function step(now){ const s=document.getElementById("lab-"+lid); if(s&&!s.hidden){ const dt=last?Math.min(.05,(now-last)/1000):0; fn(dt); } last=now; requestAnimationFrame(step); } requestAnimationFrame(step); }
const eb=(spec,n)=>`AQA GCSE Combined Science · ${spec}${n?` · Lesson ${n}`:""}`;

/* ---------- periodic table (SVG) ---------- */
/* opts: {id, cls(e)->class, label(e)->small text, w, sel, ar:true} ; cells carry data-z */
function ptable(o={}){ const cw=50, ch=58, x0=24, y0=34, W=x0+18*cw+8, H=y0+7*ch+46; let g="";
  const gnum=[1,2,null,null,null,null,null,null,null,null,null,null,3,4,5,6,7,0];
  gnum.forEach((n,i)=>{ if(n!=null) g+=`<text x="${x0+i*cw+cw/2}" y="${y0-10}" text-anchor="middle" font-size="13" font-weight="700" class="num">${n}</text>`; });
  for(let p=1;p<=7;p++) g+=`<text x="${x0-8}" y="${y0+(p-1)*ch+ch/2+5}" text-anchor="end" font-size="12" class="num">${p}</text>`;
  E.forEach(e=>{ const x=x0+(e.col-1)*cw, y=y0+(e.per-1)*ch, c=o.cls?o.cls(e):"c-"+e.cat.replace("tm","tm");
    const lab=o.label?o.label(e):(o.ar===false?"":String(e.Ar));
    g+=`<g class="cell${o.sel===e.Z?" sel":""}" data-z="${e.Z}" tabindex="0" role="button" aria-label="${e.name}, atomic number ${e.Z}"><rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="4" class="${c}"/>
<text x="${x+4}" y="${y+13}" font-size="10" class="num">${e.Z}</text><text x="${x+cw/2}" y="${y+34}" text-anchor="middle" font-size="18" class="sym">${e.sym}</text><text x="${x+cw/2}" y="${y+50}" text-anchor="middle" font-size="9.5" class="num">${lab}</text></g>`; });
  /* staircase between metals and non-metals */
  const sx=c=>x0+(c-1)*cw, sy=p=>y0+(p-1)*ch;
  g+=`<path class="stair" d="M${sx(13)} ${sy(2)} V${sy(3)} H${sx(14)} V${sy(4)} H${sx(15)} V${sy(5)} H${sx(16)} V${sy(6)} H${sx(17)} V${sy(7)}"/>`;
  g+=`<text x="${x0+2*cw+4}" y="${y0+7*ch+22}" font-size="11" class="num">Elements 58–71 and 90–103 are not shown. Small number: relative atomic mass, Ar.</text>`;
  return `<svg class="pt" ${o.id?`id="${o.id}"`:""} viewBox="0 0 ${W} ${H}" role="group" aria-label="Periodic table">${g}</svg>`; }
const ptKey=`<div class="ckey"><span><i style="background:color-mix(in srgb,var(--pt-metal) 42%,var(--panel))"></i>Metals</span><span><i style="background:color-mix(in srgb,var(--pt-tm) 42%,var(--panel))"></i>Transition metals</span><span><i style="background:color-mix(in srgb,var(--pt-semi) 46%,var(--panel))"></i>Close to the dividing line (metalloids)</span><span><i style="background:color-mix(in srgb,var(--pt-non) 42%,var(--panel))"></i>Non-metals</span><span><i style="background:color-mix(in srgb,var(--pt-noble) 42%,var(--panel))"></i>Noble gases (Group 0)</span><span><i style="background:transparent;border:2px solid var(--bad)"></i>Metal / non-metal dividing line</span></div>`;

/* ---------- electron shell diagrams ---------- */
/* draw at (cx,cy): Z protons; charge for ions; xs = number of outer-shell electrons drawn as crosses (transferred) */
function shells(Z,o={}){ const q=o.charge||0, n=Z-q, sym=o.sym||byZ[Z].sym, cx=o.x||0, cy=o.y||0, r0=o.r0||22, dr=o.dr||18;
  const cfg=[]; let k=n; for(const cap of [2,8,8,2]){ if(k<=0) break; cfg.push(Math.min(cap,k)); k-=cap; }
  let g=`<circle cx="${cx}" cy="${cy}" r="${r0-6}" class="nuc"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="${o.fs||14}" font-weight="700">${sym}</text>`;
  const show=o.outerOnly?[cfg.length-1]:cfg.map((_,i)=>i);
  cfg.forEach((m,i)=>{ if(!show.includes(i)) return; const r=r0+dr*(o.outerOnly?1:i+1); g+=`<circle cx="${cx}" cy="${cy}" r="${r}" class="shell"/>`;
    const last=i===cfg.length-1, xs=last?(o.xs||0):0;
    for(let j=0;j<m;j++){ /* electrons in pairs at 4 compass points (2 for the first shell) */
      let a; if(i===0) a=m===1?-90:(j?90:-90); else { const slot=j%4, second=j>=4, paired=m>slot+4; a=[-90,0,90,180][slot]+(paired?(second?12:-12):0); }

  if(q){ const R=r0+dr*(o.outerOnly?1:cfg.length)+12; g+=`<path class="brk" d="M${cx-R+10} ${cy-R} h-10 v${2*R} h10 M${cx+R-10} ${cy-R} h10 v${2*R} h-10"/><text x="${cx+R+6}" y="${cy-R+8}" font-size="16" font-weight="700">${Math.abs(q)>1?Math.abs(q):""}${q>0?"+":MINUS}</text>`; }
  return g; }
function shellsSVG(Z,o={}){ const n=Z-(o.charge||0); const nsh=n<=2?1:n<=10?2:n<=18?3:4; const R=(o.r0||22)+(o.dr||18)*(o.outerOnly?1:nsh)+(o.charge?26:10); return `<svg class="chsvg" viewBox="${-R} ${-R} ${2*R+(o.charge?20:0)} ${2*R}" role="img" aria-label="${o.aria||"Electron shell diagram"}">${shells(Z,o)}</svg>`; }

  const dot=(x,y)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" class="e-dot"/>`, cross=(x,y)=>`<path class="e-x" d="M${(x-3.6).toFixed(1)} ${(y-3.6).toFixed(1)}l7.2 7.2m0 -7.2l-7.2 7.2"/>`;

    /* shared pairs in the overlap */

    for(let k=0;k<b;k++){ const off=(k-(b-1)/2)*11, [px,py]=P(mx,my,pa,off), [ax,ay]=P(px,py,a,-5), [bx,by]=P(px,py,a,5); el+=dot(ax,ay)+cross(bx,by); }

  (spec.lca||cand.slice(0,spec.lc||0)).forEach(t=>{ const [qx,qy]=P(cx,cy,t,R-8); const [ax,ay]=P(qx,qy,t+90,5), [bx,by]=P(qx,qy,t+90,-5); el+=dot(ax,ay)+dot(bx,by); });

function dotcrossSVG(spec,o={}){ const R=o.R||40, ext=R*1.42+R+8; return `<svg class="chsvg" viewBox="${-ext} ${-ext} ${2*ext} ${2*ext}" role="img" aria-label="${o.aria||"Dot and cross diagram"}">${dotcross(spec,o)}</svg>`; }

/* ---------- reaction profile ---------- */
/* {W,H,r,p,ea,cat,lab:{r,p}} energies in arbitrary units 0..100 */
function profile(o){ const W=o.W||460, H=o.H||300, ml=50, mb=36, mt=20, pw=W-ml-96, ph=H-mt-mb; const Y=e=>mt+ph*(1-e/100);

  const path=(pk)=>`M${ml+10} ${Y(r)} H${ml+pw*.28} C${ml+pw*.42} ${Y(r)}, ${ml+pw*.42} ${Y(pk)}, ${ml+pw*.5} ${Y(pk)} S${ml+pw*.58} ${Y(p)}, ${ml+pw*.72} ${Y(p)} H${ml+pw+14}`;
  let g=`<line x1="${ml}" y1="${mt-6}" x2="${ml}" y2="${mt+ph}" class="ink" stroke-width="2"/><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw+80}" y2="${mt+ph}" class="ink" stroke-width="2"/>
<text transform="translate(18 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="13">Energy</text><text x="${ml+pw/2}" y="${H-8}" text-anchor="middle" font-size="13">Progress of reaction</text>`;
  if(o.cat!=null) g+=`<path d="${path(r+o.cat)}" fill="none" class="gd" stroke-width="2.6" stroke-dasharray="6 5"/>`;
  g+=`<path d="${path(peak)}" fill="none" class="dat" stroke-width="3"/>`;
  g+=`<text x="${ml+14}" y="${Y(r)-8}" font-size="12">${o.lab&&o.lab.r||"Reactants"}</text><text x="${ml+pw*.64}" y="${Y(p)-8}" font-size="12">${o.lab&&o.lab.p||"Products"}</text>`;
  const ax=ml+pw*.5; g+=LEARN.arr(ax-34,Y(r),ax-34,Y(peak)+2,"acc","",2.2)+`<text x="${ax-40}" y="${(Y(r)+Y(peak))/2+4}" text-anchor="end" font-size="12" class="tacc">activation energy</text>`;
  const dx=ml+pw+12; g+=`<line x1="${ml+pw*.5}" y1="${Y(r)}" x2="${dx+10}" y2="${Y(r)}" class="mut" stroke-width="1.2" stroke-dasharray="4 4"/>`+LEARN.arr(dx,Y(r),dx,Y(p)+(p>r?2:-2),"dat","",2.2)+`<text x="${dx+8}" y="${(Y(r)+Y(p))/2-4}" font-size="12" class="tdat">energy</text><text x="${dx+8}" y="${(Y(r)+Y(p))/2+11}" font-size="12" class="tdat">${p<r?"given out":"taken in"}</text>`;
  if(o.cat!=null) g+=`<text x="${ax+6}" y="${Y(r+o.cat)-6}" font-size="12" class="tgd">with a catalyst</text>`;
  return g; }

/* ---------- indicators ---------- */
const UIC=["#c0182a","#d8352b","#ea6a2d","#f29a2e","#f7c63a","#e4d93d","#b9d33c","#5daa3b","#2e8f53","#22857a","#246d9a","#2f4fa0","#4b3d99","#5a2d8a","#4a1f6e"];
const uiColour=pH=>{ const i=Math.max(0,Math.min(14,pH)), a=Math.floor(i), b=Math.min(14,a+1), t=i-a; const h=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16)); const A=h(UIC[a]),B=h(UIC[b]); return `rgb(${A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(",")})`; };
const indicator=(name,pH)=>name==="phenolphthalein"?(pH>=9.3?"#d63384":pH>=8.2?`rgba(214,51,132,${((pH-8.2)/1.1).toFixed(2)})`:"rgba(255,255,255,0.15)"):name==="methyl orange"?(pH<=3.1?"#d7301f":pH>=4.4?"#f2b632":"#ec7a2a"):name==="litmus"?(pH<5?"#d1352b":pH>8?"#3c5fbf":"#8a4fa8"):uiColour(pH);

return {balance,eqStr,u,sci,E,bySym,byZ,grp,config,f,parse,Mr,mrWork,fmtN,sl,seg,field,sel,ro,val,radio,on,set,loop,eb,ptable,ptKey,shells,shellsSVG,dotcross,dotcrossSVG,profile,uiColour,indicator,MINUS};
})();
G.eb=CH.eb;
</script>

<!-- BEGIN SHARED SCIENCE LESSONS -->
<script>
LEARN.unit="chem-atoms";

/* AT1: atoms, elements, compounds and equations */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {res}=LAB.W, {f,parse,set,eb}=CH;
const RX=[
 {n:"Hydrogen burning",L:["H2","O2"],R:["H2O"],a:[2,1,2],w:"hydrogen + oxygen → water"},
 {n:"Magnesium burning",L:["Mg","O2"],R:["MgO"],a:[2,1,2],w:"magnesium + oxygen → magnesium oxide"},
 {n:"Sodium and chlorine",L:["Na","Cl2"],R:["NaCl"],a:[2,1,2],w:"sodium + chlorine → sodium chloride"},
 {n:"Methane burning",L:["CH4","O2"],R:["CO2","H2O"],a:[1,2,1,2],w:"methane + oxygen → carbon dioxide + water"},
 {n:"Sodium and water",L:["Na","H2O"],R:["NaOH","H2"],a:[2,2,2,1],w:"sodium + water → sodium hydroxide + hydrogen"},
 {n:"Making iron(III) chloride",L:["Fe","Cl2"],R:["FeCl3"],a:[2,3,2],w:"iron + chlorine → iron(III) chloride"},
 {n:"Aluminium oxide",L:["Al","O2"],R:["Al2O3"],a:[4,3,2],w:"aluminium + oxygen → aluminium oxide"},
 {n:"Making ammonia",L:["N2","H2"],R:["NH3"],a:[1,3,2],w:"nitrogen + hydrogen → ammonia"},

<p class="note">Use the + and − buttons to change the number in front of each formula. You may not change the small numbers inside a formula: that would make a different substance.</p>
<div class="btnrow"><button class="btn" id="chem-at1-reset">Reset to 1s</button><button class="btn" id="chem-at1-show">Show the answer</button></div>
<div class="readout" style="margin-top:10px"><div><span>Status</span><b id="chem-at1-st">—</b></div><div><span>Atoms each side</span><b id="chem-at1-n">—</b></div></div>`;

lesson({id:"chem-at1",group:"a",num:1,lvl:"5.1.1 · Lesson 1",name:"Atoms, elements, compounds and equations",icon:"elem",
 eyebrow:eb("5.1.1.1 Atoms, elements and compounds",1),title:"Atoms, elements, compounds and equations",
 intro:"Everything is made of atoms. There are only about 100 different kinds, but they join together in countless ways. Chemical equations are the shorthand chemists use to show which atoms rearrange in a reaction.",
 outcomes:[["Use the names and symbols of the first 20 elements, Groups 1 and 7 and other common elements","5.1.1.1"],["Explain the difference between an element and a compound","5.1.1.1"],["Write word equations, and write and balance symbol equations","5.1.1.1"]],
 blocks:[
  B.text("Atoms, elements and compounds",`<p>An <b>atom</b> is the smallest part of an element that can exist. All substances are made of atoms.</p><ul><li>An <b>element</b> contains only one type of atom. There are about 100 elements, shown in the periodic table. Each has a <b>symbol</b>: O for oxygen, Na for sodium (from its Latin name <i>natrium</i>).</li><li>A <b>compound</b> contains two or more elements <b>chemically combined</b> in fixed proportions. Water, ${f("H2O")}, always has two hydrogen atoms for every oxygen atom.</li><li>Compounds can only be separated into elements by chemical reactions. A compound usually has completely different properties from the elements in it: sodium is a reactive metal and chlorine a toxic gas, but sodium chloride is table salt.</li></ul>`),
  B.text("Formulae and equations",`<p>A <b>formula</b> shows the atoms in a substance. ${f("CO2")} has 1 carbon and 2 oxygen atoms; ${f("Ca(OH)2")} has 1 calcium, 2 oxygen and 2 hydrogen atoms (everything inside the brackets is doubled).</p><p>A <b>word equation</b> names the reactants and products: <i>magnesium + oxygen → magnesium oxide</i>. A <b>symbol equation</b> uses formulae, and must be <b>balanced</b>: atoms are not created or destroyed, so there must be the same number of each type of atom on both sides.</p><div class="eqn">${f("2Mg + O2 -> 2MgO")}</div><p>To balance an equation, change the <b>big numbers in front</b> of the formulae, never the small numbers inside them. Changing ${f("H2O")} to ${f("H2O2")} would turn water into hydrogen peroxide.</p>`),
  B.sim("chem-at1-sim","Balance the equation",stage,panel,`<span>Big numbers only</span><span>Same atoms on each side</span>`),
  B.example("Balancing an equation step by step","Balance the equation for sodium reacting with water: Na + H₂O → NaOH + H₂",[
   ["Count each type of atom","Left: Na 1, H 2, O 1. Right: Na 1, H 3 (1 in NaOH and 2 in H₂), O 1. Hydrogen is not balanced.",[`${f("Na + H2O -> NaOH + H2")}`]],
   ["Balance the awkward element","Put a 2 in front of H₂O and NaOH. Now H: 4 on the left, 2 + 2 = 4 on the right; O: 2 on each side.",[`${f("Na + 2H2O -> 2NaOH + H2")}`]],
   ["Finish with the element that is on its own","Sodium is now 1 on the left and 2 on the right, so put 2 in front of Na.",[`${res(f("2Na + 2H2O -> 2NaOH + H2"))}`]]]),
  B.check([
   {q:"How many atoms are shown in one formula unit of Ca(OH)₂?",a:5,unit:"atoms",tol:0,why:"1 Ca + 2 O + 2 H = 5 atoms."},
   {q:"Which of these is a compound?",opts:["Oxygen, O₂","Sulfur, S","Carbon dioxide, CO₂","Neon, Ne"],a:2,why:"It contains two different elements chemically combined."},
   {q:"Balance: N₂ + H₂ → NH₃. What number goes in front of H₂?",a:3,unit:"",tol:0,why:"N₂ + 3H₂ → 2NH₃: 2 N and 6 H on each side."},
   {q:"Balance: Al + O₂ → Al₂O₃. What number goes in front of Al?",a:4,unit:"",tol:0,why:"4Al + 3O₂ → 2Al₂O₃: 4 Al and 6 O on each side."},
   {q:"Why must you never change the small numbers in a formula when balancing?",opts:["It makes the equation too long","It changes the substance into a different one","Small numbers are only for gases","The teacher would not allow it"],a:1,why:"The formula defines the substance: H₂O and H₂O₂ are different compounds."}]),
  B.keypoints(["Element: one type of atom. Compound: two or more elements chemically combined in fixed proportions.","Brackets in a formula: multiply everything inside by the number outside.","Balance equations with numbers in front of formulae; never change a formula."]),
  B.mistakes(["Writing a compound as if it were an element, e.g. calling carbon dioxide an element because it is a gas.","Changing subscripts to balance an equation.","Forgetting that diatomic elements are written H₂, N₂, O₂, Cl₂ (not H, N, O, Cl) in equations."])
 ],onShow:()=>draw()});

function counts(side,coef){ const t={}; side.forEach((sp,k)=>{ const c=parse(sp); for(const e in c) t[e]=(t[e]||0)+c[e]*coef[k]; }); return t; }
function draw(){ const r=RX[st.i], nL=r.L.length, cL=st.c.slice(0,nL), cR=st.c.slice(nL);
  const term=(sp,k)=>`<span class="coef"><button class="btn" data-chem-at1="${k}" data-d="-1" aria-label="Fewer ${sp}">−</button><b>${st.c[k]}</b><button class="btn" data-chem-at1="${k}" data-d="1" aria-label="More ${sp}">+</button>${f(sp)}</span>`;
  const L=r.L.map((sp,k)=>term(sp,k)).join(" + "), R=r.R.map((sp,k)=>term(sp,k+nL)).join(" + ");
  const a=counts(r.L,cL), b=counts(r.R,cR), els=[...new Set([...Object.keys(a),...Object.keys(b)])];
  const ok=els.every(e=>a[e]===b[e]);
  const tbl=`<table class="tally"><tr><th>Element</th>${els.map(e=>`<th>${e}</th>`).join("")}</tr><tr><td>Reactants</td>${els.map(e=>`<td>${a[e]||0}</td>`).join("")}</tr><tr><td>Products</td>${els.map(e=>`<td>${b[e]||0}</td>`).join("")}</tr><tr><td></td>${els.map(e=>`<td class="${a[e]===b[e]?"ok":"no"}">${a[e]===b[e]?"✓":"✗"}</td>`).join("")}</tr></table>`;
  /* particle pictures: one circle per atom, coloured by element */
  const COL={H:"#e8e8e8",O:"#e05252",C:"#3b3b3b",N:"#4d79c7",Na:"#9b6bd1",Cl:"#4fb35a",Mg:"#9aa4ad",Fe:"#b5733d",Al:"#c0c7cf",Ca:"#d9c27a"};
  const pic=t=>Object.entries(t).map(([e,n])=>Array.from({length:Math.min(n,24)},()=>`<span title="${e}" style="display:inline-block;width:16px;height:16px;border-radius:50%;margin:1px;background:${COL[e]||"#888"};border:1px solid var(--line);font-size:8px;line-height:16px;text-align:center;color:${e==="C"?"#fff":"#000"}">${e}</span>`).join("")).join(" ");
  $("#chem-at1-box").innerHTML=`<p class="muted" style="margin:0 0 8px">${r.w}</p><div class="eqn" style="display:flex;flex-wrap:wrap;align-items:center;gap:4px">${L} <span style="font-size:1.4rem;margin:0 6px">→</span> ${R}</div><div class="bal" style="margin:12px 0"><div>${pic(a)}</div><div style="font-size:1.4rem">→</div><div>${pic(b)}</div></div>${tbl}`;
  set("chem-at1-st",ok?`<span class="pill ok">Balanced</span>`:`<span class="pill no">Not balanced</span>`); set("chem-at1-n",`${Object.values(a).reduce((x,y)=>x+y,0)} → ${Object.values(b).reduce((x,y)=>x+y,0)}`); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-chem-at1]"); if(!b) return; const k=+b.dataset.chem-at1; st.c[k]=Math.max(1,Math.min(9,st.c[k]+ +b.dataset.d)); draw(); });
$("#chem-at1-r").addEventListener("change",e=>{ st.i=+e.target.value; st.c=RX[st.i].a.map(()=>1); draw(); });
$("#chem-at1-reset").addEventListener("click",()=>{ st.c=RX[st.i].a.map(()=>1); draw(); });
$("#chem-at1-show").addEventListener("click",()=>{ st.c=RX[st.i].a.slice(); draw(); });
st.c=RX[0].a.map(()=>1); draw();
})();

</script>

(()=>{
