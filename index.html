<script>
LEARN.unit="phys-atomic";

/* AT2: development of the model of the atom */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb}=G;
const st={m:"nuc",paths:[],n:0,back:0,big:0};
const stage=`<svg id="phys-at2" viewBox="0 0 900 360" role="img" aria-label="Alpha particles fired at a thin gold foil; their paths show how they are scattered"></svg>`;
const panel=`<div class="field"><div class="lbl">Model of the atom</div><div class="seg c2" id="phys-at2-m"><label class="opt"><input type="radio" name="phys-at2-m" value="pud"><span>Plum pudding</span></label><label class="opt"><input type="radio" name="phys-at2-m" value="nuc" checked><span>Nuclear</span></label></div></div>
<div class="btnrow"><button class="btn primary" id="phys-at2-go">Fire 20 alpha particles</button><button class="btn" id="phys-at2-rs">Clear</button></div>
<div class="readout"><div><span>Fired</span><b id="phys-at2-n">—</b></div><div><span>Deflected more than 10°</span><b id="phys-at2-b">—</b></div><div><span>Bounced back (&gt; 90°)</span><b id="phys-at2-k">—</b></div></div><p class="note" id="phys-at2-msg"></p>`;

lesson({id:"phys-at2",group:"a",num:2,lvl:"6.4.1 · Lesson 2",name:"Developing the model of the atom",icon:"model",
 eyebrow:eb("6.4.1.3 The development of the model of the atom",2),title:"Developing the model of the atom",
 intro:"Our picture of the atom has changed as new evidence appeared. The alpha-scattering experiment overturned the plum pudding model and led to the nuclear model we use today. It is a classic example of how scientific models change.",
 outcomes:[["Describe how the model of the atom has changed over time as new evidence was found","6.4.1.3"],["Explain how the alpha particle scattering experiment led to the nuclear model","6.4.1.3"],["Describe the contributions of Bohr and Chadwick","6.4.1.3"]],
 blocks:[
  B.text("A timeline of models",`<ol><li><b>Tiny spheres</b>: before the discovery of the electron, atoms were thought to be tiny spheres that could not be divided.</li><li><b>Plum pudding model</b> (after the electron was discovered, 1897): the atom is a ball of positive charge with negative electrons embedded in it.</li><li><b>Nuclear model</b> (Rutherford, from the alpha scattering experiment, 1909–1911): the mass is concentrated at the centre (the nucleus), which is charged.</li><li><b>Bohr</b> adapted the nuclear model: electrons orbit the nucleus at specific distances (energy levels). His calculations agreed with experimental observations.</li><li>Later experiments showed that the positive charge of the nucleus is made of smaller particles, each with the same amount of positive charge: <b>protons</b>.</li><li><b>Chadwick</b> (about 20 years after the nucleus became accepted) provided evidence for <b>neutrons</b> in the nucleus.</li></ol>`),
  B.text("The alpha scattering experiment",`<p>Alpha particles (positively charged) were fired at a very thin gold foil. The results:</p><ul><li><b>Most</b> alpha particles went straight through ⇒ the atom is mostly <b>empty space</b>.</li><li><b>Some</b> were deflected ⇒ the centre of the atom (nucleus) is <b>positively charged</b> and repels them.</li><li><b>A very few</b> bounced back ⇒ the mass and positive charge are concentrated in a <b>very small</b> nucleus.</li></ul><p>The plum pudding model predicted that all the alpha particles would pass through with only tiny deflections, so it had to be replaced.</p>`),
  B.sim("phys-at2-sim","Alpha particle scattering",stage,panel,`<span>Alpha particles enter from the left</span><span>Nucleus drawn far larger than to scale</span>`),
  B.check([
   {q:"In the plum pudding model, what is an atom made of?",opts:["A tiny positive nucleus surrounded by electrons","A ball of positive charge with electrons embedded in it","Protons, neutrons and electrons in shells","An indivisible solid sphere"],a:1,why:"Electrons are spread through a ball of positive charge."},
   {q:"What did the fact that most alpha particles passed straight through the foil show?",opts:["The nucleus is negative","The atom is mostly empty space","Gold atoms are very small","Alpha particles have no charge"],a:1,why:"There is nothing in most of the atom to deflect them."},
   {q:"What did the very few alpha particles that bounced back show?",opts:["Electrons are heavy","The mass and positive charge are concentrated in a tiny nucleus","The foil was too thick","Alpha particles are negative"],a:1,why:"Only a small, massive, positive nucleus can turn them back."},
   {q:"Who provided evidence for the existence of neutrons?",opts:["Bohr","Rutherford","Chadwick","Thomson"],a:2,why:"James Chadwick, 1932."},
   {q:"What did Bohr suggest about electrons?",opts:["They are embedded in positive charge","They orbit the nucleus at specific distances (energy levels)","They are in the nucleus","They have no charge"],a:1,why:"Fixed energy levels, which matched experimental observations."}]),
  B.keypoints(["Models change when new evidence cannot be explained by the old model.","Alpha scattering: mostly empty space; small, positive, massive nucleus.","Bohr: electrons in energy levels. Protons then identified; Chadwick discovered neutrons."]),
  B.mistakes(["Saying the alpha particles bounced off electrons.","Muddling the order: plum pudding came before the nuclear model.","Saying the nucleus is negatively charged."])
 ],onShow:()=>draw()});

function fire(){ for(let i=0;i<20;i++){ const b=(Math.random()-.5)*300, pts=[]; let x=-430, y=b, vx=6, vy=0; const k=st.m==="nuc"?40:0;
  for(let s=0;s<220;s++){     for(let j=0;j<10;j++){ const rr2=x*x+y*y, rr=Math.sqrt(rr2); if(st.m==="nuc"&&rr>0.5){ const f=k/(rr2*rr)*0.1; vx+=f*x; vy+=f*y; } x+=vx*0.1; y+=vy*0.1; }
    if(st.m==="pud"&&Math.abs(x)<140) vy+=(Math.random()-.5)*0.04;
    pts.push([x,y]); if(Math.abs(x)>440||Math.abs(y)>180) break; }
  const ang=Math.abs(Math.atan2(vy,vx))*180/Math.PI; st.n++; if(ang>10) st.big++; if(ang>90) st.back++; st.paths.push(pts); }
  if(st.paths.length>80) st.paths=st.paths.slice(-80); draw(); }
function draw(){ const s=$("#phys-at2"); if(!s) return; const cx=450, cy=180;
  let g=`<rect x="${cx-6}" y="10" width="12" height="340" fill="#d8b24a" opacity=".35"/>`;
  if(st.m==="pud") g+=`<circle cx="${cx}" cy="${cy}" r="140" fill="#e58a7a" opacity=".25"/>${Array.from({length:14},(_,i)=>`<circle cx="${(cx+Math.cos(i*2.4)*100*Math.sqrt((i+1)/14)).toFixed(1)}" cy="${(cy+Math.sin(i*2.4)*100*Math.sqrt((i+1)/14)).toFixed(1)}" r="6" fill="#3a7bd5"/>`).join("")}`;
  else g+=`<circle cx="${cx}" cy="${cy}" r="8" fill="#d6533c"/><text x="${cx+14}" y="${cy-10}" font-size="12" class="tm">nucleus (+)</text>`;
  st.paths.forEach(p=>{ g+=`<polyline points="${p.map(([x,y])=>`${(cx+x).toFixed(1)},${(cy+y).toFixed(1)}`).join(" ")}" fill="none" class="acc" stroke-width="1.3" opacity=".7"/>`; });
  g+=`<text x="12" y="24" font-size="13" class="tm">α source →</text><text x="${cx}" y="355" text-anchor="middle" font-size="12" class="tmut">gold foil</text>`;
  s.innerHTML=g; $("#phys-at2-n").textContent=st.n; $("#phys-at2-b").textContent=st.n?`${st.big} (${fx(100*st.big/st.n,0)} %)`:"—"; $("#phys-at2-k").textContent=st.n?`${st.back}`:"—";
  $("#phys-at2-msg").textContent=st.m==="pud"?"Plum pudding prediction: the positive charge is spread out, so no alpha particle is deflected by much.":"Nuclear model: most pass straight through; those passing close to the tiny nucleus are deflected, and a head-on approach sends one back."; }
$("#phys-at2-m").addEventListener("change",e=>{ st.m=e.target.value; st.paths=[]; st.n=st.big=st.back=0; draw(); });
$("#phys-at2-go").addEventListener("click",fire);
$("#phys-at2-rs").addEventListener("click",()=>{ st.paths=[]; st.n=st.big=st.back=0; draw(); });
})();


</script>
<script>
LEARN.unit="phys-atomic";

/* AT3: radioactive decay and nuclear radiation */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb}=G;
const SRC={a:["Alpha (α)",800,"#d6533c"],b:["Beta (β)",600,"#3a7bd5"],g:["Gamma (γ)",400,"#7b5fb0"]};
const ABS={none:["No absorber",{a:1,b:1,g:1}],paper:["Sheet of paper",{a:0,b:1,g:1}],al:["3 mm aluminium",{a:0,b:0.02,g:0.95}],pb:["5 cm lead",{a:0,b:0,g:0.08}]};
const st={s:"a",ab:"none",d:3,t:0,counts:0,ph:0};
const BG=0.4; /* background counts per second */
const rate=()=>{ const [n,R0]=SRC[st.s], f=ABS[st.ab][1][st.s]; let r=R0*f*(st.s==="a"?(st.d<=5?1:0):1)*Math.pow(3/st.d,2); return r+BG; };
const stage=`<svg id="phys-at3" viewBox="0 0 900 230" role="img" aria-label="A radioactive source, an absorber and a Geiger–Müller tube with counter"></svg>`;
const panel=`<div class="field"><div class="lbl">Source</div><div class="seg c3" id="phys-at3-s">${Object.entries(SRC).map(([k,v])=>`<label class="opt"><input type="radio" name="phys-at3-s" value="${k}" ${k==="a"?"checked":""}><span>${v[0].split(" ")[0]}</span></label>`).join("")}</div></div>
<div class="field"><div class="lbl">Absorber</div><select id="phys-at3-ab" aria-label="Absorber">${Object.entries(ABS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Distance in air <b id="phys-at3-dl"></b></div><input type="range" id="phys-at3-d" min="1" max="20" step="1" value="3" aria-label="Distance"></div>
<div class="readout"><div><span>Count rate</span><b id="phys-at3-r">—</b></div><div><span>Corrected for background</span><b id="phys-at3-c">—</b></div></div><p class="note" id="phys-at3-msg"></p>`;

lesson({id:"phys-at3",group:"b",num:3,lvl:"6.4.2 · Lesson 3",name:"Radioactive decay and nuclear radiation",icon:"radiation",
 eyebrow:eb("6.4.2.1 Radioactive decay and nuclear radiation",3),title:"Radioactive decay and nuclear radiation",
 intro:"Some atomic nuclei are unstable. They give out radiation as they change to become more stable. This is a random process. The radiation can be alpha particles, beta particles, gamma rays or neutrons, and each behaves very differently.",
 outcomes:[["Describe radioactive decay as random, and define activity and count-rate","6.4.2.1"],["Describe the nature of alpha, beta and gamma radiation and neutron emission","6.4.2.1"],["Compare the penetration through materials, range in air and ionising power of alpha, beta and gamma radiation","6.4.2.1"]],
 blocks:[
  B.text("Radioactive decay",`<p>Some atomic nuclei are unstable. The nucleus gives out radiation as it changes to become more stable. This is a <b>random</b> process called <b>radioactive decay</b>: you cannot predict which nucleus will decay next, or when.</p><ul><li><b>Activity</b> is the rate at which a source of unstable nuclei decays, measured in <b>becquerels (Bq)</b>: 1 Bq = 1 decay per second.</li><li><b>Count-rate</b> is the number of decays recorded each second by a detector, such as a <b>Geiger–Müller tube</b>.</li></ul>`),
  B.text("Types of nuclear radiation",`<div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Radiation</th><th>What it is</th><th>Ionising power</th><th>Range in air</th><th>Stopped by</th></tr></thead><tbody><tr><td>Alpha (α)</td><td>2 neutrons + 2 protons (a helium nucleus)</td><td>Strongly ionising</td><td>A few cm</td><td>A sheet of paper or skin</td></tr><tr><td>Beta (β)</td><td>A high-speed electron ejected from the nucleus as a neutron turns into a proton</td><td>Moderately ionising</td><td>About a metre</td><td>A few mm of aluminium</td></tr><tr><td>Gamma (γ)</td><td>Electromagnetic radiation from the nucleus</td><td>Weakly ionising</td><td>Very large</td><td>Reduced by several cm of lead or metres of concrete</td></tr><tr><td>Neutron (n)</td><td>A neutron emitted from the nucleus</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div><p>Alpha is the most ionising because it is large and has a charge of +2, so it interacts strongly with atoms and loses its energy quickly; that is also why its range is short.</p>`),
  B.sim("phys-at3-sim","Investigating penetration",stage,panel,`<span>Dots: radiation reaching the detector</span><span>Background radiation is always present</span>`),
  B.check([
   {q:"What is the unit of activity?",opts:["Sievert","Becquerel","Gray","Hertz"],a:1,why:"1 Bq = 1 decay per second."},
   {q:"Which radiation is stopped by a sheet of paper?",opts:["Alpha","Beta","Gamma","Neutrons"],a:0,why:"Alpha particles are stopped by paper or skin."},
   {q:"What is a beta particle?",opts:["A helium nucleus","A high-speed electron from the nucleus","An electromagnetic wave","A neutron"],a:1,why:"Formed when a neutron changes into a proton."},
   {q:"Which radiation is the most ionising?",opts:["Alpha","Beta","Gamma","All the same"],a:0,why:"Alpha: large and doubly charged."},
   {q:"A detector records 85 counts per minute near a source and 25 counts per minute with no source. What is the corrected count rate?",a:60,unit:"counts/min",tol:0.001,why:"Subtract background: 85 − 25 = 60."},
   {q:"Why is radioactive decay described as random?",opts:["The radiation goes in random directions only","You cannot predict when a particular nucleus will decay","The activity changes randomly from day to day","It only happens sometimes"],a:1,why:"Each nucleus has a fixed chance of decaying, but the moment is unpredictable."}]),
  B.keypoints(["Unstable nuclei decay randomly, emitting α, β, γ or neutrons.","Activity in becquerels (Bq); count-rate measured with a Geiger–Müller tube.","α: paper, few cm of air, strongly ionising. β: few mm aluminium. γ: thick lead, weakly ionising."]),
  B.mistakes(["Saying beta particles come from the electron shells.","Forgetting to subtract the background count.","Saying gamma rays are completely stopped by lead (they are reduced)."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-at3"); if(!s) return; const [n,R0,col]=SRC[st.s], px=40+st.d*24+80, r=rate();
  let g=`<rect x="20" y="90" width="50" height="50" rx="6" class="fsunk ink" stroke-width="2"/><text x="45" y="160" text-anchor="middle" font-size="11" class="tm">source</text><circle cx="62" cy="115" r="6" style="fill:${col}"/>`;
  if(st.ab!=="none"){ const w=st.ab==="paper"?3:st.ab==="al"?8:30, c=st.ab==="paper"?"#f2efe6":st.ab==="al"?"#b7c0c8":"#6c7480"; g+=`<rect x="${(px-50-w/2).toFixed(0)}" y="60" width="${w}" height="110" style="fill:${c}" class="ink" stroke-width="1"/><text x="${px-50}" y="190" text-anchor="middle" font-size="11" class="tm">${ABS[st.ab][0]}</text>`; }
  g+=`<rect x="${px}" y="100" width="90" height="30" rx="6" class="fpan ink" stroke-width="2"/><text x="${px+45}" y="120" text-anchor="middle" font-size="11" class="tm">G–M tube</text><path d="M${px+90} 115 H${px+130}" class="ink" stroke-width="2"/><rect x="${px+130}" y="85" width="150" height="60" rx="6" class="fpan ink" stroke-width="2"/><text x="${px+205}" y="122" text-anchor="middle" font-size="20" font-weight="700" class="tm">${Math.round(st.counts)}</text><text x="${px+205}" y="160" text-anchor="middle" font-size="11" class="tmut">counts</text>`;
  const f=ABS[st.ab][1][st.s]*(st.s==="a"&&st.d>5?0:1);
  for(let i=0;i<10;i++){ const life=((st.ph*0.9+i*0.1)%1); let x=70+life*(px-70), y=115+(i%5-2)*6*life; const stopAbs=st.ab!=="none"&&ABS[st.ab][1][st.s]<0.5&&x>px-60&&(i/10)>=ABS[st.ab][1][st.s], stopAir=st.s==="a"&&x>70+5*24+30; if(stopAbs||stopAir) continue; g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${st.s==="a"?4.5:st.s==="b"?3:2.5}" style="fill:${col}"/>`; }
  s.innerHTML=g;
  $("#phys-at3-dl").textContent=`${st.d} cm`; $("#phys-at3-r").textContent=`${fx(r,1)} counts/s`; $("#phys-at3-c").textContent=`${fx(r-BG,1)} counts/s`;
  $("#phys-at3-msg").textContent=f===0?(st.s==="a"&&st.d>5?"Alpha particles only travel a few centimetres in air: only background radiation is detected.":"All of this radiation is absorbed: only background radiation is detected."):f<0.1?"Almost all the radiation is absorbed.":"Radiation is reaching the detector. The count rate also falls with distance as the radiation spreads out."; }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!$("#lab-phys-at3").hidden){ st.ph+=dt*0.8; st.counts+=rate()*dt*(0.7+Math.random()*0.6); draw(); } requestAnimationFrame(loop); }
const reset=()=>{ st.counts=0; draw(); };
$("#phys-at3-s").addEventListener("change",e=>{ st.s=e.target.value; reset(); });
$("#phys-at3-ab").addEventListener("change",e=>{ st.ab=e.target.value; reset(); });
$("#phys-at3-d").addEventListener("input",e=>{ st.d=+e.target.value; reset(); });
requestAnimationFrame(loop);
})();


</script>
<script>

/* AT4: nuclear equations */
(()=>{
const {$,fx}=LAB, {B,lesson}=LEARN, {eb}=G;
const SYMS="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am".split(" ");
const NUC=[["Uranium-238",92,238,"a"],["Radium-226",88,226,"a"],["Americium-241",95,241,"a"],["Polonium-210",84,210,"a"],["Carbon-14",6,14,"b"],["Strontium-90",38,90,"b"],["Iodine-131",53,131,"b"],["Potassium-40",19,40,"b"],["Technetium-99m",43,99,"g"]];
const st={i:0,t:"a"};

const stage=`<div id="phys-at4-eq" style="font-family:var(--f-display);font-size:clamp(1.3rem,4vw,2.2rem);text-align:center;padding:30px 10px 14px;display:flex;justify-content:center;align-items:center;gap:.4em;flex-wrap:wrap"></div><svg id="phys-at4" viewBox="0 0 600 220" style="display:block;margin:0 auto;max-width:600px" role="img" aria-label="Part of a chart of neutron number against proton number showing how the nucleus changes"></svg>`;
const panel=`<div class="field"><div class="lbl">Nucleus</div><select id="phys-at4-i" aria-label="Nucleus">${NUC.map((n,i)=>`<option value="${i}">${n[0]}</option>`).join("")}</select></div>
<div class="field"><div class="lbl">Type of decay</div><div class="seg c4" id="phys-at4-t"><label class="opt"><input type="radio" name="phys-at4-t" value="a" checked><span>α</span></label><label class="opt"><input type="radio" name="phys-at4-t" value="b"><span>β</span></label><label class="opt"><input type="radio" name="phys-at4-t" value="g"><span>γ</span></label><label class="opt"><input type="radio" name="phys-at4-t" value="n"><span>n</span></label></div></div>
<div class="readout"><div><span>Mass number change</span><b id="phys-at4-dA">—</b></div><div><span>Charge (atomic number) change</span><b id="phys-at4-dZ">—</b></div></div><p class="note" id="phys-at4-msg"></p>`;

lesson({id:"phys-at4",group:"b",num:4,lvl:"6.4.2 · Lesson 4",name:"Nuclear equations",icon:"nuceq",
 eyebrow:eb("6.4.2.2 Nuclear equations",4),title:"Nuclear equations",
 intro:"Nuclear equations show what happens to a nucleus when it decays. The mass numbers and the atomic numbers must balance on both sides, and that lets you work out the new element that is formed.",
 outcomes:[["Use symbols for alpha and beta particles in nuclear equations","6.4.2.2"],["Balance nuclear equations for alpha and beta decay","6.4.2.2"],["Describe the effect of each type of decay on the mass and charge of the nucleus","6.4.2.2"]],
 blocks:[
  B.text("Symbols and rules",`<p>An alpha particle is written ${nuc(4,2,"He")} and a beta particle ${nuc(0,"−1","e")}. In a nuclear equation the <b>top numbers (mass)</b> and the <b>bottom numbers (charge)</b> must add up to the same total on both sides.</p><ul><li><b>Alpha decay</b>: mass number decreases by 4, charge (atomic number) decreases by 2. A new element is formed.</li><li><b>Beta decay</b>: a neutron becomes a proton plus an electron. Mass number unchanged, charge increases by 1. A new element is formed.</li><li><b>Gamma emission</b>: no change to the mass or the charge of the nucleus; it loses energy.</li><li><b>Neutron emission</b>: mass number decreases by 1; the element stays the same (a different isotope).</li></ul>`),
  B.sim("phys-at4-sim","Building nuclear equations",stage,panel,`<span>Mass numbers on top; atomic numbers below</span>`),
  B.example("Balancing an alpha decay","Radon-222 (atomic number 86) decays by alpha emission. Write the equation and identify the new element (atomic number 84 is polonium, Po).",[
   ["Mass numbers","222 = A + 4",[`A = 218`]],
   ["Atomic numbers","86 = Z + 2",[`Z = 84 ⇒ polonium`]],
   ["Equation","",[`${nuc(222,86,"Rn")} → ${nuc(218,84,"Po")} + ${nuc(4,2,"He")}`]]]),
  B.check([
   {q:"Thorium-234 (Z = 90) decays by alpha emission. What is the mass number of the new nucleus?",a:230,unit:"",tol:0.001,why:"234 − 4 = 230."},
   {q:"In the alpha decay of thorium-234 (Z = 90), what is the atomic number of the new nucleus?",a:88,unit:"",tol:0.001,why:"90 − 2 = 88 (radium)."},
   {q:"Carbon-14 (Z = 6) decays by beta emission. What is the atomic number of the new nucleus?",a:7,unit:"",tol:0.001,why:"6 + 1 = 7 (nitrogen-14)."},
   {q:"Which type of decay does not change the mass number or the atomic number?",opts:["Alpha","Beta","Gamma","Neutron"],a:2,why:"Gamma emission only removes energy."},
   {q:"What happens inside the nucleus during beta decay?",opts:["A proton becomes a neutron","A neutron becomes a proton and an electron","Two protons and two neutrons leave","An electron joins the nucleus"],a:1,why:"The electron is emitted as the beta particle."}]),
  B.keypoints(["α: ⁴₂He; A − 4, Z − 2. β: ⁰₋₁e; A same, Z + 1. γ: no change. n: A − 1.","Mass numbers and atomic numbers balance on both sides.","α and β decay form a new element."]),
  B.mistakes(["Writing the beta particle as ⁰₁e (its charge is −1).","Changing Z in gamma emission.","Forgetting that a change of Z means a new element symbol."])
 ],onShow:()=>draw()});

function draw(){ const box=$("#phys-at4-eq"); if(!box) return; const [name,Z,A]=NUC[st.i], S=SYMS[Z-1]+(name.endsWith("m")?"m":"");
  const dA={a:-4,b:0,g:0,n:-1}[st.t], dZ={a:-2,b:1,g:0,n:0}[st.t], Z2=Z+dZ, A2=A+dA, S2=st.t==="g"?SYMS[Z-1]:SYMS[Z2-1];
  const part={a:nuc(4,2,"He"),b:nuc(0,"−1","e"),g:`<span>γ</span>`,n:nuc(1,0,"n")}[st.t];
  box.innerHTML=`${nuc(A,Z,S)}<span>→</span>${nuc(A2,Z2,S2,"tacc")}<span>+</span>${part}`;
  const s=$("#phys-at4"), N=A-Z, N2=A2-Z2, x=z=>300+(z-Z)*60, y=n=>110-(n-N)*30;
  let g=""; for(let z=Z-3;z<=Z+2;z++) for(let n=N-3;n<=N+2;n++){ if(x(z)<20||x(z)>580||y(n)<10||y(n)>210) continue; g+=`<rect x="${x(z)-26}" y="${y(n)-13}" width="52" height="26" rx="3" class="fpan ln"/>`; }
  g+=`<text x="300" y="215" text-anchor="middle" font-size="11" class="tmut">proton number Z →</text><text x="12" y="110" font-size="11" class="tmut" transform="rotate(-90 12 110)" text-anchor="middle">neutron number N →</text>`;
  g+=`<rect x="${x(Z)-26}" y="${y(N)-13}" width="52" height="26" rx="3" class="fdat"/><text x="${x(Z)}" y="${y(N)+5}" text-anchor="middle" font-size="12" style="fill:#fff">${S}-${A}</text>`;
  if(st.t!=="g"){ g+=`<rect x="${x(Z2)-26}" y="${y(N2)-13}" width="52" height="26" rx="3" class="facc"/><text x="${x(Z2)}" y="${y(N2)+5}" text-anchor="middle" font-size="12" style="fill:var(--on-accent)">${S2}-${A2}</text>`;
    g+=`<path d="M${x(Z)} ${y(N)} L${x(Z2)} ${y(N2)}" class="ink" stroke-width="1.5" stroke-dasharray="4 3"/>`; }
  s.innerHTML=g;
  $("#phys-at4-dA").textContent=dA?`${dA}`:"0"; $("#phys-at4-dZ").textContent=dZ>0?`+${dZ}`:`${dZ}`;
  const usual={a:"alpha",b:"beta",g:"gamma"}[NUC[st.i][3]];
  $("#phys-at4-msg").textContent=`${name} actually decays by ${usual} emission. ${st.t==="a"?"Alpha: lose 2 protons and 2 neutrons.":st.t==="b"?"Beta: one neutron becomes a proton.":st.t==="g"?"Gamma: same nucleus, less energy.":"Neutron emission: same element, lighter isotope."}`; }
$("#phys-at4-i").addEventListener("change",e=>{ st.i=+e.target.value; draw(); });
$("#phys-at4-t").addEventListener("change",e=>{ st.t=e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-atomic";

/* AT5: half-life and the random nature of decay */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,HT,ht}=G;
const NN=400; const st={T:10,t:0,run:false,alive:[],data:[]};
const stage=`<svg id="phys-at5" viewBox="0 0 400 200" style="display:block;margin:0 auto;max-width:520px" role="img" aria-label="A grid of 400 nuclei; decayed nuclei change colour"></svg><canvas id="phys-at5-cv" class="graph" aria-label="Number of undecayed nuclei against time"></canvas>`;
const panel=`<div class="field"><div class="lbl">Half-life <b id="phys-at5-Tl"></b></div><input type="range" id="phys-at5-T" min="4" max="20" step="2" value="10" aria-label="Half-life"></div>
<div class="btnrow"><button class="btn primary" id="phys-at5-go">Start</button><button class="btn" id="phys-at5-rs">Reset</button></div>
<div class="readout"><div><span>Time</span><b id="phys-at5-t">—</b></div><div><span>Undecayed nuclei</span><b id="phys-at5-n">—</b></div><div><span>Fraction left</span><b id="phys-at5-f">—</b></div></div>
<p class="note">Each nucleus has the same chance of decaying in each second. Run it twice: the curve is never exactly the same, but the half-life is.</p>`;

lesson({id:"phys-at5",group:"b",num:5,lvl:"6.4.2 · Lesson 5",name:"Half-life",icon:"halflife",
 eyebrow:eb("6.4.2.3 Half-lives and the random nature of radioactive decay",5),title:"Half-life",
 intro:"You cannot predict when one nucleus will decay, but with billions of them the pattern is very predictable. The time it takes for half of them to decay is always the same: the half-life.",
 outcomes:[["Explain the meaning of half-life","6.4.2.3"],["Determine half-life from a graph or a table of data","6.4.2.3"],["(HT) Calculate the net decline, as a ratio, after a given number of half-lives","6.4.2.3"]],
 blocks:[
  B.text("Half-life",`<p>Radioactive decay is random, so you cannot say when a particular nucleus will decay. But with a very large number of nuclei, we can say how long it takes for half of them to decay.</p><p>The <b>half-life</b> of a radioactive isotope is:</p><ul><li>the time it takes for the <b>number of nuclei</b> of the isotope in a sample to halve, or</li><li>the time it takes for the <b>count rate</b> (or activity) from a sample to fall to half its initial level.</li></ul><p>After 1 half-life ½ is left, after 2 half-lives ¼, after 3 half-lives ⅛, and so on.</p>`,
   B.fig(`<svg viewBox="0 0 300 200" role="img" aria-label="Decay curve halving every half-life"><path d="M40 20 V170 H290" class="ink" fill="none" stroke-width="1.5"/><path d="M40 30 ${Array.from({length:50},(_,i)=>`L${40+i*5} ${(170-140*Math.pow(.5,i*5/60)).toFixed(1)}`).join(" ")}" fill="none" class="dat" stroke-width="2.5"/><path d="M40 100 H100 V170 M40 135 H160 V170 M40 152.5 H220 V170" fill="none" class="acc" stroke-dasharray="4 3"/><text x="34" y="34" text-anchor="end" font-size="11">N₀</text><text x="34" y="104" text-anchor="end" font-size="11">½</text><text x="34" y="139" text-anchor="end" font-size="11">¼</text><text x="100" y="185" text-anchor="middle" font-size="11">T½</text><text x="160" y="185" text-anchor="middle" font-size="11">2T½</text><text x="220" y="185" text-anchor="middle" font-size="11">3T½</text></svg>`,"Read the half-life from the time taken to fall to half of any starting value.")),
  B.sim("phys-at5-sim","Watching nuclei decay",stage,panel,`<span>Blue: undecayed · grey: decayed</span><span>Dashed line: N₀ × ½^(t/T½)</span>`),
  B.example("Using half-life","A sample has an activity of 1200 Bq. Its half-life is 8 days. What is the activity after 24 days?",[
   ["Number of half-lives","",[`24 ÷ 8 = 3 half-lives`]],
   ["Halve three times","",[`1200 → 600 → 300 → ${res("150 Bq")}`]]]),
  B.text(`Net decline ${HT}`,ht(`<p>The <b>net decline</b> is how much the activity has fallen, as a fraction (ratio) of the starting value. After n half-lives the fraction remaining is (½)ⁿ, so the net decline is 1 − (½)ⁿ.</p><p>Example: after 3 half-lives, ⅛ of the original activity remains, so the net decline is ⅞. If the initial activity was 1200 Bq, the decline is ⅞ × 1200 = 1050 Bq.</p>`)),
  B.check([
   {q:"A sample contains 8000 undecayed nuclei. The half-life is 5 hours. How many remain undecayed after 15 hours?",a:1000,unit:"",tol:0.001,why:"3 half-lives: 8000 → 4000 → 2000 → 1000."},
   {q:"The count rate from a source falls from 480 to 60 counts per minute in 12 days. What is the half-life?",a:4,unit:"days",tol:0.01,why:"480 → 240 → 120 → 60 is 3 half-lives in 12 days: 4 days each."},
   {q:"What fraction of a radioactive isotope remains after 4 half-lives?",opts:["1/4","1/8","1/16","1/32"],a:2,why:"(½)⁴ = 1/16."},
   {q:"(Higher) What is the net decline in activity, as a fraction of the initial activity, after 2 half-lives?",opts:["1/4","1/2","3/4","7/8"],a:2,why:"¼ remains, so ¾ has gone."},
   {q:"(Higher) A source of 640 Bq decays for 3 half-lives. By how many becquerels has its activity fallen?",a:560,unit:"Bq",tol:0.001,why:"⅞ × 640 = 560 Bq (80 Bq remains)."}]),
  B.keypoints(["Decay is random, but half-life is constant for an isotope.","Half-life: time for the number of nuclei (or count rate) to halve.","(HT) Net decline after n half-lives = 1 − (½)ⁿ of the initial value."]),
  B.mistakes(["Thinking that after 2 half-lives everything has decayed.","Reading a half-life from the start of a graph only when it does not start at the y-axis value you halved.","Forgetting to subtract background count rate before finding the half-life."])
 ],onShow:()=>draw()});

function reset(){ st.t=0; st.run=false; st.alive=Array(NN).fill(true); st.data=[[0,NN]]; draw(); }
function draw(){ const s=$("#phys-at5"); if(!s) return; let g=""; st.alive.forEach((a,i)=>{ g+=`<circle cx="${10+(i%40)*9.5}" cy="${10+Math.floor(i/40)*19}" r="3.6" style="fill:${a?"#3a7bd5":"#c4c9ce"}"/>`; }); s.innerHTML=g;
  const n=st.alive.filter(Boolean).length, th=[]; for(let t=0;t<=60;t+=0.5) th.push([t,NN*Math.pow(.5,t/st.T)]);
  plot($("#phys-at5-cv"),{aspect:asp(.42),x:{label:"time / s",min:0,max:60},y:{label:"undecayed nuclei",min:0,max:400},series:[{pts:st.data,col:css("--accent"),join:true,noPts:true}],fits:[{fn:t=>NN*Math.pow(.5,t/st.T),x0:0,x1:60,col:css("--muted"),dash:[5,4]}]});
  $("#phys-at5-Tl").textContent=`${st.T} s`; $("#phys-at5-t").textContent=`${fx(st.t,0)} s`; $("#phys-at5-n").textContent=n; $("#phys-at5-f").textContent=fx(n/NN,3); }
let last=0, acc=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(st.run&&!$("#lab-phys-at5").hidden){ acc+=dt*4; while(acc>=1&&st.t<60){ acc-=1; st.t+=1; const p=1-Math.pow(.5,1/st.T); st.alive=st.alive.map(a=>a&&Math.random()>p); st.data.push([st.t,st.alive.filter(Boolean).length]); } if(st.t>=60) st.run=false; draw(); } requestAnimationFrame(loop); }
$("#phys-at5-go").addEventListener("click",()=>{ if(st.t>=60) reset(); st.run=true; });
$("#phys-at5-rs").addEventListener("click",reset);
$("#phys-at5-T").addEventListener("input",e=>{ st.T=+e.target.value; reset(); });
reset(); requestAnimationFrame(loop);
})();


</script>

attach("phys-at3",{title:T,intro:I,qs:[

  {q:"Explain why there is a count rate with no source present.",m:1,lines:2,ms:[["1","background radiation (from rocks, cosmic rays, etc.)"]]},
  {q:"With the source 2 cm away the count was 540 counts per minute. With a sheet of paper between them it was 535; with 3 mm of aluminium it was 20. Identify the radiation emitted, with a reason.",m:3,lines:4,ms:[["1","beta"],["1","not alpha because the paper does not reduce the count rate significantly"],["1","not gamma because aluminium reduces the count rate to background"]]},

attach("phys-at4",{title:T,intro:I,qs:[
 {stem:`<p>Radium-226 (atomic number 88) decays by alpha emission to an isotope of radon (Rn).</p>`,parts:[
  {q:"State the mass number of the radon isotope.",m:1,ans:{a:222,unit:"",tol:0.001},ms:[["1","222"]]},
  {q:"State the atomic number of radon.",m:1,ans:{a:86,unit:"",tol:0.001},ms:[["1","86"]]},
  {q:"Strontium-90 (atomic number 38) decays by beta emission to yttrium (Y). Write the nuclear equation.",m:3,lines:2,ms:[["1","⁹⁰₃₈Sr → ⁹⁰₃₉Y"],["1","+ ⁰₋₁e"],["1","mass and atomic numbers balance"]]},
  {q:"Explain why gamma emission does not change the element.",m:2,lines:2,ms:[["1","gamma is electromagnetic radiation / has no mass or charge"],["1","so the number of protons (atomic number) does not change"]]}]}

attach("phys-at5",{title:T,intro:I,qs:[
 {stem:`<p>The graph shows how the count rate from a radioactive sample changes with time (background has been subtracted).</p>`+graph({xmax:20,xs:2,xl:2,ymax:800,ys:100,yl:2,lines:[Array.from({length:41},(_,i)=>[i*0.5,800*Math.pow(.5,i*0.5/5)])],xt:"time / hours",yt:"count rate / counts per minute",aria:"Decay curve starting at 800 and halving every 5 hours"}),parts:[
  {q:"Use the graph to determine the half-life of the sample.",m:2,ans:{a:5,unit:"hours",tol:0.05},ms:[["1","count rate falls from 800 to 400 (or any halving)"],["1","in 5 hours"]]},
  {q:"Predict the count rate after 25 hours.",m:2,ans:{a:25,unit:"counts/min",tol:0.02},ms:[["1","25 hours = 5 half-lives"],["1","800 / 32 = 25 counts per minute"]]},
  {ht:true,q:"Calculate the net decline in count rate after 3 half-lives, as a ratio of the initial count rate.",m:2,ans:{a:0.875,unit:"",tol:0.01},ms:[["1","remaining = (½)³ = 1/8"],["1","net decline = 7/8 (0.875)"]]},

attach("phys-at6",{title:T,intro:I,qs:[

attach("phys-at7",{title:T,intro:I,qs:[

<script>
LEARN.unit="phys-forces";

/* FO1: scalars, vectors, contact and non-contact forces */
(()=>{
const {$}=LAB, {B,lesson,arr}=LEARN, {eb}=G;
/* scenario: picture fn and forces [x1,y1,x2,y2,name,contact] */
const SC={
 book:["Book resting on a table",()=>`<rect x="120" y="190" width="260" height="14" class="fsunk ink" stroke-width="2"/><path d="M140 204 V280 M360 204 V280" class="ink" stroke-width="5"/><rect x="200" y="150" width="100" height="40" rx="3" class="facc"/>`,[[250,170,250,90,"normal contact force",1],[250,170,250,250,"weight",0]]],
 car:["Car driving at a steady speed",()=>`<path d="M40 250 H460" class="ink" stroke-width="2"/><rect x="180" y="190" width="140" height="44" rx="10" class="facc"/><rect x="210" y="166" width="80" height="30" rx="8" class="facc" opacity=".8"/><circle cx="210" cy="240" r="13" class="fink"/><circle cx="290" cy="240" r="13" class="fink"/>`,[[250,212,380,212,"driving force (friction from road)",1],[250,212,120,212,"air resistance + friction",1],[250,212,250,124,"normal contact force",1],[250,212,250,300,"weight",0]]],
 sky:["Skydiver falling at terminal velocity",()=>`<path d="M180 70 Q250 20 320 70 Z" class="fdat" opacity=".8"/><path d="M185 70 L245 160 M315 70 L255 160" class="ink"/><circle cx="250" cy="168" r="10" class="facc"/><rect x="242" y="178" width="16" height="36" rx="5" class="facc"/>`,[[250,190,250,110,"air resistance",1],[250,190,250,270,"weight",0]]],
 mag:["Paper clip held up by a magnet",()=>`<rect x="190" y="60" width="120" height="40" rx="4" class="fbd"/><text x="250" y="86" text-anchor="middle" font-size="14" style="fill:#fff">N</text><path d="M240 150 h20 v40 h-16 v-30" fill="none" class="ink" stroke-width="3"/><path d="M250 120 V150" class="mut" stroke-dasharray="3 3"/>`,[[250,170,250,110,"magnetic force",0],[250,170,250,230,"weight",0]]],
 balloon:["Charged balloon stuck to a wall",()=>`<rect x="330" y="40" width="30" height="240" class="fsunk ink" stroke-width="2"/><ellipse cx="280" cy="150" rx="40" ry="50" class="facc"/><path d="M280 200 q-10 30 5 60" fill="none" class="ink"/>`,[[280,150,330,150,"electrostatic force",0],[280,150,230,150,"normal contact force",1],[280,150,280,220,"weight",0],[280,150,280,80,"friction",1]]]
};
const st={k:"car"};
const stage=`<svg id="phys-fo1" viewBox="0 0 900 310" role="img" aria-label="Force diagram for the chosen situation with contact and non-contact forces labelled"></svg>`;
const panel=`<div class="field"><div class="lbl">Situation</div><select id="phys-fo1-k" aria-label="Situation">${Object.entries(SC).map(([k,s])=>`<option value="${k}" ${k===st.k?"selected":""}>${s[0]}</option>`).join("")}</select></div><p class="note">Orange arrows: contact forces. Blue arrows: non-contact forces. Arrow length shows the size of the force.</p>`;

lesson({id:"phys-fo1",group:"a",num:1,lvl:"6.5.1 · Lesson 1",name:"Scalars, vectors and types of force",icon:"vector",
 eyebrow:eb("6.5.1.1–6.5.1.2 Scalar and vector quantities; contact and non-contact forces",1),title:"Scalars, vectors and types of force",
 intro:"Some quantities only have a size; others have a size and a direction. Forces are vectors: pushes or pulls that act on an object because of its interaction with another object.",
 outcomes:[["Distinguish between scalar and vector quantities, and represent vectors with arrows","6.5.1.1"],["Describe a force as a push or pull from an interaction between objects","6.5.1.2"],["Classify forces as contact or non-contact forces","6.5.1.2"]],
 blocks:[
  B.text("Scalars and vectors",`<p><b>Scalar</b> quantities have magnitude (size) only. <b>Vector</b> quantities have magnitude <b>and</b> an associated direction.</p><div style="overflow-x:auto"><table class="gtab"><thead><tr><th>Scalars</th><th>Vectors</th></tr></thead><tbody><tr><td>distance, speed, mass, time, energy, temperature</td><td>displacement, velocity, acceleration, force, weight, momentum</td></tr></tbody></table></div><p>A vector can be represented by an <b>arrow</b>: the length of the arrow represents the magnitude, and the direction of the arrow represents the direction.</p>`),
  B.text("Contact and non-contact forces",`<p>A <b>force</b> is a push or pull that acts on an object due to its <b>interaction</b> with another object. Force is a vector.</p><ul><li><b>Contact forces</b>: the objects are physically touching. Examples: friction, air resistance, tension, normal contact force.</li><li><b>Non-contact forces</b>: the objects are physically separated. Examples: gravitational force, electrostatic force, magnetic force.</li></ul><p>Forces come from interactions, so they always arise in pairs: if a book pushes down on a table, the table pushes up on the book.</p>`),
  B.sim("phys-fo1-sim","Forces in everyday situations",stage,panel,`<span>Free body diagrams</span>`),
  B.check([
   {q:"Which of these is a vector quantity?",opts:["Speed","Mass","Velocity","Energy"],a:2,why:"Velocity has a direction."},
   {q:"Which is a non-contact force?",opts:["Friction","Tension","Gravitational force","Air resistance"],a:2,why:"Gravity acts between objects that are not touching."},
   {q:"What is the difference between distance and displacement?",opts:["None","Displacement includes a direction","Distance includes a direction","Displacement is always larger"],a:1,why:"Displacement is distance in a given direction."},
   {q:"Which force keeps a book from falling through a table?",opts:["Weight","Friction","Normal contact force","Magnetic force"],a:2,why:"The table pushes up on the book."},
   {q:"On a vector diagram, what does the length of an arrow represent?",opts:["The direction","The magnitude","The time","The mass"],a:1,why:"Length = size of the vector."}]),
  B.keypoints(["Scalars: magnitude only. Vectors: magnitude and direction; drawn as arrows.","Force: push or pull from an interaction; a vector.","Contact: friction, air resistance, tension, normal force. Non-contact: gravity, electrostatic, magnetic."]),
  B.mistakes(["Calling weight a contact force.","Saying speed and velocity are the same.","Forgetting that every force comes from an interaction with another object."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo1"); if(!s) return; const [n,pic,F]=SC[st.k], nw=window.innerWidth<640, lx=nw?20:530, ly=nw?340:40;
  let g=`<rect x="10" y="10" width="480" height="290" rx="10" class="fpan ln"/>`+pic();
  F.forEach(([x1,y1,x2,y2,nm,c])=>{ g+=arr(x1,y1,x2,y2,c?"acc":"dat","",4); });
  g+=`<text x="${lx}" y="${ly}" font-size="15" font-weight="700">${n}</text>`;
  F.forEach(([x1,y1,x2,y2,nm,c],i)=>{ const y=ly+22+i*34; g+=`<rect x="${lx}" y="${y}" width="14" height="14" rx="3" class="${c?"facc":"fdat"}"/><text x="${lx+22}" y="${y+12}" font-size="13">${nm}</text><text x="${lx+22}" y="${y+27}" font-size="11" class="tmut">${c?"contact":"non-contact"} force</text>`; });
  s.setAttribute("viewBox",nw?`0 0 500 ${ly+30+F.length*34}`:"0 0 900 310"); s.innerHTML=g; }
$("#phys-fo1-k").addEventListener("change",e=>{ st.k=e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-forces";

/* FO2: gravity, weight and mass */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G;
const PL={earth:["Earth",9.8,"#3a7bd5"],moon:["Moon",1.6,"#9aa1a8"],mars:["Mars",3.7,"#d6533c"],jup:["Jupiter",25,"#d1a72c"]};
const st={p:"earth",m:2};
const stage=`<svg id="phys-fo2" viewBox="0 0 260 300" style="display:block;margin:0 auto;max-width:280px" role="img" aria-label="A newtonmeter holding a mass"></svg><canvas id="phys-fo2-cv" class="graph" aria-label="Weight against mass for each planet"></canvas>`;
const panel=`<div class="field"><div class="lbl">Location</div><div class="seg c2" id="phys-fo2-p">${Object.entries(PL).map(([k,p])=>`<label class="opt"><input type="radio" name="phys-fo2-p" value="${k}" ${k===st.p?"checked":""}><span>${p[0]}</span></label>`).join("")}</div></div>
<div class="field"><div class="lbl">Mass <b id="phys-fo2-ml"></b></div><input type="range" id="phys-fo2-m" min="0.5" max="5" step="0.5" value="2" aria-label="Mass"></div>
<div class="readout"><div><span>g</span><b id="phys-fo2-g">—</b></div><div><span>Weight W = mg</span><b id="phys-fo2-W">—</b></div><div><span>Mass</span><b id="phys-fo2-mm">—</b></div></div><p class="note">The mass is the same everywhere; only the weight changes.</p>`;

lesson({id:"phys-fo2",group:"a",num:2,lvl:"6.5.1 · Lesson 2",name:"Gravity, weight and mass",icon:"g",
 eyebrow:eb("6.5.1.3 Gravity",2),title:"Gravity, weight and mass",
 intro:"Your mass is the amount of matter in you and is the same wherever you go. Your weight is the gravitational force on you, and it would be much smaller on the Moon.",
 outcomes:[["Describe weight as the force acting on an object due to gravity","6.5.1.3"],["Use W = mg and recall that weight and mass are directly proportional","6.5.1.3"],["Describe the centre of mass and how weight is measured with a newtonmeter","6.5.1.3"]],
 blocks:[
  B.text("Weight",`<p>Gravity is the force of attraction between masses. Close to the Earth, it is responsible for the <b>weight</b> of an object: the force acting on the object due to gravity. The weight depends on the <b>gravitational field strength</b> at the point where the object is.</p>`+B.eq(`${v("W")} = ${v("m")}${v("g")} ${R}`,`<small>W = weight (N), m = mass (kg), g = gravitational field strength (N/kg); g = 9.8 N/kg on Earth</small>`)+`<ul><li>Weight and mass are <b>directly proportional</b> (W ∝ m).</li><li>The weight of an object may be considered to act at a single point called its <b>centre of mass</b>.</li><li>Weight is measured using a calibrated spring-balance (a <b>newtonmeter</b>).</li></ul>`),
  B.sim("phys-fo2-sim","Weight on different worlds",stage,panel,`<span>Lines: W = mg for each location</span>`),
  B.example("Weight on the Moon","An astronaut has a mass of 85 kg. Calculate her weight on the Earth (g = 9.8 N/kg) and on the Moon (g = 1.6 N/kg).",[
   ["On Earth","",[`${v("W")} = 85 × 9.8 = ${res("833 N")}`]],
   ["On the Moon","Same mass",[`${v("W")} = 85 × 1.6 = ${res("136 N")}`]]]),
  B.check([
   {q:"Calculate the weight of a 60 kg person on Earth. (g = 9.8 N/kg)",a:588,unit:"N",tol:0.01,why:"W = 60 × 9.8 = 588 N."},
   {q:"A rock weighs 49 N on Earth. What is its mass? (g = 9.8 N/kg)",a:5,unit:"kg",tol:0.01,why:"m = W/g = 49/9.8 = 5.0 kg."},
   {q:"An object weighs 37 N on Mars, where g = 3.7 N/kg. What is its mass?",a:10,unit:"kg",tol:0.01,why:"m = 37/3.7 = 10 kg."},
   {q:"What is the unit of weight?",opts:["kilogram","newton","N/kg","joule"],a:1,why:"Weight is a force, measured in newtons."},
   {q:"An object is taken from the Earth to the Moon. What happens to its mass?",opts:["Increases","Decreases","Stays the same","Becomes zero"],a:2,why:"Mass is the amount of matter; it does not depend on location."}]),
  B.keypoints(["Weight is the force due to gravity: W = mg (N).","Mass (kg) is the same everywhere; weight depends on g.","Weight acts at the centre of mass; measure it with a newtonmeter."]),
  B.mistakes(["Giving weight in kilograms.","Saying mass changes on the Moon.","Using g = 10 when the question gives 9.8 N/kg."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo2"); if(!s) return; const [n,g,col]=PL[st.p], W=st.m*g, sc=W<=50?50:150, ext=Math.min(130,W/sc*130);
  let gg=`<rect x="70" y="10" width="120" height="10" class="fink"/><rect x="100" y="20" width="60" height="${60+ext}" rx="8" class="fpan ink" stroke-width="2"/>`;
  for(let i=0;i<=10;i++){ const y=40+i*13; gg+=`<path d="M100 ${y} h10" class="mut"/><text x="96" y="${y+4}" text-anchor="end" font-size="9" class="tmut">${i*sc/10}</text>`; }
  gg+=`<path d="M112 ${40+W/sc*130} h36" class="bd" stroke-width="3"/><path d="M130 ${80+ext} V${100+ext}" class="ink" stroke-width="2"/><rect x="${130-12-st.m*3}" y="${100+ext}" width="${24+st.m*6}" height="${20+st.m*4}" rx="3" style="fill:${col}"/>`;
  gg+=`<text x="200" y="${40+W/sc*130+4}" font-size="12" class="tbd">${fx(W,1)} N</text><text x="130" y="${140+ext+st.m*4}" text-anchor="middle" font-size="12" class="tm">${st.m} kg</text>`;
  s.setAttribute("viewBox",`0 0 260 ${Math.max(300,160+ext+st.m*4)}`); s.innerHTML=gg;
  plot($("#phys-fo2-cv"),{aspect:asp(.4),x:{label:"mass / kg",min:0,max:5},y:{label:"weight / N",min:0,max:130},series:Object.entries(PL).map(([k,[nm,gv,c]])=>({pts:[[0,0],[5,5*gv]],col:c,join:true,noPts:true,label:nm})).concat([{pts:[[st.m,W]],col:css("--ink")}]),legend:"left"});
  $("#phys-fo2-ml").textContent=`${st.m} kg`; $("#phys-fo2-g").textContent=`${g} N/kg`; $("#phys-fo2-W").textContent=`${fx(W,1)} N`; $("#phys-fo2-mm").textContent=`${st.m} kg`; }
$("#phys-fo2-p").addEventListener("change",e=>{ st.p=e.target.value; draw(); });
$("#phys-fo2-m").addEventListener("input",e=>{ st.m=+e.target.value; draw(); });
})();


</script>
<script>
LEARN.unit="phys-forces";

/* FO3: resultant forces (HT: resolving and vector diagrams) */
(()=>{
const {$,fx}=LAB, {B,lesson,arr}=LEARN, {v,fr,res,sq}=LAB.W, {eb,HT,ht}=G;
const st={mode:"line",F1:6,F2:4,ang:90,same:false};
const stage=`<svg id="phys-fo3" viewBox="0 0 600 320" style="display:block;margin:0 auto;max-width:640px" role="img" aria-label="Vector diagram of forces and their resultant"></svg>`;
const panel=`<div class="field"><div class="lbl">Diagram</div><div class="seg c3" id="phys-fo3-m"><label class="opt"><input type="radio" name="phys-fo3-m" value="line" checked><span>In a line</span></label><label class="opt"><input type="radio" name="phys-fo3-m" value="angle"><span>At an angle</span></label><label class="opt"><input type="radio" name="phys-fo3-m" value="res"><span>Resolve</span></label></div></div>
<div class="field"><div class="lbl" id="phys-fo3-1t">Force 1 <b id="phys-fo3-1l"></b></div><input type="range" id="phys-fo3-1" min="1" max="10" step="1" value="6" aria-label="Force 1"></div>
<div class="field" id="phys-fo3-2f"><div class="lbl">Force 2 <b id="phys-fo3-2l"></b></div><input type="range" id="phys-fo3-2" min="1" max="10" step="1" value="4" aria-label="Force 2"></div>
<div class="field" id="phys-fo3-af"><div class="lbl">Angle <b id="phys-fo3-al"></b></div><input type="range" id="phys-fo3-a" min="0" max="180" step="5" value="90" aria-label="Angle"></div>
<label id="phys-fo3-sf" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="phys-fo3-s" style="width:18px;height:18px;accent-color:var(--accent)"> Forces in the same direction</label>
<div class="readout"><div><span id="phys-fo3-r1t">Resultant</span><b id="phys-fo3-r1">—</b></div><div><span id="phys-fo3-r2t">Direction</span><b id="phys-fo3-r2">—</b></div></div><p class="note" id="phys-fo3-msg"></p>`;

lesson({id:"phys-fo3",group:"a",num:3,lvl:"6.5.1 · Lesson 3",name:"Resultant forces",icon:"tri",
 eyebrow:eb("6.5.1.4 Resultant forces",3),title:"Resultant forces",
 intro:"When several forces act on an object, they can be replaced by a single force with the same effect: the resultant force. Higher-tier students also need to combine forces at an angle and split a force into two components.",
 outcomes:[["Calculate the resultant of forces acting in a straight line","6.5.1.4"],["(HT) Use free body diagrams and scale vector diagrams to find the resultant of forces at an angle","6.5.1.4"],["(HT) Resolve a single force into two components at right angles, and describe equilibrium","6.5.1.4"]],
 blocks:[
  B.text("Resultant force",`<p>A number of forces acting on an object may be replaced by a single force that has the same effect as all the original forces acting together. This is the <b>resultant force</b>.</p><ul><li>Forces in the <b>same direction</b>: add them.</li><li>Forces in <b>opposite directions</b>: subtract the smaller from the larger; the resultant is in the direction of the larger force.</li><li>If the resultant force is zero, the forces are <b>balanced</b>.</li></ul><p>A <b>free body diagram</b> shows all the forces acting on one object, as arrows drawn from the object, each labelled.</p>`),
  B.text(`Forces at an angle ${HT}`,ht(`<p>To find the resultant of two forces at an angle, draw a <b>scale vector diagram</b>: draw the forces <b>tip-to-tail</b> to scale; the resultant goes from the tail of the first arrow to the tip of the last. Measure its length and angle. (For two forces at right angles you can also use Pythagoras.)</p><p>A single force can be <b>resolved</b> into two components at right angles to each other that have the same effect. Draw the force to scale as the hypotenuse of a right-angled triangle; the other two sides are the components.</p><p>An object is in <b>equilibrium</b> if the forces on it are balanced: the vector diagram of the forces is a closed shape (the arrows go tip-to-tail and return to the start).</p>`)),
  B.sim("phys-fo3-sim","Combining and resolving forces",stage,panel,`<span>Grey grid: 1 square = 1 N</span>`),
  B.example("Two forces at right angles (HT)","A boat is pulled east with a force of 300 N and pushed north by the wind with a force of 400 N. Find the resultant force.",[
   ["Draw tip-to-tail","Right-angled triangle",[`resultant² = 300² + 400²`]],
   ["Magnitude","",[`resultant = √250 000 = ${res("500 N")}`]],
   ["Direction","tan θ = 400/300",[`θ = 53° north of east`]]]),
  B.check([
   {q:"Forces of 12 N to the right and 5 N to the left act on a box. What is the resultant force?",a:7,unit:"N",tol:0.001,why:"12 − 5 = 7 N to the right."},
   {q:"Two people push a car in the same direction with 250 N and 180 N. What is the resultant force?",a:430,unit:"N",tol:0.001,why:"250 + 180 = 430 N."},
   {q:"A parachutist has a weight of 700 N and air resistance of 700 N. What is the resultant force?",a:0,unit:"N",abs:0.01,why:"The forces are balanced."},
   {q:"(Higher) Forces of 6 N and 8 N act at right angles. Calculate the resultant.",a:10,unit:"N",tol:0.01,why:"√(36 + 64) = 10 N."},
   {q:"(Higher) A 10 N force acts at 30° above the horizontal. Its horizontal component is closest to…",opts:["5.0 N","8.7 N","10 N","2.7 N"],a:1,why:"10 cos 30° = 8.7 N (measure from a scale drawing)."},
   {q:"(Higher) Three forces on an object form a closed triangle when drawn tip-to-tail. What does this show?",opts:["The object is accelerating","The resultant force is zero (equilibrium)","The forces are all equal","The object has no weight"],a:1,why:"A closed vector diagram means a zero resultant."}]),
  B.keypoints(["Resultant force: single force with the same effect as all the forces.","In a line: add same-direction forces; subtract opposite ones.","(HT) Forces at an angle: tip-to-tail scale drawing. Resolving: split one force into two perpendicular components. Equilibrium: closed vector diagram."]),
  B.mistakes(["Adding forces that act in opposite directions.","Forgetting to state the direction of the resultant.","(HT) Drawing vectors tail-to-tail instead of tip-to-tail."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo3"); if(!s) return; const u=st.mode==="angle"?20:26, ox=120, oy=220; let g="";
  for(let x=0;x<=600;x+=u) g+=`<path d="M${x} 0 V320" class="mut" stroke-width=".3"/>`; for(let y=0;y<=320;y+=u) g+=`<path d="M0 ${y} H600" class="mut" stroke-width=".3"/>`;
  $("#phys-fo3-2f").hidden=st.mode==="res"; $("#phys-fo3-af").hidden=st.mode==="line"; $("#phys-fo3-sf").hidden=st.mode!=="line";
  if(st.mode==="line"){ const cx=300, cy=160; g+=`<rect x="${cx-30}" y="${cy-25}" width="60" height="50" rx="4" class="fsunk ink" stroke-width="2"/>`+arr(cx+30,cy,cx+30+st.F1*u,cy,"acc","",5)+(st.same?arr(cx+30,cy+12,cx+30+st.F2*u,cy+12,"dat","",5):arr(cx-30,cy,cx-30-st.F2*u,cy,"dat","",5));
    const R=st.same?st.F1+st.F2:st.F1-st.F2; const xs=R>0?Math.min(cx,580-R*u):Math.max(cx,20-R*u); if(R) g+=arr(xs,cy+60,xs+R*u,cy+60,"bd","",5); g+=`<text x="${cx}" y="${cy+90}" text-anchor="middle" font-size="13" class="tbd">resultant ${Math.abs(R)} N</text>`;
    $("#phys-fo3-r1t").textContent="Resultant"; $("#phys-fo3-r2t").textContent="Direction"; $("#phys-fo3-r1").textContent=`${Math.abs(R)} N`; $("#phys-fo3-r2").textContent=R>0?"right":R<0?"left":"— (balanced)";
    $("#phys-fo3-msg").textContent=R===0?"Balanced forces: the resultant is zero.":"The resultant is in the direction of the larger force."; }
  else if(st.mode==="angle"){ const a=st.ang*Math.PI/180, x1=ox+st.F1*u, y1=oy, x2=x1+st.F2*u*Math.cos(a), y2=y1-st.F2*u*Math.sin(a);
    g+=arr(ox,oy,x1,y1,"acc","",5)+arr(x1,y1,x2,y2,"dat","",5)+arr(ox,oy,x2,y2,"bd","",5);
    const Rx=st.F1+st.F2*Math.cos(a), Ry=st.F2*Math.sin(a), R=Math.hypot(Rx,Ry), th=Math.atan2(Ry,Rx)*180/Math.PI;
    g+=`<text x="${(ox+x1)/2}" y="${oy+22}" text-anchor="middle" font-size="13" class="tacc">${st.F1} N</text><text x="${(x1+x2)/2+10}" y="${(y1+y2)/2}" font-size="13" class="tdat">${st.F2} N</text><text x="${(ox+x2)/2-10}" y="${(oy+y2)/2-10}" text-anchor="end" font-size="13" class="tbd">${fx(R,1)} N</text>`;
    $("#phys-fo3-r1t").textContent="Resultant"; $("#phys-fo3-r2t").textContent="Angle to force 1"; $("#phys-fo3-r1").textContent=`${fx(R,1)} N`; $("#phys-fo3-r2").textContent=`${fx(th,0)}°`;
    $("#phys-fo3-msg").textContent="Tip-to-tail: the resultant (red) goes from the start of the first arrow to the end of the second."; }
  else { const a=st.ang*Math.PI/180, F=st.F1, x2=ox+F*u*Math.cos(a), y2=oy-F*u*Math.sin(a);
    g+=arr(ox,oy,x2,y2,"bd","",5)+arr(ox,oy+0.1,x2,oy,"acc","",4)+arr(x2,oy,x2,y2,"dat","",4);
    g+=`<text x="${(ox+x2)/2}" y="${oy+22}" text-anchor="middle" font-size="13" class="tacc">${fx(F*Math.cos(a),1)} N</text><text x="${x2+8}" y="${(oy+y2)/2}" font-size="13" class="tdat">${fx(F*Math.sin(a),1)} N</text>`;
    $("#phys-fo3-r1t").textContent="Horizontal component"; $("#phys-fo3-r2t").textContent="Vertical component"; $("#phys-fo3-r1").textContent=`${fx(F*Math.cos(a),2)} N`; $("#phys-fo3-r2").textContent=`${fx(F*Math.sin(a),2)} N`;
    $("#phys-fo3-msg").textContent="The two components (orange and blue) together have the same effect as the single force (red)."; }
  s.innerHTML=g; $("#phys-fo3-1t").firstChild.textContent=st.mode==="res"?"Force ":"Force 1 "; $("#phys-fo3-1l").textContent=`${st.F1} N`; $("#phys-fo3-2l").textContent=`${st.F2} N`; $("#phys-fo3-al").textContent=`${st.ang}°`; }
$("#phys-fo3-m").addEventListener("change",e=>{ st.mode=e.target.value; if(st.mode==="res"&&st.ang>90) st.ang=40, $("#phys-fo3-a").value=40; draw(); });

lesson({id:"phys-fo4",group:"a",num:4,lvl:"6.5.2 · Lesson 4",name:"Work done and energy transfer",icon:"work",

<script>

/* FO5: forces and elasticity */
(()=>{
const {$,fx,plot,css}=LAB, {B,lesson,asp}=LEARN, {v,fr,res}=LAB.W, {eb,R}=G;
const k=25, LP=6; /* N/m, limit at 6 N */
const st={n:0,maxF:0,data:[]};
const ext=F=>F<=LP?F/k:LP/k+(F-LP)/k*1.6+0.004*(F-LP)**2; /* metres */
const perm=()=>st.maxF>LP+0.5?(ext(st.maxF)-st.maxF/k)*0.6:0;
const stage=`<svg id="phys-fo5" viewBox="0 0 300 420" style="display:block;margin:0 auto;max-width:220px" role="img" aria-label="A spring with masses hanging from it next to a metre rule"></svg><canvas id="phys-fo5-cv" class="graph" aria-label="Force against extension"></canvas>`;
const panel=`<div class="field"><div class="lbl">Masses on the hanger (100 g each)</div><div class="btnrow"><button class="btn" id="phys-fo5-add">Add 100 g</button><button class="btn" id="phys-fo5-rem">Remove 100 g</button></div></div>
<div class="readout"><div><span>Force (weight)</span><b id="phys-fo5-F">—</b></div><div><span>Extension</span><b id="phys-fo5-e">—</b></div><div><span>F/e</span><b id="phys-fo5-k">—</b></div></div>
<div class="btnrow"><button class="btn" id="phys-fo5-rs">New spring</button></div><p class="note" id="phys-fo5-msg"></p>`;

lesson({id:"phys-fo5",group:"a",num:5,lvl:"6.5.3 · Lesson 5",name:"Forces and elasticity",icon:"spring",
 eyebrow:eb("6.5.3 Forces and elasticity",5),title:"Forces and elasticity",
 intro:"Stretching, squashing or bending an object needs more than one force. A spring stretches in proportion to the force on it, up to a point. Beyond that it is permanently deformed.",
 outcomes:[["Explain why more than one force is needed to stretch, bend or compress an object","6.5.3"],["Distinguish between elastic and inelastic deformation","6.5.3"],["Use F = ke and describe the limit of proportionality","6.5.3"],["Describe how to investigate force and extension for a spring (required practical 18)","6.5.3"]],
 blocks:[
  B.text("Elastic and inelastic deformation",`<p>To change the shape of an object (by stretching, bending or compressing), <b>more than one force</b> has to be applied: for example, a spring is stretched by pulling at both ends.</p><ul><li><b>Elastic deformation</b>: the object returns to its original length and shape when the forces are removed.</li><li><b>Inelastic deformation</b>: the object does not return to its original length or shape.</li></ul>`),
  B.text("Hooke’s law",`<p>The extension of an elastic object, such as a spring, is <b>directly proportional</b> to the force applied, provided that the <b>limit of proportionality</b> is not exceeded.</p>`+B.eq(`${v("F")} = ${v("k")}${v("e")} ${R}`,`<small>F = force (N), k = spring constant (N/m), e = extension (m)</small>`)+`<p>The same relationship applies to compression. A force that stretches (or compresses) a spring does work, and elastic potential energy is stored in the spring. Provided the spring is not inelastically deformed, the work done on the spring equals the elastic potential energy stored (E<sub>e</sub> = ½ke²).</p><p>Beyond the limit of proportionality the force–extension graph curves (it becomes <b>non-linear</b>).</p>`),
  B.sim("phys-fo5-sim","Loading a spring",stage,panel,`<span>Crosses: your readings</span><span>Dashed: limit of proportionality</span>`),
  B.practical(`<p>In <b>RP 18 Force and extension</b> you hang masses on a spring clamped next to a metre rule. Measure the original length, then the length after adding each mass. Extension = new length − original length. Plot force (weight, W = mg) against extension: the gradient of the straight part is the spring constant k.</p><ul><li>Use a pointer on the spring and read the ruler at eye level to avoid parallax.</li><li>Do not exceed the limit of proportionality if you want to reuse the spring.</li></ul>`,"Required practical 18"),
  B.check([
   {q:"A spring has a spring constant of 40 N/m. What force stretches it by 0.15 m?",a:6,unit:"N",tol:0.01,why:"F = ke = 40 × 0.15 = 6.0 N."},
   {q:"A 5.0 N force stretches a spring by 0.020 m. Calculate the spring constant.",a:250,unit:"N/m",tol:0.01,why:"k = F/e = 5.0/0.020 = 250 N/m."},
   {q:"A spring of k = 80 N/m has a force of 2.0 N applied. Calculate the extension in cm.",a:2.5,unit:"cm",tol:0.01,why:"e = 2.0/80 = 0.025 m = 2.5 cm."},
   {q:"A spring has an original length of 12.0 cm. With a load its length is 15.5 cm. What is the extension?",a:3.5,unit:"cm",tol:0.01,why:"15.5 − 12.0 = 3.5 cm."},
   {q:"A spring does not return to its original length when the load is removed. This is…",opts:["elastic deformation","inelastic deformation","compression","the spring constant"],a:1,why:"It has been permanently deformed."}]),
  B.keypoints(["Changing shape needs more than one force.","Elastic: returns to shape. Inelastic: permanently deformed.","F = ke up to the limit of proportionality; graph is a straight line through the origin."]),
  B.mistakes(["Using the length instead of the extension.","Plotting mass instead of force (convert with W = mg).","Assuming F = ke still works beyond the limit of proportionality."])
 ],onShow:()=>draw()});

function draw(){ const s=$("#phys-fo5"); if(!s) return; const F=st.n*0.98, e=ext(F)+(F<st.maxF?perm():0), L0=120, sc=600, Lp=L0+e*sc;
  let d=`M150 30 v10`; const n=14; for(let i=0;i<n;i++){ const y=40+(i+.5)*(Lp-20)/n; d+=` L${i%2?132:168} ${y.toFixed(1)}`; } d+=` L150 ${30+Lp-10} v10`;
  let g=`<rect x="90" y="18" width="120" height="12" class="fink"/><rect x="230" y="20" width="24" height="440" class="fpan ink" stroke-width="1"/>`;
  for(let c=0;c<=50;c++){ const y=30+L0+c*6; g+=`<path d="M230 ${y} h${c%5?6:12}" class="ink" stroke-width=".8"/>${c%5?"":`<text x="226" y="${y+4}" text-anchor="end" font-size="9" class="tmut">${c}</text>`}`; }
  g+=`<path d="${d}" fill="none" class="${st.maxF>LP+0.5?"bd":"ink"}" stroke-width="2.4"/><path d="M150 ${30+Lp} h80" class="acc" stroke-width="1.5"/>`;
  for(let i=0;i<st.n;i++) g+=`<rect x="128" y="${30+Lp+8+i*7}" width="44" height="6" rx="1" class="fmut"/>`;
  g+=`<path d="M150 ${30+Lp} v8" class="ink" stroke-width="2"/>`;
  s.setAttribute("viewBox",`0 0 300 ${Math.max(470,40+Lp+10+st.n*7)}`); s.innerHTML=g;
  const lp=[[0,0],[LP/k,LP]];
  plot($("#phys-fo5-cv"),{aspect:asp(.42),x:{label:"extension / m",min:0,max:0.6},y:{label:"force / N",min:0,max:10},series:[{pts:st.data,col:css("--accent")}],fits:[{m:k,c:0,x0:0,x1:LP/k,col:css("--muted"),dash:[5,4]}],empty:"Add masses"});
  $("#phys-fo5-F").textContent=`${fx(F,2)} N`; $("#phys-fo5-e").textContent=`${fx(e*100,1)} cm`; $("#phys-fo5-k").textContent=e>0?`${fx(F/e,1)} N/m`:"—";
  $("#phys-fo5-msg").textContent=st.maxF>LP+0.5?(st.n*0.98<st.maxF?"The spring has been stretched beyond its limit of proportionality and has not returned to its original length: inelastic deformation.":"Beyond the limit of proportionality: the extension is no longer proportional to the force."):"Within the limit of proportionality: doubling the force doubles the extension."; }
function rec(){ const F=st.n*0.98, e=ext(F)+(F<st.maxF?perm():0); st.data=st.data.filter(p=>Math.abs(p[1]-F)>1e-6); st.data.push([+(e*(1+(Math.random()-.5)*0.03)).toFixed(4),F]); st.data.sort((a,b)=>a[1]-b[1]); }
$("#phys-fo5-add").addEventListener("click",()=>{ if(st.n>=10) return; st.n++; st.maxF=Math.max(st.maxF,st.n*0.98); rec(); draw(); });
$("#phys-fo5-rem").addEventListener("click",()=>{ if(st.n<=0) return; st.n--; draw(); });
$("#phys-fo5-rs").addEventListener("click",()=>{ st.n=0; st.maxF=0; st.data=[]; draw(); });
})();


</script>

(()=>{

/* journey: s(t) piecewise */
const vel=t=>t<10?3:t<20?0:t<40?0.25*(t-20):5;

lesson({id:"phys-fo8",group:"c",num:8,lvl:"6.5.4 · Lesson 8",name:"Speed and distance–time graphs",icon:"st",
 eyebrow:eb("6.5.6.1.1–6.5.6.1.4 Distance, speed, velocity and distance–time graphs",8),title:"Speed and distance–time graphs",
 intro:"Speed tells you how far something travels each second; velocity is speed in a given direction. A distance–time graph shows a whole journey at a glance, and its gradient is the speed.",
 outcomes:[["Distinguish distance from displacement and speed from velocity","6.5.6.1.1–3"],["Use s = vt and recall typical speeds","6.5.6.1.2"],["Calculate speed from the gradient of a distance–time graph; (HT) use a tangent when the speed is changing","6.5.6.1.4"]],
 blocks:[
  B.text("Speed and velocity",`<p><b>Distance</b> is how far an object moves (a scalar). <b>Displacement</b> includes both the distance and the direction of an object’s final position from its start (a vector).</p><p><b>Speed</b> is a scalar. The <b>velocity</b> of an object is its speed in a given direction (a vector). An object moving in a circle at constant speed has a changing velocity, because its direction changes.</p>`+B.eq(`${v("s")} = ${v("v")}${v("t")} ${R}`,`<small>s = distance (m), v = speed (m/s), t = time (s)</small>`)+`<p>Typical speeds: walking ≈ 1.5 m/s, running ≈ 3 m/s, cycling ≈ 6 m/s, car in town ≈ 13 m/s, train ≈ 50 m/s, sound in air ≈ 330 m/s, wind ≈ 5–20 m/s. The speed of a moving person is affected by age, terrain, fitness and distance travelled.</p>`),
  B.text("Distance–time graphs",`<ul><li>A straight sloping line: constant speed. <b>Speed = gradient</b>.</li><li>A horizontal line: stationary.</li><li>A curve getting steeper: accelerating; getting less steep: decelerating.</li></ul>`+ht(`<p>If the speed is changing, the speed at any particular time is found by drawing a <b>tangent</b> to the curve at that time and measuring its gradient.</p>`)),

   {q:"What does a horizontal line on a distance–time graph show?",opts:["Constant speed","Acceleration","The object is stationary","Deceleration"],a:2,why:"The distance does not change."},
