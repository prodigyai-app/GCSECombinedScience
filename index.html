lesson({id:"chem-cc8",group:"c",num:8,lvl:"5.4.3 · Lesson 8",name:"Electrolysis of molten compounds",icon:"elec",
 eyebrow:eb("5.4.3.1–5.4.3.2 The process of electrolysis; electrolysis of molten ionic compounds",8),title:"Electrolysis of molten ionic compounds",
 intro:"When an ionic compound is melted or dissolved, its ions can move. Passing an electric current through it pulls the positive ions to one electrode and the negative ions to the other, where they are discharged as elements.",
 outcomes:[["Describe electrolysis: ions move to the oppositely charged electrodes and are discharged","5.4.3.1"],["Predict the products of electrolysing a molten binary ionic compound","5.4.3.2"],["<span class=\"ht\">Higher</span> Write half equations for the reactions at the electrodes","5.4.3.1"]],
 blocks:[
  B.text("The process",`<p>When an ionic compound is <b>melted or dissolved</b> in water, the ions are free to move about within the liquid or solution. These liquids and solutions are able to conduct electricity and are called <b>electrolytes</b>.</p><p>Passing an electric current through electrolytes causes the ions to move to the electrodes. <b>Positively charged ions</b> move to the <b>negative electrode (the cathode)</b>, and <b>negatively charged ions</b> move to the <b>positive electrode (the anode)</b>. Ions are <b>discharged</b> at the electrodes, producing elements. This process is called <b>electrolysis</b>.</p><p>When a simple ionic compound (e.g. lead bromide) is electrolysed in the molten state using inert electrodes, the <b>metal</b> (lead) is produced at the cathode and the <b>non-metal</b> (bromine) at the anode.</p>`+G.ht(`<p>At the cathode, positive ions <b>gain electrons</b> (reduction): ${f("Pb^2+ + 2e^- -> Pb")}. At the anode, negative ions <b>lose electrons</b> (oxidation): ${f("2Br^- -> Br2 + 2e^-")}. This may also be written ${f("2Br^- - 2e^- -> Br2")}.</p>`)),

   {q:"What is the name for a liquid or solution that conducts and is decomposed by electricity?",opts:["Electrode","Electrolyte","Electron","Anode"],a:1,why:"An electrolyte."},
   {q:"<span class=\"ht\">Higher</span> In Pb²⁺ + 2e⁻ → Pb, what happens to the lead ions?",opts:["Oxidised","Reduced","Neutralised","Displaced"],a:1,why:"They gain electrons (HT)."}]),
  B.keypoints(["Electrolyte: molten or dissolved ionic compound; ions free to move.","Positive ions → cathode (−), gain electrons. Negative ions → anode (+), lose electrons.","Molten binary compound: metal at the cathode, non-metal at the anode."]),
  B.mistakes(["Saying electrons flow through the electrolyte (ions move).","Mixing up anode and cathode: remember PANIC, Positive Anode Negative Is Cathode.","Writing Br instead of Br₂ as the product."])
 ],onShow:()=>{}});

 {n:"Sodium chloride solution",liq:"#9cc8e8",where:"NaCl(aq)",ions:W([["Na⁺",1,P,7],["Cl⁻",-1,N,7]]),cat:{name:"hydrogen",t:"gas",col:"#ffffff",h:"2H^+ + 2e^- -> H2"},an:{name:"chlorine",t:"gas",col:"#9bd36b",h:"2Cl^- -> Cl2 + 2e^-"},why:"Sodium is more reactive than hydrogen, so hydrogen is produced. A halide is present, so chlorine is produced. Sodium hydroxide solution is left."},
 {n:"Copper(II) sulfate solution",liq:"#5b9be0",where:"CuSO₄(aq)",ions:W([["Cu²⁺",2,"#2a6fd6",6],["SO₄²⁻",-2,"#c565c9",6]]),cat:{name:"copper (pink-brown coating)",t:"solid",col:"#c87533",h:"Cu^2+ + 2e^- -> Cu"},an:{name:"oxygen",t:"gas",col:"#ffffff",h:"4OH^- -> O2 + 2H2O + 4e^-"},why:"Copper is less reactive than hydrogen, so copper is deposited. No halide ions, so oxygen is produced from hydroxide ions."},
 {n:"Copper(II) chloride solution",liq:"#5fb3a8",where:"CuCl₂(aq)",ions:W([["Cu²⁺",2,"#2a6fd6",6],["Cl⁻",-1,N,10]]),cat:{name:"copper",t:"solid",col:"#c87533",h:"Cu^2+ + 2e^- -> Cu"},an:{name:"chlorine",t:"gas",col:"#9bd36b",h:"2Cl^- -> Cl2 + 2e^-"},why:"Copper is below hydrogen, so copper forms; chloride is a halide, so chlorine forms."},
 {n:"Potassium bromide solution",liq:"#9cc8e8",where:"KBr(aq)",ions:W([["K⁺",1,P,7],["Br⁻",-1,"#b5502b",7]]),cat:{name:"hydrogen",t:"gas",col:"#ffffff",h:"2H^+ + 2e^- -> H2"},an:{name:"bromine (orange solution)",t:"gas",col:"#d9792b",h:"2Br^- -> Br2 + 2e^-"},why:"Potassium is more reactive than hydrogen; bromide is a halide."},
 {n:"Dilute sulfuric acid",liq:"#9cc8e8",where:"H₂SO₄(aq)",ions:[["H⁺",1,HI,10],["SO₄²⁻",-2,"#c565c9",5],["OH⁻",-1,OH,2]],cat:{name:"hydrogen",t:"gas",col:"#ffffff",rate:2,h:"2H^+ + 2e^- -> H2"},an:{name:"oxygen",t:"gas",col:"#ffffff",h:"4OH^- -> O2 + 2H2O + 4e^-"},why:"Hydrogen ions are discharged at the cathode; with no halide, oxygen forms at the anode. Twice the volume of hydrogen as oxygen is produced."},
 {n:"Silver nitrate solution",liq:"#cfe2f2",where:"AgNO₃(aq)",ions:W([["Ag⁺",1,"#8f9aa6",7],["NO₃⁻",-1,"#d9a43a",7]]),cat:{name:"silver",t:"solid",col:"#d8dde2",h:"Ag^+ + e^- -> Ag"},an:{name:"oxygen",t:"gas",col:"#ffffff",h:"4OH^- -> O2 + 2H2O + 4e^-"},why:"Silver is less reactive than hydrogen; nitrate is not a halide, so oxygen is produced."}];

 eyebrow:eb("5.4.3.4 Electrolysis of aqueous solutions · Required practical 9",9),title:"Electrolysis of aqueous solutions",
 intro:"In a solution, water provides extra ions: hydrogen ions and hydroxide ions. They compete with the ions of the dissolved compound, and two simple rules tell you which ones are discharged.",
 outcomes:[["Explain why aqueous solutions contain H⁺ and OH⁻ ions from water","5.4.3.4"],["Predict the products of electrolysing aqueous solutions using the reactivity of the metal and whether a halide is present","5.4.3.4"],["<span class=\"ht\">Higher</span> Write half equations, including for the production of oxygen","5.4.3.5"]],
 blocks:[
  B.text("The rules",`<p>The ions discharged when an aqueous solution is electrolysed using inert electrodes depend on the relative reactivity of the elements involved. Water is partially ionised: ${f("H2O <=> H^+ + OH^-")}.</p><ul><li><b>At the cathode (−)</b>: <b>hydrogen</b> is produced if the metal is <b>more reactive than hydrogen</b>. Otherwise the metal is produced (copper, silver).</li><li><b>At the anode (+)</b>: <b>oxygen</b> is produced unless the solution contains <b>halide ions</b> (Cl⁻, Br⁻, I⁻), when the <b>halogen</b> is produced.</li></ul><p>This happens because in the aqueous solution water molecules break down producing hydrogen ions and hydroxide ions that are discharged.</p>`+G.ht(`<p>Oxygen at the anode: ${f("4OH^- -> O2 + 2H2O + 4e^-")}. Hydrogen at the cathode: ${f("2H^+ + 2e^- -> H2")}. Reduction happens at the cathode and oxidation at the anode.</p>`)),

   {q:"Which test identifies chlorine?",opts:["Squeaky pop","Relights a glowing splint","Bleaches damp litmus paper","Turns limewater milky"],a:2,why:"Chlorine bleaches damp litmus."}]),
  B.keypoints(["Water provides H⁺ and OH⁻ ions.","Cathode: hydrogen unless the metal is less reactive than hydrogen.","Anode: oxygen unless a halide is present (then the halogen)."]),
  B.mistakes(["Saying sodium is produced from sodium chloride solution.","Saying sulfur or sulfate is produced at the anode.","Forgetting that the solution left behind changes (e.g. NaOH forms)."])

(()=>{

 ]});

<script>
LEARN.unit="chem-energy";

/* EN1: exothermic and endothermic reactions (RP10) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,sl,val}=CH;
/* neutralisation in a polystyrene cup: 25 cm3 of 2.0 mol/dm3 HCl at 20 C; NaOH 2.0 mol/dm3 added. dT approx 55.8 kJ/mol */
const T0=20.0, dTmax=v=>{ const n=Math.min(0.05,0.002*v), heat=n*57100, mass=(25+v); return heat/(mass*4.18); };
const Tmax=v=>v===0?T0:+(T0+dTmax(v)-(v>25?0:0)).toFixed(1);
const RX=[["Neutralisation: HCl + NaOH","exo","HCl(aq) + NaOH(aq) -> NaCl(aq) + H2O(l)",+13],["Magnesium + hydrochloric acid","exo","Mg(s) + 2HCl(aq) -> MgCl2(aq) + H2(g)",+24],["Zinc + copper(II) sulfate (displacement)","exo","Zn(s) + CuSO4(aq) -> ZnSO4(aq) + Cu(s)",+9],["Citric acid + sodium hydrogencarbonate","endo","citric acid + NaHCO3 -> sodium citrate + H2O + CO2",-5],["Ammonium nitrate dissolving (cold pack)","endo","NH4NO3(s) -> NH4NO3(aq)",-8],["Thermal decomposition of calcium carbonate","endo","CaCO3(s) -> CaO(s) + CO2(g)",null]];
const stage=`<div class="two" style="padding:12px;align-items:center"><svg id="chem-en1-cup" class="chsvg" viewBox="0 0 220 260" role="img" aria-label="Polystyrene cup with thermometer"></svg><svg id="chem-en1-g" class="chsvg" viewBox="0 0 340 250" role="img" aria-label="Maximum temperature against volume of sodium hydroxide"></svg></div>`;
const panel=sl("chem-en1-v","Volume of sodium hydroxide added",0,40,5,10,"Volume of sodium hydroxide in cubic centimetres")+CH.ro([["chem-en1-t","Highest temperature"],["chem-en1-d","Temperature rise"]])+`<p class="note">25 cm³ of dilute hydrochloric acid at ${T0} °C in a polystyrene cup with a lid. Each point is a separate run.</p>`;
const stage2=`<div style="padding:14px"><div id="chem-en1-eq" class="eqn"></div><div id="chem-en1-th" style="display:flex;gap:20px;align-items:flex-end;margin-top:10px"></div></div>`;
const panel2=field("Reaction",sel("chem-en1-r",RX.map((r,i)=>[String(i),r[0]]),"0"))+CH.ro([["chem-en1-k","Type"],["chem-en1-s","Surroundings"]]);
lesson({id:"chem-en1",group:"a",num:1,lvl:"5.5.1 · Lesson 1",name:"Exothermic and endothermic reactions",icon:"exo",
 eyebrow:eb("5.5.1.1 Energy transfer during exothermic and endothermic reactions · Required practical 10",1),title:"Exothermic and endothermic reactions",
 intro:"Energy is conserved in chemical reactions, but it can move between the chemicals and their surroundings. If the reaction gives energy out, the surroundings get warmer; if it takes energy in, they cool down.",
 outcomes:[["Describe exothermic and endothermic reactions in terms of energy transfer and temperature change","5.5.1.1"],["Give examples and everyday uses of exothermic and endothermic reactions","5.5.1.1"],["Describe how to investigate the variables that affect temperature changes in reacting solutions (RP10)","5.5.1.1"]],
 blocks:[
  B.text("Energy in, energy out",`<p>Energy is conserved in chemical reactions: the amount of energy in the universe at the end of a reaction is the same as before.</p><ul><li>An <b>exothermic</b> reaction transfers energy <b>to the surroundings</b>, so the temperature of the surroundings <b>increases</b>. Examples: combustion, many oxidation reactions, neutralisation. Uses: self-heating cans, hand warmers.</li><li>An <b>endothermic</b> reaction takes in energy <b>from the surroundings</b>, so the temperature of the surroundings <b>decreases</b>. Examples: thermal decompositions, citric acid with sodium hydrogencarbonate. Uses: some sports injury cold packs.</li></ul>`),
  B.sim("chem-en1-sim2","Hot or cold?",stage2,panel2,`<span>Exo: temperature rises</span><span>Endo: temperature falls</span>`),
  B.text("Required practical 10",`<p>In <b>RP10</b>, Required practical 10, you investigate a variable that affects the temperature change of a reaction, for example the volume of sodium hydroxide added to hydrochloric acid. Use a polystyrene cup with a lid (in a beaker for stability) to reduce energy transfer to the surroundings, and record the highest temperature reached for each volume.</p>`),
  B.sim("chem-en1-sim","Temperature change on neutralisation",stage,panel,`<span>Peak at the neutral point</span>`),
  B.check([
   {q:"The temperature of a solution falls during a reaction. What type of reaction is it?",opts:["Exothermic","Endothermic","Neutralisation","Combustion"],a:1,why:"Energy is taken in from the surroundings."},
   {q:"Which is an endothermic reaction?",opts:["Burning methane","Neutralisation","Thermal decomposition of calcium carbonate","Magnesium with acid"],a:2,why:"Thermal decompositions take in energy."},
   {q:"Why is a polystyrene cup used in RP10?",opts:["It is cheap","It is a good thermal insulator, reducing energy transfer to the surroundings","It reacts with the acid","It is transparent"],a:1,why:"Less energy is lost, so the temperature change is more accurate."},
   {q:"The temperature rises from 19.5 °C to 31.0 °C. Calculate the temperature change, in °C.",a:11.5,unit:"°C",tol:0.001,why:"31.0 − 19.5 = 11.5 °C."},
   {q:"Give a use of an exothermic reaction.",opts:["Cold pack for injuries","Hand warmer","Photosynthesis","Fridge"],a:1,why:"Hand warmers and self-heating cans use exothermic reactions."}]),
  B.keypoints(["Exothermic: energy out to surroundings, temperature rises (combustion, neutralisation, oxidation).","Endothermic: energy in from surroundings, temperature falls (thermal decomposition, citric acid + NaHCO₃).","RP10: polystyrene cup and lid; measure the highest (or lowest) temperature."]),
  B.mistakes(["Saying an endothermic reaction 'gives out cold'.","Thinking energy is created or destroyed in a reaction.","Recording the final temperature instead of the highest temperature."])
 ],onShow:()=>{draw();draw2();}});
function draw(){ const V=val("chem-en1-v"), T=Tmax(V);
  const X=v=>45+v/40*280, Y=t=>220-(t-15)/20*200;
  let g=`<line x1="45" y1="15" x2="45" y2="220" class="ink" stroke-width="1.5"/><line x1="45" y1="220" x2="330" y2="220" class="ink" stroke-width="1.5"/>${[15,20,25,30,35].map(t=>`<text x="39" y="${Y(t)+4}" text-anchor="end" font-size="11">${t}</text><line x1="45" y1="${Y(t)}" x2="330" y2="${Y(t)}" class="ln" stroke-width="1"/>`).join("")}${[0,10,20,30,40].map(v=>`<text x="${X(v)}" y="236" text-anchor="middle" font-size="11">${v}</text>`).join("")}<text x="185" y="249" text-anchor="middle" font-size="11">volume of NaOH added / cm³</text><text x="12" y="118" font-size="11" transform="rotate(-90 12 118)" text-anchor="middle">highest temperature / °C</text>`;
  for(let v=0;v<=V;v+=5) g+=`<path d="M${X(v)-5} ${Y(Tmax(v))-5}l10 10m0 -10l-10 10" class="dat" stroke-width="2"/>`;
  $("#chem-en1-g").innerHTML=g;
  const h=Math.max(0,(T-10)/30*140);
  $("#chem-en1-cup").innerHTML=`<path d="M50 90l14 150h92l14-150z" fill="#f3f3ee" stroke="var(--ink)" stroke-width="2"/><rect x="40" y="80" width="140" height="14" rx="3" class="fmut"/><path d="M71 170l6 66h66l6-66z" fill="#9cc8e8" opacity=".7"/><rect x="104" y="20" width="12" height="200" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><circle cx="110" cy="218" r="10" fill="#e05252"/><rect x="107" y="${212-h}" width="6" height="${h}" fill="#e05252"/><text x="128" y="40" font-size="14" font-weight="700">${T.toFixed(1)} °C</text>`;
  set("chem-en1-v-l",V+" cm³"); set("chem-en1-t",T.toFixed(1)+" °C"); set("chem-en1-d",(T-T0).toFixed(1)+" °C"); }
function draw2(){ const r=RX[+$("#chem-en1-r").value];
  $("#chem-en1-eq").innerHTML=/citric/.test(r[2])?r[2].replace("->","→").replace("NaHCO3","NaHCO₃").replace("H2O","H₂O").replace("CO2","CO₂"):f(r[2]);
  const th=(t,lab)=>`<div style="text-align:center"><svg viewBox="0 0 60 200" width="54" class="chsvg"><rect x="24" y="10" width="12" height="160" rx="6" fill="#fff" stroke="var(--ink)"/><circle cx="30" cy="178" r="11" fill="#e05252"/><rect x="27" y="${170-(t-0)/45*150}" width="6" height="${(t-0)/45*150}" fill="#e05252"/></svg><div style="font-family:var(--f-mono)">${t.toFixed(0)} °C</div><div class="muted" style="font-size:.85rem">${lab}</div></div>`;
  if(r[3]==null) $("#chem-en1-th").innerHTML=`<p>This reaction only happens while it is heated strongly: energy must be supplied continuously. Remove the Bunsen burner and the decomposition stops.</p>`;
  else $("#chem-en1-th").innerHTML=th(20,"before")+`<div style="font-size:2rem;align-self:center">→</div>`+th(20+r[3],"after");
  set("chem-en1-k",r[1]==="exo"?`<span class="pill no">exothermic</span>`:`<span class="pill ok">endothermic</span>`); set("chem-en1-s",r[1]==="exo"?"get warmer":"get colder"); }
$("#chem-en1-v").addEventListener("input",draw); $("#chem-en1-r").addEventListener("change",draw2); draw(); draw2();
})();

</script>
<script>
LEARN.unit="chem-energy";

/* EN2: reaction profiles */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val,profile}=CH;
const stage=`<svg id="chem-en2-svg" class="chsvg" viewBox="0 0 520 320" role="img" aria-label="Reaction profile"></svg>`;
const panel=sl("chem-en2-p","Energy of products",5,85,1,25,"Energy of products")+sl("chem-en2-a","Activation energy",5,50,1,30,"Activation energy")+`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer"><input type="checkbox" id="chem-en2-c" style="width:18px;height:18px"> Add a catalyst</label>`+CH.ro([["chem-en2-t","Type"],["chem-en2-d","Overall energy change"]])+`<p class="note">Reactants are fixed at 50 units of energy.</p>`;
lesson({id:"chem-en2",group:"a",num:2,lvl:"5.5.1 · Lesson 2",name:"Reaction profiles",icon:"prof",
 eyebrow:eb("5.5.1.2 Reaction profiles",2),title:"Reaction profiles",
 intro:"A reaction profile is an energy diagram that shows the energy of the reactants and products, and the energy hill that the particles must climb before they can react.",
 outcomes:[["Draw and interpret reaction profiles for exothermic and endothermic reactions","5.5.1.2"],["Explain activation energy as the minimum energy particles need to react","5.5.1.2"],["Show the effect of a catalyst on a reaction profile","5.6.1.4"]],
 blocks:[
  B.text("Collisions and energy",`<p>Chemical reactions can occur only when reacting particles collide with each other and with sufficient energy. The minimum amount of energy that particles must have to react is called the <b>activation energy</b>.</p><p>On a reaction profile:</p><ul><li>in an <b>exothermic</b> reaction the products are <b>lower</b> in energy than the reactants (energy is released to the surroundings);</li><li>in an <b>endothermic</b> reaction the products are <b>higher</b> than the reactants;</li><li>the activation energy is shown as the rise from the reactants to the top of the curve.</li></ul><p>A <b>catalyst</b> provides a different pathway with a <b>lower activation energy</b>; it does not change the energies of the reactants or products.</p>`),
  B.sim("chem-en2-sim","Build a reaction profile",stage,panel,`<span>Ea measured from the reactants</span>`),
  B.check([
   {q:"In an exothermic reaction profile, the products are…",opts:["higher in energy than the reactants","lower in energy than the reactants","at the same energy","above the activation energy"],a:1,why:"Energy is released."},
   {q:"What is activation energy?",opts:["The energy released by a reaction","The minimum energy particles need to react","The energy of the products","The energy of a catalyst"],a:1,why:"The energy barrier."},
   {q:"What does a catalyst change?",opts:["The energy of the products","The overall energy change","The activation energy","The energy of the reactants"],a:2,why:"It provides a pathway with a lower activation energy."},
   {q:"On a profile, reactants are at 120 kJ, products at 80 kJ and the peak at 200 kJ. What is the activation energy, in kJ?",a:80,unit:"kJ",tol:0,why:"200 − 120 = 80 kJ, measured from the reactants."},
   {q:"For the same profile, what is the overall energy change, in kJ? (Give a negative value for energy released.)",a:-40,unit:"kJ",tol:0,why:"80 − 120 = −40 kJ: exothermic."}]),
  B.keypoints(["Exothermic: products below reactants. Endothermic: products above.","Activation energy: from reactants up to the peak.","Catalyst: lower peak, same start and end."]),
  B.mistakes(["Measuring activation energy from the products.","Drawing a catalyst curve that ends at a different energy.","Labelling the overall energy change from the peak."])
 ],onShow:()=>draw()});
function draw(){ const p=val("chem-en2-p"), a=val("chem-en2-a"), cat=$("#chem-en2-c").checked; const r=50; const ea=Math.max(a,p-r+5);
  $("#chem-en2-svg").innerHTML=profile({W:520,H:320,r,p,ea,cat:cat?Math.max(ea*.5,p-r+3):null});
  set("chem-en2-p-l",p); set("chem-en2-a-l",ea); set("chem-en2-t",p<r?`<span class="pill no">exothermic</span>`:p>r?`<span class="pill ok">endothermic</span>`:"no energy change"); set("chem-en2-d",(p-r>0?"+":"")+(p-r)+" units"); }
["chem-en2-p","chem-en2-a"].forEach(id=>$("#"+id).addEventListener("input",draw)); $("#chem-en2-c").addEventListener("change",draw); draw();
})();

</script>
<script>
LEARN.unit="chem-energy";

/* EN3: bond energies (HT) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field}=CH, {res}=LAB.W;
const BE={"H–H":436,"Cl–Cl":243,"H–Cl":432,"C–H":413,"O=O":498,"C=O":805,"O–H":464,"N≡N":945,"N–H":391,"Br–Br":193,"H–Br":366};
const RX=[
 {n:"Hydrogen + chlorine",eq:"H2 + Cl2 -> 2HCl",brk:[["H–H",1],["Cl–Cl",1]],mk:[["H–Cl",2]]},
 {n:"Hydrogen + bromine",eq:"H2 + Br2 -> 2HBr",brk:[["H–H",1],["Br–Br",1]],mk:[["H–Br",2]]},
 {n:"Burning methane",eq:"CH4 + 2O2 -> CO2 + 2H2O",brk:[["C–H",4],["O=O",2]],mk:[["C=O",2],["O–H",4]]},
 {n:"Burning hydrogen",eq:"2H2 + O2 -> 2H2O",brk:[["H–H",2],["O=O",1]],mk:[["O–H",4]]},
 {n:"Making ammonia",eq:"N2 + 3H2 -> 2NH3",brk:[["N≡N",1],["H–H",3]],mk:[["N–H",6]]},
 {n:"Decomposing ammonia",eq:"2NH3 -> N2 + 3H2",brk:[["N–H",6]],mk:[["N≡N",1],["H–H",3]]}];
const stage=`<div style="padding:14px"><div id="chem-en3-eq" class="eqn"></div><svg id="chem-en3-svg" class="chsvg" viewBox="0 0 560 190" role="img" aria-label="Energy to break bonds compared with energy released making bonds"></svg><div id="chem-en3-w" class="eqbox"></div></div>`;
const panel=field("Reaction",sel("chem-en3-r",RX.map((r,i)=>[String(i),r.n]),"0"))+CH.ro([["chem-en3-b","Energy to break bonds"],["chem-en3-m","Energy released making bonds"],["chem-en3-d","Overall energy change"],["chem-en3-t","Type"]])+`<p class="note">Bond energies (kJ/mol): ${Object.entries(BE).map(([k,v])=>`${k} ${v}`).join(" · ")}</p>`;
lesson({id:"chem-en3",group:"a",num:3,lvl:"5.5.1 · Lesson 3",name:"Bond energies",icon:"bond",tag:"Higher tier",
 eyebrow:eb("5.5.1.3 The energy change of reactions (HT only)",3),title:"Bond energies and energy changes",
 intro:"During a reaction, bonds in the reactants are broken and new bonds are made in the products. Breaking bonds takes energy in; making bonds gives energy out. The balance between the two decides whether the reaction is exothermic or endothermic.",
 outcomes:[["Explain that breaking bonds is endothermic and making bonds is exothermic","5.5.1.3"],["Calculate the overall energy change of a reaction from bond energies","5.5.1.3"],["Explain whether a reaction is exothermic or endothermic using bond energies","5.5.1.3"]],
 blocks:[
  B.text("Breaking and making",`<p>During a chemical reaction:</p><ul><li>energy must be <b>supplied to break bonds</b> in the reactants (endothermic);</li><li>energy is <b>released when bonds form</b> in the products (exothermic).</li></ul>`+B.eq(`overall energy change = energy needed to break bonds − energy released making bonds`)+`<p>If more energy is released making bonds than is used breaking them, the reaction is <b>exothermic</b> and the energy change is <b>negative</b>. If more energy is needed to break bonds, it is <b>endothermic</b> and the change is <b>positive</b>.</p>`),
  B.sim("chem-en3-sim","Bond energy calculator",stage,panel,`<span>Break: energy in</span><span>Make: energy out</span>`),
  B.example("Burning methane","CH₄ + 2O₂ → CO₂ + 2H₂O. Bond energies (kJ/mol): C–H 413, O=O 498, C=O 805, O–H 464.",[
   ["Bonds broken","4 C–H and 2 O=O",[`(4 × 413) + (2 × 498) = 1652 + 996 = 2648 kJ`]],
   ["Bonds made","2 C=O and 4 O–H",[`(2 × 805) + (4 × 464) = 1610 + 1856 = 3466 kJ`]],
   ["Overall","",[`2648 − 3466 = ${res("−818 kJ/mol (exothermic)")}`]]]),
  B.check([
   {q:"Is breaking bonds exothermic or endothermic?",opts:["Exothermic","Endothermic"],a:1,why:"Energy must be supplied."},
   {q:"H₂ + Cl₂ → 2HCl. Bond energies: H–H 436, Cl–Cl 243, H–Cl 432 kJ/mol. Calculate the overall energy change in kJ/mol.",a:-185,unit:"kJ/mol",tol:0,why:"(436 + 243) − (2 × 432) = 679 − 864 = −185 kJ/mol."},
   {q:"N₂ + 3H₂ → 2NH₃. Energy to break bonds = 2253 kJ; energy released making bonds = 2346 kJ. Calculate the overall energy change.",a:-93,unit:"kJ/mol",tol:0,why:"2253 − 2346 = −93 kJ/mol."},
   {q:"A reaction needs 1200 kJ to break bonds and releases 950 kJ making bonds. Is it exothermic or endothermic?",opts:["Exothermic","Endothermic"],a:1,why:"More energy in than out: +250 kJ."},
   {q:"How many O–H bonds are made when 2 molecules of water form?",a:4,unit:"",tol:0,why:"Each H₂O has 2 O–H bonds."}]),
  B.keypoints(["Breaking bonds: endothermic. Making bonds: exothermic.","Energy change = bonds broken − bonds made.","Negative: exothermic. Positive: endothermic."]),
  B.mistakes(["Subtracting the other way round (made − broken).","Forgetting to multiply by the number of each bond, including balancing numbers.","Counting a double bond as two single bonds instead of using the C=O value."])
 ],onShow:()=>draw()});
function draw(){ const r=RX[+$("#chem-en3-r").value], br=r.brk.reduce((t,[b,n])=>t+n*BE[b],0), mk=r.mk.reduce((t,[b,n])=>t+n*BE[b],0), d=br-mk;
  $("#chem-en3-eq").innerHTML=f(r.eq);
  const mx=Math.max(br,mk)*1.05, Wd=330, X=v=>130+v/mx*Wd;
  $("#chem-en3-svg").innerHTML=`<text x="10" y="40" font-size="13">break bonds</text><rect x="130" y="24" width="${X(br)-130}" height="26" fill="#4f8fd8" opacity=".85"/><text x="${X(br)-6}" y="42" text-anchor="end" font-size="12" style="fill:#fff">+${br} kJ</text><text x="10" y="90" font-size="13">make bonds</text><rect x="130" y="74" width="${X(mk)-130}" height="26" fill="#e0634f" opacity=".85"/><text x="${X(mk)-6}" y="92" text-anchor="end" font-size="12" style="fill:#fff">−${mk} kJ</text><text x="10" y="140" font-size="13">overall</text><rect x="${Math.min(X(br),X(mk))}" y="124" width="${Math.abs(X(br)-X(mk))}" height="26" fill="${d<0?"var(--bad)":"var(--good)"}" opacity=".85"/><text x="${Math.max(X(br),X(mk))+6}" y="142" font-size="12">${d>0?"+":""}${d} kJ/mol</text><text x="10" y="178" font-size="12" style="fill:var(--muted)">${d<0?"More energy released making bonds than used breaking them.":"More energy used breaking bonds than released making them."}</text>`;

 eyebrow:eb("5.6.1.1 Calculating rates of reactions",1),title:"Measuring and calculating rates of reaction",
 intro:"The rate of a reaction tells you how quickly reactants are used up or products are made. You can follow a reaction by measuring a gas given off, a loss in mass or a change in colour or cloudiness over time.",
 outcomes:[["Calculate the mean rate of a reaction from the quantity of reactant used or product formed and the time taken","5.6.1.1"],["Draw and interpret graphs of the quantity of product formed or reactant used against time","5.6.1.1"],["<span class=\"ht\">Higher</span> Draw tangents to curves and use the gradient to find the rate at a specific time; use units such as mol/s","5.6.1.1"]],
 blocks:[
  B.text("Mean rate",B.eq(`mean rate of reaction = ${fr("quantity of reactant used","time taken")}`,`mean rate of reaction = ${fr("quantity of product formed","time taken")}`)+`<p>The quantity can be measured as a <b>mass in grams</b> or a <b>volume in cm³</b>, so the units of rate may be <b>g/s</b> or <b>cm³/s</b>. <span class="ht">Higher</span> It can also be measured in moles, giving <b>mol/s</b>.</p><p>On a graph of product against time, the reaction is fastest at the start where the line is steepest; it slows down as reactants are used up, and the line becomes flat when the reaction stops.</p>`+G.ht(`<p>The rate at a particular time is the <b>gradient of a tangent</b> to the curve at that time: draw a straight line touching the curve, then gradient = change in y ÷ change in x.</p>`)),
  B.sim("chem-ra1-sim","Rate from a graph",stage,panel,`<span>Steeper = faster</span>`),
  B.example("A mean rate","In a reaction, 48 cm³ of carbon dioxide is collected in 2 minutes. Calculate the mean rate in cm³/s.",[
   ["Convert the time to seconds","",[`2 min = 120 s`]],
   ["Divide","",[`${fr("48","120")} = ${res("0.40 cm³/s")}`]]]),
  B.check([

   {q:"Why does the graph become flat?",opts:["The catalyst runs out","One of the reactants has been used up","The temperature falls to zero","The gas syringe is broken"],a:1,why:"The reaction has stopped."},
   {q:"<span class=\"ht\">Higher</span> A tangent at 20 s passes through (0 s, 8 cm³) and (40 s, 48 cm³). What is the rate at 20 s, in cm³/s?",a:1,unit:"cm³/s",tol:0.0001,why:"(48 − 8) ÷ (40 − 0) = 1.0 cm³/s."}]),

  B.mistakes(["Forgetting to convert minutes to seconds.","Using a point on the curve instead of two points on the tangent.","Saying the reaction stops because the product runs out."])
 ],onShow:()=>draw()});
function draw(){ const t=val("chem-ra1-t"), tm=val("chem-ra1-m"), X=s=>60+s/200*470, Y=v=>290-v/70*270; let path=""; for(let s=0;s<=200;s+=2) path+=(s?"L":"M")+X(s).toFixed(1)+" "+Y(V(s)).toFixed(1);
  let g=`<line x1="60" y1="15" x2="60" y2="290" class="ink" stroke-width="1.5"/><line x1="60" y1="290" x2="535" y2="290" class="ink" stroke-width="1.5"/>${[0,10,20,30,40,50,60,70].map(v=>`<text x="54" y="${Y(v)+4}" text-anchor="end" font-size="11">${v}</text><line x1="60" y1="${Y(v)}" x2="535" y2="${Y(v)}" class="ln" stroke-width="1"/>`).join("")}${[0,40,80,120,160,200].map(s=>`<text x="${X(s)}" y="306" text-anchor="middle" font-size="11">${s}</text>`).join("")}<text x="297" y="324" text-anchor="middle" font-size="12">time / s</text><text x="16" y="152" font-size="12" transform="rotate(-90 16 152)" text-anchor="middle">volume of hydrogen / cm³</text>`;
  g+=`<path d="${path}" fill="none" class="dat" stroke-width="3"/>`;
  const v=V(t), grad=Vf*k*Math.exp(-k*t), t1=Math.max(0,t-40), t2=Math.min(200,t+40);

  const vm=V(tm); g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(tm)}" y2="${Y(vm)}" class="gd" stroke-width="2" stroke-dasharray="6 5"/><circle cx="${X(tm)}" cy="${Y(vm)}" r="4" class="fgd"/>`;
  $("#chem-ra1-svg").innerHTML=g;
  set("chem-ra1-t-l",t+" s"); set("chem-ra1-m-l",tm+" s"); set("chem-ra1-v",v.toFixed(1)+" cm³"); set("chem-ra1-r",grad.toFixed(2)+" cm³/s"); set("chem-ra1-mr",`${vm.toFixed(1)} ÷ ${tm} = ${(vm/tm).toFixed(2)} cm³/s`); }
["chem-ra1-t","chem-ra1-m"].forEach(id=>$("#"+id).addEventListener("input",draw)); draw();

(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val,loop,field,seg,radio}=CH;

lesson({id:"chem-ra2",group:"a",num:2,lvl:"5.6.1 · Lesson 2",name:"Factors affecting rate and collision theory",icon:"coll",
 eyebrow:eb("5.6.1.2–5.6.1.3 Factors which affect rates; collision theory and activation energy · Required practical 11",2),title:"Factors that affect the rate of reaction",
 intro:"Particles must collide, with enough energy, to react. Anything that makes successful collisions more frequent speeds up the reaction: higher concentration or pressure, smaller pieces, higher temperature, or a catalyst.",
 outcomes:[["Describe the effect of concentration, pressure, surface area, temperature and catalysts on rate","5.6.1.2"],["Explain these effects using collision theory and activation energy","5.6.1.3"],["Describe how to investigate the effect of concentration on rate (RP11)","5.6.1.2"]],
 blocks:[
  B.text("Collision theory",`<p>Chemical reactions can occur only when reacting particles <b>collide</b> with each other and with <b>sufficient energy</b> (at least the activation energy). The rate depends on the <b>frequency of successful collisions</b>.</p><ul><li><b>Concentration</b> (or <b>pressure</b> of gases): more particles in the same volume → more frequent collisions.</li><li><b>Surface area</b>: smaller pieces have a larger surface area to volume ratio, so more particles of the solid are exposed → more frequent collisions.</li><li><b>Temperature</b>: particles move faster, so they collide more often, <b>and</b> a greater proportion of collisions have energy above the activation energy. This second effect is the more important.</li><li><b>Catalysts</b> increase the rate without being used up (next lesson).</li></ul>`),
  B.sim("chem-ra2-sim","Collision theory",stage,panel,`<span>Frequency × energy</span>`),
  B.practical(`<p><b>RP11</b>, Required practical 11: investigate how changing the concentration affects the rate, by measuring the volume of gas produced (magnesium and hydrochloric acid) or the change in colour or turbidity (sodium thiosulfate and hydrochloric acid: time for a cross to disappear).</p>`,"Required practical 11: rates of reaction"),
  B.check([
   {q:"Why does increasing the concentration increase the rate?",opts:["Particles have more energy","There are more particles in the same volume, so more frequent collisions","The activation energy decreases","The particles get bigger"],a:1,why:"More frequent collisions."},
   {q:"Why does powder react faster than a lump of the same mass?",opts:["Powder is hotter","Powder has a larger surface area, so more frequent collisions","Powder has a lower activation energy","Powder is more concentrated"],a:1,why:"More particles exposed."},
   {q:"Give the two reasons why increasing temperature increases rate.",opts:["Particles collide more often, and more collisions have energy ≥ activation energy","Concentration increases and particles get bigger","The catalyst works better and pressure rises","Activation energy falls and particles stop"],a:0,why:"Faster particles collide more often and more energetically."},
   {q:"Increasing the pressure of a gas reaction has the same effect as increasing…",opts:["Temperature","Concentration","Surface area","Activation energy"],a:1,why:"More particles per unit volume."},
   {q:"In the disappearing cross experiment, the cross disappears in 40 s. What is 1/time, in s⁻¹?",a:0.025,unit:"s⁻¹",tol:0.00001,why:"1 ÷ 40 = 0.025 s⁻¹; a bigger value means a faster rate."}]),
  B.keypoints(["Successful collision: particles collide with energy ≥ activation energy.","Concentration, pressure, surface area: more frequent collisions.","Temperature: more frequent and more energetic collisions."]),
  B.mistakes(["Saying particles 'collide more' without saying 'more frequently' (per second).","Saying a lump has a larger surface area.","Saying temperature lowers the activation energy."])
 ],onShow:()=>{ st.key=""; }});
loop("chem-ra2",dt=>{ const cv=$("#chem-ra2-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.55), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; st.key=""; }
  const T=val("chem-ra2-T"), n=val("chem-ra2-c"), s=+radio("chem-ra2-s"), key=n+"|"+s; set("chem-ra2-T-l",T+" °C"); set("chem-ra2-c-l",n);
  const blocks=s===1?[{x:w*.38,y:h*.28,w:w*.24,h:h*.44}]:[[.2,.2],[.6,.2],[.2,.62],[.6,.62]].map(([a,b])=>({x:w*a+w*.06,y:h*b,w:w*.08,h:h*.15}));
  if(key!==st.key){ st.key=key; st.P=Array.from({length:n},()=>{ let x,y; do{ x=Math.random()*w; y=Math.random()*h; }while(blocks.some(b=>x>b.x-8&&x<b.x+b.w+8&&y>b.y-8&&y<b.y+b.h+8)); const a=Math.random()*7; return {x,y,a}; }); st.hits=0; st.good=0; st.t=0; st.F=[]; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  c.fillStyle="#9aa4ad"; blocks.forEach(b=>{ c.fillRect(b.x,b.y,b.w,b.h); });
  const vT=Math.sqrt((T+273)/293), sp=w*.18*vT, ea=0.62/vT; st.t+=dt;
  st.P.forEach(p=>{ p.x+=Math.cos(p.a)*sp*dt; p.y+=Math.sin(p.a)*sp*dt; if(p.x<4||p.x>w-4){ p.a=Math.PI-p.a; p.x=Math.max(4,Math.min(w-4,p.x)); } if(p.y<4||p.y>h-4){ p.a=-p.a; p.y=Math.max(4,Math.min(h-4,p.y)); }
    blocks.forEach(b=>{ if(p.x>b.x-5&&p.x<b.x+b.w+5&&p.y>b.y-5&&p.y<b.y+b.h+5){ st.hits++; const E=-Math.log(Math.random()); if(E>ea*2.2){ st.good++; st.F.push({x:p.x,y:p.y,t:.35}); }
      const dx=Math.min(Math.abs(p.x-b.x),Math.abs(p.x-b.x-b.w)), dy=Math.min(Math.abs(p.y-b.y),Math.abs(p.y-b.y-b.h)); if(dx<dy){ p.a=Math.PI-p.a; p.x+=p.x<b.x+b.w/2?-6:6; } else { p.a=-p.a; p.y+=p.y<b.y+b.h/2?-6:6; } } });
    c.fillStyle=css("--accent"); c.beginPath(); c.arc(p.x,p.y,4.5,0,7); c.fill(); });
  st.F=(st.F||[]).filter(F=>(F.t-=dt)>0); st.F.forEach(F=>{ c.strokeStyle="#ffd34d"; c.lineWidth=2; c.beginPath(); c.arc(F.x,F.y,10*(1.4-F.t*2),0,7); c.stroke(); });
  c.fillStyle=css("--ink"); c.font="12px "+css("--f-body"); c.fillText("grey: solid reactant · orange: acid particles",8,h-8);
  if(st.t>1){ set("chem-ra2-h",(st.hits/st.t).toFixed(1)); set("chem-ra2-g",(st.good/st.t).toFixed(1)); }
  if(st.t>8){ st.hits*=.5; st.good*=.5; st.t*=.5; } });
["chem-ra2-T"].forEach(id=>$("#"+id).addEventListener("input",()=>{ st.hits=0; st.good=0; st.t=0; }));
})();

</script>

 eyebrow:eb("5.6.1.4 Catalysts · Required practical 11",3),title:"Catalysts, and following a reaction by turbidity",
 intro:"Catalysts speed up reactions without being used up, which is why industry relies on them. And some reactions can be timed simply by watching a solution go cloudy.",
 outcomes:[["Describe what a catalyst does and explain how it works using activation energy","5.6.1.4"],["Recognise that enzymes are biological catalysts and that catalysts are not included in the chemical equation","5.6.1.4"],["Use the disappearing cross method to investigate the effect of concentration on rate","5.6.1.2"]],
 blocks:[
  B.text("Catalysts",`<p><b>Catalysts</b> change the rate of chemical reactions but are <b>not used up</b> during the reaction. Different reactions need different catalysts. <b>Enzymes</b> act as catalysts in biological systems.</p><p>Catalysts increase the rate of reaction by providing a <b>different pathway</b> for the reaction that has a <b>lower activation energy</b>, so a greater proportion of collisions are successful. Catalysts are not included in the chemical equation. For example, manganese(IV) oxide catalyses the decomposition of hydrogen peroxide: ${f("2H2O2 -> 2H2O + O2")}.</p>`),

   {q:"What does a catalyst do?",opts:["It is used up to increase the rate","It increases the rate without being used up","It increases the yield","It raises the activation energy"],a:1,why:"It is unchanged at the end."},

   {q:"What are enzymes?",opts:["Biological catalysts","Reactants in the body","Types of salts","Strong acids"],a:0,why:"Enzymes catalyse reactions in living things."},

<script>

/* RA4: reversible reactions and energy changes */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val}=CH;
const st={h:0};
const stage=`<svg id="chem-ra4-svg" class="chsvg" viewBox="0 0 560 260" role="img" aria-label="Hydrated and anhydrous copper(II) sulfate"></svg>`;
const panel=`<div class="btnrow"><button class="btn primary" id="chem-ra4-heat">Heat</button><button class="btn" id="chem-ra4-water">Add water</button></div>`+CH.ro([["chem-ra4-s","Solid is"],["chem-ra4-e","Energy"]])+`<p class="note">The same amount of energy is transferred in each direction.</p>`;
lesson({id:"chem-ra4",group:"b",num:4,lvl:"5.6.2 · Lesson 4",name:"Reversible reactions",icon:"rev2",
 eyebrow:eb("5.6.2.1–5.6.2.2 Reversible reactions; energy changes and reversible reactions",4),title:"Reversible reactions and energy changes",
 intro:"In some reactions the products can react to form the original reactants again. If the forward reaction is endothermic, the reverse reaction is exothermic, and exactly the same amount of energy is transferred.",
 outcomes:[["Recognise and write reversible reactions using the ⇌ symbol","5.6.2.1"],["Explain that changing the conditions can change the direction of a reversible reaction","5.6.2.1"],["Explain that if a reversible reaction is exothermic in one direction it is endothermic in the other, with the same energy transferred","5.6.2.2"]],
 blocks:[
  B.text("Two directions",`<p>In some chemical reactions, the products of the reaction can react to produce the original reactants. Such reactions are called <b>reversible reactions</b> and are represented: A + B ⇌ C + D. The direction of reversible reactions can be changed by changing the conditions. For example:</p><div class="eqn">ammonium chloride ⇌ ammonia + hydrogen chloride</div><p>Heating makes the forward reaction happen; cooling makes the reverse happen.</p><div class="eqn">hydrated copper(II) sulfate (blue) ⇌ anhydrous copper(II) sulfate (white) + water</div><p>If a reversible reaction is <b>exothermic in one direction, it is endothermic in the opposite direction</b>. The same amount of energy is transferred in each case. Heating blue copper(II) sulfate is endothermic; adding water to the white solid is exothermic (it gets hot), which is used as a test for water.</p>`),
  B.sim("chem-ra4-sim","Copper(II) sulfate: forwards and back",stage,panel,`<span>Endothermic one way, exothermic the other</span>`),
  B.check([
   {q:"What does the symbol ⇌ show?",opts:["A fast reaction","A reversible reaction","An exothermic reaction","A precipitate"],a:1,why:"The reaction can go both ways."},
   {q:"Heating blue hydrated copper(II) sulfate turns it white. What happens when water is added to the white solid?",opts:["Nothing","It turns blue and gets hot","It turns blue and gets cold","It turns black"],a:1,why:"The reverse reaction is exothermic."},
   {q:"The forward reaction of a reversible reaction is exothermic and transfers 40 kJ. How much energy is transferred in the reverse reaction?",a:40,unit:"kJ",tol:0,why:"The same amount, but taken in (endothermic)."},
   {q:"Ammonium chloride is heated in a test tube. White solid reappears near the cool top. Why?",opts:["The solid melted","Ammonia and hydrogen chloride react again when cooled","The tube was dirty","Ammonium chloride is a catalyst"],a:1,why:"The reverse reaction happens at lower temperature."},
   {q:"Anhydrous copper(II) sulfate is used to test for…",opts:["Carbon dioxide","Water","Oxygen","Acids"],a:1,why:"It turns from white to blue."}]),
  B.keypoints(["Reversible reaction: products can re-form the reactants; symbol ⇌.","Changing conditions (e.g. temperature) changes the direction.","Exothermic one way = endothermic the other, same energy transferred."]),
  B.mistakes(["Saying the reverse reaction transfers a different amount of energy.","Using a single arrow for a reversible reaction.","Calling anhydrous copper(II) sulfate blue."])
 ],onShow:()=>draw()});
function draw(){ const h=st.h; const col=`rgb(${Math.round(60+190*h)},${Math.round(120+130*h)},${Math.round(220+30*h)})`;
  $("#chem-ra4-svg").innerHTML=`<path d="M180 30v160a30 30 0 0 0 60 0V30" class="ink" fill="none" stroke-width="2.4" transform="rotate(-20 210 120)"/><g transform="rotate(-20 210 120)"><rect x="184" y="150" width="52" height="56" rx="10" fill="${col}"/>${h>.5?`<circle cx="200" cy="60" r="4" fill="#9cc8e8"/><circle cx="214" cy="48" r="3" fill="#9cc8e8"/>`:""}</g><text x="300" y="100" font-size="15" font-weight="700">${h>.5?"anhydrous copper(II) sulfate: white":"hydrated copper(II) sulfate: blue"}</text><text x="300" y="126" font-size="13">${h>.5?"water vapour is driven off":"contains water of crystallisation"}</text><text x="300" y="170" font-size="13">${CH.u("CuSO4·5H2O(s) <=> CuSO4(s) + 5H2O(l)")}</text>`;
  set("chem-ra4-s",h>.5?"white (anhydrous)":"blue (hydrated)"); }
$("#chem-ra4-heat").addEventListener("click",()=>{ st.h=1; draw(); set("chem-ra4-e","taken in: endothermic"); });
$("#chem-ra4-water").addEventListener("click",()=>{ st.h=0; draw(); set("chem-ra4-e","given out: exothermic (it gets hot)"); });
draw();
})();

</script>
<script>

/* RA5: equilibrium and Le Chatelier's principle (HT) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val}=CH;
/* rough Haber yield model: % NH3 at equilibrium */
const yieldOf=(T,P)=>{ const k=Math.exp(5300/(T+273)-13.48)*P; return k/(1+k)*100; };
const stage=`<svg id="chem-ra5-svg" class="chsvg" viewBox="0 0 560 300" role="img" aria-label="Equilibrium yield of ammonia"></svg>`;
const panel=sl("chem-ra5-T","Temperature",300,600,10,450,"Temperature in degrees Celsius")+sl("chem-ra5-P","Pressure",50,400,10,200,"Pressure in atmospheres")+CH.ro([["chem-ra5-y","Equilibrium yield of ammonia"],["chem-ra5-s","Shift compared with 450 °C, 200 atm"]])+`<p class="note">Model values for illustration. N₂ + 3H₂ ⇌ 2NH₃ ; the forward reaction is exothermic.</p>`;
lesson({id:"chem-ra5",group:"b",num:5,lvl:"5.6.2 · Lesson 5",name:"Equilibrium and Le Chatelier's principle",icon:"eq",tag:"Higher tier",
 eyebrow:eb("5.6.2.3–5.6.2.7 Equilibrium; the effect of changing conditions (HT only)",5),title:"Dynamic equilibrium and changing conditions",
 intro:"In a sealed container a reversible reaction reaches a balance where the forward and reverse reactions happen at exactly the same rate. Change the conditions and the balance shifts to counteract the change.",
 outcomes:[["Describe dynamic equilibrium in a closed system","5.6.2.3"],["Use Le Chatelier's principle to predict the effect of changing concentration, temperature and pressure","5.6.2.4–5.6.2.7"],["Explain the effect of conditions on the position of equilibrium for the Haber process","5.6.2.7"]],
 blocks:[
  B.text("Dynamic equilibrium",`<p>When a reversible reaction occurs in apparatus which prevents the escape of reactants and products (a <b>closed system</b>), equilibrium is reached when the forward and reverse reactions occur at <b>exactly the same rate</b>. The concentrations of reactants and products then stay constant, although both reactions are still happening.</p><p>The relative amounts of all the substances at equilibrium depend on the conditions. <b>Le Chatelier's principle</b>: if a system is at equilibrium and a change is made to any of the conditions, the system responds to <b>counteract the change</b>.</p><table class="tbl-mini"><tr><th>Change</th><th>Equilibrium shifts…</th></tr><tr><td>increase concentration of a reactant</td><td>to the right: more products form until equilibrium is reached again</td></tr><tr><td>increase temperature</td><td>in the endothermic direction</td></tr><tr><td>decrease temperature</td><td>in the exothermic direction</td></tr><tr><td>increase pressure (gases)</td><td>to the side with fewer molecules (as shown by the equation)</td></tr><tr><td>decrease pressure</td><td>to the side with more molecules</td></tr></table>`),
  B.sim("chem-ra5-sim","Shifting the Haber equilibrium",stage,panel,`<span>4 molecules ⇌ 2 molecules</span><span>Forward: exothermic</span>`),
  B.check([
   {q:"What is true at dynamic equilibrium?",opts:["The reactions have stopped","The forward and reverse rates are equal","There are equal amounts of reactants and products","Only the forward reaction happens"],a:1,why:"Both continue at the same rate."},
   {q:"N₂ + 3H₂ ⇌ 2NH₃ (forward exothermic). What happens to the yield of ammonia if the temperature is increased?",opts:["Increases","Decreases","No change"],a:1,why:"Equilibrium shifts in the endothermic (reverse) direction."},
   {q:"For the same reaction, what is the effect of increasing pressure on the yield of ammonia?",opts:["Increases","Decreases","No change"],a:0,why:"4 molecules on the left, 2 on the right: shifts to fewer molecules."},
   {q:"H₂ + I₂ ⇌ 2HI. What effect does increasing pressure have on the position of equilibrium?",opts:["Shifts right","Shifts left","No effect"],a:2,why:"2 molecules on each side."},
   {q:"In a closed system, more reactant is added. What happens?",opts:["More products form until a new equilibrium is reached","The reaction stops","The reverse reaction speeds up only","Nothing"],a:0,why:"The system counteracts the change."}]),
  B.keypoints(["Equilibrium: closed system; forward rate = reverse rate.","Le Chatelier: the system counteracts any change.","Higher T → endothermic direction. Higher P → fewer gas molecules."]),
  B.mistakes(["Saying equal amounts of reactants and products at equilibrium.","Saying the reactions stop at equilibrium.","Applying pressure arguments when there are equal numbers of gas molecules on each side."])
 ],onShow:()=>draw()});
function draw(){ const T=val("chem-ra5-T"), P=val("chem-ra5-P"), y=yieldOf(T,P), y0=yieldOf(450,200);
  const X=P=>60+(P-50)/350*470, Y=v=>270-v/100*250; let g=`<line x1="60" y1="15" x2="60" y2="270" class="ink" stroke-width="1.5"/><line x1="60" y1="270" x2="535" y2="270" class="ink" stroke-width="1.5"/>${[0,20,40,60,80,100].map(v=>`<text x="54" y="${Y(v)+4}" text-anchor="end" font-size="11">${v}</text><line x1="60" y1="${Y(v)}" x2="535" y2="${Y(v)}" class="ln" stroke-width="1"/>`).join("")}${[50,100,200,300,400].map(p=>`<text x="${X(p)}" y="286" text-anchor="middle" font-size="11">${p}</text>`).join("")}<text x="300" y="299" text-anchor="middle" font-size="11">pressure / atm</text><text x="16" y="142" font-size="11" transform="rotate(-90 16 142)" text-anchor="middle">% ammonia at equilibrium</text>`;
  [300,400,500,600].forEach((t,i)=>{ let d=""; for(let p=50;p<=400;p+=5) d+=(p>50?"L":"M")+X(p).toFixed(1)+" "+Y(yieldOf(t,p)).toFixed(1); g+=`<path d="${d}" fill="none" stroke="${["#3fb37a","#4f8fd8","#d9a43a","#e0634f"][i]}" stroke-width="2"/><text x="538" y="${Y(yieldOf(t,400))+4}" font-size="11">${t} °C</text>`; });
  { let d=""; for(let p=50;p<=400;p+=5) d+=(p>50?"L":"M")+X(p).toFixed(1)+" "+Y(yieldOf(T,p)).toFixed(1); g+=`<path d="${d}" fill="none" class="acc" stroke-width="3" stroke-dasharray="7 5"/>`; }
  g+=`<circle cx="${X(P)}" cy="${Y(y)}" r="7" class="facc"/>`;
  $("#chem-ra5-svg").innerHTML=g; set("chem-ra5-T-l",T+" °C"); set("chem-ra5-P-l",P+" atm"); set("chem-ra5-y",y.toFixed(0)+"%"); set("chem-ra5-s",Math.abs(y-y0)<1?"about the same":y>y0?"to the right: more ammonia":"to the left: less ammonia"); }
["chem-ra5-T","chem-ra5-P"].forEach(id=>$("#"+id).addEventListener("input",draw)); draw();
})();

<script>

LEARN.unit="organic";
Object.assign(LAB.ICONS,{
 "l-alk":'<path d="M3 12h18"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 6v4M12 6v4M18 6v4M6 14v4M12 14v4M18 14v4"/>',
 "l-frac":'<rect x="8" y="2" width="8" height="20" rx="1"/><path d="M8 7h-4M8 12h-4M8 17h-4M16 7h4M16 12h4M16 17h4"/>',
 "l-crack":'<path d="M3 12h7M14 8h7M14 16h7"/><path d="M10 12l4-4M10 12l4 4"/>',
 "l-ene":'<path d="M4 10h16M4 14h16"/><circle cx="4" cy="12" r="2.5"/><circle cx="20" cy="12" r="2.5"/>',
 "l-ol":'<path d="M3 12h10"/><circle cx="16" cy="12" r="3"/><path d="M19 12h2"/>',
 "l-acid":'<path d="M3 14h9l3-5M12 14l3 5h5"/><circle cx="15" cy="7" r="2"/>',
 "l-poly":'<path d="M2 12h20"/><path d="M5 9v6M10 9v6M15 9v6M20 9v6"/><path d="M3 6l-1 6 1 6M21 6l1 6-1 6"/>',
 "l-dna":'<path d="M7 3c0 6 10 6 10 12s-10 6-10 6M17 3c0 6-10 6-10 12"/><path d="M8 7h8M8 17h8M10 12h4"/>'
});
/* displayed-formula drawer for straight-chain organic molecules */
window.ORG=(()=>{
const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="bond"/>`;
const dbl=(x1,y1,x2,y2)=>{ const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), nx=-dy/L*3.5, ny=dx/L*3.5; return ln(x1+nx,y1+ny,x2+nx,y2+ny)+ln(x1-nx,y1-ny,x2-nx,y2-ny); };
const A=(x,y,t)=>`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="700">${t}</text>`;
/* type: alkane | alkene | alcohol | acid ; n carbons */
function disp(n,type){ const s=56, x0=60, y=80; let g="", W=x0+(n-1)*s+60;
  for(let i=0;i<n;i++){ const x=x0+i*s, last=i===n-1; g+=A(x,y,"C");
    if(!last) g+=(type==="alkene"&&i===0)?dbl(x+12,y,x+s-12,y):ln(x+12,y,x+s-12,y);
    let up=true, down=true, left=i===0, right=last;
    if(type==="alkene"){ if(i===0) left=false; if(i===1){ down=n===2; right=false; } }
    if(type==="acid"&&last){ up=false; down=false; right=false; g+=dbl(x,y-13,x,y-37)+A(x,y-50,"O")+ln(x+12,y,x+30,y)+A(x+42,y,"O")+ln(x+54,y,x+72,y)+A(x+84,y,"H"); W+=60; }
    if(type==="alcohol"&&last){ right=false; g+=ln(x+12,y,x+30,y)+A(x+42,y,"O")+ln(x+54,y,x+72,y)+A(x+84,y,"H"); W+=60; }
    if(up) g+=ln(x,y-13,x,y-37)+A(x,y-50,"H");
    if(down) g+=ln(x,y+13,x,y+37)+A(x,y+50,"H");
    if(left) g+=ln(x-12,y,x-34,y)+A(x-46,y,"H");
    if(right) g+=ln(x+12,y,x+34,y)+A(x+46,y,"H"); }
  return {svg:g,W:W+20,H:160}; }
function svg(n,type,aria){ const d=disp(n,type); return `<svg class="chsvg" viewBox="0 0 ${d.W} ${d.H}" style="max-width:${Math.min(100,d.W/6)}%;min-width:min(100%,260px)" role="img" aria-label="${aria||"Displayed formula"}">${d.svg}</svg>`; }
/* monomer C=C with four substituents [tl, bl, tr, br]; poly: draw repeat unit in brackets */
function mono(sub,poly){ const g=[], x1=70, x2=150, y=90, S=t=>t.length>1?16:20;
  const at=(x,y,t)=>`<text x="${x}" y="${y+6}" text-anchor="middle" font-size="${S(t)}" font-weight="700">${t}</text>`;
  g.push(at(x1,y,"C"),at(x2,y,"C"), poly?ln(x1+12,y,x2-12,y):dbl(x1+12,y,x2-12,y));
  g.push(ln(x1,y-13,x1,y-37),at(x1,y-50,sub[0]),ln(x1,y+13,x1,y+37),at(x1,y+52,sub[1]),ln(x2,y-13,x2,y-37),at(x2,y-50,sub[2]),ln(x2,y+13,x2,y+37),at(x2,y+52,sub[3]));
  if(poly){ g.push(ln(30,y,x1-12,y),ln(x2+12,y,190,y),`<path d="M42 30 q-12 60 0 120 M178 30 q12 60 0 120" class="bond" fill="none"/>`,`<text x="196" y="160" font-size="18" font-style="italic">n</text>`); }
  return `<svg class="chsvg" viewBox="0 0 220 180" role="img" aria-label="${poly?"Repeat unit":"Monomer"}" style="max-width:260px">${g.join("")}</svg>`; }
return {disp,svg,mono};
})();

(()=>{

lesson({id:"chem-or1",group:"a",num:1,lvl:"5.7.1 · Lesson 1",name:"Crude oil, hydrocarbons and alkanes",icon:"alk",
 eyebrow:eb("5.7.1.1 Crude oil, hydrocarbons and alkanes",1),title:"Crude oil, hydrocarbons and alkanes",
 intro:"Crude oil is a finite resource made from the remains of ancient plankton, buried in mud. It is a mixture of a very large number of compounds, most of them hydrocarbons: molecules made of hydrogen and carbon atoms only.",
 outcomes:[["Describe crude oil as a finite resource and a mixture of hydrocarbons","5.7.1.1"],["Recognise alkanes from their formulae and use the general formula CₙH₂ₙ₊₂","5.7.1.1"],["Name and draw the first four alkanes","5.7.1.1"]],
 blocks:[

   {q:"How many hydrogen atoms are in an alkane with 20 carbon atoms?",a:42,unit:"",tol:0,why:"2 × 20 + 2 = 42."},

<script>

/* OR2: fractional distillation and properties of hydrocarbons */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set}=CH;
const F=[["Refinery gases (LPG)","below 25 °C","C1–C4","bottled gas for heating and cooking"],["Petrol","40–75 °C","C5–C10","fuel for cars"],["Kerosene","150–250 °C","C10–C16","fuel for aircraft"],["Diesel oil","250–350 °C","C15–C20","fuel for lorries, trains and some cars"],["Heavy fuel oil","350–400 °C","C20–C40","fuel for ships and power stations"],["Bitumen","above 400 °C","C40+","road surfaces and roofing"]];
const stage=`<svg id="chem-or2-svg" class="chsvg" viewBox="0 0 600 420" role="img" aria-label="Fractionating column"></svg>`;
const panel=`<p class="note" style="margin-top:0">Click a fraction on the column.</p>`+CH.ro([["chem-or2-n","Fraction"],["chem-or2-b","Boiling range"],["chem-or2-c","Chain length"],["chem-or2-u","Use"]])+`<div id="chem-or2-tr"></div>`;
lesson({id:"chem-or2",group:"a",num:2,lvl:"5.7.1 · Lesson 2",name:"Fractional distillation and petrochemicals",icon:"frac",
 eyebrow:eb("5.7.1.2–5.7.1.3 Fractional distillation and petrochemicals; properties of hydrocarbons",2),title:"Fractional distillation and the properties of hydrocarbons",
 intro:"Crude oil is not much use as it comes out of the ground. Fractional distillation separates it into fractions: groups of hydrocarbons with similar numbers of carbon atoms and similar boiling points.",
 outcomes:[["Describe how crude oil is separated by fractional distillation","5.7.1.2"],["Name fuels and other useful products obtained from crude oil","5.7.1.2"],["Describe how boiling point, viscosity and flammability change with chain length, and write equations for complete combustion","5.7.1.3"]],
 blocks:[
  B.text("Fractional distillation",`<ol><li>Crude oil is heated until most of it <b>evaporates</b>, and the vapour enters the bottom of a <b>fractionating column</b>.</li><li>The column is <b>hot at the bottom and cooler at the top</b>. Vapours rise up the column and condense at different heights, depending on their boiling points.</li><li>Hydrocarbons with <b>small molecules</b> have low boiling points, so they rise high before condensing (or leave as gases at the top). <b>Large molecules</b> condense near the bottom; the largest, bitumen, never evaporate.</li></ol><p>The fractions can be processed to produce fuels and <b>feedstock for the petrochemical industry</b>: solvents, lubricants, polymers and detergents are all made from crude oil. The vast array of natural and synthetic carbon compounds occur due to the ability of carbon atoms to form families of similar compounds.</p>`),
  B.sim("chem-or2-sim","The fractionating column",stage,panel,`<span>Hot at the bottom, cool at the top</span>`),
  B.text("Properties depend on chain length",`<table class="tbl-mini"><tr><th>As molecules get longer…</th><th>Change</th></tr><tr><td>boiling point</td><td>increases</td></tr><tr><td>viscosity (how thick and slow-flowing)</td><td>increases</td></tr><tr><td>flammability (how easily it ignites)</td><td>decreases</td></tr></table><p>The <b>combustion</b> of hydrocarbon fuels releases energy. During complete combustion the carbon and hydrogen in the fuels are <b>oxidised</b> to carbon dioxide and water:</p><div class="eqn">${f("C3H8 + 5O2 -> 3CO2 + 4H2O")}</div>`),
  B.check([
   {q:"Where in the column do fractions with the lowest boiling points collect?",opts:["At the bottom","In the middle","At the top","They do not condense"],a:2,why:"Small molecules rise furthest."},
   {q:"Which fraction is used as aircraft fuel?",opts:["Petrol","Kerosene","Bitumen","Diesel"],a:1,why:"Kerosene (jet fuel)."},
   {q:"How does viscosity change as the hydrocarbon chain gets longer?",opts:["Increases","Decreases","Stays the same"],a:0,why:"Longer molecules are thicker and flow more slowly."},
   {q:"Balance: CH₄ + __O₂ → CO₂ + 2H₂O. What number goes in front of O₂?",a:2,unit:"",tol:0,why:"4 O atoms are needed on each side."},
   {q:"What are the products of complete combustion of a hydrocarbon?",opts:["Carbon monoxide and water","Carbon dioxide and water","Carbon and hydrogen","Carbon dioxide and hydrogen"],a:1,why:"Carbon and hydrogen are oxidised."}]),
  B.keypoints(["Fractional distillation: evaporate, vapour rises, condenses at different heights by boiling point.","Fractions: LPG, petrol, kerosene, diesel oil, heavy fuel oil, bitumen.","Longer chains: higher boiling point, more viscous, less flammable."]),
  B.mistakes(["Saying the column is hottest at the top.","Saying each fraction is a pure substance (it is a mixture with similar chain lengths).","Saying longer chains are more flammable."])
 ],onShow:()=>pick(1)});
function pick(i){ const Fi=F[i]; let g=`<path d="M220 40h120v340H220z" class="ink" fill="none" stroke-width="2.5"/><path d="M180 370h40" class="ink" stroke-width="2.5"/><text x="20" y="378" font-size="13">heated crude oil vapour →</text><rect x="222" y="42" width="116" height="336" fill="url(#chem-or2-g)" opacity=".5"/><defs><linearGradient id="chem-or2-g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e0634f"/><stop offset="1" stop-color="#4f8fd8"/></linearGradient></defs><text x="280" y="30" text-anchor="middle" font-size="12">cool (about 25 °C)</text><text x="210" y="340" text-anchor="end" font-size="12">hot (about 400 °C)</text>`;
  F.forEach((x,k)=>{ const y=k===5?392:60+k*60; const on=k===i; g+=`<g data-chem-or2="${k}" style="cursor:pointer"><path d="M${k===5?280:340} ${y}h${k===5?0:60}" class="ink" stroke-width="2"/>${k===5?`<path d="M280 380v16" class="ink" stroke-width="2"/>`:""}<rect x="${k===5?350:404}" y="${y-14}" width="${k===5?200:190}" height="26" rx="5" fill="${on?"var(--accent)":"var(--panel)"}" stroke="var(--line)"/><text x="${k===5?360:414}" y="${y+4}" font-size="13" ${on?'style="fill:#111;font-weight:700"':""}>${x[0]}</text></g>`; });
  $("#chem-or2-svg").innerHTML=g; set("chem-or2-n",Fi[0]); set("chem-or2-b",Fi[1]); set("chem-or2-c",Fi[2]); set("chem-or2-u",Fi[3]);
  $("#chem-or2-tr").innerHTML=`<p class="note">Compared with the fractions above it, ${Fi[0].toLowerCase()} has ${i===0?"the shortest molecules: lowest boiling point, least viscous, most flammable":"longer molecules: higher boiling point, more viscous, less flammable"}.</p>`; }
document.addEventListener("click",e=>{ const g=e.target.closest("[data-chem-or2]"); if(g) pick(+g.dataset.chem-or2); });
pick(1);
})();

</script>

/* OR3: cracking and alkenes */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val,field,sel}=CH;
const NM={2:"ethene",3:"propene",4:"butene",5:"pentene",6:"hexene"}, AN={1:"methane",2:"ethane",3:"propane",4:"butane",5:"pentane",6:"hexane",7:"heptane",8:"octane",9:"nonane",10:"decane",11:"undecane",12:"dodecane"};
const stage=`<div style="padding:14px"><div id="chem-or3-eq" class="eqn" style="font-size:1.2rem"></div><div id="chem-or3-bar" style="margin:12px 0"></div><div class="two" style="align-items:center"><div id="chem-or3-bw"></div><div id="chem-or3-txt"></div></div></div>`;
const panel=field("Alkane to crack",sel("chem-or3-a",[[ "10","decane, C₁₀H₂₂"],["12","dodecane, C₁₂H₂₆"],["8","octane, C₈H₁₈"],["6","hexane, C₆H₁₄"]],"10"))+sl("chem-or3-k","Carbon atoms in the alkene made",2,6,1,2,"Carbon atoms in the alkene")+CH.ro([["chem-or3-p1","Alkane product"],["chem-or3-p2","Alkene product"]]);
lesson({id:"chem-or3",group:"a",num:3,lvl:"5.7.1 · Lesson 3",name:"Cracking and alkenes",icon:"crack",
 eyebrow:eb("5.7.1.4 Cracking and alkenes",3),title:"Cracking and alkenes",
 intro:"There is more demand for short-chain fuels like petrol than crude oil can supply, and too much of the long-chain fractions. Cracking breaks long hydrocarbons into shorter, more useful ones, and makes alkenes for the polymer industry too.",
 outcomes:[["Describe cracking by catalytic and steam methods","5.7.1.4"],["Balance equations for cracking reactions","5.7.1.4"],["Describe the test for alkenes and explain why cracking is useful","5.7.1.4"]],
 blocks:[
  B.text("Cracking",`<p>Hydrocarbons can be broken down (<b>cracked</b>) to produce smaller, more useful molecules. Cracking can be done by various methods including <b>catalytic cracking</b> (the vapour is passed over a hot catalyst) and <b>steam cracking</b> (the vapour is mixed with steam and heated to a very high temperature).</p><p>The products of cracking include <b>alkanes</b> and another type of hydrocarbon called <b>alkenes</b>. Alkenes are more reactive than alkanes. They contain a carbon–carbon double bond and are <b>unsaturated</b>; their general formula is <b>CₙH₂ₙ</b>.</p><p>There is a high demand for fuels with small molecules, and so some of the products of cracking are useful as fuels. Alkenes are used to produce <b>polymers</b> and as starting materials for the production of many other chemicals.</p><p><b>Test for alkenes</b>: shake with <b>bromine water</b>. Alkenes turn it from <b>orange to colourless</b>; alkanes leave it orange.</p>`),
  B.sim("chem-or3-sim","Crack a long alkane",stage,panel,`<span>Long alkane → shorter alkane + alkene</span>`),
  B.check([
   {q:"Balance: C₁₀H₂₂ → C₈H₁₈ + ___. What is the missing product?",opts:["C₂H₆","C₂H₄","CH₄","C₂H₂"],a:1,why:"10 − 8 = 2 C; 22 − 18 = 4 H: ethene."},
   {q:"What is the test for an alkene?",opts:["Limewater turns milky","Bromine water turns from orange to colourless","Squeaky pop","Relights a glowing splint"],a:1,why:"The alkene reacts with bromine."},
   {q:"Why is cracking useful?",opts:["It makes crude oil","It converts less useful long chains into more useful short chains and alkenes","It makes alkanes longer","It removes sulfur"],a:1,why:"Supply of long chains exceeds demand."},]),
  B.keypoints(["Cracking: long alkanes → shorter alkanes + alkenes; catalytic or steam.","Alkenes: C=C, unsaturated, CₙH₂ₙ, more reactive.","Bromine water: orange → colourless with alkenes."]),
  B.mistakes(["Saying bromine water turns 'clear' (say colourless).","Not balancing H atoms in cracking equations.","Saying cracking is a type of distillation."])
 ],onShow:()=>draw()});
function draw(){ const n=+$("#chem-or3-a").value, k=Math.min(val("chem-or3-k"),n-1), m=n-k;
  const al=`C${m>1?m:""}H${2*m+2}`, en=`C${k}H${2*k}`;
  $("#chem-or3-eq").innerHTML=f(`C${n}H${2*n+2} -> ${al} + ${en}`);
  $("#chem-or3-bar").innerHTML=`<div style="display:flex;gap:3px;flex-wrap:wrap">${Array.from({length:n},(_,i)=>`<span style="width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;background:${i<m?"#4f8fd8":"#e0634f"};color:#fff">C</span>`).join("")}</div><div class="muted" style="font-size:.85rem;margin-top:4px">blue: becomes the alkane · red: becomes the alkene</div>`;
  $("#chem-or3-bw").innerHTML=`<svg class="chsvg" viewBox="0 0 220 150" role="img" aria-label="Bromine water tests"><path d="M40 20v90a18 18 0 0 0 36 0V20M140 20v90a18 18 0 0 0 36 0V20" class="ink" fill="none" stroke-width="2"/><path d="M41 60v50a17 17 0 0 0 34 0V60z" fill="#e8892b" opacity=".85"/><path d="M141 60v50a17 17 0 0 0 34 0V60z" fill="#e9eef2" opacity=".5"/><text x="58" y="146" text-anchor="middle" font-size="11">+ alkane</text><text x="158" y="146" text-anchor="middle" font-size="11">+ alkene</text></svg>`;
  $("#chem-or3-txt").innerHTML=`<p style="margin:0">${AN[n]} → ${AN[m]} + ${NM[k]}</p><p class="muted" style="margin:.4rem 0 0">${AN[m]} ${m<=10&&m>=5?"can be used as petrol":m<5?"is a gas used as a fuel (LPG)":"is a fuel"}; ${NM[k]} can be used to make poly(${NM[k]}).</p>`;
  set("chem-or3-k-l",k); set("chem-or3-p1",f(al)+" "+AN[m]); set("chem-or3-p2",f(en)+" "+NM[k]); }
$("#chem-or3-a").addEventListener("change",draw); $("#chem-or3-k").addEventListener("input",draw); draw();
})();

<script>
