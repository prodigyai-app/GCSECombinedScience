 filtration:`<path d="M330 60h140l-55 70v40h-30v-40z" ${ink}/><path d="M342 66h116l-50 62" fill="#f2efe4" stroke="#bbb"/><path d="M362 92c20 6 50 6 76 0l-8 10c-20 4-40 4-60 0z" fill="#c9a36b"/><path d="M415 170v30" class="dat" stroke-width="3" stroke-dasharray="3 5"/><path d="M360 200h110l18 120h-146z" ${ink}/><path d="M352 280h126l8 40h-142z" fill="#9cc8e8" opacity=".6"/>${lab(500,80,"filter funnel")}${lead(495,76,462,76)}${lab(500,104,"filter paper")}${lead(495,100,450,96)}${lab(500,128,"residue: sand")}${lead(495,124,432,98)}${lab(500,300,"filtrate: salt solution")}${lead(495,296,470,300)}${lab(500,250,"conical flask")}${lead(495,246,472,246)}`,
 crystallisation:`<path d="M330 150c0 40 140 40 140 0z" ${ink}/><path d="M340 156c10 26 110 26 120 0z" fill="#9cc8e8" opacity=".7"/><path d="M342 158l10 0M450 158l8 0" stroke="#fff" stroke-width="4"/>${tripod(400,182,170)}${burner(400,300)}${lab(490,140,"evaporating basin")}${lead(485,136,466,148)}${lab(490,166,"salt solution")}${lead(485,162,450,162)}${lab(490,190,"gauze and tripod")}${lead(485,186,470,182)}${lab(490,262,"Bunsen burner")}${lead(485,258,418,262)}<text x="120" y="120" font-size="13">1 Heat to evaporate some</text><text x="120" y="138" font-size="13">   of the water.</text><text x="120" y="164" font-size="13">2 Leave to cool: crystals</text><text x="120" y="182" font-size="13">   form as the solution</text><text x="120" y="200" font-size="13">   becomes saturated.</text><text x="120" y="226" font-size="13">3 Filter off the crystals</text><text x="120" y="244" font-size="13">   and dry them.</text>`,
 distillation:`<circle cx="230" cy="190" r="48" ${ink}/><path d="M188 212c14 22 70 22 84 0z" fill="#9cc8e8" opacity=".7"/><path d="M215 142v-40h30v40" ${ink}/><path d="M230 70v84" class="ink" stroke-width="2"/><circle cx="230" cy="156" r="4" class="fbd"/><path d="M245 112l230 70" ${ink}/><path d="M282 108l190 58v22l-190 -58z" ${ink}/><path d="M300 104v-18M450 160v22" ${ink}/>${tripod(230,248,100)}${burner(230,340)}<path d="M475 190v20" class="dat" stroke-width="3" stroke-dasharray="3 5"/><path d="M455 214h44l6 70h-56z" ${ink}/><path d="M458 254h40l4 30h-48z" fill="#cfe7f7" opacity=".8"/>${lab(120,60,"thermometer")}${lead(170,58,226,80)}${lab(330,70,"condenser: cold water flows round the inner tube")}${lab(510,270,"pure water")}${lead(505,266,498,262)}${lab(120,200,"sea water")}${lead(165,196,196,206)}${lab(320,232,"water out")}${lab(440,214,"water in")}`,
 fractional:`<circle cx="210" cy="250" r="42" ${ink}/><path d="M174 268c12 20 60 20 72 0z" fill="#9cc8e8" opacity=".7"/><path d="M198 210v-150h24v150" ${ink}/>${Array.from({length:9},(_,i)=>`<circle cx="210" cy="${80+i*14}" r="5" class="mut" fill="none" stroke-width="1.4"/>`).join("")}<path d="M210 28v56" class="ink" stroke-width="2"/><circle cx="210" cy="86" r="4" class="fbd"/><path d="M222 70l240 70" ${ink}/><path d="M262 64l196 57v20l-196 -57z" ${ink}/><path d="M462 146v20" class="dat" stroke-width="3" stroke-dasharray="3 5"/><path d="M442 170h44l6 70h-56z" ${ink}/><path d="M446 212h40l4 28h-48z" fill="#f1e8c9" opacity=".9"/>${tripod(210,296,90)}${lab(240,40,"thermometer at the top of the column: reads 78 °C while ethanol distils")}${lab(80,140,"fractionating column")}${lab(80,158,"(glass beads)")}${lead(150,150,196,150)}${lab(500,226,"ethanol (bp 78 °C)")}${lab(60,270,"ethanol + water")}${lead(140,266,170,266)}`,
 chromatography:`<path d="M300 70h160v260h-160z" ${ink}/><path d="M300 300h160v30h-160z" fill="#9cc8e8" opacity=".5"/><rect x="330" y="50" width="100" height="270" fill="#fbfaf4" stroke="#bbb"/><path d="M320 50h120" class="ink" stroke-width="3"/><path d="M330 280h100" class="mut" stroke-dasharray="4 3"/><text x="436" y="284" font-size="11" class="tmut">pencil line</text><path d="M330 120h100" class="dat" stroke-dasharray="2 3"/><text x="436" y="124" font-size="11" class="tdat">solvent front</text><circle cx="355" cy="200" r="7" fill="#d63a8a"/><circle cx="355" cy="250" r="7" fill="#3a7bd6"/><circle cx="405" cy="160" r="7" fill="#e3b81f"/><circle cx="405" cy="226" r="7" fill="#d63a8a"/><circle cx="405" cy="262" r="7" fill="#3a7bd6"/>${lab(500,316,"solvent below the start line")}${lead(495,312,460,312)}${lab(500,220,"each dye travels a different distance")}${lab(120,180,"chromatography paper")}${lead(240,176,330,176)}`};
const MIX=[
 {k:"filtration",n:"Sand mixed with salt water",t:"Filtration",why:"Sand is insoluble: its particles are too big to pass through the filter paper, so it stays behind as the residue. The dissolved salt passes through with the water as the filtrate."},
 {k:"crystallisation",n:"Salt crystals from salt solution",t:"Crystallisation",why:"Evaporating some of the water makes the solution saturated. On cooling, the solid comes out of solution as crystals. Evaporating to dryness can decompose some solids and gives smaller crystals."},
 {k:"distillation",n:"Pure water from sea water",t:"Simple distillation",why:"Water boils and turns to steam, leaving the salt behind. The steam condenses back to liquid water in the condenser. Simple distillation separates a solvent from a solution."},
 {k:"fractional",n:"Ethanol from ethanol and water",t:"Fractional distillation",why:"The liquids have different boiling points (ethanol 78 °C, water 100 °C). In the column, the vapour repeatedly condenses and re-evaporates, so the liquid with the lower boiling point reaches the top first."},
 {k:"chromatography",n:"The dyes in a black ink",t:"Paper chromatography",why:"Each dye has a different attraction for the paper and the solvent, so the solvent carries each dye a different distance up the paper."}];
const stage=`<svg id="chem-at2-svg" viewBox="0 0 700 360" role="img" aria-label="Labelled apparatus for the chosen separation technique"></svg>`;
const panel=`<div class="field"><div class="lbl">I want to separate…</div><div class="seg c1" id="chem-at2-m">${MIX.map((m,i)=>`<label class="opt"><input type="radio" name="chem-at2-m" value="${i}" ${i?"":"checked"}><span>${m.n}</span></label>`).join("")}</div></div>
<div class="readout c1" style="grid-template-columns:1fr"><div><span>Technique</span><b id="chem-at2-t">—</b></div></div><p class="note" id="chem-at2-why"></p>`;

lesson({id:"chem-at2",group:"a",num:2,lvl:"5.1.1 · Lesson 2",name:"Mixtures and separating them",icon:"sep",
 eyebrow:eb("5.1.1.2 Mixtures",2),title:"Mixtures and how to separate them",
 intro:"A mixture is two or more substances that are not chemically combined. Because each substance keeps its own properties, a mixture can be separated by physical processes, without any chemical reaction.",
 outcomes:[["Describe a mixture and explain why its parts can be separated by physical processes","5.1.1.2"],["Describe filtration, crystallisation, simple distillation, fractional distillation and paper chromatography","5.1.1.2"],["Choose a suitable separation technique for a given mixture","5.1.1.2"]],
 blocks:[
  B.text("What is a mixture?",`<p>A <b>mixture</b> consists of two or more elements or compounds <b>not chemically combined</b> together. The chemical properties of each substance in the mixture are unchanged. Air (mainly nitrogen and oxygen), sea water and crude oil are all mixtures.</p><p>The parts of a mixture can be separated by <b>physical processes</b>, which do not involve chemical reactions and do not produce new substances:</p><ul><li><b>Filtration</b> separates an insoluble solid from a liquid.</li><li><b>Crystallisation</b> obtains a soluble solid from a solution.</li><li><b>Simple distillation</b> separates a solvent from a solution.</li><li><b>Fractional distillation</b> separates a mixture of liquids with different boiling points.</li><li><b>Paper chromatography</b> separates substances that dissolve in a solvent, such as the dyes in an ink.</li></ul>`),
  B.sim("chem-at2-sim","Choose a separation technique",stage,panel,`<span>Physical processes only</span><span>No new substances are made</span>`),
  B.example("Planning a separation","A student has a mixture of copper(II) oxide (insoluble) and copper(II) sulfate (soluble, blue). Describe how to obtain dry crystals of copper(II) sulfate.",[
   ["Dissolve","Add warm water and stir: the copper(II) sulfate dissolves, the copper(II) oxide does not.",[`mixture + water → solution + insoluble solid`]],
   ["Filter","Filter the mixture. Copper(II) oxide stays in the filter paper as the residue; the blue solution is the filtrate.",[`residue: CuO · filtrate: CuSO₄(aq)`]],
   ["Crystallise","Heat the filtrate to evaporate some of the water, leave it to cool so crystals form, then filter off and dry the crystals.",[`blue crystals of copper(II) sulfate`]]]),
  B.check([
   {q:"Which technique separates pure water from salt solution?",opts:["Filtration","Simple distillation","Chromatography","Crystallisation"],a:1,why:"The water boils off and is condensed; the salt stays behind."},
   {q:"In filtration, what is the substance left in the filter paper called?",opts:["Filtrate","Solute","Residue","Solvent"],a:2,why:"The residue is the insoluble solid trapped by the paper."},
   {q:"Why can the substances in a mixture be separated by physical processes?",opts:["They are chemically bonded","They are not chemically combined","They all have the same boiling point","They are all elements"],a:1,why:"Each substance keeps its own properties, which can be used to separate them."},
   {q:"Ethanol boils at 78 °C and water at 100 °C. Which technique separates them?",opts:["Filtration","Crystallisation","Fractional distillation","Evaporation"],a:2,why:"Fractional distillation separates liquids with different boiling points."},
   {q:"Why is a solution usually only partly evaporated during crystallisation, rather than heated to dryness?",opts:["To save time","Heating to dryness can decompose the solid and gives small crystals","Crystals only form in boiling water","To make the crystals dissolve"],a:1,why:"Leaving the saturated solution to cool gives larger, purer crystals without decomposing them."}]),
  B.keypoints(["Mixture: substances not chemically combined; each keeps its properties.","Filtration: insoluble solid from liquid. Crystallisation: soluble solid from solution.","Distillation: solvent from solution. Fractional distillation: liquids with different boiling points. Chromatography: dissolved substances such as dyes."]),
  B.mistakes(["Calling the solution that passes through the filter paper the residue (it is the filtrate).","Using filtration to remove a dissolved solid: dissolved particles pass through the paper.","Thinking that a mixture has a fixed composition like a compound."])
 ],onShow:()=>draw()});
function draw(){ const m=MIX[+CH.radio("chem-at2-m")||0]; $("#chem-at2-svg").innerHTML=D[m.k]; set("chem-at2-t",m.t); set("chem-at2-why",m.why); }
$("#chem-at2-m").addEventListener("change",draw); draw();
})();

/* AT3: the development of the model of the atom */
(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {eb,seg,radio,set,loop}=CH;
const st={P:[],n:0,c:[0,0,0],acc:0};
const stage=`<canvas id="chem-at3-cv" class="big-anim" aria-label="Alpha particles fired at a thin gold foil"></canvas>`;
const panel=`<div class="field"><div class="lbl">Model of the atom being tested</div>${seg("chem-at3-m",[["pp","Plum pudding"],["nu","Nuclear model"]],2,"nu")}</div>
<div class="field"><div class="lbl">Rate of firing</div><input type="range" id="chem-at3-r" min="2" max="40" value="14" aria-label="Rate of firing"></div>
<div class="btnrow"><button class="btn" id="chem-at3-clr">Reset counts</button></div>
<div class="readout"><div><span>Fired</span><b id="chem-at3-f">0</b></div><div><span>Straight through</span><b id="chem-at3-a">0</b></div><div><span>Deflected</span><b id="chem-at3-b">0</b></div><div><span>Bounced back</span><b id="chem-at3-c">0</b></div></div>
<p class="note">The nucleus is drawn far bigger than its real size, and large deflections are made more common than in the real experiment, so you can see them.</p>`;
lesson({id:"chem-at3",group:"b",num:3,lvl:"5.1.1 · Lesson 3",name:"The development of the atomic model",icon:"model",
 eyebrow:eb("5.1.1.3 The development of the model of the atom",3),title:"The development of the model of the atom",
 intro:"Our model of the atom has changed as new experiments produced evidence the old model could not explain. Each step shows how science works: a model is kept only while it explains the observations.",
 outcomes:[["Describe how the model of the atom changed: Dalton, Thomson, Rutherford, Bohr and Chadwick","5.1.1.3"],["Explain how the alpha particle scattering experiment led to the nuclear model","5.1.1.3"],["Explain why new evidence can cause a scientific model to be changed or replaced","5.1.1.3"]],
 blocks:[
  B.text("From tiny spheres to the nuclear atom",`<ul><li><b>Before 1900:</b> atoms were thought to be tiny spheres that could not be divided (John Dalton, early 1800s).</li><li><b>1897, plum pudding model:</b> J. J. Thomson discovered the electron. He suggested the atom is a ball of positive charge with negative electrons embedded in it.</li><li><b>1909–1911, nuclear model:</b> in the <b>alpha particle scattering experiment</b> (Geiger and Marsden, explained by Ernest Rutherford), positive alpha particles were fired at thin gold foil. Most went straight through, but a few were deflected and a very few bounced back. So the mass of the atom is concentrated in a tiny, positively charged <b>nucleus</b>, and most of the atom is empty space.</li><li><b>1913, Bohr model:</b> Niels Bohr suggested that electrons orbit the nucleus at specific distances (in shells). His calculations agreed with experimental observations.</li><li><b>Protons:</b> later experiments showed the positive charge of a nucleus is divided into a whole number of smaller particles with the same charge: protons.</li><li><b>1932, neutrons:</b> James Chadwick provided evidence for neutrons in the nucleus, about 20 years after the nucleus became accepted.</li></ul>`),
  B.sim("chem-at3-sim","Alpha particle scattering",stage,panel,`<span>Gold foil a few atoms thick</span><span>Alpha particles are positive</span>`),
  B.example("Using the evidence","Explain what each observation of the scattering experiment tells us about the atom.",[
   ["Most alpha particles went straight through","They passed through without hitting anything.",[`most of the atom is empty space`]],
   ["Some were deflected","Positive alpha particles were repelled.",[`the centre of the atom (nucleus) is positively charged`]],
   ["A very few bounced straight back","They must have hit something very small but with a lot of mass.",[`the mass is concentrated in a tiny central nucleus`]]]),
  B.check([
   {q:"Which particle did J. J. Thomson discover?",opts:["Proton","Neutron","Electron","Nucleus"],a:2,why:"The discovery of the electron led to the plum pudding model."},
   {q:"In the scattering experiment, what did most alpha particles do?",opts:["Bounced back","Were deflected through large angles","Passed straight through the foil","Were absorbed by the foil"],a:2,why:"Most of the atom is empty space."},
   {q:"What did the fact that a few alpha particles bounced back show?",opts:["Electrons are negative","The mass and positive charge are concentrated in a tiny nucleus","Gold is a metal","Atoms are solid spheres"],a:1,why:"Only a small, dense, positive nucleus could repel them back."},
   {q:"Who provided the evidence for neutrons?",opts:["Bohr","Rutherford","Chadwick","Dalton"],a:2,why:"James Chadwick, in 1932."},
   {q:"What did Niels Bohr add to the nuclear model?",opts:["Electrons orbit the nucleus at specific distances","The nucleus contains neutrons","Atoms cannot be divided","Electrons are embedded in positive charge"],a:0,why:"Electrons are in shells (energy levels) at fixed distances."}]),
  B.keypoints(["Plum pudding: positive ball with electrons embedded. Nuclear model: tiny positive nucleus, mostly empty space.","Scattering: most through, some deflected, very few back.","Bohr: electrons in shells. Protons: whole-number units of nuclear charge. Chadwick: neutrons."]),
  B.mistakes(["Saying the plum pudding model has a nucleus.","Saying alpha particles were attracted by the nucleus (they are repelled: both are positive).","Mixing up which scientist did which: Thomson electron, Rutherford nucleus, Bohr shells, Chadwick neutron."])
 ],onShow:()=>{}});
function fire(){ const nu=radio("chem-at3-m")==="nu"; const y=.08+Math.random()*.84; const N=[.2,.4,.6,.8].map(v=>v); /* nuclei rows */
  let th=0; if(nu){ const yn=N.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a), bimp=(y-yn); const k=.0012; th=2*Math.atan(k/Math.max(1e-4,Math.abs(bimp)))*Math.sign(bimp||1); }
  else th=(Math.random()-.5)*.03;
  const cat=Math.abs(th)>Math.PI/2?2:Math.abs(th)>.3?1:0; st.c[cat]++; st.n++;
  st.P.push({x:0,y,th,turned:false,vx:1,vy:0}); }
loop("chem-at3",dt=>{ const cv=$("#chem-at3-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.5), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  const nu=radio("chem-at3-m")==="nu", fx=.62*w;
  /* foil */
  c.fillStyle="rgba(212,175,55,.22)"; c.fillRect(fx-10,0,20,h);
  if(nu){ [.2,.4,.6,.8].forEach(yy=>{ c.fillStyle="#d4af37"; c.beginPath(); c.arc(fx,yy*h,5,0,7); c.fill(); }); }
  else { [.2,.4,.6,.8].forEach(yy=>{ c.fillStyle="rgba(230,90,70,.25)"; c.beginPath(); c.arc(fx,yy*h,h*.1,0,7); c.fill(); for(let k=0;k<5;k++){ c.fillStyle="#2f6fb0"; c.beginPath(); c.arc(fx+Math.cos(k*1.3)*h*.06,yy*h+Math.sin(k*2.1)*h*.06,2.5,0,7); c.fill(); } }); }
  c.fillStyle=css("--ink"); c.font="12px "+css("--f-body"); c.fillText("source of alpha particles",8,16); c.fillText("gold foil",fx-22,h-8);
  st.acc+=dt*(+$("#chem-at3-r").value); while(st.acc>1){ st.acc-=1; fire(); }
  const sp=w*.45*dt;
  st.P.forEach(p=>{ if(!p.turned&&p.x*w>=fx){ p.turned=true; p.vx=Math.cos(p.th); p.vy=Math.sin(p.th); } p.x+=p.vx*sp/w; p.y+=p.vy*sp/h; c.fillStyle=css("--accent"); c.beginPath(); c.arc(p.x*w,p.y*h,3,0,7); c.fill(); });
  st.P=st.P.filter(p=>p.x>-.02&&p.x<1.02&&p.y>-.02&&p.y<1.02);
  set("chem-at3-f",st.n); set("chem-at3-a",st.c[0]); set("chem-at3-b",st.c[1]); set("chem-at3-c",st.c[2]); });
$("#chem-at3-clr").addEventListener("click",()=>{ st.n=0; st.c=[0,0,0]; });
$("#chem-at3-m").addEventListener("change",()=>{ st.n=0; st.c=[0,0,0]; st.P=[]; });
})();

</script>
<script>
LEARN.unit="chem-atoms";

/* AT4: protons, neutrons, electrons and isotopes */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {res,fr}=LAB.W, {eb,sl,val,set,shellsSVG,byZ}=CH;
const stage=`<div class="two" style="padding:12px;align-items:center"><div id="chem-at4-pic"></div><div id="chem-at4-info"></div></div>`;
const panel=sl("chem-at4-p","Protons",1,20,1,6)+sl("chem-at4-n","Neutrons",0,22,1,6)+sl("chem-at4-e","Electrons",0,22,1,6)+`<div class="readout"><div><span>Element</span><b id="chem-at4-el">—</b></div><div><span>Mass number</span><b id="chem-at4-A">—</b></div><div><span>Charge</span><b id="chem-at4-q">—</b></div><div><span>Atom or ion?</span><b id="chem-at4-t">—</b></div></div>`;
lesson({id:"chem-at4",group:"b",num:4,lvl:"5.1.1 · Lesson 4",name:"Subatomic particles and isotopes",icon:"iso",
 eyebrow:eb("5.1.1.4–5.1.1.6 Atoms, isotopes and relative atomic mass",4),title:"Protons, neutrons, electrons and isotopes",
 intro:"Atoms are tiny, about 0.1 nm across, and almost all their mass is in a nucleus about 10 000 times smaller still. Counting the particles inside tells you which element an atom is and which isotope.",
 outcomes:[["Recall the relative charges and masses of protons, neutrons and electrons","5.1.1.4"],["Use atomic number and mass number to work out the numbers of protons, neutrons and electrons","5.1.1.5"],["Explain what isotopes are and calculate relative atomic mass from isotope abundances","5.1.1.6"]],
 blocks:[
  B.text("Inside the atom",`<table class="tbl-mini"><tr><th>Particle</th><th>Relative charge</th><th>Relative mass</th><th>Where</th></tr><tr><td>Proton</td><td>+1</td><td>1</td><td>nucleus</td></tr><tr><td>Neutron</td><td>0</td><td>1</td><td>nucleus</td></tr><tr><td>Electron</td><td>−1</td><td>very small</td><td>shells around the nucleus</td></tr></table><p>An atom has <b>no overall charge</b> because it has equal numbers of protons and electrons. The <b>atomic number</b> is the number of protons; all atoms of an element have the same atomic number. The <b>mass number</b> is the total number of protons and neutrons.</p><p>Atoms have a radius of about 0.1 nm (1 × 10⁻¹⁰ m). The radius of a nucleus is less than 1/10 000 of that of the atom, but almost all the mass is in the nucleus.</p>`),
  B.text("Isotopes and relative atomic mass",`<p><b>Isotopes</b> are atoms of the same element with the same number of protons but a different number of neutrons, so they have different mass numbers. Chlorine has two common isotopes: chlorine-35 (17 protons, 18 neutrons) and chlorine-37 (17 protons, 20 neutrons).</p><p>The <b>relative atomic mass</b>, A<sub>r</sub>, is an average value that takes account of the abundance of each isotope:</p>`+B.eq(`A<sub>r</sub> = ${fr("(mass number × abundance) + (mass number × abundance) + …","total abundance (usually 100)")}`)),
  B.sim("chem-at4-sim","Build an atom or an ion",stage,panel,`<span>Protons decide the element</span><span>Electrons decide the charge</span>`),
  B.example("Relative atomic mass of chlorine","Chlorine is 75% chlorine-35 and 25% chlorine-37. Calculate its relative atomic mass.",[
   ["Multiply each mass number by its abundance","",[`(35 × 75) + (37 × 25) = 2625 + 925 = 3550`]],
   ["Divide by the total abundance","",[`A<sub>r</sub> = ${fr("3550","100")} = ${res("35.5")}`]]]),
  B.example("Counting particles","Work out the numbers of protons, neutrons and electrons in an atom of sodium-23 (atomic number 11).",[
   ["Protons = atomic number","",[`protons = 11`]],
   ["Neutrons = mass number − atomic number","",[`neutrons = 23 − 11 = 12`]],
   ["Electrons = protons in an atom","",[`${res("11 protons, 12 neutrons, 11 electrons")}`]]]),
  B.check([
   {q:"How many neutrons are in an atom of potassium-39? (atomic number 19)",a:20,unit:"",tol:0,why:"39 − 19 = 20."},
   {q:"An ion has 12 protons and 10 electrons. What is its charge?",opts:["2−","0","1+","2+"],a:3,why:"12 positive and 10 negative charges: 2+ (the Mg²⁺ ion)."},
   {q:"What is the same in two isotopes of an element?",opts:["Mass number","Number of neutrons","Number of protons","Relative atomic mass"],a:2,why:"Isotopes have the same atomic number, so the same number of protons."},
   {q:"Copper is 69% copper-63 and 31% copper-65. Calculate its relative atomic mass to 1 decimal place.",a:63.6,unit:"",tol:0.002,why:"(63 × 69 + 65 × 31) ÷ 100 = 63.62 ≈ 63.6."},
   {q:"About how many times larger is the radius of an atom than the radius of its nucleus?",opts:["10","100","10 000","10 000 000 000"],a:2,why:"The nucleus radius is less than 1/10 000 of the atomic radius."}]),
  B.keypoints(["Proton +1, mass 1; neutron 0, mass 1; electron −1, very small mass.","Atomic number = protons. Mass number = protons + neutrons. Atoms: electrons = protons.","Isotopes: same protons, different neutrons. A<sub>r</sub> is the abundance-weighted mean mass."]),
  B.mistakes(["Using the mass number as the number of neutrons.","Adding electrons to the mass number.","Giving the charge of a negative ion as positive when it has extra electrons."])
 ],onShow:()=>draw()});
function draw(){ const p=val("chem-at4-p"), n=val("chem-at4-n"), e=val("chem-at4-e"), el=byZ[p], q=p-e, A=p+n;
  const typical=Math.round(el.Ar);
  $("#chem-at4-pic").innerHTML=e>0?shellsSVG(p,{charge:q,aria:`Shell diagram for ${el.name}`}):`<p class="muted">No electrons: a bare nucleus.</p>`;
  const qs=q===0?"":`<sup>${Math.abs(q)>1?Math.abs(q):""}${q>0?"+":"−"}</sup>`;
  $("#chem-at4-info").innerHTML=`<div style="font-size:3rem;line-height:1;font-family:var(--f-display)"><span style="display:inline-flex;flex-direction:column;font-size:1.1rem;vertical-align:middle;text-align:right;margin-right:4px"><span>${A}</span><span>${p}</span></span>${el.sym}${qs}</div><p style="margin:.6rem 0 0">${el.name}-${A}: ${p} protons, ${n} neutrons, ${e} electrons.</p><p class="muted" style="font-size:.9rem">${Math.abs(n-(typical-p))<=2?`A real isotope region: most ${el.name.toLowerCase()} atoms have ${typical-p} neutrons (A<sub>r</sub> = ${el.Ar}).`:`Real ${el.name.toLowerCase()} atoms have about ${typical-p} neutrons; this one would be very unstable.`}</p>`;
  set("chem-at4-p-l",p); set("chem-at4-n-l",n); set("chem-at4-e-l",e); set("chem-at4-el",el.name); set("chem-at4-A",A); set("chem-at4-q",q===0?"0":(q>0?"+":"−")+Math.abs(q)); set("chem-at4-t",q===0?"atom":q>0?"positive ion":"negative ion"); }
["chem-at4-p","chem-at4-n","chem-at4-e"].forEach(id=>$("#"+id).addEventListener("input",draw));
$("#chem-at4-p").addEventListener("change",()=>{ const p=val("chem-at4-p"); $("#chem-at4-e").value=p; $("#chem-at4-n").value=Math.round(byZ[p].Ar)-p; draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-atoms";

/* AT5: electronic structure */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {eb,sl,val,set,shellsSVG,byZ,config,grp,ptable}=CH;
const stage=`<div class="two" style="padding:12px;align-items:center"><div id="chem-at5-pic"></div><div><div id="chem-at5-pt"></div></div></div>`;
const panel=sl("chem-at5-z","Atomic number",1,20,1,11)+`<div class="readout"><div><span>Element</span><b id="chem-at5-el">—</b></div><div><span>Electronic structure</span><b id="chem-at5-c">—</b></div><div><span>Group</span><b id="chem-at5-g">—</b></div><div><span>Period</span><b id="chem-at5-per">—</b></div></div><p class="note">The number of shells gives the period. The number of electrons in the outer shell gives the group (Group 0 elements have a full outer shell).</p>`;
lesson({id:"chem-at5",group:"b",num:5,lvl:"5.1.1 · Lesson 5",name:"Electronic structure",icon:"shells",
 eyebrow:eb("5.1.1.7 Electronic structure",5),title:"Electronic structure",
 intro:"Electrons occupy the lowest available energy levels, or shells, around the nucleus. Their arrangement explains the shape of the periodic table and how each element reacts.",
 outcomes:[["Describe how electrons fill shells (energy levels) for the first 20 elements","5.1.1.7"],["Represent the electronic structure of an atom as numbers (2,8,1) and as a diagram","5.1.1.7"],["Link electronic structure to an element's group and period","5.1.2.1"]],
 blocks:[
  B.text("Filling the shells",`<p>Electrons occupy the <b>lowest available energy level</b> (the innermost shell) first. For the first 20 elements:</p><ul><li>the first shell holds up to <b>2</b> electrons;</li><li>the second shell holds up to <b>8</b>;</li><li>the third shell holds up to <b>8</b> (for the first 20 elements), and then the fourth shell starts.</li></ul><p>Sodium has 11 electrons: 2 in the first shell, 8 in the second and 1 in the third. Its electronic structure is written <b>2,8,1</b>.</p><p>Elements in the same <b>group</b> have the same number of electrons in their outer shell, which is why they have similar chemical properties. The number of occupied shells is the <b>period</b> (row).</p>`),
  B.sim("chem-at5-sim","Electron shells for the first 20 elements",stage,panel,`<span>2, 8, 8, 2</span><span>Lowest energy level first</span>`),
  B.example("Writing an electronic structure","Write the electronic structure of sulfur (atomic number 16) and use it to find sulfur's group and period.",[
   ["Fill the shells in order","16 electrons: 2 in the first shell, 8 in the second, leaving 6 for the third.",[`sulfur: 2,8,6`]],
   ["Read off group and period","6 electrons in the outer shell and 3 occupied shells.",[`Group 6, period 3`]]]),
  B.check([
   {q:"What is the electronic structure of aluminium (atomic number 13)?",opts:["2,8,3","2,11","8,2,3","2,3,8"],a:0,why:"2 + 8 + 3 = 13."},
   {q:"An element has the electronic structure 2,8,8,1. Which element is it?",opts:["Sodium","Potassium","Argon","Calcium"],a:1,why:"19 electrons: potassium, Group 1, period 4."},
   {q:"How many electrons are in the outer shell of chlorine (atomic number 17)?",a:7,unit:"",tol:0,why:"2,8,7."},
   {q:"Why do lithium and sodium have similar chemical properties?",opts:["Same number of shells","Same number of electrons in the outer shell","Same mass number","Both are gases"],a:1,why:"Li 2,1 and Na 2,8,1 each have one outer electron."},
   {q:"Which element has the electronic structure 2,8?",opts:["Oxygen","Neon","Magnesium","Fluorine"],a:1,why:"10 electrons with a full outer shell: neon, Group 0."}]),
  B.keypoints(["Shells fill from the inside: 2, then 8, then 8, then 2 (first 20 elements).","Outer-shell electrons = group number (Groups 1–7); full outer shell = Group 0.","Number of shells = period."]),
  B.mistakes(["Putting more than 2 electrons in the first shell.","Writing 2,8,9 for potassium instead of 2,8,8,1.","Counting all the electrons rather than only the outer shell to find the group."])
 ],onShow:()=>draw()});
function draw(){ const Z=val("chem-at5-z"), el=byZ[Z], c=config(Z), g=grp(el.col);
  $("#chem-at5-pic").innerHTML=shellsSVG(Z,{aria:`Electron shells of ${el.name}`});
  $("#chem-at5-pt").innerHTML=ptable({sel:Z,cls:e=>e.Z>20?"c-dim":e.Z===Z?"c-hl":"c-"+e.cat,label:e=>e.Z<=20?config(e.Z).join(","):""});
  set("chem-at5-z-l",Z); set("chem-at5-el",`${el.name} (${el.sym})`); set("chem-at5-c",c.join(",")); set("chem-at5-g",g==null?"—":g); set("chem-at5-per",el.per); }
$("#chem-at5-z").addEventListener("input",draw);
document.addEventListener("click",e=>{ const cell=e.target.closest("#chem-at5-pt .cell"); if(!cell) return; const z=+cell.dataset.z; if(z<=20){ $("#chem-at5-z").value=z; draw(); } });
draw();
})();

</script>
<script>
LEARN.unit="chem-atoms";

/* AT6: the periodic table and its development */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {eb,seg,radio,ptable,ptKey,grp}=CH;
const stage=`<div style="padding:10px"><div style="overflow-x:auto"><div id="chem-at6-pt"></div><div class="pt-out" aria-live="polite">Select an element to see its details.</div></div><div id="chem-at6-key"></div></div>`;
const panel=`<div class="field"><div class="lbl">Colour the table by</div>${seg("chem-at6-m",[["mn","Metals and non-metals"],["g","Groups 1, 7 and 0"],["dm","Mendeleev's gaps"]],1,"mn")}</div><p class="note" id="chem-at6-note"></p>`;
lesson({id:"chem-at6",group:"c",num:6,lvl:"5.1.2 · Lesson 6",name:"The periodic table",icon:"pt",
 eyebrow:eb("5.1.2.1–5.1.2.3 The periodic table",6),title:"The periodic table and how it was developed",
 intro:"The periodic table arranges the elements in order of atomic number so that elements with similar properties line up in columns. Getting there took a bold idea: leaving gaps for elements no one had discovered yet.",
 outcomes:[["Explain how the elements are arranged in the periodic table, and why elements in a group have similar properties","5.1.2.1"],["Describe how Mendeleev developed the table and why he left gaps","5.1.2.2"],["Describe where metals and non-metals are found and how they differ","5.1.2.3"]],
 blocks:[
  B.text("The modern periodic table",`<p>The elements are arranged in order of <b>atomic number</b> (number of protons). Elements with similar properties are in vertical columns called <b>groups</b>; the horizontal rows are <b>periods</b>.</p><p>Elements in the same group have the same number of electrons in their outer shell, which gives them similar chemical properties. The table is called a <i>periodic</i> table because similar properties occur at regular intervals.</p>`),
  B.text("How the table was developed",`<ul><li>Before the discovery of protons, neutrons and electrons, scientists ordered elements by <b>atomic weight</b>. Early tables were incomplete, and some elements were placed in the wrong groups if the order of atomic weight was followed strictly.</li><li><b>Dmitri Mendeleev</b> (1869) also ordered by atomic weight, but he <b>left gaps</b> for elements he thought had not been discovered yet, and in some places he <b>changed the order</b> so that elements with similar properties were in the same group (tellurium before iodine, for example).</li><li>Elements discovered later, such as gallium and germanium, fitted the gaps and had properties close to his predictions. This was strong evidence for his table.</li><li>Knowledge of <b>isotopes</b> explained why ordering by atomic weight was not always correct: atomic number, not mass, decides an element's place.</li></ul>`),
  B.text("Metals and non-metals",`<p><b>Metals</b> are on the left and towards the bottom of the table; <b>non-metals</b> are on the right and towards the top. Elements that react to form <b>positive ions</b> are metals; non-metals do not form positive ions.</p><table class="tbl-mini"><tr><th>Typical metal</th><th>Typical non-metal</th></tr><tr><td>shiny, high melting point</td><td>dull, low melting point (many are gases)</td></tr><tr><td>good conductor of electricity and heat</td><td>poor conductor (graphite is an exception)</td></tr><tr><td>malleable and ductile</td><td>brittle when solid</td></tr><tr><td>forms positive ions; oxides are basic</td><td>forms negative ions or shares electrons; oxides are acidic</td></tr></table>`),
  B.sim("chem-at6-sim","Explore the periodic table",stage,panel,`<span>Ordered by atomic number</span><span>Groups are columns</span>`),
  B.check([
   {q:"In what order are the elements arranged in the modern periodic table?",opts:["Atomic weight","Mass number","Atomic number","Date of discovery"],a:2,why:"Atomic number: the number of protons."},
   {q:"Why did Mendeleev leave gaps in his table?",opts:["He ran out of space","For elements he predicted had not yet been discovered","For radioactive elements","To separate metals from non-metals"],a:1,why:"He predicted their properties; gallium and germanium later fitted."},
   {q:"Why did Mendeleev place tellurium before iodine, even though tellurium has the higher atomic weight?",opts:["It was discovered first","So that each element was in the group with similar properties","Tellurium is a metal","He made a mistake"],a:1,why:"Iodine's properties match fluorine, chlorine and bromine in Group 7."},
   {q:"Which of these is a property of a typical non-metal?",opts:["Forms positive ions","Good conductor of electricity","Low melting point","Malleable"],a:2,why:"Many non-metals are gases or low-melting solids."},
   {q:"What did the discovery of isotopes explain?",opts:["Why some elements are radioactive","Why ordering by atomic weight was not always correct","Why metals conduct","Why noble gases are unreactive"],a:1,why:"Isotopes change the mass but not the atomic number."}]),
  B.keypoints(["Order by atomic number; groups = columns with the same number of outer electrons; periods = rows.","Mendeleev: ordered by atomic weight but left gaps and swapped pairs; later discoveries confirmed his predictions.","Metals (left, bottom) form positive ions; non-metals (right, top) do not."]),
  B.mistakes(["Saying Mendeleev ordered by atomic number (protons had not been discovered).","Thinking the staircase line means elements beside it are always metals.","Confusing groups (columns) with periods (rows)."])
 ],onShow:()=>draw()});
const GAP=[21,31,32];
function draw(){ const m=radio("chem-at6-m");
  const cls=m==="mn"?(e=>"c-"+e.cat):m==="g"?(e=>{ const g=grp(e.col); return g===1&&e.Z>1?"c-metal":g===7?"c-non":g===0?"c-noble":"c-dim"; }):(e=>GAP.includes(e.Z)?"c-hl":e.Z>56?"c-dim":"c-"+e.cat);
  $("#chem-at6-pt").innerHTML=ptable({cls});
  $("#chem-at6-key").innerHTML=m==="mn"?ptKey:"";
  $("#chem-at6-note").innerHTML=m==="mn"?"Metals form positive ions. The red staircase is the rough dividing line between metals and non-metals.":m==="g"?"Group 1: alkali metals. Group 7: halogens. Group 0: noble gases. Hydrogen sits above Group 1 but is a non-metal.":"Mendeleev left gaps where scandium, gallium and germanium now are. He predicted their properties, and they matched closely when the elements were found."; }
$("#chem-at6-m").addEventListener("change",draw); draw();
})();

</script>
<script>
LEARN.unit="chem-atoms";

/* AT7: Group 0 and Group 1 */
(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,seg,radio,set,loop}=CH, {hbars}=G;
const M={Li:{n:"Lithium",mp:181,d:.53,speed:.25,melt:false,flame:false,txt:"Floats and fizzes steadily. Moves slowly on the surface."},
 Na:{n:"Sodium",mp:98,d:.97,speed:.7,melt:true,flame:false,txt:"Fizzes rapidly, melts into a shiny ball and whizzes about on the surface."},
 K:{n:"Potassium",mp:63,d:.89,speed:1.3,melt:true,flame:true,txt:"Reacts violently: melts, whizzes about and the hydrogen burns with a lilac flame. Often ends with a small explosion."}};
const st={x:.5,vx:.2,t:0,size:1,bub:[],run:false};
const stage=`<canvas id="chem-at7-cv" class="big-anim" aria-label="A small piece of alkali metal reacting with water containing universal indicator"></canvas>`;
const panel=`<div class="field"><div class="lbl">Metal</div>${seg("chem-at7-m",[["Li","Lithium"],["Na","Sodium"],["K","Potassium"]],3,"Li")}</div><div class="btnrow"><button class="btn primary" id="chem-at7-go">Drop it in the water</button></div>
<div class="readout"><div><span>Melting point</span><b id="chem-at7-mp">—</b></div><div><span>Density</span><b id="chem-at7-d">—</b></div></div><p class="note" id="chem-at7-o"></p>`;
lesson({id:"chem-at7",group:"c",num:7,lvl:"5.1.2 · Lesson 7",name:"Group 0 and Group 1",icon:"g1",
 eyebrow:eb("5.1.2.4–5.1.2.5 Group 0 and Group 1",7),title:"The noble gases and the alkali metals",
 intro:"Group 0 elements barely react at all, while Group 1 metals react so readily that they are stored under oil. The difference comes down to one thing: the number of electrons in the outer shell.",
 outcomes:[["Explain why the noble gases are unreactive and describe the trend in their boiling points","5.1.2.4"],["Describe the reactions of the alkali metals with oxygen, chlorine and water","5.1.2.5"],["Explain the trend in reactivity of Group 1 in terms of electronic structure","5.1.2.5"]],
 blocks:[
  B.text("Group 0: the noble gases",`<p>The noble gases are unreactive and do not easily form molecules, because their atoms have <b>stable arrangements of electrons</b>: a full outer shell of 8 electrons (helium has 2). They exist as single atoms.</p><p>The <b>boiling points increase going down the group</b> as the relative atomic mass increases.</p><svg viewBox="0 0 560 220" class="chsvg" role="img" aria-label="Boiling points of the noble gases">${hbars([["Helium",269-269+4,"fdat"],["Neon",269-246+4,"fdat"],["Argon",269-186+4,"fdat"],["Krypton",269-153+4,"fdat"],["Xenon",269-108+4,"fdat"],["Radon",269-62+4,"fdat"]].map(([a,v,c],i)=>[a,v,c]),10,10,540,215,{unit:"",dp:0}).replace(/>(\d+) <\/text>/g,(m0,n)=>`>${+n-4-269} °C</text>`)}</svg>`),
  B.text("Group 1: the alkali metals",`<p>The alkali metals have <b>one electron in their outer shell</b>. They are soft, have low densities (lithium, sodium and potassium float on water) and low melting points that decrease down the group. They are stored under oil because they react with oxygen and water in the air.</p><ul><li>With <b>oxygen</b>: metal + oxygen → metal oxide, e.g. ${f("4Na + O2 -> 2Na2O")}. Freshly cut surfaces quickly tarnish.</li><li>With <b>chlorine</b>: metal + chlorine → metal chloride, a white solid, e.g. ${f("2Na + Cl2 -> 2NaCl")}.</li><li>With <b>water</b>: metal + water → metal hydroxide + hydrogen, e.g. ${f("2Na + 2H2O -> 2NaOH + H2")}. The hydroxide dissolves to make an <b>alkaline</b> solution (universal indicator turns purple).</li></ul><p><b>Reactivity increases down the group.</b> Going down, the atoms get bigger: the outer electron is further from the nucleus and is shielded by more inner shells, so it is attracted less strongly and is <b>lost more easily</b>.</p>`),
  B.sim("chem-at7-sim","Alkali metals in water",stage,panel,`<span>Universal indicator added</span><span>Small pieces, behind a safety screen</span>`),
  B.check([
   {q:"Why are the noble gases unreactive?",opts:["They are gases","They have a full (stable) outer shell of electrons","They have no electrons","They are very dense"],a:1,why:"They have no tendency to gain, lose or share electrons."},
   {q:"What is formed when potassium reacts with water?",opts:["Potassium oxide and hydrogen","Potassium hydroxide and hydrogen","Potassium hydroxide and oxygen","Potassium and hydrogen oxide"],a:1,why:"2K + 2H₂O → 2KOH + H₂."},
   {q:"What colour does universal indicator turn in the water after sodium has reacted?",opts:["Red","Green","Purple","Orange"],a:2,why:"Sodium hydroxide is a strong alkali."},
   {q:"Why is potassium more reactive than sodium?",opts:["Its outer electron is further from the nucleus, so it is lost more easily","It has more electrons in its outer shell","It has a higher melting point","It is less dense"],a:0,why:"Weaker attraction to the nucleus means the electron is lost more easily."},
   {q:"How does the boiling point of the noble gases change down the group?",opts:["Increases","Decreases","Stays the same","Increases then decreases"],a:0,why:"It increases as the relative atomic mass increases."}]),
  B.keypoints(["Group 0: full outer shell, unreactive, boiling point increases down the group.","Group 1: one outer electron; react with O₂ (oxide), Cl₂ (chloride), H₂O (hydroxide + H₂).","Group 1 reactivity increases down the group: the outer electron is further from the nucleus and more easily lost."]),
  B.mistakes(["Saying Group 1 metals react to form an acid with water (the hydroxide is an alkali).","Explaining the trend by 'more shells means more electrons to lose': there is still only one outer electron.","Writing the hydrogen as H instead of H₂."])
 ],onShow:()=>draw()});
function draw(){ const m=M[radio("chem-at7-m")]; set("chem-at7-mp",`${m.mp} °C`); set("chem-at7-d",`${m.d} g/cm³`); set("chem-at7-o",st.run||st.t>0?m.txt:"Press the button to add a small piece of the metal."); }
loop("chem-at7",dt=>{ const cv=$("#chem-at7-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.48), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  const k=radio("chem-at7-m"), m=M[k], wy=h*.42, x0=w*.08, x1=w*.92;
  if(st.run){ st.t+=dt; st.size=Math.max(0,st.size-dt*m.speed*.18); st.vx+=(Math.random()-.5)*m.speed*3*dt; st.vx=Math.max(-m.speed,Math.min(m.speed,st.vx)); st.x+=st.vx*dt*.25; if(st.x<.15||st.x>.85) st.vx*=-1; st.x=Math.max(.15,Math.min(.85,st.x));
    for(let i=0;i<m.speed*6;i++) if(Math.random()<.5) st.bub.push({x:st.x+(Math.random()-.5)*.03,y:wy,v:20+Math.random()*30}); if(st.size<=0) st.run=false; }
  /* trough */
  const mix=Math.min(1,st.t*m.speed*.6), green=[93,170,59], purple=[90,45,138], col=green.map((v,i)=>Math.round(v+(purple[i]-v)*mix));
  c.fillStyle=`rgba(${col.join(",")},.55)`; c.fillRect(x0,wy,x1-x0,h*.5); c.strokeStyle=css("--ink"); c.lineWidth=2; c.beginPath(); c.moveTo(x0,h*.2); c.lineTo(x0,h*.92); c.lineTo(x1,h*.92); c.lineTo(x1,h*.2); c.stroke();
  st.bub.forEach(b=>{ b.y-=b.v*dt; }); st.bub=st.bub.filter(b=>b.y>wy-30);
  c.fillStyle="rgba(255,255,255,.8)"; st.bub.forEach(b=>{ c.beginPath(); c.arc(b.x*w,b.y,2,0,7); c.fill(); });
  if(st.size>0&&(st.run||st.t===0)){ const r=8*st.size+2, px=st.x*w;
    if(st.t>0&&m.flame){ c.fillStyle="rgba(170,110,230,.55)"; c.beginPath(); c.moveTo(px-10,wy-r); c.quadraticCurveTo(px,wy-r-40-Math.random()*14,px+10,wy-r); c.fill(); }
    c.fillStyle=k==="Li"?"#b9bec4":"#d7dbe0"; c.beginPath(); if(m.melt&&st.t>0) c.arc(px,wy-r*.6,r,0,7); else c.rect(px-r,wy-r*1.2,2*r,r*1.2); c.fill(); c.strokeStyle="#777"; c.stroke(); }
  c.fillStyle=css("--ink"); c.font="12px "+css("--f-body"); c.fillText(st.t>0&&!st.run?"The metal has reacted completely. The solution is now alkaline.":"water with universal indicator",x0+6,h*.9-6); });
$("#chem-at7-go").addEventListener("click",()=>{ st.x=.5; st.vx=.2; st.t=.001; st.size=1; st.run=true; st.bub=[]; draw(); });
$("#chem-at7-m").addEventListener("change",()=>{ st.t=0; st.run=false; st.size=1; st.bub=[]; draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-atoms";

/* AT8: Group 7, the halogens */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,seg,radio,set}=CH;
const H={Cl:{n:"chlorine water",rank:1,col:"#e9f2c0"},Br:{n:"bromine water",rank:2,col:"#f0a43a"},I:{n:"iodine solution",rank:3,col:"#8a4b1c"}};
const S={Cl:{n:"potassium chloride",rank:1},Br:{n:"potassium bromide",rank:2},I:{n:"potassium iodide",rank:3}};
const NAME={Cl:"chlorine",Br:"bromine",I:"iodine"}, ION={Cl:"chloride",Br:"bromide",I:"iodide"};
const SOLCOL={Cl:"#eef5d8",Br:"#f2a33a",I:"#7b3f16"};
const stage=`<svg id="chem-at8-svg" viewBox="0 0 640 300" class="chsvg" role="img" aria-label="Test tube showing the result of adding a halogen to a halide solution"></svg>`;
const panel=`<div class="field"><div class="lbl">Add this halogen…</div>${seg("chem-at8-h",[["Cl","Chlorine"],["Br","Bromine"],["I","Iodine"]],3,"Cl")}</div><div class="field"><div class="lbl">…to this salt solution</div>${seg("chem-at8-s",[["Cl","KCl"],["Br","KBr"],["I","KI"]],3,"I")}</div><div class="readout c1" style="grid-template-columns:1fr"><div><span>Result</span><b id="chem-at8-r">—</b></div></div><p class="note" id="chem-at8-e"></p>`;
lesson({id:"chem-at8",group:"c",num:8,lvl:"5.1.2 · Lesson 8",name:"Group 7: the halogens",icon:"g7",
 eyebrow:eb("5.1.2.6 Group 7",8),title:"Group 7: the halogens",
 intro:"The halogens are coloured, toxic non-metals that exist as pairs of atoms. They become less reactive down the group, and a more reactive halogen will push a less reactive one out of its compounds.",
 outcomes:[["Describe the properties of the halogens and the trends in melting and boiling points","5.1.2.6"],["Explain why reactivity decreases down Group 7","5.1.2.6"],["Predict and write equations for halogen displacement reactions","5.1.2.6"]],
 blocks:[
  B.text("Properties and trends",`<p>The halogens have <b>seven electrons in their outer shell</b> and consist of molecules made of pairs of atoms: ${f("F2")}, ${f("Cl2")}, ${f("Br2")}, ${f("I2")}.</p><table class="tbl-mini"><tr><th>Halogen</th><th>State at room temperature</th><th>Colour</th></tr><tr><td>Fluorine</td><td>gas</td><td>pale yellow</td></tr><tr><td>Chlorine</td><td>gas</td><td>green</td></tr><tr><td>Bromine</td><td>liquid</td><td>red-brown (orange in solution)</td></tr><tr><td>Iodine</td><td>solid</td><td>grey-black (purple vapour, brown in solution)</td></tr></table><p>Going down the group, the <b>relative molecular mass increases</b> and so do the <b>melting and boiling points</b>.</p><p>Halogens react with metals to form ionic salts called halides (sodium chloride, iron bromide…) and with non-metals to form covalent molecules (hydrogen chloride, HCl).</p>`),
  B.text("Reactivity and displacement",`<p><b>Reactivity decreases going down the group.</b> A halogen reacts by gaining one electron. Further down, the outer shell is further from the nucleus and more shielded, so an incoming electron is attracted less strongly and is <b>gained less easily</b>.</p><p>A more reactive halogen <b>displaces</b> a less reactive halogen from an aqueous solution of its salt:</p><div class="eqn">${f("Cl2 + 2KBr -> 2KCl + Br2")}</div><p>The solution turns orange as bromine forms. Bromine displaces iodine from potassium iodide (brown), but iodine cannot displace bromine or chlorine.</p>`+G.ht(`<p>As an ionic equation: ${f("Cl2 + 2Br^- -> 2Cl^- + Br2")}. Chlorine gains electrons (it is reduced) and bromide ions lose electrons (they are oxidised).</p>`)),
  B.sim("chem-at8-sim","Halogen displacement",stage,panel,`<span>Aqueous solutions</span><span>Colourless salt solutions to start</span>`),
  B.example("Writing a displacement equation","Write a balanced equation for bromine water reacting with potassium iodide solution.",[
   ["Word equation","Bromine is more reactive than iodine, so it displaces it.",[`bromine + potassium iodide → potassium bromide + iodine`]],
   ["Symbol equation","Each Br₂ molecule needs two iodide compounds.",[`${f("Br2 + 2KI -> 2KBr + I2")}`]]]),
  B.check([
   {q:"Which halogen is a red-brown liquid at room temperature?",opts:["Fluorine","Chlorine","Bromine","Iodine"],a:2,why:"Bromine."},
   {q:"Which mixture would react?",opts:["Iodine + potassium bromide","Bromine + potassium chloride","Chlorine + potassium iodide","Iodine + potassium chloride"],a:2,why:"Chlorine is more reactive than iodine, so it displaces it."},
   {q:"How do the boiling points of the halogens change down the group?",opts:["They increase","They decrease","They stay the same","They decrease then increase"],a:0,why:"Larger molecules with greater relative molecular mass."},
   {q:"Why is fluorine more reactive than chlorine?",opts:["It has more electrons","Its outer shell is closer to the nucleus, so it gains an electron more easily","It is a gas","It has a higher boiling point"],a:1,why:"Stronger attraction for an extra electron."},
   {q:"What colour is the solution when chlorine water is added to potassium bromide solution?",opts:["Colourless","Orange","Purple","Green"],a:1,why:"Bromine is produced, which is orange in solution."}]),
  B.keypoints(["Halogens: 7 outer electrons, diatomic molecules, toxic coloured non-metals.","Melting and boiling points increase down the group; reactivity decreases.","A more reactive halogen displaces a less reactive one from its salt solution."]),
  B.mistakes(["Explaining Group 7 reactivity as for Group 1 (halogens gain an electron; Group 1 metals lose one).","Writing Cl instead of Cl₂ for the element.","Thinking a less reactive halogen can displace a more reactive one."])
 ],onShow:()=>draw()});
function draw(){ const h=radio("chem-at8-h"), s=radio("chem-at8-s"), react=H[h].rank<S[s].rank;
  const solC=h===s?H[h].col:react?SOLCOL[s]:H[h].col;
  let g=`<path d="M290 40v190a30 30 0 0 0 60 0v-190" class="ink" fill="none" stroke-width="2.5"/><path d="M292 120v110a28 28 0 0 0 56 0v-110z" fill="${solC}" opacity=".85"/><ellipse cx="320" cy="120" rx="28" ry="5" fill="${solC}" opacity=".95"/>`;
  g+=`<text x="30" y="80" font-size="15" font-weight="700">${H[h].n}</text><text x="30" y="100" font-size="13" class="tmut">added to</text><text x="30" y="120" font-size="15" font-weight="700">${S[s].n}</text><text x="30" y="138" font-size="15" font-weight="700">solution</text>`;
  g+=`<text x="380" y="140" font-size="15" font-weight="700">${h===s?"no reaction (same halogen)":react?"reaction":"no reaction"}</text><text x="380" y="162" font-size="13">${react?`${NAME[s]} is displaced`:h===s?"":`${NAME[h]} is less reactive than ${NAME[s]}`}</text>`;
  $("#chem-at8-svg").innerHTML=g;
  set("chem-at8-r",h===s?"No reaction":react?`${NAME[h][0].toUpperCase()+NAME[h].slice(1)} displaces ${NAME[s]}: solution turns ${s==="Br"?"orange":"brown"}`:"No reaction: no colour change");
  set("chem-at8-e",react?`${f(`${h}2 + 2K${s} -> 2K${h} + ${s}2`)}<br><span class="ht">Higher</span> ${f(`${h}2 + 2${s}^- -> 2${h}^- + ${s}2`)}`:`${NAME[h]} + potassium ${ION[s]} → no reaction`); }
["chem-at8-h","chem-at8-s"].forEach(id=>$("#"+id).addEventListener("change",draw)); draw();
})();

</script>

<script>

/* BO1: ionic bonding */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,shellsSVG,byZ,bySym,config,grp}=CH;
const MET=["Li","Na","K","Mg","Ca","Al"], NON=["F","Cl","O","S","N"];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const stage=`<div style="padding:12px"><div class="lbl" style="margin-bottom:4px">Before: atoms</div><div id="chem-bo1-a" class="chem-bo1-row"></div><div style="text-align:center;font-size:1.4rem;margin:2px 0" aria-hidden="true">↓ electron transfer ↓</div><div class="lbl" style="margin-bottom:4px">After: ions</div><div id="chem-bo1-b" class="chem-bo1-row"></div></div>`;
const panel=field("Metal",sel("chem-bo1-m",MET.map(s=>[s,`${byZ[bySym[s].Z].name} (${s})`]),"Na"))+field("Non-metal",sel("chem-bo1-n",NON.map(s=>[s,`${bySym[s].name} (${s})`]),"Cl"))+
`<div class="readout"><div><span>Each metal atom</span><b id="chem-bo1-l">—</b></div><div><span>Each non-metal atom</span><b id="chem-bo1-g">—</b></div><div><span>Ratio of ions</span><b id="chem-bo1-r">—</b></div><div><span>Formula</span><b id="chem-bo1-f">—</b></div></div><p class="note">Crosses are electrons that came from the metal; dots are the non-metal's own electrons.</p>`;
lesson({id:"chem-bo1",group:"a",num:1,lvl:"5.2.1 · Lesson 1",name:"Ionic bonding",icon:"ionic",
 eyebrow:eb("5.2.1.1–5.2.1.2 Chemical bonds and ionic bonding",1),title:"Ionic bonding",
 intro:"When a metal reacts with a non-metal, electrons move from the metal atoms to the non-metal atoms. The ions that form have opposite charges and attract each other strongly: this is ionic bonding.",
 outcomes:[["Name the three types of strong chemical bond: ionic, covalent and metallic","5.2.1.1"],["Describe how ions form by electron transfer, and explain the charges on ions of Groups 1, 2, 6 and 7","5.2.1.2"],["Draw dot-and-cross diagrams for ionic compounds","5.2.1.2"]],
 blocks:[
  B.text("Three types of strong bond",`<table class="tbl-mini"><tr><th>Bond</th><th>Between</th><th>What happens to the electrons</th></tr><tr><td>Ionic</td><td>a metal and a non-metal</td><td>transferred from the metal to the non-metal, forming oppositely charged ions</td></tr><tr><td>Covalent</td><td>non-metals</td><td>shared in pairs</td></tr><tr><td>Metallic</td><td>atoms in a metal or alloy</td><td>outer electrons are delocalised and shared through the whole structure</td></tr></table>`),
  B.text("How ions form",`<p>An <b>ion</b> is an atom or group of atoms with an electric charge. When a metal atom reacts with a non-metal atom, the metal atom <b>loses</b> its outer-shell electrons and becomes a <b>positive ion</b>; the non-metal atom <b>gains</b> electrons and becomes a <b>negative ion</b>. Both ions then have the stable electronic structure of a noble gas (Group 0).</p><table class="tbl-mini"><tr><th>Group</th><th>1</th><th>2</th><th>3</th><th>5</th><th>6</th><th>7</th></tr><tr><td>Electrons lost or gained</td><td>lose 1</td><td>lose 2</td><td>lose 3</td><td>gain 3</td><td>gain 2</td><td>gain 1</td></tr><tr><td>Charge on ion</td><td>1+</td><td>2+</td><td>3+</td><td>3−</td><td>2−</td><td>1−</td></tr><tr><td>Example</td><td>${f("Na^+")}</td><td>${f("Mg^2+")}</td><td>${f("Al^3+")}</td><td>${f("N^3-")}</td><td>${f("O^2-")}</td><td>${f("Cl^-")}</td></tr></table><p>Negative ions of single elements are named with <b>-ide</b>: chlor<b>ide</b>, ox<b>ide</b>, sulf<b>ide</b>.</p>`),
  B.sim("chem-bo1-sim","Electron transfer",stage,panel,`<span>Metals lose electrons</span><span>Non-metals gain electrons</span>`),
  B.example("Dot-and-cross for magnesium oxide","Describe what happens when magnesium (2,8,2) reacts with oxygen (2,6).",[
   ["Electrons lost","Each magnesium atom loses its 2 outer electrons.",[`Mg (2,8,2) → ${f("Mg^2+")} (2,8) + 2${f("e^-")}`]],
   ["Electrons gained","Each oxygen atom gains 2 electrons into its outer shell.",[`O (2,6) + 2${f("e^-")} → ${f("O^2-")} (2,8)`]],

<script>

(()=>{

lesson({id:"chem-bo2",group:"a",num:2,lvl:"5.2.1 · Lesson 2",name:"Ionic compounds",icon:"lattice",
 eyebrow:eb("5.2.1.3 Ionic compounds",2),title:"Ionic compounds: giant lattices and formulae",
 intro:"An ionic compound is a giant structure of ions held together by strong electrostatic forces acting in all directions. Because the charges must balance, you can work out the formula of any ionic compound from the charges on its ions.",

  B.text("Giant ionic lattices",`<p>An ionic compound is a <b>giant structure</b> of ions. The ions form a regular, repeating 3D pattern called a <b>lattice</b>. It is held together by strong <b>electrostatic forces of attraction</b> between oppositely charged ions, which act in <b>all directions</b>: this attraction is the ionic bond.</p><p>Sodium chloride has a lattice where every ${f("Na^+")} ion is surrounded by 6 ${f("Cl^-")} ions and every ${f("Cl^-")} ion by 6 ${f("Na^+")} ions. There is no such thing as a 'molecule' of sodium chloride; the formula NaCl gives the <b>ratio</b> of ions (1 : 1).</p>`),

function lattice(n){ const pts=[]; const o=(n-1)/2; for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++) pts.push({x:i-o,y:j-o,z:k-o,na:(i+j+k)%2===0}); return pts; }

  const pr=p=>{ const x1=p.x*ca+p.z*sa, z1=-p.x*sa+p.z*ca, y1=p.y*cb-z1*sb, z2=p.y*sb+z1*cb; const k=1/(1+z2*.06); return {X:w/2+x1*s*k,Y:h/2+y1*s*k,Z:z2,k}; };
  const Q=P.map(p=>Object.assign(pr(p),{na:p.na,p}));
  if(!sf){ c.strokeStyle=css("--muted"); c.lineWidth=1.2; c.beginPath(); P.forEach((p,i)=>P.forEach((q,j)=>{ if(j>i&&Math.abs(p.x-q.x)+Math.abs(p.y-q.y)+Math.abs(p.z-q.z)===1){ c.moveTo(Q[i].X,Q[i].Y); c.lineTo(Q[j].X,Q[j].Y); } })); c.stroke(); }
  Q.sort((a,b)=>b.Z-a.Z).forEach(q=>{ const r=(q.na?(sf?.36:.13):(sf?.62:.22))*s*q.k; const g=c.createRadialGradient(q.X-r*.3,q.Y-r*.3,r*.1,q.X,q.Y,r); g.addColorStop(0,q.na?"#c9b6f2":"#9fe3a8"); g.addColorStop(1,q.na?"#6f4bc2":"#2f9a45"); c.fillStyle=g; c.beginPath(); c.arc(q.X,q.Y,r,0,7); c.fill(); });
  c.font="12px "+css("--f-body"); c.fillStyle="#6f4bc2"; c.fillText("● Na⁺",10,h-26); c.fillStyle="#2f9a45"; c.fillText("● Cl⁻",10,h-10);

(()=>{ const cv=$("#chem-bo2-cv"); const pos=e=>[e.clientX,e.clientY];

lesson({id:"chem-bo3",group:"a",num:3,lvl:"5.2.1 · Lesson 3",name:"Covalent bonding",icon:"cov",
 eyebrow:eb("5.2.1.4 Covalent bonding",3),title:"Covalent bonding",

 outcomes:[["Describe a covalent bond as a shared pair of electrons between non-metal atoms","5.2.1.4"],["Draw dot-and-cross diagrams for H₂, Cl₂, O₂, N₂, HCl, H₂O, NH₃, CH₄ and CO₂","5.2.1.4"],["Recognise small molecules, polymers and giant covalent structures, and deduce a molecular formula from a model or diagram","5.2.1.4"]],
 blocks:[

   ["Count each type of atom","C: 2, H: 6, O: 1",[`C<sub>2</sub>H<sub>6</sub>O`]],

  B.keypoints(["Covalent bond: a shared pair of electrons between two non-metal atoms. The bond is strong.","Single bond: 1 pair; double: 2 pairs; triple: 3 pairs.","Covalent substances: small molecules, polymers or giant covalent structures."]),

function draw(){ const k=$("#chem-bo3-m").value, m=M[k], s=m.s, v=radio("chem-bo3-v"); const L=s.L, angs=s.ang||(L.length===1?[0]:L.length===2?(s.lc?[150,30]:[180,0]):L.length===3?[180,0,90]:[0,90,180,270]);

lesson({id:"chem-bo4",group:"a",num:4,lvl:"5.2.1 · Lesson 4",name:"Metallic bonding",icon:"metal",
 eyebrow:eb("5.2.1.5 Metallic bonding",4),title:"Metallic bonding",
 intro:"Metals are giant structures of atoms arranged in a regular pattern. Their outer electrons are not tied to any one atom, which is why metals conduct electricity and can be hammered into shape.",
 outcomes:[["Describe metallic bonding as positive ions in a sea of delocalised electrons","5.2.1.5"],["Explain why metals conduct electricity and heat, and why pure metals can be bent and shaped","5.2.2.7–5.2.2.8"],["Explain why alloys are harder than pure metals","5.2.2.7"]],
 blocks:[
  B.text("A sea of electrons",`<p>Metals consist of giant structures of atoms arranged in a regular pattern of layers. The electrons in the outer shell of the metal atoms are <b>delocalised</b>: they are free to move through the whole structure. This leaves a lattice of <b>positive metal ions</b>.</p><p>The sharing of delocalised electrons gives <b>strong metallic bonds</b>: the electrostatic attraction between the positive ions and the delocalised electrons. Because the bonding is strong, most metals have <b>high melting and boiling points</b>.</p>`),
  B.sim("chem-bo4-sim","Inside a metal",stage,panel,`<span>Positive ions</span><span>Delocalised electrons</span>`),
  B.text("Properties explained",`<ul><li><b>Good conductors of electricity</b>: the delocalised electrons move through the metal and carry charge.</li><li><b>Good conductors of thermal energy</b>: energy is transferred by the delocalised electrons.</li><li><b>Malleable and ductile</b> (pure metals): the layers of atoms can slide over each other, so pure metals can be bent and shaped. Pure iron, copper, gold and aluminium are too soft for many uses.</li><li><b>Alloys are harder</b>: an alloy is a mixture of a metal with other elements (usually metals). The different sized atoms <b>distort the layers</b>, making it more difficult for them to slide over each other.</li></ul>`),
  B.check([
   {q:"What are the particles in the lattice of a metal?",opts:["Atoms with no charge","Negative ions","Positive ions","Molecules"],a:2,why:"Atoms that have lost their outer electrons to the delocalised 'sea'."},
   {q:"Why do metals conduct electricity?",opts:["Their ions move","Delocalised electrons move through the structure","They have strong bonds","Their atoms vibrate"],a:1,why:"The delocalised electrons carry charge."},
   {q:"Why is an alloy harder than the pure metal?",opts:["It has more electrons","Different sized atoms distort the layers so they cannot slide easily","Alloys are ionic","The bonds are covalent"],a:1,why:"Distorted layers resist sliding."},
   {q:"Why do pure metals bend easily?",opts:["The layers of atoms can slide over each other","The bonds are weak","They contain no electrons","They are not crystals"],a:0,why:"Regular layers of identical atoms slide past each other."},
   {q:"Why do most metals have high melting points?",opts:["Weak intermolecular forces","Strong metallic bonds need a lot of energy to break","They are small molecules","Their electrons are fixed"],a:1,why:"Strong electrostatic attraction between ions and delocalised electrons."}]),
  B.keypoints(["Metallic bonding: positive ions in a sea of delocalised electrons; strong attraction.","Delocalised electrons carry charge and transfer thermal energy.","Pure metals: layers slide (soft). Alloys: different sized atoms distort layers (harder)."]),
  B.mistakes(["Saying that ions move to carry the current in a metal.","Describing metallic bonding as atoms sharing pairs of electrons (that is covalent).","Saying alloys are harder because they are stronger chemicals."])
 ],onShow:()=>{}});
const C=10, Rr=6;
function init(w,h){ st.E=Array.from({length:60},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60})); }
loop("chem-bo4",dt=>{ const cv=$("#chem-bo4-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.55), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; init(w,h); }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  const alloy=radio("chem-bo4-k")==="alloy", V=radio("chem-bo4-v")==="1", F=+$("#chem-bo4-f").value, sp=w/(C+1), rows=Math.floor(h/sp), r=sp*.36;
  /* top half slides by an amount set by the force; an alloy resists */
  const target=alloy?Math.min(F,30)/30*sp*.18:F/100*sp*2; st.shift+=(target-st.shift)*Math.min(1,dt*4);
  const big=(i,j)=>alloy&&((i*7+j*3)%9===4);
  c.font=Math.round(r*.9)+"px "+css("--f-body"); c.textAlign="center"; c.textBaseline="middle";
  for(let j=0;j<rows;j++) for(let i=-2;i<C+3;i++){ const top=j<rows/2, x=sp*(i+.5)+(top?st.shift:0)+(j%2?0:0), y=sp*(j+.6);
    let rr=r, col="#c9a95c"; if(big(i,j)){ rr=r*1.35; col="#8aa0b8"; }
    const dy=alloy&&!big(i,j)?Math.sin(i*1.7+j)*r*.14:0;
    c.fillStyle=col; c.beginPath(); c.arc(x,y+dy,rr,0,7); c.fill(); c.fillStyle="#222"; c.fillText("+",x,y+dy+1); }
  c.textAlign="left"; c.textBaseline="alphabetic";
  st.E.forEach(e=>{ e.vx+=(V?-90:0)*dt; const s=Math.hypot(e.vx,e.vy), mx=V?130:80; if(s>mx){ e.vx*=mx/s; e.vy*=mx/s; } e.x+=e.vx*dt; e.y+=e.vy*dt;
    if(Math.random()<dt*2){ e.vx+=(Math.random()-.5)*60; e.vy+=(Math.random()-.5)*60; }
    if(e.x<0) e.x+=w; if(e.x>w) e.x-=w; if(e.y<0){e.y=0;e.vy*=-1;} if(e.y>h){e.y=h;e.vy*=-1;}
    c.fillStyle=css("--data"); c.beginPath(); c.arc(e.x,e.y,3,0,7); c.fill(); });
  if(V){ c.fillStyle=css("--ink"); c.font="13px "+css("--f-body"); c.fillText("+ terminal  ←  electrons drift this way  ←  − terminal",12,h-10); }
  set("chem-bo4-f-l",F+"%"); set("chem-bo4-s",alloy?(F>30?"held: layers distorted, cannot slide":"distorted by larger atoms"):(F>0?"top layers slide over the bottom ones":"regular, in rows")); set("chem-bo4-c",V?"flow: a current":"move randomly"); });
})();

/* BO5: states of matter and state symbols */
(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,sl,val,loop}=CH;
const S={water:["Water","H2O",0,100],oxygen:["Oxygen","O2",-218,-183],methane:["Methane","CH4",-182,-162],ethanol:["Ethanol","C2H5OH",-114,78],bromine:["Bromine","Br2",-7,59],mercury:["Mercury","Hg",-39,357],sulfur:["Sulfur","S8",115,445],nacl:["Sodium chloride","NaCl",801,1413],iron:["Iron","Fe",1538,2862]};
const st={P:[],mode:"",t:0};
const stage=`<canvas id="chem-bo5-cv" class="big-anim" aria-label="Particles of the chosen substance at the chosen temperature"></canvas>`;
const panel=field("Substance",sel("chem-bo5-s",Object.entries(S).map(([k,v])=>[k,v[0]]),"water"))+sl("chem-bo5-t","Temperature",-270,3000,1,20,"Temperature in degrees Celsius")+
`<div class="readout"><div><span>Melting point</span><b id="chem-bo5-mp">—</b></div><div><span>Boiling point</span><b id="chem-bo5-bp">—</b></div><div><span>State</span><b id="chem-bo5-st">—</b></div><div><span>Written as</span><b id="chem-bo5-sym">—</b></div></div><div class="btnrow"><button class="btn" id="chem-bo5-rt">Room temperature (20 °C)</button></div>`;
lesson({id:"chem-bo5",group:"b",num:5,lvl:"5.2.2 · Lesson 5",name:"States of matter",icon:"states",
 eyebrow:eb("5.2.2.1–5.2.2.2 The three states of matter and state symbols",5),title:"States of matter and state symbols",
 intro:"Whether a substance is a solid, a liquid or a gas at a given temperature depends on how strong the forces between its particles are. The stronger the forces, the more energy is needed to melt or boil it.",
 outcomes:[["Describe the arrangement and movement of particles in solids, liquids and gases","5.2.2.1"],["Use melting and boiling points to predict the state of a substance at a given temperature","5.2.2.1"],["Explain the limitations of the simple particle model, and use the state symbols (s), (l), (g) and (aq)","5.2.2.1–5.2.2.2"]],
 blocks:[
  B.text("The particle model",`<table class="tbl-mini"><tr><th>State</th><th>Arrangement</th><th>Movement</th></tr><tr><td>Solid (s)</td><td>regular pattern, touching</td><td>vibrate about fixed positions</td></tr><tr><td>Liquid (l)</td><td>random, touching</td><td>move around each other</td></tr><tr><td>Gas (g)</td><td>random, far apart</td><td>move quickly in all directions</td></tr></table><p><b>Melting</b> and <b>freezing</b> happen at the melting point; <b>boiling</b> and <b>condensing</b> at the boiling point. To melt or boil a substance, energy must be transferred to it to overcome the forces between the particles. The amount of energy needed depends on the <b>strength of these forces</b>, which depends on the structure and bonding of the substance.</p>`),
  B.sim("chem-bo5-sim","Solid, liquid or gas?",stage,panel,`<span>Below mp: solid</span><span>Between mp and bp: liquid</span><span>Above bp: gas</span>`),
  B.text("State symbols and the limits of the model",`<p>In equations, <b>state symbols</b> show the state of each substance: <b>(s)</b> solid, <b>(l)</b> liquid, <b>(g)</b> gas and <b>(aq)</b> aqueous, which means dissolved in water.</p><div class="eqn">${f("Mg(s) + 2HCl(aq) -> MgCl2(aq) + H2(g)")}</div><p class="htbox"><span class="ht">Higher</span> The simple particle model has <b>limitations</b>: it shows particles as small, solid, inelastic spheres, but in reality particles are atoms, ions or molecules that are not solid, and the model shows no forces between them. It also does not show the real spacing: gas particles are far further apart than any diagram can show.</p>`),
  B.example("Predicting a state","Ethanol melts at −114 °C and boils at 78 °C. What is its state at 20 °C and at 90 °C?",[
   ["Compare with the melting point","20 °C is above −114 °C, so ethanol is not a solid.",[`20 °C > −114 °C`]],
   ["Compare with the boiling point","20 °C is below 78 °C, so it has not boiled: it is a liquid. At 90 °C it is above its boiling point.",[LAB.W.res("20 °C: liquid (l); 90 °C: gas (g)")]]]),
  B.check([
   {q:"Bromine melts at −7 °C and boils at 59 °C. What is its state at 70 °C?",opts:["Solid","Liquid","Gas","Aqueous"],a:2,why:"70 °C is above the boiling point."},
   {q:"Oxygen melts at −218 °C and boils at −183 °C. What is its state at −200 °C?",opts:["Solid","Liquid","Gas"],a:1,why:"−200 °C lies between −218 °C and −183 °C."},
   {q:"What does the state symbol (aq) mean?",opts:["A liquid","Dissolved in water","A gas","A solid that is acidic"],a:1,why:"Aqueous: in solution in water."},
   {q:"<span class=\"ht\">Higher</span> Which is a limitation of the simple particle model?",opts:["It shows particles moving","It shows no forces between the particles","It shows three states","It shows particles touching in a liquid"],a:1,why:"The model treats particles as solid spheres with no forces between them."},
   {q:"Substance X melts at 801 °C. What does this suggest about the forces between its particles?",opts:["They are very weak","They are strong","There are no forces","They are only present in gases"],a:1,why:"A lot of energy is needed to overcome them."}]),
  B.keypoints(["Solid: regular, vibrating. Liquid: random, touching, moving. Gas: random, far apart, fast.","Below mp: solid. Between mp and bp: liquid. Above bp: gas.","The stronger the forces between particles, the higher the melting and boiling points. State symbols: (s), (l), (g), (aq)."]),
  B.mistakes(["Writing (l) for a solution in water instead of (aq).","Saying particles expand when a substance is heated (the spaces between them increase).","Getting negative temperatures the wrong way round: −200 °C is colder than −183 °C."])
 ],onShow:()=>draw()});
function draw(){ const k=$("#chem-bo5-s").value, s=S[k], T=val("chem-bo5-t"); const mode=T<s[2]?"s":T<s[3]?"l":"g";
  set("chem-bo5-t-l",T+" °C"); set("chem-bo5-mp",s[2]+" °C"); set("chem-bo5-bp",s[3]+" °C"); set("chem-bo5-st",{s:"solid",l:"liquid",g:"gas"}[mode]); set("chem-bo5-sym",f(s[1]+"("+mode+")"));
  if(mode!==st.mode||k!==st.k){ st.mode=mode; st.k=k; st.P=[]; } }
loop("chem-bo5",dt=>{ const cv=$("#chem-bo5-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.5), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; st.P=[]; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  const T=val("chem-bo5-t")+273, r=Math.max(6,w/70), cols=Math.floor(w*.5/(2*r)), rows=Math.floor(h*.55/(2*r)), x0=w/2-cols*r, y0=h-rows*2*r-6;
  if(!st.P.length){ for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) st.P.push({gx:x0+r+i*2*r,gy:y0+r+j*2*r,x:x0+r+i*2*r,y:y0+r+j*2*r,ox:0,oy:0,vx:(Math.random()-.5),vy:(Math.random()-.5)}); }
  const v=Math.sqrt(T)*9;
  st.P.forEach(p=>{
   if(st.mode==="s"){ const a=Math.min(r*.35,.05*Math.sqrt(T)); p.x=p.gx+(Math.random()-.5)*a; p.y=p.gy+(Math.random()-.5)*a; }
   else if(st.mode==="l"){ p.ox+=(Math.random()-.5)*r*.5; p.oy+=(Math.random()-.5)*r*.3; p.ox*=.97; p.oy*=.97; p.ox=Math.max(-r*.45,Math.min(r*.45,p.ox)); p.oy=Math.max(-r*.3,Math.min(r*.3,p.oy)); p.x=p.gx+p.ox+((Math.floor((p.gy-y0)/(2*r))%2)?r*.5:0); p.y=p.gy+p.oy+r*.3; }
   else { if(!p.g){ p.g=1; const a=Math.random()*7; p.vx=Math.cos(a); p.vy=Math.sin(a); } p.x+=p.vx*v*dt; p.y+=p.vy*v*dt; if(p.x<r){p.x=r;p.vx*=-1;} if(p.x>w-r){p.x=w-r;p.vx*=-1;} if(p.y<r){p.y=r;p.vy*=-1;} if(p.y>h-r){p.y=h-r;p.vy*=-1;} }
   c.fillStyle=css("--accent"); c.beginPath(); c.arc(p.x,p.y,r*.78,0,7); c.fill(); });
  c.fillStyle=css("--ink"); c.font="13px "+css("--f-body"); c.fillText(`${S[$("#chem-bo5-s").value][0]} at ${val("chem-bo5-t")} °C`,10,18); });
on();function on(){ ["chem-bo5-s","chem-bo5-t"].forEach(id=>$("#"+id).addEventListener(id==="chem-bo5-s"?"change":"input",draw)); $("#chem-bo5-rt").addEventListener("click",()=>{ $("#chem-bo5-t").value=20; draw(); }); }

lesson({id:"chem-bo6",group:"b",num:6,lvl:"5.2.2 · Lesson 6",name:"Ionic compounds, small molecules and polymers",icon:"cond",
 eyebrow:eb("5.2.2.3–5.2.2.5 Properties of ionic compounds, small molecules and polymers",6),title:"Properties of ionic compounds, small molecules and polymers",
 intro:"The bonding in a substance explains its properties. Ionic compounds have high melting points and conduct only when melted or dissolved. Small molecules generally have low melting points and do not conduct when pure; solutions may conduct if the molecules ionise. Polymers lie in between.",
 outcomes:[["Explain the melting points and electrical conductivity of ionic compounds","5.2.2.3"],["Explain why substances made of small molecules have low melting and boiling points and do not conduct","5.2.2.4"],["Explain why polymers are solids at room temperature","5.2.2.5"]],
 blocks:[
  B.text("Ionic compounds",`<p>Ionic compounds have regular giant lattices with strong electrostatic forces of attraction <b>in all directions</b> between oppositely charged ions. A lot of energy is needed to break these many strong bonds, so ionic compounds have <b>high melting and boiling points</b>.</p><p>They <b>conduct electricity when melted or dissolved</b> in water, because the ions are then free to move and carry the current. In the solid, the ions are fixed in position.</p>`),
  B.text("Small molecules",`<p>Substances made of small molecules, such as ${f("H2O")}, ${f("CO2")} and ${f("Cl2")}, are usually <b>gases or liquids</b> at room temperature with <b>low melting and boiling points</b>.</p><p>The covalent bonds inside each molecule are strong, but the <b>intermolecular forces</b> between molecules are weak. When the substance melts or boils it is these weak intermolecular forces that are overcome, <b>not</b> the covalent bonds. The intermolecular forces increase with the size of the molecules, so larger molecules have higher melting and boiling points.</p><p>They do not conduct electricity because the molecules have no overall electric charge.</p>`),
  B.text("Polymers",`<p>Polymers have very large molecules. The atoms in the polymer molecules are linked to other atoms by strong covalent bonds. The intermolecular forces between polymer molecules are relatively strong (because the molecules are so large), so polymers are <b>solids at room temperature</b>.</p>`),
  B.sim("chem-bo6-sim","Which substances conduct?",stage,panel,`<span>Charged particles must be free to move</span>`),
  B.check([
   {q:"Why does solid sodium chloride not conduct electricity?",opts:["It has no ions","Its ions cannot move","It has no electrons","It is a molecule"],a:1,why:"The ions are fixed in the lattice."},
   {q:"What is overcome when water boils?",opts:["The covalent bonds in the molecules","The weak intermolecular forces between molecules","The ionic bonds","The metallic bonds"],a:1,why:"The molecules stay intact; only the forces between them are overcome."},
   {q:"Pentane (C₅H₁₂) boils at 36 °C. Would decane (C₁₀H₂₂) boil at a higher or lower temperature?",opts:["Higher","Lower","The same"],a:0,why:"Larger molecules have stronger intermolecular forces."},
   {q:"Why do ionic compounds have high melting points?",opts:["Weak forces between molecules","Many strong electrostatic forces in all directions must be overcome","They contain metals","Electrons are delocalised"],a:1,why:"Breaking the lattice needs a lot of energy."},
   {q:"Why are polymers solid at room temperature?",opts:["They are ionic","Their intermolecular forces are relatively strong because the molecules are very large","They have no intermolecular forces","They are giant covalent structures"],a:1,why:"Very large molecules have relatively strong forces between them."}]),
  B.keypoints(["Ionic: high mp and bp; conduct when molten or in solution (ions free to move).","Small molecules: weak intermolecular forces → low mp and bp; do not conduct.","Polymers: very large molecules; relatively strong intermolecular forces → solids at room temperature."]),
  B.mistakes(["Saying covalent bonds break when a simple molecular substance melts.","Saying ionic solutions conduct because electrons move (ions move).","Calling intermolecular forces 'bonds' without saying they are weak forces between molecules."])
 ],onShow:()=>draw()});

<path d="M120 58h120M280 58h120" class="ink" stroke-width="2.2"/><path d="M120 58v40M400 58v40" class="ink" stroke-width="2.2"/>
<path d="M95 98h50M108 112h24" class="ink" stroke-width="3"/><text x="70" y="96" font-size="13">+</text><text x="70" y="118" font-size="13">−</text><path d="M120 112v40h90v${liq?66:76}" class="ink" fill="none" stroke-width="2.2"/><path d="M400 98v54h-90v${liq?66:76}" class="ink" fill="none" stroke-width="2.2"/>
<rect x="202" y="${liq?190:200}" width="16" height="${liq?60:32}" class="fsunk ink" stroke-width="1.5"/><rect x="302" y="${liq?190:200}" width="16" height="${liq?60:32}" class="fsunk ink" stroke-width="1.5"/>${sample}
<text x="260" y="290" text-anchor="middle" font-size="14" font-weight="700">${s[1]}</text><text x="430" y="62" font-size="13">bulb</text><text x="440" y="200" font-size="13">electrodes</text>
${on?`<text x="260" y="116" text-anchor="middle" font-size="13" class="tgd" style="fill:var(--good)">current flows</text>`:`<text x="260" y="116" text-anchor="middle" font-size="13" style="fill:var(--muted)">no current</text>`}`;
  set("chem-bo6-t",s[2]); set("chem-bo6-m",s[4]); set("chem-bo6-b",on?`<span class="pill ok">Lights</span>`:`<span class="pill no">Off</span>`); set("chem-bo6-w",s[5]); }

/* BO7: giant covalent structures and comparing structures */

<script>

(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,set,seg,field,radio,loop}=CH;
const st={a:.5,b:.35,drag:null,k:null,A:[],Bd:[]};
const phi=(1+Math.sqrt(5))/2;
function honey(nx,ny){ const P=[]; for(let i=-nx;i<=nx;i++)for(let j=-ny;j<=ny;j++){ const x=i*Math.sqrt(3)+j*Math.sqrt(3)/2, y=j*1.5; P.push([x,y],[x,y+1]); } return P; }
function bondsBy(A,d){ const B=[]; for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){ const dd=Math.hypot(A[i][0]-A[j][0],A[i][1]-A[j][1],A[i][2]-A[j][2]); if(Math.abs(dd-d)<d*.08) B.push([i,j]); } return B; }
const BUILD={
 diamond(){ const A=[], base=[[0,0,0],[0,.5,.5],[.5,0,.5],[.5,.5,0]]; for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++) base.forEach(([x,y,z])=>{ [[x,y,z],[x+.25,y+.25,z+.25]].forEach(([p,q,r])=>A.push([p+i,q+j,r+k])); });
   [[2,0,0],[0,2,0],[0,0,2],[2,2,0],[2,0,2],[0,2,2],[2,2,2],[2,1,1],[1,2,1],[1,1,2],[2,.5,.5],[2,1.5,1.5],[2,.5,1.5],[2,1.5,.5],[.5,2,.5],[1.5,2,1.5],[.5,2,1.5],[1.5,2,.5],[.5,.5,2],[1.5,1.5,2],[.5,1.5,2],[1.5,.5,2],[2,0,1],[2,1,0],[0,2,1],[1,2,0],[0,1,2],[1,0,2],[2,2,1],[2,1,2],[1,2,2]].forEach(p=>A.push(p));
   const U=[]; A.forEach(p=>{ if(p.every(v=>v<=2.01)&&!U.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])<.01)) U.push(p); });
   const s=1/(Math.sqrt(3)/4); const C=U.map(p=>p.map(v=>(v-1)*s)); return {A:C,B:bondsBy(C,1),sc:.105}; },
 graphite(){ const A=[]; [-1,0,1].forEach((L,li)=>{ honey(3,3).forEach(([x,y])=>{ const yy=y+(li%2?1:0); if(Math.hypot(x,yy)<4.3) A.push([x,L*2.4,yy]); }); }); return {A,B:bondsBy(A,1),sc:.11,layers:true}; },
 graphene(){ const A=[]; honey(5,5).forEach(([x,y])=>{ if(Math.hypot(x,y)<5.6) A.push([x,0,y]); }); return {A,B:bondsBy(A,1),sc:.085}; },
 c60(){ const A=[], sgn=[1,-1]; const perm=([a,b,c])=>[[a,b,c],[b,c,a],[c,a,b]];
