   seeds.forEach(sd=>{ sgn.forEach(s1=>sgn.forEach(s2=>sgn.forEach(s3=>{ const v=[sd[0]*s1,sd[1]*s2,sd[2]*s3]; perm(v).forEach(p=>{ if(!A.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])<.01)) A.push(p); }); }))); });
   const C=A.map(p=>p.map(v=>v/2)); return {A:C,B:bondsBy(C,1),sc:.12}; },
 tube(){ const n=9, Cc=n*Math.sqrt(3), R=Cc/(2*Math.PI), A2=[]; for(let i=0;i<n;i++)for(let j=-5;j<=5;j++){ const x=i*Math.sqrt(3)+(j%2?Math.sqrt(3)/2:0), y=j*1.5; A2.push([x,y],[x,y+1]); }
   const A=A2.map(([x,y])=>[R*Math.cos(2*Math.PI*x/Cc),y,R*Math.sin(2*Math.PI*x/Cc)]); const B=[];
   for(let i=0;i<A2.length;i++)for(let j=i+1;j<A2.length;j++){ let dx=Math.abs(A2[i][0]-A2[j][0]); dx=Math.min(dx,Cc-dx); if(Math.abs(Math.hypot(dx,A2[i][1]-A2[j][1])-1)<.08) B.push([i,j]); } return {A,B,sc:.085}; }};
function prune(m){ const deg=m.A.map(()=>0); m.B.forEach(([i,j])=>{deg[i]++;deg[j]++;}); const map=[], A=[]; m.A.forEach((p,i)=>{ if(deg[i]>1||(deg[i]===1&&m.A.length<70)){ map[i]=A.length; A.push(p); } }); m.B=m.B.filter(([i,j])=>map[i]!=null&&map[j]!=null).map(([i,j])=>[map[i],map[j]]); m.A=A; return m; }
const INFO={
 diamond:["Diamond","Each carbon atom forms <b>four</b> covalent bonds with other carbon atoms in a giant covalent structure.",["Very hard: used in cutting tools","Very high melting point","Does not conduct electricity: no delocalised electrons"]],

 eyebrow:eb("5.2.3 Structure and bonding of carbon",8),title:"Diamond, graphite, graphene and fullerenes",

 blocks:[

loop("chem-bo8",()=>{ const cv=$("#chem-bo8-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.62), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }

    const deg=st.m.A.map(()=>0); st.m.B.forEach(([i,j])=>{deg[i]++;deg[j]++;}); set("chem-bo8-n",st.m.A.length); set("chem-bo8-bpa",{diamond:"4 (inside the crystal)",graphite:"3",graphene:"3",c60:"3",tube:"3"}[k]); }

  const zmin=Math.min(...Q.map(q=>q.Z)), zmax=Math.max(...Q.map(q=>q.Z)), sh=z=>.35+.65*(1-(z-zmin)/((zmax-zmin)||1));
  const edges=st.m.B.map(([i,j])=>({i,j,z:(Q[i].Z+Q[j].Z)/2})).sort((a,b)=>b.z-a.z);
  const items=[...edges.map(e=>({t:"b",z:e.z+.001,e})),...Q.map((q,i)=>({t:"a",z:q.Z,q}))].sort((a,b)=>b.z-a.z);

    else { const q=it.q, r=s*.2*q.k; c.globalAlpha=sh(q.Z); const g=c.createRadialGradient(q.X-r*.3,q.Y-r*.3,r*.1,q.X,q.Y,r); g.addColorStop(0,"#8a8a8a"); g.addColorStop(1,"#222"); c.fillStyle=g; c.beginPath(); c.arc(q.X,q.Y,r,0,7); c.fill(); } });
  c.globalAlpha=1;

<script>
LEARN.unit="chem-quant";

/* QC1: conservation of mass and relative formula mass */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,Mr,mrWork,parse,bySym}=CH, {res}=LAB.W;
const PRE=["H2O","CO2","NaCl","MgO","CaCO3","H2SO4","NaOH","Ca(OH)2","Al2(SO4)3","C6H12O6","NH4NO3","CuSO4"];
const stage=`<div style="padding:14px"><div id="chem-qc1-f" class="eqn" style="font-size:1.6rem;margin-bottom:8px"></div><div id="chem-qc1-t"></div><div id="chem-qc1-w" class="eqbox" style="margin-top:10px"></div></div>`;
const panel=`<div class="field"><div class="lbl">Type a formula</div><input type="text" id="chem-qc1-in" value="CaCO3" autocomplete="off" spellcheck="false" aria-label="Chemical formula"></div><div class="field"><div class="lbl">Or choose one</div><div class="btnrow" id="chem-qc1-pre" style="flex-wrap:wrap">${PRE.map(p=>`<button class="btn" data-chem-qc1="${p}">${f(p)}</button>`).join("")}</div></div><div class="readout"><div><span>Relative formula mass</span><b id="chem-qc1-mr">—</b></div><div><span>Atoms in formula</span><b id="chem-qc1-n">—</b></div></div><p class="note">Use capital letters correctly: Co is cobalt, CO is carbon monoxide. Brackets work: Ca(OH)2.</p>`;
lesson({id:"chem-qc1",group:"a",num:1,lvl:"5.3.1 · Lesson 1",name:"Conservation of mass and relative formula mass",icon:"mr",
 eyebrow:eb("5.3.1.1–5.3.1.2 Conservation of mass and relative formula mass",1),title:"Conservation of mass and relative formula mass",
 intro:"Atoms are never created or destroyed in a chemical reaction, so the total mass of the products always equals the total mass of the reactants. Relative formula masses let you check this with numbers.",
 outcomes:[["State the law of conservation of mass and use it to explain balanced equations","5.3.1.1"],["Calculate the relative formula mass, M<sub>r</sub>, of a substance from its formula","5.3.1.2"],["Show that the total M<sub>r</sub> of the reactants equals the total M<sub>r</sub> of the products in a balanced equation","5.3.1.2"]],
 blocks:[
  B.text("Conservation of mass",`<p>The <b>law of conservation of mass</b> states that no atoms are lost or made during a chemical reaction, so the <b>mass of the products equals the mass of the reactants</b>. This is why chemical reactions can be represented by balanced symbol equations.</p>`),
  B.text("Relative formula mass",`<p>The <b>relative formula mass</b> (M<sub>r</sub>) of a compound is the sum of the relative atomic masses (A<sub>r</sub>) of the atoms in the numbers shown in the formula. It has no units.</p>`+B.eq(`M<sub>r</sub> of ${f("H2O")} = (2 × 1) + 16 = 18`,`M<sub>r</sub> of ${f("Ca(OH)2")} = 40 + 2 × (16 + 1) = 74`)+`<p>In a balanced equation, the sum of the M<sub>r</sub> values of the reactants (multiplied by their numbers) equals the sum for the products:</p>`+B.eq(`${f("2Mg + O2 -> 2MgO")}`,`(2 × 24) + (2 × 16) = 80 → 2 × (24 + 16) = 80 ✓`)),
  B.sim("chem-qc1-sim","Relative formula mass calculator",stage,panel,`<span>A<sub>r</sub> values from the periodic table</span>`),
  B.example("M<sub>r</sub> with brackets","Calculate the relative formula mass of aluminium sulfate, Al₂(SO₄)₃. (A<sub>r</sub>: Al 27, S 32, O 16)",[
   ["Count the atoms","Everything in the bracket is multiplied by 3.",[`Al: 2 · S: 3 · O: 4 × 3 = 12`]],
   ["Add up the A<sub>r</sub> values","",[`(2 × 27) + (3 × 32) + (12 × 16) = 54 + 96 + 192`]],
   ["Total","",[res("M<sub>r</sub> = 342")]]]),
  B.check([
   {q:"Calculate the M<sub>r</sub> of carbon dioxide, CO₂. (C 12, O 16)",a:44,unit:"",tol:0,why:"12 + (2 × 16) = 44."},
   {q:"Calculate the M<sub>r</sub> of sulfuric acid, H₂SO₄. (H 1, S 32, O 16)",a:98,unit:"",tol:0,why:"2 + 32 + 64 = 98."},
   {q:"Calculate the M<sub>r</sub> of magnesium hydroxide, Mg(OH)₂. (Mg 24, O 16, H 1)",a:58,unit:"",tol:0,why:"24 + 2 × (16 + 1) = 58."},
   {q:"12 g of carbon burns completely in 32 g of oxygen. What mass of carbon dioxide forms?",a:44,unit:"g",tol:0,why:"Mass is conserved: 12 + 32 = 44 g."},
   {q:"What are the units of relative formula mass?",opts:["g","g/mol","It has no units","mol"],a:2,why:"It is a ratio compared with the mass of a carbon-12 atom."}]),
  B.keypoints(["Mass of products = mass of reactants: atoms are conserved.","M<sub>r</sub> = sum of A<sub>r</sub> values of all atoms in the formula; no units.","Total M<sub>r</sub> of reactants = total M<sub>r</sub> of products in a balanced equation."]),
  B.mistakes(["Multiplying only the first atom inside a bracket: Ca(OH)₂ has 2 O and 2 H.","Forgetting the big number in front of a formula when comparing totals.","Using atomic numbers instead of relative atomic masses."])
 ],onShow:()=>draw()});
function draw(){ const s=$("#chem-qc1-in").value.trim().replace(/\s+/g,""); const c=parse(s), ok=s&&/^[A-Za-z0-9()\[\]]+$/.test(s)&&Object.keys(c).length&&Object.keys(c).every(k=>bySym[k]);
  $("#chem-qc1-f").innerHTML=s?f(s):"&nbsp;";
  if(!ok){ $("#chem-qc1-t").innerHTML=`<p class="muted">${s?"That formula contains a symbol that is not an element. Check the capital letters.":"Type a formula."}</p>`; $("#chem-qc1-w").innerHTML=""; set("chem-qc1-mr","—"); set("chem-qc1-n","—"); return; }
  $("#chem-qc1-t").innerHTML=`<table class="tally"><tr><th>Element</th>${Object.keys(c).map(k=>`<th>${k}</th>`).join("")}</tr><tr><td>Atoms</td>${Object.values(c).map(n=>`<td>${n}</td>`).join("")}</tr><tr><td>A<sub>r</sub></td>${Object.keys(c).map(k=>`<td>${bySym[k].Ar}</td>`).join("")}</tr></table>`;
  $("#chem-qc1-w").innerHTML=`<div>M<sub>r</sub> = ${mrWork(s)}</div>`; set("chem-qc1-mr",Mr(s)); set("chem-qc1-n",Object.values(c).reduce((a,b)=>a+b,0)); }
$("#chem-qc1-in").addEventListener("input",draw);
$("#chem-qc1-pre").addEventListener("click",e=>{ const b=e.target.closest("[data-chem-qc1]"); if(!b) return; $("#chem-qc1-in").value=b.dataset.chem-qc1; draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-quant";

/* QC2: mass changes when a reactant or product is a gas; uncertainty */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,loop}=CH, {res,fr}=LAB.W;
const R=[
 {n:"Magnesium burning in an open crucible",eq:"2Mg(s) + O2(g) -> 2MgO(s)",m0:27.40,dm:+1.60,open:true,why:"Oxygen atoms from the air join the magnesium. They were not on the balance at the start, so the mass increases."},
 {n:"Heating calcium carbonate",eq:"CaCO3(s) -> CaO(s) + CO2(g)",m0:30.00,dm:-4.40,open:true,why:"Carbon dioxide gas escapes into the air, so the mass on the balance decreases."},
 {n:"Marble chips and acid, open flask",eq:"CaCO3(s) + 2HCl(aq) -> CaCl2(aq) + H2O(l) + CO2(g)",m0:152.30,dm:-0.88,open:true,why:"Carbon dioxide escapes from the open flask, so the mass decreases."},
 {n:"Marble chips and acid, sealed with a balloon",eq:"CaCO3(s) + 2HCl(aq) -> CaCl2(aq) + H2O(l) + CO2(g)",m0:154.10,dm:0,open:false,why:"The gas is trapped in the balloon, so nothing leaves the system: the mass stays the same. Mass is conserved."},
 {n:"Precipitation in a flask",eq:"BaCl2(aq) + Na2SO4(aq) -> BaSO4(s) + 2NaCl(aq)",m0:96.75,dm:0,open:false,why:"No gas is involved and nothing enters or leaves: the mass does not change."}];
const st={t:0,run:false};
const stage=`<svg id="chem-qc2-svg" class="chsvg" viewBox="0 0 560 300" role="img" aria-label="Reaction on a balance"></svg>`;
const panel=field("Reaction",sel("chem-qc2-r",R.map((r,i)=>[String(i),r.n]),"0"))+`<div class="btnrow"><button class="btn primary" id="chem-qc2-go">Start the reaction</button><button class="btn" id="chem-qc2-re">Reset</button></div>${CH.ro([["chem-qc2-a","Start mass"],["chem-qc2-b","Mass now"],["chem-qc2-c","Change"]])}<p class="note" id="chem-qc2-w"></p>`;
lesson({id:"chem-qc2",group:"a",num:2,lvl:"5.3.1 · Lesson 2",name:"Mass changes and uncertainty",icon:"mass",
 eyebrow:eb("5.3.1.3–5.3.1.4 Mass changes when a reactant or product is a gas; chemical measurements",2),title:"Mass changes and uncertainty in measurements",
 intro:"Some reactions seem to break the law of conservation of mass: the reading on the balance goes up or down. The explanation is always a gas entering or leaving the container.",
 outcomes:[["Explain observed changes of mass in non-enclosed systems using the particle model","5.3.1.3"],["Recognise that every measurement has some uncertainty","5.3.1.4"],["Estimate uncertainty from the range of repeat results, using a mean","5.3.1.4"]],
 blocks:[
  B.text("Apparent mass changes",`<p>If a reaction happens in an open container:</p><ul><li>the mass may <b>increase</b> if one of the reactants is a gas taken from the air, such as oxygen when a metal is heated;</li><li>the mass may <b>decrease</b> if one of the products is a gas that escapes, such as carbon dioxide when a carbonate reacts or is heated.</li></ul><p>In a closed (sealed) system nothing enters or leaves, so the total mass stays the same.</p>`),
  B.sim("chem-qc2-sim","Watch the balance",stage,panel,`<span>Open system: gases can enter or leave</span><span>Closed system: mass constant</span>`),
  B.text("Uncertainty",`<p>Whenever a measurement is made there is always some <b>uncertainty</b> about the result obtained. Repeating a measurement gives a spread of values. The <b>mean</b> is the best estimate of the true value, and the uncertainty can be estimated as <b>half the range</b>:</p>`+B.eq(`uncertainty = ± ${fr("range","2")} = ± ${fr("highest − lowest","2")}`)),
  B.example("Mean and uncertainty","A student times how long a reaction takes three times: 41 s, 44 s and 47 s. Give the mean with its uncertainty.",[
   ["Mean","",[`${fr("41 + 44 + 47","3")} = 44 s`]],
   ["Range","",[`47 − 41 = 6 s`]],
   ["Uncertainty = half the range","",[res("44 ± 3 s")]]]),
  B.check([
   {q:"When zinc carbonate is heated in an open tube, the mass decreases. Why?",opts:["Atoms are destroyed","Carbon dioxide gas escapes","Zinc evaporates","Oxygen is added"],a:1,why:"ZnCO₃ → ZnO + CO₂; the gas leaves the tube."},
   {q:"When copper is heated in air, the mass of the solid increases. Why?",opts:["Copper atoms gain mass","Oxygen from the air combines with the copper","Water is absorbed","The balance is faulty"],a:1,why:"2Cu + O₂ → 2CuO."},
   {q:"Readings: 2.48 g, 2.52 g, 2.50 g. Calculate the mean, in g.",a:2.5,unit:"g",tol:0.0001,why:"(2.48 + 2.52 + 2.50) ÷ 3 = 2.50 g."},
   {q:"Using the same readings, what is the uncertainty in g? (give the number after ±)",a:0.02,unit:"g",tol:0.0001,why:"Range 2.52 − 2.48 = 0.04 g; half is 0.02 g."},
   {q:"12.0 g of calcium carbonate is heated and 5.28 g of carbon dioxide escapes. What mass of solid is left, in g?",a:6.72,unit:"g",tol:0.001,why:"12.0 − 5.28 = 6.72 g of calcium oxide."}]),
  B.keypoints(["Mass increases in an open container if a gas from the air reacts.","Mass decreases if a gas product escapes.","Uncertainty ≈ half the range of repeat readings, about the mean."]),
  B.mistakes(["Saying mass is not conserved: it is, but a gas has entered or left.","Including an anomalous result when calculating the mean.","Giving the whole range as the uncertainty instead of half of it."])
 ],onShow:()=>{ st.t=0; st.run=false; draw(); }});
function draw(){ const r=R[+$("#chem-qc2-r").value], p=Math.min(1,st.t), m=r.m0+r.dm*(1-Math.pow(1-p,2.2));
  const op=r.open, fl=/flask|acid|Precip/.test(r.n);
  let g=`<rect x="140" y="236" width="280" height="44" rx="6" class="fsunk ink" stroke-width="2"/><rect x="250" y="248" width="120" height="24" rx="3" fill="#0d2416"/><text x="360" y="266" text-anchor="end" font-size="18" style="fill:#5df08b;font-family:var(--f-mono)">${m.toFixed(2)} g</text><path d="M170 236h220" class="ink" stroke-width="3"/>`;
  if(fl){ g+=`<path d="M262 120h36v40l40 70h-116l40-70z" class="ink" fill="none" stroke-width="2.2"/><path d="M236 206h88l14 24h-116z" fill="${/Precip/.test(r.n)?(p>.05?"#e9eef2":"#9cc8e8"):"#9cc8e8"}" opacity=".75"/>`;
    if(!/Precip/.test(r.n)) for(let i=0;i<5;i++) g+=`<rect x="${252+i*13}" y="${220-((i%2)*6)}" width="10" height="8" rx="2" fill="#ddd" opacity="${Math.max(.2,1-p*.6)}"/>`;
    if(!op){ const b=/balloon/.test(r.n); g+=b?`<ellipse cx="280" cy="${100-p*16}" rx="${14+p*22}" ry="${16+p*26}" fill="#e05252" opacity=".75"/><rect x="270" y="112" width="20" height="10" fill="#e05252"/>`:`<rect x="258" y="108" width="44" height="14" rx="3" class="fmut"/>`; }
    if(op&&st.run&&p<1) for(let i=0;i<6;i++){ const y=110-((st.t*120+i*25)%90); g+=`<circle cx="${270+((i*17)%22)}" cy="${y}" r="3" class="fmut" opacity=".7"/>`; } }
  else { g+=`<path d="M235 190h90l-10 46h-70z" class="ink" fill="#c9c3b7" stroke-width="2"/><path d="M248 196h64" stroke="${p>0?"#f2f2f2":"#9aa4ad"}" stroke-width="10"/>`;
    if(st.run&&p<1) g+=`<path d="M280 186c-14-18-4-30 0-42c4 12 14 24 0 42z" fill="#f6f2c4" opacity=".9"/>`;
    if(r.dm>0) g+=`<text x="430" y="120" font-size="13">O<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> from the air</tspan></text><path d="M430 126l-110 70" class="mut" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    else g+=`<text x="410" y="120" font-size="13">CO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> escapes</tspan></text>`; }
  g+=`<text x="280" y="24" text-anchor="middle" font-size="14">${CH.u(r.eq)}</text>`;
  $("#chem-qc2-svg").innerHTML=g;
  set("chem-qc2-a",r.m0.toFixed(2)+" g"); set("chem-qc2-b",m.toFixed(2)+" g"); const d=m-r.m0; set("chem-qc2-c",(d>0.004?"+":d<-0.004?"−":"")+Math.abs(d).toFixed(2)+" g"); set("chem-qc2-w",p>=1?r.why:"Press Start, then watch the reading."); }
loop("chem-qc2",dt=>{ if(st.run&&st.t<1){ st.t+=dt/5; draw(); } });
$("#chem-qc2-go").addEventListener("click",()=>{ st.t=0; st.run=true; });
$("#chem-qc2-re").addEventListener("click",()=>{ st.t=0; st.run=false; draw(); });
$("#chem-qc2-r").addEventListener("change",()=>{ st.t=0; st.run=false; draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-quant";

/* QC3: moles (HT) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,sl,val,Mr}=CH, {res,fr}=LAB.W;
const SUB=["C","H2O","CO2","NaCl","Mg","O2","CaCO3","Fe","C6H12O6","NH3"];
const sup=n=>CH.sci(n);
const stage=`<div style="padding:14px"><div id="chem-qc3-dots" style="display:flex;flex-wrap:wrap;gap:3px;min-height:90px;align-content:flex-start"></div><div id="chem-qc3-w" class="eqbox" style="margin-top:12px"></div></div>`;
const panel=field("Substance",sel("chem-qc3-s",SUB.map(s=>[s,CH.u(s)]),"H2O"))+sl("chem-qc3-m","Mass",1,200,1,36,"Mass in grams")+CH.ro([["chem-qc3-mr","Relative formula mass"],["chem-qc3-n","Amount"],["chem-qc3-p","Particles"]])+`<p class="note">Each dot is 0.1 mol (6.02 × 10²² particles).</p>`;
lesson({id:"chem-qc3",group:"b",num:3,lvl:"5.3.2 · Lesson 3",name:"Moles",icon:"mole",tag:"Higher tier",
 eyebrow:eb("5.3.2.1 Moles (HT only)",3),title:"Moles and Avogadro's constant",
 intro:"Atoms are far too small to count, so chemists count them in packs: one mole is 6.02 × 10²³ particles. The clever part is that one mole of any substance has a mass in grams equal to its relative formula mass.",
 outcomes:[["Recall that chemical amounts are measured in moles, with the symbol mol","5.3.2.1"],["Use the Avogadro constant, 6.02 × 10²³ per mole","5.3.2.1"],["Calculate moles from mass and M<sub>r</sub>, and mass from moles","5.3.2.1"]],
 blocks:[
  B.text("What is a mole?",`<p>Chemical amounts are measured in <b>moles</b> (symbol <b>mol</b>). The mass of one mole of a substance in grams is numerically equal to its relative formula mass: one mole of water (M<sub>r</sub> 18) has a mass of 18 g, and one mole of carbon (A<sub>r</sub> 12) has a mass of 12 g.</p><p>One mole of a substance contains the same number of particles (atoms, molecules or ions) as one mole of any other substance. This number is the <b>Avogadro constant</b>: <b>6.02 × 10²³ per mole</b>.</p>`+B.eq(`number of moles = ${fr("mass (g)","M<sub>r</sub>")}`,`number of particles = moles × 6.02 × 10²³`)),
  B.sim("chem-qc3-sim","Mass, moles and particles",stage,panel,`<span>n = m ÷ M<sub>r</sub></span>`),
  B.example("Moles to mass","What is the mass of 0.25 mol of calcium carbonate, CaCO₃? (Ca 40, C 12, O 16)",[
   ["M<sub>r</sub>","",[`40 + 12 + (3 × 16) = 100`]],
   ["Rearrange: mass = moles × M<sub>r</sub>","",[`0.25 × 100 = ${res("25 g")}`]]]),
  B.example("Counting particles","How many molecules are in 4.4 g of carbon dioxide (M<sub>r</sub> 44)?",[
   ["Moles","",[`${fr("4.4","44")} = 0.10 mol`]],
   ["Particles","",[`0.10 × 6.02 × 10²³ = ${res("6.02 × 10²² molecules")}`]]]),
  B.check([
   {q:"How many moles are in 11 g of carbon dioxide, CO₂? (M<sub>r</sub> 44)",a:0.25,unit:"mol",tol:0.0001,why:"11 ÷ 44 = 0.25 mol."},
   {q:"What is the mass of 0.5 mol of sodium hydroxide, NaOH? (Na 23, O 16, H 1)",a:20,unit:"g",tol:0.0001,why:"M<sub>r</sub> = 40; 0.5 × 40 = 20 g."},
   {q:"How many moles of magnesium atoms are in 6 g of magnesium? (A<sub>r</sub> 24)",a:0.25,unit:"mol",tol:0.0001,why:"6 ÷ 24 = 0.25 mol."},
   {q:"How many molecules are in 9 g of water (M<sub>r</sub> 18)?",opts:["3.01 × 10²³","6.02 × 10²³","1.08 × 10²⁵","9 × 10²³"],a:0,why:"9 ÷ 18 = 0.5 mol; 0.5 × 6.02 × 10²³ = 3.01 × 10²³."},
   {q:"Which contains the most atoms?",opts:["1 mol of He","1 mol of O₂","1 mol of H₂O","1 mol of CH₄"],a:3,why:"Each CH₄ molecule has 5 atoms, so 5 mol of atoms."}]),
  B.keypoints(["1 mol = 6.02 × 10²³ particles (Avogadro constant).","Mass of 1 mol in g = M<sub>r</sub>.","moles = mass ÷ M<sub>r</sub>; mass = moles × M<sub>r</sub>."]),
  B.mistakes(["Dividing M<sub>r</sub> by the mass instead of mass by M<sub>r</sub>.","Using the A<sub>r</sub> of oxygen (16) for oxygen gas, O₂ (M<sub>r</sub> 32).","Forgetting to say which particles: 1 mol of O₂ contains 2 mol of O atoms."])
 ],onShow:()=>draw()});
function draw(){ const s=$("#chem-qc3-s").value, m=val("chem-qc3-m"), M=Mr(s), n=m/M, k=Math.min(400,Math.round(n*10));
  $("#chem-qc3-dots").innerHTML=Array.from({length:k},()=>`<i style="width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block"></i>`).join("")+(n*10>400?`<span class="muted"> … (more than 40 mol)</span>`:"");
  $("#chem-qc3-w").innerHTML=`<div>moles = ${fr(m+" g",M)} = ${+n.toPrecision(3)} mol</div><div>particles = ${+n.toPrecision(3)} × 6.02 × 10²³ = ${sup(n*6.02e23)}</div>`;
  set("chem-qc3-m-l",m+" g"); set("chem-qc3-mr",M); set("chem-qc3-n",+n.toPrecision(3)+" mol"); set("chem-qc3-p",sup(n*6.02e23)); }
["chem-qc3-s","chem-qc3-m"].forEach(id=>$("#"+id).addEventListener(id==="chem-qc3-s"?"change":"input",draw));
$("#chem-qc3-s").addEventListener("change",()=>{ $("#chem-qc3-m").value=Math.min(200,Math.max(1,Math.round(Mr($("#chem-qc3-s").value)))); draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-quant";

/* QC4: reacting masses and limiting reactants (HT) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field,sl,val,Mr}=CH, {res,fr}=LAB.W;
const RX=[
 {n:"Magnesium + oxygen",A:["Mg",2],B:["O2",1],P:["MgO",2],ma:[1,30,12],mb:[1,30,8]},
 {n:"Sodium + chlorine",A:["Na",2],B:["Cl2",1],P:["NaCl",2],ma:[1,50,23],mb:[1,80,35]},
 {n:"Aluminium + iron(III) oxide (thermite)",A:["Al",2],B:["Fe2O3",1],P:["Fe",2],ma:[1,60,27],mb:[1,200,80],eq:"2Al + Fe2O3 -> Al2O3 + 2Fe"},
 {n:"Nitrogen + hydrogen",A:["N2",1],B:["H2",3],P:["NH3",2],ma:[1,60,28],mb:[1,20,6]},
 {n:"Methane + oxygen",A:["CH4",1],B:["O2",2],P:["CO2",1],ma:[1,40,16],mb:[1,100,64],eq:"CH4 + 2O2 -> CO2 + 2H2O"}];
const eqOf=r=>r.eq||`${r.A[1]>1?r.A[1]:""}${r.A[0]} + ${r.B[1]>1?r.B[1]:""}${r.B[0]} -> ${r.P[1]>1?r.P[1]:""}${r.P[0]}`;
const stage=`<div style="padding:14px"><div id="chem-qc4-eq" class="eqn" style="margin-bottom:10px"></div><svg id="chem-qc4-svg" class="chsvg" viewBox="0 0 560 170" role="img" aria-label="Moles of each reactant available and used"></svg><div id="chem-qc4-w" class="eqbox"></div></div>`;
const panel=field("Reaction",sel("chem-qc4-r",RX.map((r,i)=>[String(i),r.n]),"0"))+sl("chem-qc4-a","Mass of first reactant",1,30,1,12)+sl("chem-qc4-b","Mass of second reactant",1,30,1,8)+CH.ro([["chem-qc4-l","Limiting reactant"],["chem-qc4-x","In excess"],["chem-qc4-p","Maximum mass of product"]]);
lesson({id:"chem-qc4",group:"b",num:4,lvl:"5.3.2 · Lesson 4",name:"Reacting masses and limiting reactants",icon:"limit",tag:"Higher tier",
 eyebrow:eb("5.3.2.2–5.3.2.4 Amounts in equations; balancing from masses; limiting reactants (HT only)",4),title:"Reacting masses and limiting reactants",
 intro:"A balanced equation tells you the ratio of moles that react. Turn masses into moles, use the ratio, then turn moles back into masses. When one reactant runs out first, it limits how much product can form.",
 outcomes:[["Calculate the masses of reactants and products from a balanced equation","5.3.2.2"],["Use reacting masses to balance an equation","5.3.2.3"],["Identify the limiting reactant and explain its effect on the amount of product","5.3.2.4"]],
 blocks:[
  B.text("Three-step method",`<p>The balancing numbers in a symbol equation give the <b>number of moles</b> of each substance that react or form.</p><ol><li>Work out the moles of the substance you know: n = mass ÷ M<sub>r</sub>.</li><li>Use the ratio from the equation to find moles of the substance you want.</li><li>Convert back to mass: mass = n × M<sub>r</sub>.</li></ol><p>In a reaction with two reactants, it is usual to use an <b>excess</b> of one of them so that all of the other reacts. The reactant that is completely used up is the <b>limiting reactant</b>, because it limits the amount of products.</p>`),
  B.sim("chem-qc4-sim","Which reactant runs out?",stage,panel,`<span>Mass → moles → ratio → moles → mass</span>`),
  B.example("Reacting masses","Calculate the mass of magnesium oxide formed when 6.0 g of magnesium burns completely. 2Mg + O₂ → 2MgO (Mg 24, O 16)",[
   ["Moles of Mg","",[`${fr("6.0","24")} = 0.25 mol`]],
   ["Ratio Mg : MgO = 2 : 2 = 1 : 1","",[`0.25 mol MgO`]],
   ["Mass of MgO (M<sub>r</sub> 40)","",[`0.25 × 40 = ${res("10 g")}`]]]),
  B.example("Balancing from masses","8.0 g of methane (CH₄) reacts with 32 g of oxygen (O₂) to form 22 g of carbon dioxide and 18 g of water. Use these masses to balance the equation.",[
   ["Moles of each","",[`CH₄: ${fr("8.0","16")} = 0.5 · O₂: ${fr("32","32")} = 1 · CO₂: ${fr("22","44")} = 0.5 · H₂O: ${fr("18","18")} = 1`]],
   ["Divide by the smallest (0.5)","",[`1 : 2 : 1 : 2`]],
   ["Equation","",[res(f("CH4 + 2O2 -> CO2 + 2H2O"))]]]),
  B.check([
   {q:"What mass of water forms when 4 g of hydrogen burns? 2H₂ + O₂ → 2H₂O (H 1, O 16)",a:36,unit:"g",tol:0.0001,why:"4 ÷ 2 = 2 mol H₂ → 2 mol H₂O → 2 × 18 = 36 g."},
   {q:"What mass of calcium oxide forms when 50 g of calcium carbonate is heated? CaCO₃ → CaO + CO₂ (Ca 40, C 12, O 16)",a:28,unit:"g",tol:0.0001,why:"50 ÷ 100 = 0.5 mol → 0.5 × 56 = 28 g."},
   {q:"4.8 g of magnesium (0.2 mol) reacts with 0.15 mol of oxygen. 2Mg + O₂ → 2MgO. Which is the limiting reactant?",opts:["Magnesium","Oxygen","Neither","Magnesium oxide"],a:0,why:"0.2 mol Mg needs only 0.1 mol O₂; oxygen is in excess."},
   {q:"In the reaction above, what mass of MgO forms? (M<sub>r</sub> 40)",a:8,unit:"g",tol:0.0001,why:"0.2 mol Mg → 0.2 mol MgO → 8.0 g."},
   {q:"Why is one reactant often used in excess?",opts:["To slow the reaction","To make sure all of the other (often more expensive) reactant reacts","To make the product purer","Because it is a catalyst"],a:1,why:"Then the limiting reactant is completely used up."}]),
  B.keypoints(["Balancing numbers give the mole ratio.","mass → moles (÷ M<sub>r</sub>) → ratio → moles → mass (× M<sub>r</sub>).","The limiting reactant is used up first; the amount of product is proportional to it."]),
  B.mistakes(["Using the mass ratio instead of the mole ratio.","Forgetting the balancing number: 2 mol Mg gives 2 mol MgO, not 1.","Choosing the reactant with the smaller mass as limiting without converting to moles."])
 ],onShow:()=>{ setup(); }});
function setup(){ const r=RX[+$("#chem-qc4-r").value]; [["chem-qc4-a",r.ma,r.A[0]],["chem-qc4-b",r.mb,r.B[0]]].forEach(([id,[a,b,c],s])=>{ const e=$("#"+id); e.min=a; e.max=b; e.value=c; e.closest(".field").querySelector(".lbl").firstChild.textContent=`Mass of ${s} `; }); draw(); }
function draw(){ const r=RX[+$("#chem-qc4-r").value], ma=val("chem-qc4-a"), mb=val("chem-qc4-b"), Ma=Mr(r.A[0]), Mb=Mr(r.B[0]), Mp=Mr(r.P[0]);
  const na=ma/Ma, nb=mb/Mb, ka=na/r.A[1], kb=nb/r.B[1], lim=ka<=kb?"A":"B", k=Math.min(ka,kb), ua=k*r.A[1], ub=k*r.B[1], np=k*r.P[1], mp=np*Mp;
  const p=x=>+x.toPrecision(3);
  $("#chem-qc4-eq").innerHTML=f(eqOf(r));
  const mx=Math.max(na,nb)*1.1, W=270, bar=(y,lab,n,u,col)=>`<text x="10" y="${y+16}" font-size="13">${lab}</text><rect x="150" y="${y}" width="${W*n/mx}" height="22" fill="${col}" opacity=".25" stroke="${col}"/><rect x="150" y="${y}" width="${W*u/mx}" height="22" fill="${col}" opacity=".85"/><text x="${150+W*n/mx+6}" y="${y+16}" font-size="12">${p(n)} mol (uses ${p(u)})</text>`;
  $("#chem-qc4-svg").innerHTML=bar(20,CH.u(r.A[0])+" available",na,ua,"#4f8fd8")+bar(70,CH.u(r.B[0])+" available",nb,ub,"#c565c9")+`<text x="10" y="140" font-size="12" style="fill:var(--muted)">Solid: the amount that reacts. Pale: left over (excess).</text>`;
  const U=CH.u; $("#chem-qc4-w").innerHTML=`<div>n(${U(r.A[0])}) = ${fr(ma,Ma)} = ${p(na)} mol ; n(${U(r.B[0])}) = ${fr(mb,Mb)} = ${p(nb)} mol</div><div>ratio ${r.A[1]} : ${r.B[1]} → ${U(r.A[0])} needs ${p(na*r.B[1]/r.A[1])} mol ${U(r.B[0])} ; ${p(nb)} available</div><div>n(${U(r.P[0])}) = ${p(np)} mol ; mass = ${p(np)} × ${Mp} = <b>${p(mp)} g</b></div>`;
  set("chem-qc4-a-l",ma+" g"); set("chem-qc4-b-l",mb+" g"); set("chem-qc4-l",Math.abs(ka-kb)<1e-9?"neither: exact ratio":f(lim==="A"?r.A[0]:r.B[0])); set("chem-qc4-x",Math.abs(ka-kb)<1e-9?"neither (exact ratio)":f(lim==="A"?r.B[0]:r.A[0])); set("chem-qc4-p",`${p(mp)} g ${f(r.P[0])}`); }
$("#chem-qc4-r").addEventListener("change",setup); ["chem-qc4-a","chem-qc4-b"].forEach(id=>$("#"+id).addEventListener("input",draw));
setup();
})();

</script>
<script>
LEARN.unit="chem-quant";

/* QC5: concentration of solutions (g/dm3) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sl,val}=CH, {res,fr}=LAB.W;
const stage=`<svg id="chem-qc5-svg" class="chsvg" viewBox="0 0 520 280" role="img" aria-label="Beaker of solution"></svg>`;
const panel=sl("chem-qc5-m","Mass of copper(II) sulfate dissolved",1,100,1,20,"Mass of solute in grams")+sl("chem-qc5-v","Volume of solution",50,1000,10,250,"Volume in cubic centimetres")+CH.ro([["chem-qc5-vd","Volume in dm³"],["chem-qc5-c","Concentration"]])+`<p class="note">1 dm³ = 1000 cm³ = 1 litre. Divide a volume in cm³ by 1000 to get dm³.</p>`;
lesson({id:"chem-qc5",group:"b",num:5,lvl:"5.3.2 · Lesson 5",name:"Concentration of solutions",icon:"conc",
 eyebrow:eb("5.3.2.5 Concentration of solutions",5),title:"Concentration of solutions",
 intro:"Many reactions are carried out in solution. The concentration tells you how much solute is dissolved in each cubic decimetre of solution, so you can measure out a known mass of a substance just by measuring a volume.",
 outcomes:[["Calculate the mass of solute in a given volume of solution of known concentration (g/dm³)","5.3.2.5"],["Convert between cm³ and dm³","5.3.2.5"],["Explain how the mass of solute and the volume of solution affect the concentration","5.3.2.5"]],
 blocks:[
  B.text("Grams per cubic decimetre",`<p>The concentration of a solution can be measured in <b>mass per given volume</b> of solution, for example grams per dm³ (g/dm³).</p>`+B.eq(`concentration (g/dm³) = ${fr("mass of solute (g)","volume of solution (dm³)")}`,`volume (dm³) = ${fr("volume (cm³)","1000")}`)+`<p><span class="ht">Higher</span> Dissolving <b>more solute</b> in the same volume makes the solution <b>more concentrated</b>. Dissolving the same mass in a <b>larger volume</b> makes it <b>less concentrated</b> (more dilute).</p>`),
  B.sim("chem-qc5-sim","Making a solution",stage,panel,`<span>c = m ÷ V</span><span>V in dm³</span>`),
  B.example("Mass from concentration","What mass of sodium chloride is in 250 cm³ of a solution with a concentration of 40 g/dm³?",[
   ["Convert the volume","",[`250 cm³ = ${fr("250","1000")} = 0.250 dm³`]],
   ["Rearrange: mass = concentration × volume","",[`40 × 0.250 = ${res("10 g")}`]]]),
  B.check([
   {q:"25 g of sugar is dissolved to make 500 cm³ of solution. What is the concentration in g/dm³?",a:50,unit:"g/dm³",tol:0.0001,why:"500 cm³ = 0.5 dm³; 25 ÷ 0.5 = 50 g/dm³."},
   {q:"What mass of solute is in 200 cm³ of a 30 g/dm³ solution?",a:6,unit:"g",tol:0.0001,why:"30 × 0.200 = 6 g."},
   {q:"Convert 75 cm³ to dm³.",a:0.075,unit:"dm³",tol:0.00001,why:"75 ÷ 1000 = 0.075 dm³."},
   {q:"<span class=\"ht\">Higher</span> A solution is diluted by adding water so that its volume doubles. What happens to its concentration?",opts:["It doubles","It halves","It stays the same","It becomes zero"],a:1,why:"Same mass of solute in twice the volume."},
   {q:"What volume of a 20 g/dm³ solution contains 5 g of solute, in cm³?",a:250,unit:"cm³",tol:0.0001,why:"5 ÷ 20 = 0.25 dm³ = 250 cm³."}]),
  B.keypoints(["Concentration (g/dm³) = mass (g) ÷ volume (dm³).","cm³ ÷ 1000 = dm³.","More solute → more concentrated; more solvent → more dilute."]),
  B.mistakes(["Dividing by the volume in cm³ instead of dm³.","Multiplying by 1000 instead of dividing when converting cm³ to dm³.","Using the volume of water added rather than the final volume of solution."])
 ],onShow:()=>draw()});
function draw(){ const m=val("chem-qc5-m"), v=val("chem-qc5-v"), c=m/(v/1000);
  const h=v/1000*170, a=Math.min(.95,c/400+.08);
  $("#chem-qc5-svg").innerHTML=`<path d="M160 40v210a10 10 0 0 0 10 10h180a10 10 0 0 0 10-10V40" class="ink" fill="none" stroke-width="2.5"/>${[200,400,600,800,1000].map(x=>`<path d="M160 ${250-x/1000*170}h16" class="ink" stroke-width="1.5"/><text x="152" y="${254-x/1000*170}" text-anchor="end" font-size="11">${x}</text>`).join("")}<rect x="162" y="${250-h}" width="196" height="${h+8}" fill="#2a6fd6" opacity="${a.toFixed(2)}"/><text x="152" y="30" text-anchor="end" font-size="11">cm³</text><text x="380" y="${Math.max(60,254-h)}" font-size="13">${v} cm³</text><text x="380" y="${Math.max(80,274-h)}" font-size="13">${m} g dissolved</text>`;
  set("chem-qc5-m-l",m+" g"); set("chem-qc5-v-l",v+" cm³"); set("chem-qc5-vd",(v/1000).toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+" dm³"); set("chem-qc5-c",(+c.toPrecision(3))+" g/dm³"); }
["chem-qc5-m","chem-qc5-v"].forEach(id=>$("#"+id).addEventListener("input",draw)); draw();
})();

</script>
<script>

/* Exam-style questions at the end of each Topic 3 lesson */
(()=>{

attach("chem-qc1",{title:T,intro:I,qs:[

  {q:"Calculate the relative formula mass of iron sulfide.",m:1,ans:{a:88,unit:"",tol:0},ms:[["1","56 + 32 = 88"]]},
  {q:"A student heats 5.6 g of iron with 3.2 g of sulfur. All of both reactants react. Calculate the mass of iron sulfide produced.",m:1,ans:{a:8.8,unit:"g",tol:0.001},ms:[["1","5.6 + 3.2 = 8.8 g"]]},

  {q:"Calculate the relative formula mass of iron(III) sulfate, Fe₂(SO₄)₃. (O 16)",m:2,ans:{a:400,unit:"",tol:0},ms:[["1","(2 × 56) + 3 × (32 + 4 × 16)"],["1","= 400"]]}]}]});

 {stem:`<p>A student heated copper carbonate in an open boiling tube. CuCO₃(s) → CuO(s) + CO₂(g). The table shows the results.</p><table class="tbl-mini"><tr><th>Mass of tube + copper carbonate before heating / g</th><th>Mass of tube + solid after heating / g</th></tr><tr><td>32.47</td><td>31.59</td></tr></table>`,parts:[
  {q:"Calculate the change in mass.",m:1,ans:{a:0.88,unit:"g",tol:0.001},ms:[["1","32.47 − 31.59 = 0.88 g"]]},
  {q:"Explain why the mass decreased.",m:2,lines:2,ms:[["1","carbon dioxide is produced"],["1","which is a gas and escapes from the tube"]]},
  {q:"The student repeated the experiment. The mass losses were 0.88 g, 0.84 g and 0.86 g. Calculate the mean and its uncertainty.",m:2,lines:2,ms:[["1","mean = 0.86 g"],["1","uncertainty ± 0.02 g (half the range of 0.04 g)"]]}]}]});
attach("chem-qc3",{title:T,intro:I,qs:[
 {stem:`<p><span class="ht">Higher</span> This question is about moles. Relative atomic masses (A<sub>r</sub>): C 12, O 16, Na 23, Cl 35.5. The Avogadro constant is 6.02 × 10²³ per mole.</p>`,parts:[
  {q:"Calculate the number of moles in 117 g of sodium chloride, NaCl.",m:2,ans:{a:2,unit:"mol",tol:0.0001},ms:[["1","M<sub>r</sub> = 58.5"],["1","117 ÷ 58.5 = 2.0 mol"]]},
  {q:"Calculate the mass of 0.020 mol of carbon dioxide.",m:2,ans:{a:0.88,unit:"g",tol:0.0001},ms:[["1","M<sub>r</sub> = 44"],["1","0.020 × 44 = 0.88 g"]]},
  {q:"Calculate the number of atoms in 6.0 g of carbon. Give your answer in standard form.",m:2,lines:2,ms:[["1","6.0 ÷ 12 = 0.50 mol"],["1","0.50 × 6.02 × 10²³ = 3.01 × 10²³"]]}]}]});
attach("chem-qc4",{title:T,intro:I,qs:[
 {stem:`<p><span class="ht">Higher</span> Aluminium is extracted by electrolysis: 2Al₂O₃ → 4Al + 3O₂. Relative atomic masses: Al 27, O 16.</p>`,parts:[
  {q:"Calculate the maximum mass of aluminium that can be produced from 51 tonnes of aluminium oxide.",m:4,ans:{a:27,unit:"tonnes",tol:0.001},ms:[["1","M<sub>r</sub> Al₂O₃ = 102"],["1","moles ratio: 51 ÷ 102 = 0.5 (× 10⁶) mol Al₂O₃"],["1","Al : Al₂O₃ = 4 : 2, so 1 (× 10⁶) mol Al"],["1","1 × 27 = 27 tonnes"]]},
  {q:"In another reaction, 2.4 g of magnesium is added to 0.10 mol of hydrochloric acid. Mg + 2HCl → MgCl₂ + H₂. Show that the hydrochloric acid is the limiting reactant. (Mg 24)",m:2,lines:3,ms:[["1","moles Mg = 2.4 ÷ 24 = 0.10 mol"],["1","0.10 mol Mg needs 0.20 mol HCl but only 0.10 mol is present, so HCl is used up first"]]},
  {q:"Calculate the mass of hydrogen produced in this reaction. (H 1)",m:2,ans:{a:0.1,unit:"g",tol:0.0001},ms:[["1","0.10 mol HCl → 0.050 mol H₂"],["1","0.050 × 2 = 0.10 g"]]}]}]});
attach("chem-qc5",{title:T,intro:I,qs:[
 {stem:`<p>A student makes a solution of copper(II) sulfate by dissolving 12.5 g of copper(II) sulfate in water and making it up to 250 cm³.</p>`,parts:[
  {q:"Calculate the concentration of the solution in g/dm³.",m:2,ans:{a:50,unit:"g/dm³",tol:0.0001},ms:[["1","250 cm³ = 0.250 dm³"],["1","12.5 ÷ 0.250 = 50 g/dm³"]]},
  {q:"Calculate the mass of copper(II) sulfate in 40 cm³ of this solution.",m:2,ans:{a:2,unit:"g",tol:0.0001},ms:[["1","40 cm³ = 0.040 dm³"],["1","50 × 0.040 = 2.0 g"]]},
  {q:"The student adds water to the solution until the volume is 500 cm³. State and explain what happens to the concentration.",m:2,lines:2,ms:[["1","it halves (to 25 g/dm³)"],["1","same mass of solute in twice the volume"]]}]}]});
attach("chem-qc6",{title:T,intro:I,qs:[
 {stem:`<p>Ethanol can be made by two methods.</p><p>Method 1: C₂H₄ + H₂O → C₂H₅OH<br>Method 2: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</p><p>M<sub>r</sub>: C₂H₅OH 46, C₆H₁₂O₆ 180.</p>`,parts:[
  {q:"Give the atom economy of method 1. Give a reason.",m:2,lines:2,ms:[["1","100%"],["1","ethanol is the only product"]]},
  {q:"Calculate the atom economy of method 2. Give your answer to 3 significant figures.",m:2,ans:{a:51.1,unit:"%",tol:0.06},ms:[["1","(2 × 46) ÷ 180 × 100"],["1","51.1%"]]},
  {q:"In method 2, 180 g of glucose should give 92 g of ethanol. A company obtains 69 g. Calculate the percentage yield.",m:2,ans:{a:75,unit:"%",tol:0.0001},ms:[["1","69 ÷ 92 × 100"],["1","75%"]]},

 {stem:`<p>A student titrated 25.0 cm³ of sodium hydroxide solution with 0.100 mol/dm³ hydrochloric acid. NaOH + HCl → NaCl + H₂O. The results are shown.</p><table class="tbl-mini"><tr><th></th><th>Rough</th><th>1</th><th>2</th><th>3</th></tr><tr><td>Titre / cm³</td><td>24.60</td><td>24.05</td><td>23.95</td><td>24.00</td></tr></table>`,parts:[
  {q:"Calculate the mean titre using the concordant results.",m:1,ans:{a:24,unit:"cm³",tol:0.001},ms:[["1","(24.05 + 23.95 + 24.00) ÷ 3 = 24.00 cm³"]]},
  {q:"<span class=\"ht\">Higher</span> Calculate the concentration of the sodium hydroxide in mol/dm³.",m:3,ans:{a:0.096,unit:"mol/dm³",tol:0.0001},ms:[["1","moles HCl = 0.100 × 0.02400 = 0.00240 mol"],["1","moles NaOH = 0.00240 mol (1 : 1)"],["1","0.00240 ÷ 0.0250 = 0.096 mol/dm³"]]},
  {q:"<span class=\"ht\">Higher</span> Convert your answer to g/dm³. (M<sub>r</sub> NaOH 40)",m:1,ans:{a:3.84,unit:"g/dm³",tol:0.005},ms:[["1","0.096 × 40 = 3.84 g/dm³"]]},
  {q:"Why was the rough titre not used in the mean?",m:1,lines:1,ms:[["1","it is not concordant / not within 0.10 cm³ of the others (end point overshot)"]]}]}]});

lesson({id:"chem-cc1",group:"a",num:1,lvl:"5.4.1 · Lesson 1",name:"Metal oxides and the reactivity series",icon:"react",
 eyebrow:eb("5.4.1.1–5.4.1.2 Metal oxides and the reactivity series",1),title:"Metal oxides and the reactivity series",
 intro:"Metals react with oxygen to form metal oxides, and many react with water and acids. How vigorously they react lets us put them in order: the reactivity series.",
 outcomes:[["Explain reduction and oxidation in terms of loss or gain of oxygen","5.4.1.1"],["Describe the reactions of metals with water and dilute acids, and place metals in order of reactivity","5.4.1.2"],["Relate the reactivity of a metal to its tendency to form positive ions","5.4.1.2"]],
 blocks:[
  B.text("Oxidation and reduction (oxygen)",`<p>Metals react with oxygen to produce <b>metal oxides</b>. These reactions are <b>oxidation</b> reactions because the metals <b>gain oxygen</b>: ${f("2Mg + O2 -> 2MgO")}.</p><p><b>Reduction</b> is the <b>loss of oxygen</b>. When iron oxide is heated with carbon, the iron oxide is reduced: ${f("2Fe2O3 + 3C -> 4Fe + 3CO2")}.</p>`),
  B.text("The reactivity series",`<p>When metals react with other substances, the metal atoms form <b>positive ions</b>. The reactivity of a metal is related to its tendency to form positive ions: the more easily it loses electrons, the more reactive it is.</p><table class="tbl-mini"><tr><th>Metal</th><th>With cold water</th><th>With dilute acid</th></tr><tr><td>potassium, sodium, lithium, calcium</td><td>react (vigorously → steadily) to give a hydroxide and hydrogen</td><td>dangerously vigorous</td></tr><tr><td>magnesium, zinc, iron</td><td>little or no reaction</td><td>react to give a salt and hydrogen (vigorous → slow)</td></tr><tr><td>copper</td><td>no reaction</td><td>no reaction</td></tr></table><p>Carbon and hydrogen are non-metals, but they are often placed in the series: metals above carbon cannot be extracted by heating with carbon, and metals below hydrogen do not react with dilute acids.</p>`),
  B.sim("chem-cc1-sim","Testing reactivity",stage,panel,`<span>More bubbles = more reactive</span>`),
  B.check([

   {q:"In the reaction 2Cu + O₂ → 2CuO, what happens to the copper?",opts:["It is reduced","It is oxidised","It is neutralised","It is decomposed"],a:1,why:"It gains oxygen."},
   {q:"Why does copper not react with dilute hydrochloric acid?",opts:["It is less reactive than hydrogen","It is a non-metal","It is too reactive","It is a transition metal so cannot react"],a:0,why:"Copper is below hydrogen in the reactivity series."},
   {q:"Metal X reacts slowly with acid but not with water. Metal Y fizzes in water. Metal Z does not react with acid. Order them from most to least reactive.",opts:["X, Y, Z","Y, X, Z","Z, X, Y","Y, Z, X"],a:1,why:"Y reacts with water, X only with acid, Z with neither."}]),
  B.keypoints(["Oxidation: gain of oxygen. Reduction: loss of oxygen.","Order: K, Na, Li, Ca, Mg, (C), Zn, Fe, (H), Cu.","More reactive metals lose electrons more easily to form positive ions."]),
  B.mistakes(["Saying copper reacts slowly with acid: it does not react.","Writing 'metal + acid → salt + water' for a metal (it gives hydrogen).","Putting carbon and hydrogen in as metals."])
 ],onShow:()=>draw()});
const EQ={K:{w:"2K + 2H2O -> 2KOH + H2"},Na:{w:"2Na + 2H2O -> 2NaOH + H2"},Li:{w:"2Li + 2H2O -> 2LiOH + H2"},Ca:{w:"Ca + 2H2O -> Ca(OH)2 + H2",a:"Ca + 2HCl -> CaCl2 + H2"},Mg:{w:"Mg + 2H2O -> Mg(OH)2 + H2",a:"Mg + 2HCl -> MgCl2 + H2"},Zn:{a:"Zn + 2HCl -> ZnCl2 + H2"},Fe:{a:"Fe + 2HCl -> FeCl2 + H2"}};

loop("chem-cc1",dt=>{ const cv=$("#chem-cc1-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.55), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
  const m=M[+$("#chem-cc1-m").value], l=radio("chem-cc1-l"), d=m[2][l], danger=/dangerous|Explodes/.test(d[1]);
  const tx=w/2-40, tw=80, ty=h*.12, th=h*.8;
  if(danger){ c.fillStyle=css("--bad"); c.font="bold 16px "+css("--f-body"); c.textAlign="center"; c.fillText("⚠  "+d[1],w/2,h/2); c.textAlign="left"; return; }
  c.fillStyle=l==="a"?"rgba(140,190,240,.35)":"rgba(140,190,240,.25)"; c.fillRect(tx,ty+th*.3,tw,th*.7-tw/2); c.beginPath(); c.arc(tx+tw/2,ty+th-tw/2,tw/2,0,Math.PI); c.fill();
  c.strokeStyle=css("--ink"); c.lineWidth=2.5; c.beginPath(); c.moveTo(tx,ty); c.lineTo(tx,ty+th-tw/2); c.arc(tx+tw/2,ty+th-tw/2,tw/2,Math.PI,0,true); c.lineTo(tx+tw,ty); c.stroke();
  const floats=["K","Na","Li"].includes(m[1])&&l==="w"; const px=tx+tw/2, py=floats?ty+th*.3:ty+th-18;

  st.acc+=dt*d[0]; while(st.acc>1){ st.acc-=1; st.B.push({x:px-12+Math.random()*24,y:py-6,r:2+Math.random()*3}); }
  st.B.forEach(b=>{ b.y-=dt*(60+b.r*20); b.x+=(Math.random()-.5)*1.5; }); st.B=st.B.filter(b=>b.y>ty+th*.3);
  c.strokeStyle=css("--ink"); c.lineWidth=1; st.B.forEach(b=>{ c.beginPath(); c.arc(b.x,b.y,b.r,0,7); c.stroke(); });
  c.fillStyle=css("--ink"); c.font="13px "+css("--f-body"); c.fillText(`${m[0]} in ${l==="a"?"dilute hydrochloric acid":"cold water"}`,10,18);
  c.fillStyle=css("--muted"); c.fillText(d[0]===0?"no bubbles":d[0]<1?"very slow bubbling":d[0]<10?"steady bubbling":"rapid fizzing",tx+tw+16,ty+th*.6); });
["chem-cc1-m","chem-cc1-l"].forEach(id=>$("#"+id).addEventListener("change",draw)); draw();
})();

</script>
<script>

/* CC2: extraction of metals and displacement */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set}=CH;
const MET=[["Mg","magnesium","MgSO4"],["Zn","zinc","ZnSO4"],["Fe","iron","FeSO4"],["Cu","copper","CuSO4"]];
const COL={MgSO4:"#e9eef2",ZnSO4:"#e9eef2",FeSO4:"#b9dcb4",CuSO4:"#5b9be0"};

lesson({id:"chem-cc2",group:"a",num:2,lvl:"5.4.1 · Lesson 2",name:"Extraction of metals and displacement",icon:"extract",
 eyebrow:eb("5.4.1.2–5.4.1.3 Displacement and the extraction of metals",2),title:"Extraction of metals and displacement reactions",
 intro:"A more reactive metal can push a less reactive metal out of its compounds. The same idea, using carbon, is how iron and many other metals are extracted from their ores.",
 outcomes:[["Explain displacement reactions using the reactivity series","5.4.1.2"],["Explain how metals less reactive than carbon are extracted by reduction with carbon","5.4.1.3"],["Explain why unreactive metals such as gold are found as the metal itself","5.4.1.3"]],
 blocks:[
  B.text("Displacement",`<p>A more reactive metal can <b>displace</b> a less reactive metal from a compound. Iron nails in copper(II) sulfate solution become coated in pink-brown copper, and the blue colour fades:</p><div class="eqn">${f("Fe(s) + CuSO4(aq) -> FeSO4(aq) + Cu(s)")}</div><p>If the added metal is <b>less</b> reactive than the metal in the compound, there is no reaction.</p>`),
  B.sim("chem-cc2-sim","Displacement grid",stage,panel,`<span>More reactive metal displaces less reactive metal</span>`),
  B.text("Extracting metals",`<p><b>Unreactive metals</b> such as gold are found in the Earth as the metal itself. Most metals are found as compounds in <b>ores</b> and must be extracted by chemical reactions.</p><ul><li>Metals <b>less reactive than carbon</b> (zinc, iron, tin, lead, copper) can be extracted from their oxides by <b>reduction with carbon</b>: ${f("2ZnO + C -> 2Zn + CO2")}. The oxide loses oxygen (is reduced) and the carbon gains oxygen (is oxidised).</li><li>Metals <b>more reactive than carbon</b> (potassium to aluminium) are extracted by <b>electrolysis</b> of molten compounds, which uses a lot of energy.</li></ul>`),
  B.example("Will it react?","Predict whether magnesium reacts with zinc chloride solution, and write the word equation.",[
   ["Compare positions in the reactivity series","Magnesium is above zinc, so it is more reactive.",[`Mg more reactive than Zn → displacement`]],
   ["Word equation","",[LAB.W.res("magnesium + zinc chloride → magnesium chloride + zinc")]]]),
  B.check([
   {q:"Which mixture would react?",opts:["Copper + iron(II) sulfate","Zinc + magnesium sulfate","Iron + copper(II) sulfate","Copper + zinc sulfate"],a:2,why:"Iron is more reactive than copper."},
   {q:"Why is gold found as the uncombined element?",opts:["It is very reactive","It is very unreactive","It is a liquid","It is magnetic"],a:1,why:"It does not react with oxygen or water in the ground."},
   {q:"Which metal must be extracted by electrolysis rather than by heating with carbon?",opts:["Iron","Zinc","Aluminium","Copper"],a:2,why:"Aluminium is more reactive than carbon."},
   {q:"In 2CuO + C → 2Cu + CO₂, which substance is reduced?",opts:["Copper(II) oxide","Carbon","Copper","Carbon dioxide"],a:0,why:"Copper(II) oxide loses oxygen."},
   {q:"Zinc is added to copper(II) sulfate solution. What colour change is seen in the solution?",opts:["Colourless to blue","Blue to colourless","Green to blue","No change"],a:1,why:"Blue Cu²⁺ ions are replaced by colourless Zn²⁺ ions."}]),
  B.keypoints(["A more reactive metal displaces a less reactive metal from its compounds.","Below carbon: extract by reduction with carbon. Above carbon: electrolysis.","Unreactive metals (gold) are found native."]),
  B.mistakes(["Saying copper displaces iron.","Describing the extraction of iron as 'oxidation' of the ore (the ore is reduced).","Forgetting that carbon is oxidised to carbon dioxide."])
 ],onShow:()=>{}});
const rank={Mg:0,Zn:1,Fe:2,Cu:3};
function render(sel){ let h=`<tr><th>metal ↓ · solution →</th>${MET.map(m=>`<th>${f(m[2])}</th>`).join("")}</tr>`;
  MET.forEach(([s,n])=>{ h+=`<tr><td>${n}</td>${MET.map(([t,,sol])=>{ const same=s===t, yes=!same&&rank[s]<rank[t]; return `<td>${same?"—":`<button class="btn" data-chem-cc2="${s}|${sol}" style="min-width:42px;${sel===s+"|"+sol?"outline:3px solid var(--accent)":""}">${yes?"✓":"✗"}</button>`}</td>`; }).join("")}</tr>`; });
  $("#chem-cc2-t").innerHTML=h; }
function show(s,sol){ const t=sol.slice(0,2).replace(/S$/,""), tm=MET.find(m=>m[2]===sol), yes=rank[s]<rank[tm[0]];
  const ns=s+"SO4";
  $("#chem-cc2-o").innerHTML=`<svg viewBox="0 0 300 150" class="chsvg" style="max-width:340px" role="img" aria-label="Test tube"><path d="M120 10v110a30 30 0 0 0 60 0V10" class="ink" fill="none" stroke-width="2.4"/><path d="M121 50v70a29 29 0 0 0 58 0V50z" fill="${yes?COL[ns]||"#e9eef2":COL[sol]}" opacity=".8"/><rect x="140" y="70" width="20" height="60" fill="${{Mg:"#c0c4c8",Zn:"#a8b0b8",Fe:"#777",Cu:"#c87533"}[s]}"/>${yes?`<rect x="138" y="80" width="24" height="50" fill="${{Cu:"#c87533",Fe:"#4a4a4a",Zn:"#9aa0a6"}[tm[0]]}" opacity=".85"/>`:""}<text x="200" y="70" font-size="12">${yes?"coating of "+tm[1]:"no change"}</text></svg>`;
  set("chem-cc2-r",yes?`<span class="pill ok">Yes</span>`:`<span class="pill no">No</span>`); set("chem-cc2-x",yes?`${tm[1]} ions (${f(tm[0]+"^2+")})`:"—");
  set("chem-cc2-e",yes?f(`${s}(s) + ${sol}(aq) -> ${ns}(aq) + ${tm[0]}(s)`):`${MET.find(m=>m[0]===s)[1]} is less reactive than ${tm[1]}: no displacement`); render(s+"|"+sol); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-chem-cc2]"); if(!b) return; const [s,sol]=b.dataset.chem-cc2.split("|"); show(s,sol); });
render(); show("Fe","CuSO4");

<script>

/* CC3: oxidation and reduction in terms of electrons (HT) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set,sel,field}=CH;
const R=[
 {n:"Magnesium + copper(II) sulfate",full:"Mg(s) + CuSO4(aq) -> MgSO4(aq) + Cu(s)",ion:"Mg(s) + Cu^2+(aq) -> Mg^2+(aq) + Cu(s)",ox:"Mg -> Mg^2+ + 2e^-",red:"Cu^2+ + 2e^- -> Cu",spec:"sulfate",e:2,A:"Mg",Bi:"Cu^2+"},
 {n:"Zinc + iron(II) chloride",full:"Zn(s) + FeCl2(aq) -> ZnCl2(aq) + Fe(s)",ion:"Zn(s) + Fe^2+(aq) -> Zn^2+(aq) + Fe(s)",ox:"Zn -> Zn^2+ + 2e^-",red:"Fe^2+ + 2e^- -> Fe",spec:"chloride",e:2,A:"Zn",Bi:"Fe^2+"},
 {n:"Copper + silver nitrate",full:"Cu(s) + 2AgNO3(aq) -> Cu(NO3)2(aq) + 2Ag(s)",ion:"Cu(s) + 2Ag^+(aq) -> Cu^2+(aq) + 2Ag(s)",ox:"Cu -> Cu^2+ + 2e^-",red:"Ag^+ + e^- -> Ag",spec:"nitrate",e:2,A:"Cu",Bi:"Ag^+"},
 {n:"Magnesium + hydrochloric acid",full:"Mg(s) + 2HCl(aq) -> MgCl2(aq) + H2(g)",ion:"Mg(s) + 2H^+(aq) -> Mg^2+(aq) + H2(g)",ox:"Mg -> Mg^2+ + 2e^-",red:"2H^+ + 2e^- -> H2",spec:"chloride",e:2,A:"Mg",Bi:"H^+"},
 {n:"Chlorine + potassium bromide",full:"Cl2(aq) + 2KBr(aq) -> 2KCl(aq) + Br2(aq)",ion:"Cl2(aq) + 2Br^-(aq) -> 2Cl^-(aq) + Br2(aq)",ox:"2Br^- -> Br2 + 2e^-",red:"Cl2 + 2e^- -> 2Cl^-",spec:"potassium",e:2,A:"Br^-",Bi:"Cl2"}];
const stage=`<div style="padding:14px" id="chem-cc3-box"></div>`;
const panel=field("Reaction",sel("chem-cc3-r",R.map((r,i)=>[String(i),r.n]),"0"))+CH.ro([["chem-cc3-o","Oxidised (loses electrons)"],["chem-cc3-d","Reduced (gains electrons)"],["chem-cc3-s","Spectator ions"]]);
lesson({id:"chem-cc3",group:"a",num:3,lvl:"5.4.1 · Lesson 3",name:"Oxidation and reduction in terms of electrons",icon:"redox",tag:"Higher tier",
 eyebrow:eb("5.4.1.4 Oxidation and reduction in terms of electrons (HT only)",3),title:"Oxidation and reduction in terms of electrons",
 intro:"Oxidation and reduction are really about electrons. In a displacement reaction the more reactive metal gives electrons to the ions of the less reactive one. Ionic equations and half equations show exactly where the electrons go.",
 outcomes:[["Define oxidation as loss of electrons and reduction as gain of electrons","5.4.1.4"],["Write ionic equations for displacement reactions, leaving out spectator ions","5.4.1.4"],["Write half equations and identify which species are oxidised and which are reduced","5.4.1.4"]],
 blocks:[
  B.text("OIL RIG",`<p><b>Oxidation Is Loss</b> of electrons; <b>Reduction Is Gain</b> of electrons. Because the electrons lost by one species are gained by another, oxidation and reduction always happen together: these are <b>redox</b> reactions.</p><p>In an <b>ionic equation</b>, ions that are unchanged (<b>spectator ions</b>) are left out. In ${f("Mg + CuSO4 -> MgSO4 + Cu")} the sulfate ions do not change, so the ionic equation is ${f("Mg + Cu^2+ -> Mg^2+ + Cu")}. This can be split into two <b>half equations</b>:</p>`+B.eq(`${f("Mg -> Mg^2+ + 2e^-")}  (oxidation: electrons lost)`,`${f("Cu^2+ + 2e^- -> Cu")}  (reduction: electrons gained)`)),
  B.sim("chem-cc3-sim","From full equation to half equations",stage,panel,`<span>Oxidation Is Loss</span><span>Reduction Is Gain</span>`),
  B.check([
   {q:"In Zn + Cu²⁺ → Zn²⁺ + Cu, which species is oxidised?",opts:["Zn","Cu²⁺","Zn²⁺","Cu"],a:0,why:"Zinc atoms lose 2 electrons each."},
   {q:"Which half equation shows reduction?",opts:["Fe → Fe²⁺ + 2e⁻","2Cl⁻ → Cl₂ + 2e⁻","Ag⁺ + e⁻ → Ag","Mg → Mg²⁺ + 2e⁻"],a:2,why:"Silver ions gain an electron."},
   {q:"In the reaction of iron with copper(II) sulfate solution, which ions are spectator ions?",opts:["Fe²⁺","Cu²⁺","SO₄²⁻","None"],a:2,why:"Sulfate ions are unchanged."},
   {q:"How many electrons does each aluminium atom lose when it forms an Al³⁺ ion?",a:3,unit:"",tol:0,why:"Al → Al³⁺ + 3e⁻."},
   {q:"In Cl₂ + 2I⁻ → 2Cl⁻ + I₂, what happens to the chlorine?",opts:["It is oxidised by losing electrons","It is reduced by gaining electrons","It is a spectator","It loses protons"],a:1,why:"Cl₂ + 2e⁻ → 2Cl⁻."}]),
  B.keypoints(["Oxidation is loss of electrons; reduction is gain of electrons (OIL RIG).","Ionic equations leave out spectator ions.","Half equations show electrons: Mg → Mg²⁺ + 2e⁻ ; Cu²⁺ + 2e⁻ → Cu."]),
  B.mistakes(["Putting electrons on the wrong side of a half equation.","Including spectator ions in an ionic equation.","Saying the metal ion is oxidised when it becomes a metal (it is reduced)."])
 ],onShow:()=>draw()});
function draw(){ const r=R[+$("#chem-cc3-r").value];
  $("#chem-cc3-box").innerHTML=`<div class="lbl">Full equation</div><div class="eqn">${f(r.full)}</div><div class="lbl" style="margin-top:10px">Ionic equation (spectator ions removed)</div><div class="eqn">${f(r.ion)}</div><div class="lbl" style="margin-top:10px">Half equations</div><div class="eqn"><span class="pill no" style="margin-right:6px">oxidation</span>${f(r.ox)}</div><div class="eqn"><span class="pill ok" style="margin-right:6px">reduction</span>${f(r.red)}</div><p class="muted" style="margin:.6rem 0 0">Electrons move from ${f(r.A)} to ${f(r.Bi)}. The number of electrons lost equals the number gained.</p>`;
  set("chem-cc3-o",f(r.A)); set("chem-cc3-d",f(r.Bi)); set("chem-cc3-s",r.spec+" ions"); }
$("#chem-cc3-r").addEventListener("change",draw); draw();
})();

</script>

/* CC4: reactions of acids and naming salts */
(()=>{

const ACID=[["HCl","hydrochloric acid","Cl",1,"chloride"],["H2SO4","sulfuric acid","SO4",2,"sulfate"],["HNO3","nitric acid","NO3",1,"nitrate"]];
const BASE=[["Mg","magnesium","metal","Mg",2],["Zn","zinc","metal","Zn",2],["Cu","copper","metal","Cu",2],["CuO","copper(II) oxide","oxide","Cu",2],["MgO","magnesium oxide","oxide","Mg",2],["NaOH","sodium hydroxide","hydroxide","Na",1],["KOH","potassium hydroxide","hydroxide","K",1],["CaCO3","calcium carbonate","carbonate","Ca",2],["Na2CO3","sodium carbonate","carbonate","Na",1],["CuCO3","copper(II) carbonate","carbonate","Cu",2]];
const NAME={Mg:"magnesium",Zn:"zinc",Cu:"copper(II)",Na:"sodium",K:"potassium",Ca:"calcium"};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const part=(s,k)=>k===1?s:(/[A-Z].*[A-Z]|\d/.test(s)?`(${s})${k}`:s+k);
const stage=`<div style="padding:14px"><div id="chem-cc4-w" style="font-size:1.05rem"></div><div id="chem-cc4-e" class="eqn" style="margin-top:8px"></div><p class="muted" id="chem-cc4-n" style="margin-top:8px"></p></div>`;
const panel=field("Acid",sel("chem-cc4-a",ACID.map((a,i)=>[String(i),a[1]]),"0"))+field("Add",sel("chem-cc4-b",BASE.map((b,i)=>[String(i),b[1]]),"3"))+CH.ro([["chem-cc4-s","Salt"],["chem-cc4-sf","Formula"],["chem-cc4-o","Other products"]]);
lesson({id:"chem-cc4",group:"b",num:4,lvl:"5.4.2 · Lesson 4",name:"Reactions of acids",icon:"salt",
 eyebrow:eb("5.4.2.1–5.4.2.2 Reactions of acids with metals, bases and carbonates",4),title:"Reactions of acids and naming salts",
 intro:"Acids react with metals, metal oxides, metal hydroxides and metal carbonates. Every one of these reactions makes a salt, and the name of the salt comes from the metal and the acid.",
 outcomes:[["Describe the reactions of acids with metals, metal oxides, hydroxides and carbonates","5.4.2.1–5.4.2.2"],["Predict and name the salts made from hydrochloric, sulfuric and nitric acids","5.4.2.2"],["Write balanced equations for reactions of acids, including working out formulae from ion charges","5.4.2.2"]],
 blocks:[
  B.text("General equations",B.eq(`dilute hydrochloric/sulfuric acid + reactive metal → salt + hydrogen`,`acid + metal oxide → salt + water`,`acid + metal hydroxide → salt + water`,`acid + metal carbonate → salt + water + carbon dioxide`)+`<p>Metal oxides and hydroxides are <b>bases</b>; soluble bases (such as sodium hydroxide) are called <b>alkalis</b>. Their reactions with acids are <b>neutralisation</b> reactions.</p><table class="tbl-mini"><tr><th>Acid</th><th>Salt name ends in</th><th>Ion</th></tr><tr><td>hydrochloric acid, HCl</td><td>chloride</td><td>${f("Cl^-")}</td></tr><tr><td>sulfuric acid, ${f("H2SO4")}</td><td>sulfate</td><td>${f("SO4^2-")}</td></tr><tr><td>nitric acid, ${f("HNO3")}</td><td>nitrate</td><td>${f("NO3^-")}</td></tr></table>`),
  B.sim("chem-cc4-sim","Salt maker",stage,panel,`<span>Metal name first, then the acid's part</span>`),
  B.text("Metals and acids are redox reactions",G.ht(`<p>The reaction of a metal with an acid is a redox reaction. In ${f("Zn + 2H^+ -> Zn^2+ + H2")}, zinc atoms lose electrons (are oxidised) and hydrogen ions gain electrons (are reduced).</p>`)),
  B.check([
   {q:"Name the salt formed when magnesium oxide reacts with nitric acid.",opts:["Magnesium nitride","Magnesium nitrate","Magnesium sulfate","Magnesium chloride"],a:1,why:"Nitric acid makes nitrates."},
   {q:"What are the products when zinc carbonate reacts with hydrochloric acid?",opts:["Zinc chloride + hydrogen","Zinc chloride + water + carbon dioxide","Zinc chloride + water","Zinc oxide + carbon dioxide"],a:1,why:"Acid + carbonate → salt + water + carbon dioxide."},
   {q:"What is the formula of potassium sulfate?",opts:["KSO₄","K₂SO₄","K(SO₄)₂","K₂S"],a:1,why:"Two K⁺ balance one SO₄²⁻."},
   {q:"Which gas is produced when an acid reacts with a metal?",opts:["Oxygen","Hydrogen","Carbon dioxide","Chlorine"],a:1,why:"Metal + acid → salt + hydrogen."},
   {q:"Balance: CuO + HNO₃ → Cu(NO₃)₂ + H₂O. What number goes in front of HNO₃?",a:2,unit:"",tol:0,why:"CuO + 2HNO₃ → Cu(NO₃)₂ + H₂O."}]),
  B.keypoints(["Acid + metal → salt + hydrogen. Acid + oxide/hydroxide → salt + water. Acid + carbonate → salt + water + carbon dioxide.","Hydrochloric → chlorides; sulfuric → sulfates; nitric → nitrates.","Work out salt formulae from the charges on the ions."]),
  B.mistakes(["Calling the salt from nitric acid a 'nitride'.","Forgetting carbon dioxide with carbonates.","Saying copper reacts with dilute acids to give hydrogen."])
 ],onShow:()=>draw()});
function draw(){ const A=ACID[+$("#chem-cc4-a").value], Bs=BASE[+$("#chem-cc4-b").value];
  if(A[0]==="HNO3"&&Bs[2]==="metal"){ set("chem-cc4-w","Nitric acid is an oxidising acid: metal reactions do not follow the general hydrogen rule."); set("chem-cc4-e",""); set("chem-cc4-n","This combination is outside the model. Choose a metal oxide, hydroxide or carbonate to make a nitrate salt."); ["chem-cc4-s","chem-cc4-sf","chem-cc4-o"].forEach(k=>set(k,"—")); return; }
  if(Bs[2]==="metal"&&Bs[0]==="Cu"){ $("#chem-cc4-w").innerHTML=`copper + ${A[1]} → <b>no reaction</b>`; $("#chem-cc4-e").innerHTML=""; set("chem-cc4-n","Copper is less reactive than hydrogen, so it does not produce hydrogen with dilute hydrochloric or sulfuric acid. To make a copper salt, use copper(II) oxide, hydroxide or carbonate."); set("chem-cc4-s","—"); set("chem-cc4-sf","—"); set("chem-cc4-o","—"); return; }
  const m=Bs[3], q=Bs[4], l=q*A[3]/gcd(q,A[3]), salt=part(m,l/q)+part(A[2],l/A[3]);
  const other=Bs[2]==="metal"?["H2"]:Bs[2]==="carbonate"?["H2O","CO2"]:["H2O"];
  const L=[Bs[0],A[0]], R=[salt,...other], c=balance(L,R);
  const sname=`${NAME[m]} ${A[4]}`;
  $("#chem-cc4-w").innerHTML=`${Bs[1]} + ${A[1]} → <b>${sname}</b> + ${other.map(o=>({H2:"hydrogen",H2O:"water",CO2:"carbon dioxide"}[o])).join(" + ")}`;
  $("#chem-cc4-e").innerHTML=c?f(eqStr(L,R,c)):"";
  set("chem-cc4-n",(Bs[0]==="CaCO3"&&A[0]==="H2SO4")?"Calcium sulfate is only slightly soluble: it coats the calcium carbonate and the reaction soon stops.":Bs[2]==="hydroxide"?"An alkali: this is a neutralisation reaction. Hydrogen ions react with hydroxide ions to form water.":Bs[2]==="oxide"||Bs[2]==="carbonate"?"An insoluble base or carbonate: add it in excess, then filter off the excess (Required practical 8).":"Bubbles of hydrogen; the metal dissolves.");
  set("chem-cc4-s",sname); set("chem-cc4-sf",f(salt)); set("chem-cc4-o",other.map(o=>f(o)).join(" + ")); }
["chem-cc4-a","chem-cc4-b"].forEach(id=>$("#"+id).addEventListener("change",draw)); draw();
})();

</script>
<script>

/* CC5: making a soluble salt from an insoluble base (RP8) */
(()=>{
const {$}=LAB, {B,lesson}=LEARN, {f,eb,set}=CH;
const NEED=5; const st={n:0,stage:0};
const stage=`<svg id="chem-cc5-svg" class="chsvg" viewBox="0 0 560 300" role="img" aria-label="Making copper(II) sulfate crystals"></svg>`;
const panel=`<div class="btnrow" style="flex-wrap:wrap"><button class="btn" id="chem-cc5-add">Add a spatula of copper(II) oxide</button><button class="btn" id="chem-cc5-fil">Filter</button><button class="btn" id="chem-cc5-ev">Heat to evaporate some water</button><button class="btn" id="chem-cc5-cool">Leave to cool and crystallise</button><button class="btn" id="chem-cc5-re">Start again</button></div>${CH.ro([["chem-cc5-sp","Spatulas added"],["chem-cc5-st","Stage"]])}<p class="note" id="chem-cc5-n"></p>`;
lesson({id:"chem-cc5",group:"b",num:5,lvl:"5.4.2 · Lesson 5",name:"Making soluble salts",icon:"prep",
 eyebrow:eb("5.4.2.3 Soluble salts · Required practical 8",5),title:"Making a pure, dry sample of a soluble salt",
 intro:"To make a soluble salt from an insoluble base or carbonate, add the solid to the acid until no more reacts, filter off what is left over, then crystallise the salt from the solution.",
 outcomes:[["Describe how to make pure, dry crystals of a soluble salt from an insoluble oxide or carbonate","5.4.2.3"],["Explain why the solid is added in excess and why the excess is filtered off","5.4.2.3"],["Name the salt and write the equation for the reaction","5.4.2.3"]],
 blocks:[
  B.text("Method",`<ol><li>Warm about 40 cm³ of dilute sulfuric acid in a beaker (it speeds up the reaction).</li><li>Add copper(II) oxide a spatula at a time, stirring, until some black solid remains however long you stir. The copper(II) oxide is now <b>in excess</b>, so all the acid has reacted.</li><li><b>Filter</b> the mixture to remove the excess copper(II) oxide.</li><li>Heat the blue filtrate in an evaporating basin to evaporate some of the water, until crystals start to form at the edge.</li><li>Leave the solution to cool so <b>crystals</b> form. Filter off the crystals and dry them between filter papers.</li></ol><div class="eqn">${f("CuO(s) + H2SO4(aq) -> CuSO4(aq) + H2O(l)")}</div>`),
  B.sim("chem-cc5-sim","Make copper(II) sulfate crystals",stage,panel,`<span>Excess base → no acid left</span>`),
  B.practical(`<p>This is <b>RP8</b>, Required practical 8. Open it in the Practical Lab to carry out the full method and record your observations.</p>`,"Required practical 8: making salts"),
  B.check([
   {q:"Why is copper(II) oxide added until some is left over?",opts:["To make the crystals bigger","To make sure all the acid has reacted","To speed up evaporation","To make the solution colourless"],a:1,why:"Excess base means no acid remains in the solution."},
   {q:"How is the excess copper(II) oxide removed?",opts:["Evaporation","Filtration","Distillation","Chromatography"],a:1,why:"It is an insoluble solid."},
   {q:"Which acid and insoluble base would make zinc chloride?",opts:["Sulfuric acid and zinc oxide","Hydrochloric acid and zinc oxide","Nitric acid and zinc oxide","Hydrochloric acid and zinc sulfate"],a:1,why:"Chlorides come from hydrochloric acid."},
   {q:"Why is the filtrate only partly evaporated rather than heated to dryness?",opts:["To give larger, purer crystals and avoid decomposing the salt","To make it react faster","To remove the excess oxide","To save acid"],a:0,why:"Slow crystallisation on cooling gives better crystals."},
   {q:"What colour is copper(II) sulfate solution?",opts:["Colourless","Blue","Green","Black"],a:1,why:"Copper(II) ions are blue."}]),
  B.keypoints(["Add insoluble base (or carbonate, or metal) to acid until in excess.","Filter off the excess solid.","Evaporate some water, cool to crystallise, filter and dry the crystals."]),
  B.mistakes(["Filtering before the base is in excess, so acid remains.","Heating the solution to dryness.","Calling the excess solid the filtrate."])
 ],onShow:()=>draw()});
function draw(){ const blue=Math.min(st.n,NEED)/NEED, xs=Math.max(0,st.n-NEED); let g="";
  if(st.stage===0){ g+=`<path d="M200 80v170a12 12 0 0 0 12 12h136a12 12 0 0 0 12-12V80" class="ink" fill="none" stroke-width="2.5"/><rect x="202" y="150" width="156" height="110" fill="rgb(${Math.round(190-150*blue)},${Math.round(215-80*blue)},${Math.round(235)})" opacity=".75"/>`;
    for(let i=0;i<xs*6;i++) g+=`<circle cx="${215+(i*37)%130}" cy="${252-(i%3)*4}" r="3" fill="#222"/>`;
    g+=`<text x="380" y="160" font-size="13">${st.n===0?"warm dilute sulfuric acid":xs?"black solid remains: excess":"black solid dissolves"}</text>`; }
  else if(st.stage===1){ g+=`<path d="M230 60h100l-38 50v40h-24v-40z" class="ink" fill="none" stroke-width="2.4"/><path d="M262 70c10 4 26 4 36 0" stroke="#222" stroke-width="6"/><path d="M280 150v30" stroke="#5b9be0" stroke-width="3" stroke-dasharray="3 5"/><path d="M230 180h100l14 90h-128z" class="ink" fill="none" stroke-width="2.4"/><path d="M222 230h116l6 40h-128z" fill="#5b9be0" opacity=".75"/><text x="350" y="80" font-size="13">residue: excess CuO</text><text x="350" y="250" font-size="13">filtrate: blue CuSO₄(aq)</text>`; }
  else if(st.stage===2){ g+=`<path d="M200 140c0 50 160 50 160 0z" class="ink" fill="none" stroke-width="2.4"/><path d="M212 146c12 30 124 30 136 0z" fill="#3f7fd0" opacity=".85"/><path d="M280 220c-14-18-4-30 0-42c4 12 14 24 0 42z" fill="#3b7dd8" opacity=".7"/><text x="380" y="140" font-size="13">evaporate until crystals</text><text x="380" y="158" font-size="13">start to form at the edge</text>`; }
  else { g+=`<path d="M200 140c0 50 160 50 160 0z" class="ink" fill="none" stroke-width="2.4"/><path d="M216 150c14 22 114 22 128 0z" fill="#5b9be0" opacity=".45"/>`; [[240,160],[268,166],[300,162],[326,156],[256,150],[290,152]].forEach(([x,y],i)=>g+=`<path d="M${x} ${y-10}l10 6v12l-10 6l-10-6v-12z" fill="#1e63c6" stroke="#bcd8ff" stroke-width="1"/>`); g+=`<text x="380" y="150" font-size="13">blue crystals of copper(II) sulfate</text>`; }
  $("#chem-cc5-svg").innerHTML=g;
  set("chem-cc5-sp",st.n); set("chem-cc5-st",["Reacting","Filtered","Evaporating","Crystals"][st.stage]);
  set("chem-cc5-n",st.stage===0?(st.n<NEED?"Keep adding until no more dissolves.":"Excess copper(II) oxide: all the acid has reacted. Now filter."):st.stage===1?"The filtrate is a solution of copper(II) sulfate. Next, heat it.":st.stage===2?"Now leave it to cool.":"Filter off the crystals and dry them between filter papers."); }
$("#chem-cc5-add").addEventListener("click",()=>{ if(st.stage===0){ st.n++; draw(); } });
$("#chem-cc5-fil").addEventListener("click",()=>{ if(st.stage===0&&st.n>NEED){ st.stage=1; draw(); } else if(st.stage===0) set("chem-cc5-n","Not yet: if you filter now, some acid will be left. Add copper(II) oxide until some remains undissolved."); });
$("#chem-cc5-ev").addEventListener("click",()=>{ if(st.stage===1){ st.stage=2; draw(); } });
$("#chem-cc5-cool").addEventListener("click",()=>{ if(st.stage===2){ st.stage=3; draw(); } });
$("#chem-cc5-re").addEventListener("click",()=>{ st.n=0; st.stage=0; draw(); });
draw();
})();

</script>
<script>
LEARN.unit="chem-changes";

/* CC7: strong and weak acids (pH and [H+] HT) */
(()=>{
const {$,css}=LAB, {B,lesson}=LEARN, {f,eb,set,seg,field,sl,val,radio,uiColour}=CH;
const A={hcl:["Hydrochloric acid","strong",null,"HCl"],no3:["Nitric acid","strong",null,"HNO3"],eth:["Ethanoic acid","weak",1.75e-5,"CH3COOH"],cit:["Citric acid","weak",7.4e-4,"citric acid"],car:["Carbonic acid","weak",4.5e-7,"H2CO3"]};
const calc=(k,c)=>{ const a=A[k]; if(a[1]==="strong") return {H:c,al:1}; const Ka=a[2], H=(-Ka+Math.sqrt(Ka*Ka+4*Ka*c))/2; return {H,al:H/c}; };
const stage=`<div class="two" style="padding:12px;align-items:center"><div id="chem-cc7-box"></div><div id="chem-cc7-ph"></div></div>`;
const panel=field("Acid",seg("chem-cc7-a",[["hcl","Hydrochloric"],["no3","Nitric"],["eth","Ethanoic"],["cit","Citric"],["car","Carbonic"]],2,"hcl"))+sl("chem-cc7-c","Concentration (log scale)",-3,0,1,-1,"Concentration")+CH.ro([["chem-cc7-cc","Concentration"],["chem-cc7-al","Molecules ionised"],["chem-cc7-h","H⁺ concentration"],["chem-cc7-p","pH"]]);
lesson({id:"chem-cc7",group:"b",num:7,lvl:"5.4.2 · Lesson 7",name:"Strong and weak acids",icon:"weak",tag:"Higher tier",
 eyebrow:eb("5.4.2.6 Strong and weak acids",7),title:"Strong and weak acids",
 intro:"'Strong' and 'concentrated' mean different things. Strength is about how completely the acid ionises in water; concentration is about how much acid is dissolved in each cubic decimetre.",
 outcomes:[["Explain the difference between strong and weak acids in terms of ionisation","5.4.2.6"],["Distinguish between dilute and concentrated, and between weak and strong","5.4.2.6"],["<span class=\"ht\">Higher</span> Explain that a decrease of 1 pH unit means a ten-fold increase in hydrogen ion concentration","5.4.2.6"]],
 blocks:[
  B.text("Strength and concentration",`<p>A <b>strong acid</b> is <b>completely ionised</b> in aqueous solution: hydrochloric, nitric and sulfuric acids. A <b>weak acid</b> is only <b>partially ionised</b>: ethanoic, citric and carbonic acids.</p><div class="eqn">${f("HCl(aq) -> H^+(aq) + Cl^-(aq)")}</div><div class="eqn">${f("CH3COOH(aq) <=> H^+(aq) + CH3COO^-(aq)")}</div><p>For a given concentration of aqueous solutions, the stronger an acid, the lower the pH. <b>Concentration</b> is the amount of acid in a given volume: a <b>dilute</b> acid has a small amount, a <b>concentrated</b> acid a large amount. So it is possible to have a dilute solution of a strong acid, or a concentrated solution of a weak acid.</p>`+G.ht(`<p>As the pH decreases by one unit, the hydrogen ion concentration of the solution <b>increases by a factor of 10</b>. A solution of pH 2 has 10 times the H⁺ concentration of pH 3, and 100 times that of pH 4.</p>`)),
  B.sim("chem-cc7-sim","Strong or weak, concentrated or dilute",stage,panel,`<span>Strong: all ionised</span><span>Weak: few ionised</span>`),
  B.check([
   {q:"What is meant by a weak acid?",opts:["A dilute acid","An acid that is only partially ionised in water","An acid with a pH above 7","An acid that does not react"],a:1,why:"Strength is about ionisation."},
   {q:"Which is a strong acid?",opts:["Ethanoic acid","Citric acid","Nitric acid","Carbonic acid"],a:2,why:"Nitric acid is completely ionised."},
   {q:"Solution A has pH 2. Solution B has pH 4. How many times greater is the H⁺ concentration in A?",a:100,unit:"times",tol:0,why:"Two pH units: 10 × 10 = 100."},
   {q:"0.1 mol/dm³ hydrochloric acid and 0.1 mol/dm³ ethanoic acid have the same concentration. Which has the lower pH?",opts:["Hydrochloric acid","Ethanoic acid","They are the same"],a:0,why:"It is fully ionised, so its H⁺ concentration is higher."},
   {q:"A solution of 2.0 mol/dm³ ethanoic acid is best described as…",opts:["concentrated and strong","dilute and weak","concentrated and weak","dilute and strong"],a:2,why:"A lot of acid, but only partially ionised."}]),
  B.keypoints(["Strong acids ionise completely; weak acids partially.","Concentration = amount per volume; strength = degree of ionisation.","pH falls by 1 when H⁺ concentration rises by a factor of 10 (HT)."]),
  B.mistakes(["Using 'strong' to mean 'concentrated'.","Saying pH 2 is twice as acidic as pH 4.","Writing a single arrow for a weak acid's ionisation (it is reversible)."])
 ],onShow:()=>draw()});
function draw(){ const k=radio("chem-cc7-a"), e=val("chem-cc7-c"), c=10**e, r=calc(k,c), pH=-Math.log10(r.H), a=A[k];
  const N=20, ion=a[1]==="strong"?N:Math.max(0,Math.round(r.al*N));
  let g=`<svg class="chsvg" viewBox="0 0 220 180" role="img" aria-label="Acid particles in water"><rect x="5" y="5" width="210" height="170" rx="8" fill="#9cc8e8" opacity=".25" class="ink" stroke-width="1"/>`;
  for(let i=0;i<N;i++){ const x=24+(i%5)*42, y=28+Math.floor(i/5)*40; if(i<ion) g+=`<circle cx="${x-8}" cy="${y}" r="7" fill="#e05252"/><text x="${x-8}" y="${y+4}" font-size="9" text-anchor="middle" style="fill:#fff">H⁺</text><circle cx="${x+9}" cy="${y+6}" r="9" fill="#4f8fd8"/><text x="${x+9}" y="${y+9}" font-size="9" text-anchor="middle" style="fill:#fff">A⁻</text>`; else g+=`<ellipse cx="${x}" cy="${y+3}" rx="16" ry="10" fill="#8a79e0"/><text x="${x}" y="${y+6}" font-size="9" text-anchor="middle" style="fill:#fff">HA</text>`; }
  g+=`</svg><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">20 acid molecules shown. ${a[1]==="weak"&&ion===0?"Fewer than 1 in 20 ionised.":""}</p>`;
  $("#chem-cc7-box").innerHTML=g;
  $("#chem-cc7-ph").innerHTML=`<div style="font-size:3rem;font-family:var(--f-display);line-height:1">pH ${pH.toFixed(1)}</div><div style="height:22px;border-radius:6px;margin-top:8px;background:${uiColour(pH)}"></div><p style="margin:.6rem 0 0">${a[0]} is a <b>${a[1]}</b> acid at a ${c>=0.5?"concentrated":c<=0.01?"dilute":"moderate"} concentration.</p>`;
  set("chem-cc7-c-l",""); set("chem-cc7-cc",`${c} mol/dm³`); set("chem-cc7-al",a[1]==="strong"?"100%":`${(r.al*100).toPrecision(2)}%`); set("chem-cc7-h",`${CH.sci(r.H,2)} mol/dm³`); set("chem-cc7-p",pH.toFixed(2)); }
$("#chem-cc7-a").addEventListener("change",draw); $("#chem-cc7-c").addEventListener("input",draw); draw();
})();

</script>
<script>

/* CC8 + CC9: electrolysis simulations (shared engine) */
window.ELEC=(()=>{
const {$,css}=LAB, {f,set,loop}=CH;
function make(id,list){ const st={P:[],k:-1,t:0,on:true,prod:[0,0]};
  function setup(){ const d=list[+$("#"+id+"-s").value]; st.k=+$("#"+id+"-s").value; st.prod=[0,0]; st.P=[]; const add=(lab,q,col,n)=>{ for(let i=0;i<n;i++) st.P.push({lab,q,col,x:.08+Math.random()*.84,y:.45+Math.random()*.5,vx:0,vy:0}); };
    d.ions.forEach(([lab,q,col,n])=>add(lab,q,col,n)); }
  loop(id,dt=>{ const cv=$("#"+id+"-cv"); if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*.6), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
    if(+$("#"+id+"-s").value!==st.k) setup(); const d=list[st.k], on=$("#"+id+"-on").checked;
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle=css("--sunk"); c.fillRect(0,0,w,h);
    const bx=w*.12, bw=w*.76, by=h*.3, bh=h*.62;
    c.fillStyle=d.liq; c.globalAlpha=.55; c.fillRect(bx,by+bh*.12,bw,bh*.88); c.globalAlpha=1;
    c.strokeStyle=css("--ink"); c.lineWidth=2.5; c.beginPath(); c.moveTo(bx,by); c.lineTo(bx,by+bh); c.lineTo(bx+bw,by+bh); c.lineTo(bx+bw,by); c.stroke();
    const ex=[bx+bw*.2,bx+bw*.8], ew=w*.04;
    /* circuit */
    c.beginPath(); c.moveTo(ex[0],by+bh*.1); c.lineTo(ex[0],h*.1); c.lineTo(w*.44,h*.1); c.moveTo(w*.56,h*.1); c.lineTo(ex[1],h*.1); c.lineTo(ex[1],by+bh*.1); c.stroke();
    c.lineWidth=3; c.beginPath(); c.moveTo(w*.46,h*.04); c.lineTo(w*.46,h*.16); c.moveTo(w*.54,h*.07); c.lineTo(w*.54,h*.13); c.stroke(); c.lineWidth=2.5; c.beginPath(); c.moveTo(w*.44,h*.1); c.lineTo(w*.46,h*.1); c.moveTo(w*.54,h*.1); c.lineTo(w*.56,h*.1); c.stroke();
    c.fillStyle=css("--ink"); c.font="12px "+css("--f-body"); c.textAlign="center";
    c.textAlign="right"; c.fillText("cathode (−)",ex[0]-ew,by-8); c.textAlign="left"; c.fillText("anode (+)",ex[1]+ew,by-8); c.textAlign="center";
    c.fillStyle="#555"; c.fillRect(ex[0]-ew/2,by-2,ew,bh*.8); c.fillRect(ex[1]-ew/2,by-2,ew,bh*.8);
    if(on) st.prod=st.prod.map(p=>Math.min(1,p+dt*.05));
    /* products */
    const prod=(i,pr)=>{ const x=ex[i], k=st.prod[i]; if(pr.t==="solid"){ c.fillStyle=pr.col; c.fillRect(x-ew/2-4*k,by+bh*.12,ew+8*k,bh*.68); }
      else if(pr.t==="liquid"){ c.fillStyle=pr.col; c.fillRect(bx+2,by+bh-8*k-2,bw*.4,8*k); }
      else if(on){ if(Math.random()<dt*14*(pr.rate||1)) (st.B=st.B||[]).push({x:x+(Math.random()-.5)*ew,y:by+bh*.8,col:pr.col,i}); } };
    prod(0,d.cat); prod(1,d.an);
    if(d.an.t==="liquid") {}
    st.B=(st.B||[]).filter(b=>b.y>by+bh*.12); st.B.forEach(b=>{ b.y-=dt*60; c.fillStyle=b.col; c.globalAlpha=.8; c.beginPath(); c.arc(b.x,b.y,3.5,0,7); c.fill(); c.globalAlpha=1; });
    /* ions */
    st.P.forEach(p=>{ const tx=p.q>0?(ex[0]-bx)/bw:(ex[1]-bx)/bw; let ax=(Math.random()-.5)*.8, ay=(Math.random()-.5)*.8; if(on&&p.q!==0) ax+=Math.sign(tx-p.x)*.35;
      p.vx=(p.vx+ax*dt)*.96; p.vy=(p.vy+ay*dt)*.96; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(on&&Math.abs(p.x-tx)<.03&&p.q!==0){ p.x=p.q>0?.75+Math.random()*.2:.05+Math.random()*.2; p.y=.3+Math.random()*.6; p.vx=0; }
      p.x=Math.max(.03,Math.min(.97,p.x)); p.y=Math.max(.18,Math.min(.95,p.y));
      const X=bx+p.x*bw, Y=by+p.y*bh, r=Math.max(9,w*.022); c.fillStyle=p.col; c.beginPath(); c.arc(X,Y,r,0,7); c.fill(); c.fillStyle="#fff"; c.font="bold "+Math.round(r*.8)+"px "+css("--f-body"); c.fillText(p.lab,X,Y+r*.3); });
    c.textAlign="left"; c.fillStyle=css("--ink"); c.font="12px "+css("--f-body"); c.fillText(d.where,bx+4,h-6); });
  function readouts(){ const d=list[+$("#"+id+"-s").value]; set(id+"-c",d.cat.name); set(id+"-a",d.an.name); set(id+"-hc",f(d.cat.h)); set(id+"-ha",f(d.an.h)); set(id+"-why",d.why); }
  $("#"+id+"-s").addEventListener("change",readouts); readouts(); }
const panel=(id,list)=>CH.field("Electrolyte",CH.sel(id+"-s",list.map((d,i)=>[String(i),d.n]),"0"))+`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer"><input type="checkbox" id="${id}-on" checked style="width:18px;height:18px"> Power supply on</label><div class="readout"><div><span>At the cathode (−)</span><b id="${id}-c">—</b></div><div><span>At the anode (+)</span><b id="${id}-a">—</b></div><div><span>Cathode half equation</span><b id="${id}-hc">—</b></div><div><span>Anode half equation</span><b id="${id}-ha">—</b></div></div><p class="note" id="${id}-why"></p>`;
return {make,panel};
})();

 {n:"Zinc chloride (molten)",liq:"#e9e4d4",where:"molten ZnCl₂",ions:[["Zn²⁺",2,"#7a8a9a",7],["Cl⁻",-1,N,14]],cat:{name:"zinc",t:"liquid",col:"#a8b0b8",h:"Zn^2+ + 2e^- -> Zn"},an:{name:"chlorine",t:"gas",col:"#9bd36b",h:"2Cl^- -> Cl2 + 2e^-"},why:"Ionic compounds must be molten (or dissolved) so the ions are free to move to the electrodes."},
